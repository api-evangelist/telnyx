  - code: '10001'
    title: Not Found
    cause: Email message, template, or domain not found. Check the ID and your account scope. Both explicit application
      404s and framework-level routing 404s return 10001 — there is no string "404" fallback code.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10006'
    title: Not authorized
    cause: The Authorization header is missing or the API key is invalid, expired, or revoked.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10007 / 20012 (forbidden / inactive)
    action: Fix domain verification, sender authorization, scope, or account balance first.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10007'
    title: Forbidden
    cause: Domain is not verified, suspended, degraded, or missing DKIM — or the from address is not authorized
      on the sending domain.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10007'
    title: Forbidden
    cause: The request requires the email:override scope (used to send to a suppressed recipient) and your API key
      does not have it.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10008'
    title: Forbidden
    cause: Attempted to PATCH, DELETE, or POST …/verify on a shared domain you don't own. Shared domains are read-only
      for non-owners. Owned by the email-domains service — see the caveat under Codes owned by other services.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10011 (daily send limit)
    action: The limit resets at midnight UTC. Queue the work locally and resume after the reset — backing off in
      seconds will not help.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10011'
    title: Too Many Requests
    cause: The account's daily send limit was exceeded. The detail names the limit and states that it resets at
      midnight UTC. The send is rejected before message creation — no message record, no billing, no MTA injection.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10015 (validation / size)
    action: The request is malformed or too large. Retrying it unchanged always fails.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10015'
    cause: Malformed key (empty, duplicate header, overlong)
    action: Generate a valid UUID v4 and pass it as a single Idempotency-Key header.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10015'
    title: Bad Request / Validation Failed
    cause: Missing or invalid fields in the request body (e.g. email is required, subject must be a non-empty string).
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10015'
    title: Invalid Idempotency-Key
    cause: The Idempotency-Key header is empty, duplicated, malformed, or exceeds the length limit. Generate a UUID
      v4 and pass it as a single header, not a body field.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10015'
    title: Validation Failed
    cause: Changeset validation error (e.g. subject can't be blank, invalid webhook_url, bad address format).
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10015'
    title: Bad Request
    cause: Message size limit exceeded — 1 MB decoded body or 25 MB total message. See Request and message size
      limits.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10016 (service unavailable)
    action: Retry the same request with the same Idempotency-Key, with exponential backoff.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10016'
    title: Service Unavailable
    cause: An upstream dependency (e.g. the email domain service) or Edge idempotency protection is temporarily
      unavailable. Retry with the same Idempotency-Key.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10016'
    cause: Idempotency protection unavailable (fail-closed)
    action: Retry the same request with the same key. The gateway fails closed rather than risking a duplicate send.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10019 / 10000 / 500
    action: Retry with the same Idempotency-Key. Contact support if persistent.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10019'
    title: Internal Server Error
    cause: Unexpected server-side error (e.g. Failed to create batch validation). Retry with the same Idempotency-Key.
      If persistent, contact support.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10027 (idempotency fingerprint)
    action: The body differs from the original. Fix the body or use a new key.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10027'
    title: Same key, different body
    detail: The key was already used with a different request fingerprint. The new request was rejected without
      sending.
    action: Generate a new key. Reuse a key only for byte-identical retries of the same logical request.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10027'
    title: Idempotency Conflict
    cause: The Idempotency-Key was already used for a different request body. Use a new key for a new request; reuse
      keys only for exact retries.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: 10036 (idempotency in flight)
    action: Retry with the same key and body. A new key would send a duplicate.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10036'
    title: Original still in flight
    detail: The first request with this key is still being processed. No second send occurred.
    action: Wait and retry with the same key and the same body. Do not generate a new key — that would send twice.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '10036'
    title: Resource is being processed
    cause: A request with the same Idempotency-Key is still being processed. Retry later with the same key and the
      same request body.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '20012'
    title: Account inactive
    cause: The account has been deactivated — commonly out of funds. This is a billing state, not a domain or permission
      problem. Resolve the account balance before retrying.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '200'
    detail: OK
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '201'
    detail: Created
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '202'
    detail: Accepted
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '207'
    detail: Multi-Status
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '400'
    detail: Bad Request
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '401'
    detail: Unauthorized
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '403'
    detail: Forbidden
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '404'
    detail: Not Found
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '40901'
    title: Conflict
    cause: Deleting an unsubscribe group that has active suppressions (without ?force=true). Remove the suppressions
      first or pass force=true. Owned by the email-blocks service — see Codes owned by other services.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '409'
    detail: Conflict
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '413'
    detail: Payload Too Large
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '422'
    detail: Unprocessable Entity
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '429'
    detail: Too Many Requests
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '500'
    title: Internal Server Error
    cause: Framework fallback error response. Same handling as 10019.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '500'
    detail: Internal Server Error
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - status: '503'
    detail: Service Unavailable
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: bad_request
    cause: Malformed message entry, missing required fields, a template render error, or a field validation failure
      for that message.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: domain_graduation_limit_exceeded (sender-domain ramp)
    action: Wait the Retry-After interval (seconds to the domain's midnight UTC reset) and stay within the ramp's
      remaining per-day volume. The counter is daily, so backoff over seconds alone will not clear it.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: domain_graduation_limit_exceeded
    title: Too Many Requests
    cause: The sender domain's warm-up ramp daily recipient limit was exceeded — a per-domain volume cap on verified
      custom domains during warm-up, separate from the account quota. The send is rejected before message creation
      — no message record, no billing, no MTA injection. This is the only Email API 429 whose response carries the
      Retry-After header (seconds to the midnight UTC reset).
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: forbidden
    cause: Domain not verified or from-address not allowed.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: not_found
    cause: Template ID or domain not found (for template sends).
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: recipient_suppressed
    cause: All recipients of that message are suppressed.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: recipient_suppressed
    action: Every recipient is suppressed. Remove them or send to different addresses.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: recipient_suppressed
    title: Recipient Suppressed
    cause: All recipients are suppressed — the email was not sent. The response includes a top-level suppressed
      array alongside errors, each entry carrying to, reason, scope, and override_allowed.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: reputation_suspended
    title: Sending Suspended
    cause: The sending domain's reputation band is poor — every send on the domain is rejected before message creation.
      The band is recomputed once daily from a rolling 30-day window, so the suspension lifts automatically once
      the band leaves poor.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: reputation_suspended
    cause: Sending suspended for the domain's reputation band.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: reputation_suspended
    action: 'Retrying never succeeds — the send is rejected before message creation (and creates no reputation signal:
      no message, recipient, or event exists). Stop sending on that domain, fix the underlying bounce/complaint
      rates, and wait for the daily band recompute to lift the suspension as the 30-day window recovers.'
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: service_unavailable
    cause: Upstream dependency unavailable for that message.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: unprocessable_entity
    cause: 'That message exceeded a size limit — either the 1 MB decoded body or the 25 MB total message ceiling.
      Note this is a per-message failure: the rest of the batch still processes. See Request and message size limits.'
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: validation_error
    cause: Field validation failed for that message.
    category: api-and-delivery-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/error-codes
  - code: '30001'
    title: Hard bounce
    detail: bounced with a 5xx code, or a bounce with no usable code
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30002'
    title: Deferred
    detail: deferred, or bounced carrying a 4xx code
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30003'
    title: Injection failure
    detail: failed with an SMTP status — the MTA refused the injection
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30004'
    title: Suppressed recipient
    detail: suppressed — the address was on the suppression list
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30005'
    title: Queue expiry
    detail: expired — the retry window elapsed
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30006'
    title: Gateway rejection
    detail: gw_reject — refused at the HTTP injection boundary
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '30099'
    title: Internal error
    detail: failed without an SMTP status — nothing reached the MTA
    category: delivery-events
    source_url: https://developers.telnyx.com/docs/messaging/email/event-lifecycle
  - code: '*(no email-specific code)*'
    detail: Edge-level request rate limiting.
    action: Back off exponentially with jitter and retry.
    category: rate-limit-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/rate-limits
  - code: '10011'
    detail: The account's daily send limit was exceeded. The detail names the limit and states that it resets at
      midnight UTC.
    action: Queue the work and resume after the daily reset. Exponential backoff over seconds or minutes will not
      help — the counter is daily.
    category: rate-limit-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/rate-limits
  - code: domain_graduation_limit_exceeded
    detail: The sender domain's warm-up ramp daily recipient limit was exceeded — a per-domain volume cap, separate
      from the account quota. The only Email API 429 that sets the Retry-After header.
    action: Wait the Retry-After interval (seconds to the midnight UTC reset) or resume after the reset, staying
      within the ramp's per-day volume. See Deliverability.
    category: rate-limit-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/rate-limits
  - code: reputation_suspended
    detail: The sending domain's reputation band dropped to poor.
    action: Stop and remediate. Retrying never succeeds (rejected requests create no message, recipient, or event,
      so they cannot further affect the reputation signal). Reduce bounce and complaint rates; the suspension lifts
      automatically at the daily band recompute once the rolling 30-day window recovers. See Deliverability.
    category: rate-limit-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/rate-limits
  - code: '10001'
    detail: Not found — the message, domain, or resource doesn't exist.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10006'
    detail: Authentication failed — check your API key.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10007'
    detail: Forbidden — the Email API's general sending-policy error. Covers an unverified, degraded, or suspended
      sending domain, a domain with no active DKIM key, a sender that doesn't match the domain's sending profile,
      and trial-account recipient restrictions. Inspect detail for the specific reason.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10011'
    detail: The account's daily send limit was exceeded — rejected before message creation, resets at midnight UTC.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10015'
    detail: Validation failed — missing or invalid fields.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10015'
    detail: Invalid Idempotency-Key header — empty, duplicate, malformed, or overlong.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10015'
    detail: Request body exceeds 8,000,000 bytes.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10015'
    detail: Validation error (changeset).
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10016'
    detail: Service unavailable — an upstream dependency or Edge idempotency protection is unavailable.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10027'
    detail: The idempotency key was already used for a different request.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10036'
    detail: A request with the same idempotency key is still being processed.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: '200'
    detail: Rescheduled. The response matches the single-message GET representation.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: '401'
    detail: Authentication failed.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: '404'
    detail: The email message does not exist in your account.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: '409'
    detail: The message is no longer scheduled, or its scheduled-send worker has already started processing it.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: '422'
    detail: scheduled_at is missing, invalid ISO 8601, or not in the future.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: bounced
    detail: Permanently rejected by the receiving server (5xx or out-of-band bounce).
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: cancelled
    detail: A scheduled message was cancelled before sending.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: cancelled
    detail: Cancelled before delivery.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: completed
    detail: Every recipient has reached a terminal state (not necessarily success).
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: deferred
    detail: Temporary failure (4xx); will be retried.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: delivered
    detail: The receiving mail server accepted the message.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: domain_graduation_limit_exceeded
    detail: The sender domain's warm-up ramp daily recipient limit was exceeded — rejected before message creation.
      The only Email API 429 that carries the Retry-After header.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: expired
    detail: Retries were abandoned after the maximum queue age.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: failed
    detail: The message failed before delivery injection, such as when a scheduled send exceeds the daily limit
      at fire time.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: failed
    detail: Terminal system or operator-caused non-delivery.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: gw_reject
    detail: The delivery gateway refused the recipient before queueing.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: injection_timeout
    detail: The injection attempt timed out with an ambiguous result.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: queued
    detail: Accepted and waiting to be processed.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: queued
    detail: Accepted, not yet injected.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: recipient_suppressed
    detail: All recipients suppressed. Returns a top-level suppressed array.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: reputation_suspended
    detail: Sending suspended — the sending domain's reputation band is poor.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: sandbox
    detail: Created in sandbox mode; never actually delivered.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: scheduled
    detail: Held for a future scheduled_at time.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: sending
    detail: Being injected into the delivery pipeline.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: sending
    detail: Injection in progress.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - status: sent
    detail: Accepted by the delivery gateway.
    category: send-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/send-email
  - code: '10001'
    detail: The template id doesn't exist or belongs to another account.
    category: template-errors
    source_url: https://developers.telnyx.com/docs/messaging/email/templates
  - code: '10015'
    detail: Liquid parsing or rendering failed (malformed Liquid syntax or a filter error), or — on a strict_variables
      template — a required variable is missing. The standard detail field carries the engine's error detail or
