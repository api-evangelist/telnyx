- product: Meeting
  count: 6
  codes:
  - code: invalid_request
    title: Request rejected
    detail: A field in the request is invalid or not allowed, for example a disabled webhook_url. A request that
      exceeds a documented size limit returns the same code with 413.
    action: Correct the field named in message and retry.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/meeting/errors
  - code: invalid_state
    title: Operation not valid for the session status
    detail: The operation requires a different lifecycle status, for example only scheduled sessions can be updated
      and actions require an active session.
    action: Read the session status first and retry when the session reaches the required state.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/meeting/errors
  - code: not_configured
    title: Feature not configured
    detail: A required integration is not configured for the account.
    action: Complete the feature's setup for your account before retrying.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/meeting/errors
  - code: not_found
    title: Meeting session not found
    detail: No session with the supplied id belongs to the authenticated account.
    action: Verify the session id and that it was created by the same account.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/meeting/errors
  - code: unauthorized
    title: Invalid or missing credentials
    detail: Service-level authentication failure. In practice the gateway rejects a missing or invalid key first
      with the general 10009 error, so this code is rarely seen.
    action: Send your Telnyx API key as a bearer token in the Authorization header (exact Bearer capitalization).
    category: api-errors
    source_url: https://developers.telnyx.com/docs/meeting/errors
  - code: unsupported_capability
    title: Capability not supported on this platform
