    detail: The consumption reached the defined data limit. Please, update the SIM card group data limit.
    action: Increase the SIM card group's data limit before retrying the operation.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70001'
    title: There aren't enough available SIM cards
    detail: Insufficient inventory to satisfy order request.
    action: Reduce the requested quantity or retry when sufficient inventory is available.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70002'
    title: Invalid data format
    detail: The provided data attribute was invalid.
    action: Compare the rejected attribute with the endpoint's request schema, correct its format, and retry.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70003'
    title: Mobile operators' preferences priorities are out of sequence
    detail: The mobile operators' preferences priorities should be in an ascending order starting by 0.
    action: Renumber the priorities as a contiguous sequence beginning with 0, then retry.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70004'
    title: OTA update in progress
    detail: SIM card network preferences can't be defined when a previous OTA update is still in progress.
    action: Wait for the current OTA update to finish before changing network preferences.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70005'
    title: Could not delete SIM card group
    detail: The SIM card group associated with the provided ID can not be deleted because there are SIM cards associated
      with the SIM card group.
    action: Move the associated SIM cards to another group before deleting this group.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70006'
    title: Could not delete default SIM card group
    detail: The SIM card group associated with the provided ID can not be deleted because it is the default SIM
      card group on your account.
    action: Do not retry deletion of the default group; select a non-default group for deletion.
    category: api-errors
    source_url: https://developers.telnyx.com/docs/iot-sim/api-errors
  - code: '70007'
    title: SIM card doesn't have a SIM card group
