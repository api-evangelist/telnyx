    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46001'
    title: LOGIN_FAILED
    detail: The server rejected the login request (credentials invalid, expired, or account suspended). Registration
      never reached the ready state.
    action: Re-authenticate using client.login() with fresh credentials; verify credentials and account status.
      Do not recreate the instance.
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46001'
    title: LOGIN_FAILED
    detail: Authentication rejected; the session will not become ready
    action: Re-authenticate with client.login() and fresh credentials
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46002'
    title: INVALID_CREDENTIALS
    detail: Login was rejected before request was sent
    action: Fix credential parameters; re-authenticate using client.login()
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46002'
    title: INVALID_CREDENTIALS
    detail: The SDK rejected the login options client-side before sending any request — the credentials object has
      missing or empty fields, or an invalid combination of credential fields. No network request was made.
    action: Fix the credential parameters (ensure required fields like login_token are present and non-empty), then
      re-authenticate using client.login(). Check that the credential object matches one of the supported auth modes
      (credentials, token, or anonymous).
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46002'
    title: INVALID_CREDENTIALS
    detail: Credentials invalid before any network request
    action: Fix credential params, then client.login()
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '46003'
    title: AUTHENTICATION_REQUIRED
    detail: Request was sent before auth completed or after auth was lost. SDK re-auths on reconnect when autoReconnect
      is enabled
    action: 'Re-authenticate using client.login({ creds: { login_token: newToken } }) without recreating the instance'
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '47001'
    title: ICE_RESTART_FAILED
    detail: Media recovery could not complete via ICE restart
    action: The call may recover via WebSocket reconnect + Attach; if not, hang up and retry
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '48001'
    title: NETWORK_OFFLINE
    detail: Browser offline event fired. Emitted for backward compatibility; recovery is driven by SDK-owned health
      signals
    action: Restore network connectivity; the SDK recovers via health signals, not the browser online event alone
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '48501'
    title: SESSION_NOT_REATTACHED
    detail: The WebSocket reconnected but the server did not reattach the call; subsequent call-control fails with
      CALL_DOES_NOT_EXIST
    action: Terminate the local call and notify the user; start a new call
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '48501'
    title: SESSION_NOT_REATTACHED
    detail: The WebSocket reconnected successfully, but the server did not reattach the active call session — the
      server lost the in-memory call state during the disconnection window. Subsequent call-control operations (hangup,
      hold, etc.) will fail with CALL_DOES_NOT_EXIST.
    action: Terminate the local call and notify the user; start a new call. The call is unrecoverable.
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '48501'
    title: SESSION_NOT_REATTACHED
    detail: The server lost the call after reconnect; the call is unrecoverable
    action: Terminate local call UI; let the user place a new call
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '49001'
    title: UNEXPECTED_ERROR
    detail: Unclassified failure during peer/call setup
    action: Check event.error.originalError for details; report if it persists
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '49001'
    title: UNEXPECTED_ERROR
    detail: An error was thrown that does not match any known SDK error category — this is a catch-all for unclassified
      failures.
    action: Inspect event.error.originalError; report to Telnyx support if it persists.
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
