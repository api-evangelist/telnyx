      before this fires.
    action: 'Call client.disconnect() then client.connect() to start fresh, or recreate the client instance. Set
      maxReconnectAttempts: 0 for unlimited attempts. We recommend keeping autoReconnect enabled (the default) —
      disabling it is only for advanced use cases.'
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '45003'
    title: RECONNECTION_EXHAUSTED
    detail: Auto-reconnect gave up; the session is dead
    action: client.disconnect() → client.connect(), or recreate the client
    category: client-errors-and-warnings
    source_url: https://developers.telnyx.com/docs/development/webrtc/js-sdk/how-to/error-handling
  - code: '45004'
    title: GATEWAY_FAILED
