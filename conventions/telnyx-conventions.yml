reversibility:
  grade: documented
  note: Reversal operations exist for calls, faxes, scheduled messages/emails, porting and number orders, OAuth
    grants, assistants and AI jobs, but no page states a time window inside which a reversal works (a scheduled
    message can be cancelled until it is sent; nothing quantifies it). No dry-run mode is documented.
  operations:
  - operationId: HangupCall
    operation: POST /calls/{call_control_id}/actions/hangup
    reverses: ends an in-progress call
  - operationId: RejectCall
    operation: POST /calls/{call_control_id}/actions/reject
    reverses: declines an incoming call
  - operationId: CancelFax
    operation: POST /faxes/{id}/actions/cancel
    reverses: cancels a fax
  - operationId: CancelMessage
    operation: DELETE /messages/{id}
    reverses: cancels a scheduled message
  - operationId: CancelScheduledEmailMessage
    operation: DELETE /email_messages/{email_id}/schedule
    reverses: cancels a scheduled email message
  - operationId: CancelPortingOrder
    operation: POST /porting_orders/{id}/actions/cancel
    reverses: cancels a porting order
  - operationId: CancelSubNumberOrder
    operation: PATCH /sub_number_orders/{sub_number_order_id}/cancel
    reverses: cancels a sub number order
  - operationId: CancelPendingRequirementVersion
    operation: DELETE /requirements/{id}/versions/pending
    reverses: cancels a pending requirement version
  - operationId: RevokeOAuthGrant
    operation: DELETE /oauth/grants/{id}
    reverses: revokes an OAuth grant
  - operationId: restore_assistant_public_assistants__assistant_id__restore_post
    operation: POST /ai/assistants/{assistant_id}/restore
    reverses: restores a deleted assistant
  - operationId: cancel_new_finetuningjob_public_finetuning_post
    operation: POST /ai/fine_tuning/jobs/{job_id}/cancel
    reverses: cancels a fine-tuning job
  - operationId: post_public_missions_missions_mission_id_runs_run_id_cancel
    operation: POST /ai/missions/{mission_id}/runs/{run_id}/cancel
    reverses: cancels a mission run
  window: null
  dry_run_mode: none documented
