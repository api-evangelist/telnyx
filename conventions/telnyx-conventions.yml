idempotency:
  coverage: partial
  mechanism: 'Two product-specific mechanisms, neither applied across the whole mutating surface: (1) an `Idempotency-Key`
    request header (components/parameters/IdempotencyKey) on AI assistant/test/deploy operations, answered with
    an `Idempotent-Replayed` response header and rejected with HTTP 400 / code 10015 when invalid or duplicate;
    (2) a `command_id` body field on Call Control and Conference commands - ''Telnyx will ignore any command with
    the same command_id for the same call_control_id''; the voice webhooks guide states duplicate IDs are ignored
    within 60 seconds.'
  header: Idempotency-Key
  body_field: command_id
  retention: 60 seconds for command_id duplicates (voice-api-webhooks); unstated for Idempotency-Key
