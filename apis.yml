- aid: telnyx:telnyx-spend-limits-api
  name: Telnyx Spend Limits API
  description: >-
    Daily and monthly spend limits per product. A limit applies to the organization of the authenticated
    user, or to the user's own account when they belong to no organization; every user of the organization
    sees and changes the same limits.


    - **Periods.** `daily` covers the current UTC day and `monthly` the current UTC calendar month. The
    two limits are independent: you can set either, both or neither.

    - **Blocking.** When spend in a period goes above the limit (strictly greater), the product is blocked
    until the period ends: 00:00 UTC the next day for `daily`, 00:00 UTC on the 1st of the next month
    for `monthly`. A block appears within about 2 minutes (daily) or 10 minutes (monthly) of the spend
    being recorded.

    - **Changes apply immediately.** Creating, updating or deleting a limit checks the period's spend
    in the same request: raising the limit above the spend, or removing it, lifts that period's block,
    and lowering it below the spend blocks the product at once. The `evaluation` object in the response
    says what happened.

    - **Supported products.** Today only `inference` supports spend limits. A blocked account gets HTTP
    403 with the error title `Inference spend limit reached` (code `10039`) on new billable chat completions,
    Responses, Anthropic Messages and classification requests; requests already running finish normally.
    Take the list of products from the list operation.

    - **Limits set by Telnyx.** Telnyx support can also set a limit on your account. It is listed with
    `origin: operator` and you can update or delete it like your own.
  humanURL: https://developers.telnyx.com/api
  baseURL: https://api.telnyx.com/v2
  tags:
  - Spend Limits
  properties:
  - type: OpenAPI
    url: openapi/telnyx-spend-limits-api-openapi.yml
