          type: object
          value: $.
        inputParameters:
        - name: usecase
          in: query
          type: string
          required: true
    - name: 10dlc-campaign-campaignId
      path: /10dlc/campaign/{campaignId}
      operations:
      - name: deactivatecampaign
        method: DELETE
        description: Deactivate campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          required: true
      - name: getcampaign
        method: GET
        description: Get campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          required: true
      - name: updatecampaign
        method: PUT
        description: Update campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 10dlc-campaign-campaignId-appeal
      path: /10dlc/campaign/{campaignId}/appeal
      operations:
      - name: appealcampaign
        method: POST
        description: Submit campaign appeal for manual review
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: The Telnyx campaign identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 10dlc-campaign-campaignId-mnoMetadata
      path: /10dlc/campaign/{campaignId}/mnoMetadata
      operations:
      - name: getcampaignmnometadata
        method: GET
        description: Get Campaign Mno Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: ID of the campaign in question
          required: true
    - name: 10dlc-campaign-campaignId-operationStatus
