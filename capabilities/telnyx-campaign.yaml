          description: ID of the campaign in question
          required: true
    - name: 10dlc-campaignBuilder
      path: /10dlc/campaignBuilder
      operations:
      - name: postcampaign
        method: POST
        description: Submit Campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
