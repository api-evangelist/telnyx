    - name: actions-purchase-esims
      path: /actions/purchase/esims
      operations:
      - name: purchaseesim
        method: POST
        description: Purchase eSIMs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: actions-register-sim_cards
      path: /actions/register/sim_cards
      operations:
      - name: registersimcards
        method: POST
        description: Register SIM cards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
