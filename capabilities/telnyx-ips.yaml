naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — IPs
  description: 'Telnyx API — IPs. 5 operations. Lead operation: List Ips. Self-contained Naftiko capability covering one Telnyx
    business surface.'
  tags:
  - Telnyx
  - IPs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-ips
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — IPs business capability. Self-contained, no shared references.
    resources:
    - name: ips
      path: /ips
      operations:
      - name: listips
        method: GET
        description: List Ips
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[connection_id], filter[ip_address],
            filter[port]'
      - name: createip
        method: POST
        description: Create an Ip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: ips-id
      path: /ips/{id}
      operations:
      - name: deleteip
        method: DELETE
        description: Delete an Ip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: retrieveip
        method: GET
        description: Retrieve an Ip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateip
        method: PATCH
        description: Update an Ip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-ips-rest
    port: 8080
    description: REST adapter for Telnyx API — IPs. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/ips
      name: ips
      description: REST surface for ips.
      operations:
      - method: GET
        name: listips
        description: List Ips
        call: telnyx-ips.listips
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createip
        description: Create an Ip
        call: telnyx-ips.createip
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ips/{id}
      name: ips-id
      description: REST surface for ips-id.
      operations:
      - method: DELETE
        name: deleteip
        description: Delete an Ip
        call: telnyx-ips.deleteip
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: retrieveip
        description: Retrieve an Ip
        call: telnyx-ips.retrieveip
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateip
        description: Update an Ip
        call: telnyx-ips.updateip
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-ips-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — IPs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-ips
      description: List Ips
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-ips.listips
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-ip
      description: Create an Ip
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-ips.createip
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-ip
      description: Delete an Ip
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-ips.deleteip
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-ip
      description: Retrieve an Ip
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-ips.retrieveip
      outputParameters:
      - type: object
        mapping: $.
    - name: update-ip
      description: Update an Ip
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-ips.updateip
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
