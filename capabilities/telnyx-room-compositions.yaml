naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Room Compositions
  description: 'Telnyx API — Room Compositions. 4 operations. Lead operation: View a list of room compositions.. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Room Compositions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-room-compositions
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Room Compositions business capability. Self-contained, no shared references.
    resources:
    - name: room_compositions
      path: /room_compositions
      operations:
      - name: listroomcompositions
        method: GET
        description: View a list of room compositions.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[date_created_at][eq], filter[date_created_at][gte],
            filter[date_created_at][lte], filter[se'
      - name: createroomcomposition
        method: POST
        description: Create a room composition.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: room_compositions-room_composition_id
      path: /room_compositions/{room_composition_id}
      operations:
      - name: deleteroomcomposition
        method: DELETE
        description: Delete a room composition.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_composition_id
          in: path
          type: string
          description: The unique identifier of a room composition.
          required: true
      - name: viewroomcomposition
        method: GET
        description: View a room composition.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_composition_id
          in: path
          type: string
          description: The unique identifier of a room composition.
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-room-compositions-rest
    port: 8080
    description: REST adapter for Telnyx API — Room Compositions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/room-compositions
      name: room-compositions
      description: REST surface for room_compositions.
      operations:
      - method: GET
        name: listroomcompositions
        description: View a list of room compositions.
        call: telnyx-room-compositions.listroomcompositions
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createroomcomposition
        description: Create a room composition.
        call: telnyx-room-compositions.createroomcomposition
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/room-compositions/{room-composition-id}
      name: room-compositions-room-composition-id
      description: REST surface for room_compositions-room_composition_id.
      operations:
      - method: DELETE
        name: deleteroomcomposition
        description: Delete a room composition.
        call: telnyx-room-compositions.deleteroomcomposition
        with:
          room_composition_id: rest.room_composition_id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: viewroomcomposition
        description: View a room composition.
        call: telnyx-room-compositions.viewroomcomposition
        with:
          room_composition_id: rest.room_composition_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-room-compositions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Room Compositions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: view-list-room-compositions
      description: View a list of room compositions.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-room-compositions.listroomcompositions
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-room-composition
      description: Create a room composition.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-room-compositions.createroomcomposition
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-room-composition
      description: Delete a room composition.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-room-compositions.deleteroomcomposition
      with:
        room_composition_id: tools.room_composition_id
      outputParameters:
      - type: object
        mapping: $.
    - name: view-room-composition
      description: View a room composition.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-room-compositions.viewroomcomposition
      with:
        room_composition_id: tools.room_composition_id
      outputParameters:
      - type: object
        mapping: $.
