naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Enterprises
  description: 'Telnyx API — Enterprises. 5 operations. Lead operation: List enterprises. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Enterprises
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-enterprises
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Enterprises business capability. Self-contained, no shared references.
    resources:
    - name: enterprises
      path: /enterprises
      operations:
      - name: listenterprises
        method: GET
        description: List enterprises
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page[number]
          in: query
          type: integer
          description: Page number (1-indexed)
        - name: page[size]
          in: query
          type: integer
          description: Number of items per page
        - name: legal_name
          in: query
          type: string
          description: Filter by legal name (partial match)
      - name: createenterprise
        method: POST
        description: Create an enterprise
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: enterprises-enterprise_id
      path: /enterprises/{enterprise_id}
      operations:
      - name: deleteenterprise
        method: DELETE
        description: Delete an enterprise
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getenterprise
        method: GET
        description: Get an enterprise
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateenterprise
        method: PUT
        description: Update an enterprise
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-enterprises-rest
    port: 8080
    description: REST adapter for Telnyx API — Enterprises. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/enterprises
      name: enterprises
      description: REST surface for enterprises.
      operations:
      - method: GET
        name: listenterprises
        description: List enterprises
        call: telnyx-enterprises.listenterprises
        with:
          page[number]: rest.page[number]
          page[size]: rest.page[size]
          legal_name: rest.legal_name
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createenterprise
        description: Create an enterprise
        call: telnyx-enterprises.createenterprise
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/enterprises/{enterprise-id}
      name: enterprises-enterprise-id
      description: REST surface for enterprises-enterprise_id.
      operations:
      - method: DELETE
        name: deleteenterprise
        description: Delete an enterprise
        call: telnyx-enterprises.deleteenterprise
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getenterprise
        description: Get an enterprise
        call: telnyx-enterprises.getenterprise
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateenterprise
        description: Update an enterprise
        call: telnyx-enterprises.updateenterprise
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-enterprises-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Enterprises. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-enterprises
      description: List enterprises
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-enterprises.listenterprises
      with:
        page[number]: tools.page[number]
        page[size]: tools.page[size]
        legal_name: tools.legal_name
      outputParameters:
      - type: object
        mapping: $.
    - name: create-enterprise
      description: Create an enterprise
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-enterprises.createenterprise
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-enterprise
      description: Delete an enterprise
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-enterprises.deleteenterprise
      outputParameters:
      - type: object
        mapping: $.
    - name: get-enterprise
      description: Get an enterprise
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-enterprises.getenterprise
      outputParameters:
      - type: object
        mapping: $.
    - name: update-enterprise
      description: Update an enterprise
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-enterprises.updateenterprise
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
