naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Verified Numbers
  description: 'Telnyx API — Verified Numbers. 5 operations. Lead operation: List all Verified Numbers. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Verified Numbers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-verified-numbers
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Verified Numbers business capability. Self-contained, no shared references.
    resources:
    - name: verified_numbers
      path: /verified_numbers
      operations:
      - name: listverifiednumbers
        method: GET
        description: List all Verified Numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: object
          description: 'Consolidated page parameter (deepObject style). Use page[size] and page[number] in the query string.
            Originally: page[size], page[number]'
      - name: createverifiednumber
        method: POST
        description: Request phone number verification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: verified_numbers-phone_number
      path: /verified_numbers/{phone_number}
      operations:
      - name: deleteverifiednumber
        method: DELETE
        description: Delete a verified number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: path
          type: string
          description: The phone number being deleted.
          required: true
      - name: getverifiednumber
        method: GET
        description: Retrieve a verified number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: path
          type: string
          description: The phone number being requested.
          required: true
    - name: verified_numbers-phone_number-actions-verify
      path: /verified_numbers/{phone_number}/actions/verify
      operations:
      - name: verifyverificationcode
        method: POST
        description: Submit verification code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: path
          type: string
          description: The phone number being verified.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-verified-numbers-rest
    port: 8080
    description: REST adapter for Telnyx API — Verified Numbers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/verified-numbers
      name: verified-numbers
      description: REST surface for verified_numbers.
      operations:
      - method: GET
        name: listverifiednumbers
        description: List all Verified Numbers
        call: telnyx-verified-numbers.listverifiednumbers
        with:
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createverifiednumber
        description: Request phone number verification
        call: telnyx-verified-numbers.createverifiednumber
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/verified-numbers/{phone-number}
      name: verified-numbers-phone-number
      description: REST surface for verified_numbers-phone_number.
      operations:
      - method: DELETE
        name: deleteverifiednumber
        description: Delete a verified number
        call: telnyx-verified-numbers.deleteverifiednumber
        with:
          phone_number: rest.phone_number
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getverifiednumber
        description: Retrieve a verified number
        call: telnyx-verified-numbers.getverifiednumber
        with:
          phone_number: rest.phone_number
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/verified-numbers/{phone-number}/actions/verify
      name: verified-numbers-phone-number-actions-verify
      description: REST surface for verified_numbers-phone_number-actions-verify.
      operations:
      - method: POST
        name: verifyverificationcode
        description: Submit verification code
        call: telnyx-verified-numbers.verifyverificationcode
        with:
          phone_number: rest.phone_number
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-verified-numbers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Verified Numbers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-verified-numbers
      description: List all Verified Numbers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-verified-numbers.listverifiednumbers
      with:
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: request-phone-number-verification
      description: Request phone number verification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-verified-numbers.createverifiednumber
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-verified-number
      description: Delete a verified number
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-verified-numbers.deleteverifiednumber
      with:
        phone_number: tools.phone_number
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-verified-number
      description: Retrieve a verified number
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-verified-numbers.getverifiednumber
      with:
        phone_number: tools.phone_number
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-verification-code
      description: Submit verification code
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-verified-numbers.verifyverificationcode
      with:
        phone_number: tools.phone_number
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
