naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Mobile Phone Numbers
  description: 'Telnyx API — Mobile Phone Numbers. 3 operations. Lead operation: List Mobile Phone Numbers. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Mobile Phone Numbers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-mobile-phone-numbers
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Mobile Phone Numbers business capability. Self-contained, no shared references.
    resources:
    - name: v2-mobile_phone_numbers
      path: /v2/mobile_phone_numbers
      operations:
      - name: listmobilephonenumbers
        method: GET
        description: List Mobile Phone Numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page[number]
          in: query
          type: integer
          description: The page number to load
        - name: page[size]
          in: query
          type: integer
          description: The size of the page
    - name: v2-mobile_phone_numbers-id
      path: /v2/mobile_phone_numbers/{id}
      operations:
      - name: retrievemobilephonenumber
        method: GET
        description: Retrieve a Mobile Phone Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the mobile phone number
          required: true
      - name: updatemobilephonenumber
        method: PATCH
        description: Update a Mobile Phone Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the mobile phone number
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-mobile-phone-numbers-rest
    port: 8080
    description: REST adapter for Telnyx API — Mobile Phone Numbers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/mobile-phone-numbers
      name: v2-mobile-phone-numbers
      description: REST surface for v2-mobile_phone_numbers.
      operations:
      - method: GET
        name: listmobilephonenumbers
        description: List Mobile Phone Numbers
        call: telnyx-mobile-phone-numbers.listmobilephonenumbers
        with:
          page[number]: rest.page[number]
          page[size]: rest.page[size]
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/mobile-phone-numbers/{id}
      name: v2-mobile-phone-numbers-id
      description: REST surface for v2-mobile_phone_numbers-id.
      operations:
      - method: GET
        name: retrievemobilephonenumber
        description: Retrieve a Mobile Phone Number
        call: telnyx-mobile-phone-numbers.retrievemobilephonenumber
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatemobilephonenumber
        description: Update a Mobile Phone Number
        call: telnyx-mobile-phone-numbers.updatemobilephonenumber
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-mobile-phone-numbers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Mobile Phone Numbers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-mobile-phone-numbers
      description: List Mobile Phone Numbers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-mobile-phone-numbers.listmobilephonenumbers
      with:
        page[number]: tools.page[number]
        page[size]: tools.page[size]
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-mobile-phone-number
      description: Retrieve a Mobile Phone Number
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-mobile-phone-numbers.retrievemobilephonenumber
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-mobile-phone-number
      description: Update a Mobile Phone Number
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-mobile-phone-numbers.updatemobilephonenumber
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
