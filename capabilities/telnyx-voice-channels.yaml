naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Voice Channels
  description: 'Telnyx API — Voice Channels. 6 operations. Lead operation: List your voice channels for non-US zones. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Voice Channels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
