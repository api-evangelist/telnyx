        name: getallnumberschannelzones
        description: List All Numbers using Channel Billing
        call: telnyx-voice-channels.getallnumberschannelzones
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/list/{channel-zone-id}
      name: list-channel-zone-id
      description: REST surface for list-channel_zone_id.
      operations:
      - method: GET
        name: getnumberschannelzones
        description: List Numbers using Channel Billing for a specific Zone
        call: telnyx-voice-channels.getnumberschannelzones
        outputParameters:
        - type: object
          mapping: $.
