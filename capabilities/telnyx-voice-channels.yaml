      operations:
      - name: getallnumberschannelzones
        method: GET
        description: List All Numbers using Channel Billing
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: list-channel_zone_id
      path: /list/{channel_zone_id}
      operations:
      - name: getnumberschannelzones
        method: GET
        description: List Numbers using Channel Billing for a specific Zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-voice-channels-rest
    port: 8080
    description: REST adapter for Telnyx API — Voice Channels. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/channel-zones
      name: channel-zones
      description: REST surface for channel_zones.
      operations:
      - method: GET
        name: getchannelzones
        description: List your voice channels for non-US zones
        call: telnyx-voice-channels.getchannelzones
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/channel-zones/{channel-zone-id}
      name: channel-zones-channel-zone-id
      description: REST surface for channel_zones-channel_zone_id.
      operations:
      - method: PUT
        name: patchchannelzone
        description: Update voice channels for non-US Zones
        call: telnyx-voice-channels.patchchannelzone
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/inbound-channels
