    description: Telnyx API — Voice Channels business capability. Self-contained, no shared references.
    resources:
    - name: channel_zones
      path: /channel_zones
      operations:
      - name: getchannelzones
        method: GET
        description: List your voice channels for non-US zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: channel_zones-channel_zone_id
      path: /channel_zones/{channel_zone_id}
      operations:
      - name: patchchannelzone
        method: PUT
        description: Update voice channels for non-US Zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: inbound_channels
      path: /inbound_channels
      operations:
      - name: listinboundchannels
        method: GET
        description: List your voice channels for US Zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateoutboundchannels
        method: PATCH
        description: Update voice channels for US Zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
