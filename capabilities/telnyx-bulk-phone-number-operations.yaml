naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Bulk Phone Number Operations
  description: 'Telnyx API — Bulk Phone Number Operations. 5 operations. Lead operation: Lists the phone numbers jobs. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Bulk Phone Number Operations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-bulk-phone-number-operations
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Bulk Phone Number Operations business capability. Self-contained, no shared references.
    resources:
    - name: phone_numbers-jobs
      path: /phone_numbers/jobs
      operations:
      - name: listphonenumbersjobs
        method: GET
        description: Lists the phone numbers jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sort
          in: query
          type: string
          description: Specifies the sort order for results. If not given, results are sorted by created_at in descending
            order.
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[type]'
    - name: phone_numbers-jobs-delete_phone_numbers
      path: /phone_numbers/jobs/delete_phone_numbers
      operations:
      - name: createdeletephonenumbersjob
        method: POST
        description: Delete a batch of numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: phone_numbers-jobs-update_emergency_settings
      path: /phone_numbers/jobs/update_emergency_settings
      operations:
      - name: createphonenumbersjobupdateemergencysettings
        method: POST
        description: Update the emergency settings from a batch of numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: phone_numbers-jobs-update_phone_numbers
      path: /phone_numbers/jobs/update_phone_numbers
      operations:
      - name: createupdatephonenumbersjob
        method: POST
        description: Update a batch of numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[has_bundle], filter[tag], filter[connection_id],
            filter[phone_number], filter[status], filt'
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: phone_numbers-jobs-id
      path: /phone_numbers/jobs/{id}
      operations:
      - name: retrievephonenumbersjob
        method: GET
        description: Retrieve a phone numbers job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Identifies the Phone Numbers Job.
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-bulk-phone-number-operations-rest
    port: 8080
    description: REST adapter for Telnyx API — Bulk Phone Number Operations. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/phone-numbers/jobs
      name: phone-numbers-jobs
      description: REST surface for phone_numbers-jobs.
      operations:
      - method: GET
        name: listphonenumbersjobs
        description: Lists the phone numbers jobs
        call: telnyx-bulk-phone-number-operations.listphonenumbersjobs
        with:
          sort: rest.sort
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone-numbers/jobs/delete-phone-numbers
      name: phone-numbers-jobs-delete-phone-numbers
      description: REST surface for phone_numbers-jobs-delete_phone_numbers.
      operations:
      - method: POST
        name: createdeletephonenumbersjob
        description: Delete a batch of numbers
        call: telnyx-bulk-phone-number-operations.createdeletephonenumbersjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone-numbers/jobs/update-emergency-settings
      name: phone-numbers-jobs-update-emergency-settings
      description: REST surface for phone_numbers-jobs-update_emergency_settings.
      operations:
      - method: POST
        name: createphonenumbersjobupdateemergencysettings
        description: Update the emergency settings from a batch of numbers
        call: telnyx-bulk-phone-number-operations.createphonenumbersjobupdateemergencysettings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone-numbers/jobs/update-phone-numbers
      name: phone-numbers-jobs-update-phone-numbers
      description: REST surface for phone_numbers-jobs-update_phone_numbers.
      operations:
      - method: POST
        name: createupdatephonenumbersjob
        description: Update a batch of numbers
        call: telnyx-bulk-phone-number-operations.createupdatephonenumbersjob
        with:
          filter: rest.filter
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/phone-numbers/jobs/{id}
      name: phone-numbers-jobs-id
      description: REST surface for phone_numbers-jobs-id.
      operations:
      - method: GET
        name: retrievephonenumbersjob
        description: Retrieve a phone numbers job
        call: telnyx-bulk-phone-number-operations.retrievephonenumbersjob
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-bulk-phone-number-operations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Bulk Phone Number Operations. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: lists-phone-numbers-jobs
      description: Lists the phone numbers jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-bulk-phone-number-operations.listphonenumbersjobs
      with:
        sort: tools.sort
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-batch-numbers
      description: Delete a batch of numbers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-bulk-phone-number-operations.createdeletephonenumbersjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-emergency-settings-batch-numbers
      description: Update the emergency settings from a batch of numbers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-bulk-phone-number-operations.createphonenumbersjobupdateemergencysettings
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-batch-numbers
      description: Update a batch of numbers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-bulk-phone-number-operations.createupdatephonenumbersjob
      with:
        filter: tools.filter
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-phone-numbers-job
      description: Retrieve a phone numbers job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-bulk-phone-number-operations.retrievephonenumbersjob
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
