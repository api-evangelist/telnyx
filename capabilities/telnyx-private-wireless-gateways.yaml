naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Private Wireless Gateways
  description: 'Telnyx API — Private Wireless Gateways. 4 operations. Lead operation: Get all Private Wireless Gateways. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Private Wireless Gateways
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-private-wireless-gateways
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Private Wireless Gateways business capability. Self-contained, no shared references.
    resources:
    - name: private_wireless_gateways
      path: /private_wireless_gateways
      operations:
      - name: getprivatewirelessgateways
        method: GET
        description: Get all Private Wireless Gateways
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[name]
          in: query
          type: string
          description: The name of the Private Wireless Gateway.
        - name: filter[ip_range]
          in: query
          type: string
          description: The IP address range of the Private Wireless Gateway.
        - name: filter[region_code]
          in: query
          type: string
          description: The name of the region where the Private Wireless Gateway is deployed.
        - name: filter[created_at]
          in: query
          type: string
          description: Private Wireless Gateway resource creation date.
        - name: filter[updated_at]
          in: query
          type: string
          description: When the Private Wireless Gateway was last updated.
      - name: createprivatewirelessgateway
        method: POST
        description: Create a Private Wireless Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: private_wireless_gateways-id
      path: /private_wireless_gateways/{id}
      operations:
      - name: deletewirelessgateway
        method: DELETE
        description: Delete a Private Wireless Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getprivatewirelessgateway
        method: GET
        description: Get a Private Wireless Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-private-wireless-gateways-rest
    port: 8080
    description: REST adapter for Telnyx API — Private Wireless Gateways. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/private-wireless-gateways
      name: private-wireless-gateways
      description: REST surface for private_wireless_gateways.
      operations:
      - method: GET
        name: getprivatewirelessgateways
        description: Get all Private Wireless Gateways
        call: telnyx-private-wireless-gateways.getprivatewirelessgateways
        with:
          filter[name]: rest.filter[name]
          filter[ip_range]: rest.filter[ip_range]
          filter[region_code]: rest.filter[region_code]
          filter[created_at]: rest.filter[created_at]
          filter[updated_at]: rest.filter[updated_at]
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createprivatewirelessgateway
        description: Create a Private Wireless Gateway
        call: telnyx-private-wireless-gateways.createprivatewirelessgateway
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/private-wireless-gateways/{id}
      name: private-wireless-gateways-id
      description: REST surface for private_wireless_gateways-id.
      operations:
      - method: DELETE
        name: deletewirelessgateway
        description: Delete a Private Wireless Gateway
        call: telnyx-private-wireless-gateways.deletewirelessgateway
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getprivatewirelessgateway
        description: Get a Private Wireless Gateway
        call: telnyx-private-wireless-gateways.getprivatewirelessgateway
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-private-wireless-gateways-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Private Wireless Gateways. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-private-wireless-gateways
      description: Get all Private Wireless Gateways
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-private-wireless-gateways.getprivatewirelessgateways
      with:
        filter[name]: tools.filter[name]
        filter[ip_range]: tools.filter[ip_range]
        filter[region_code]: tools.filter[region_code]
        filter[created_at]: tools.filter[created_at]
        filter[updated_at]: tools.filter[updated_at]
      outputParameters:
      - type: object
        mapping: $.
    - name: create-private-wireless-gateway
      description: Create a Private Wireless Gateway
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-private-wireless-gateways.createprivatewirelessgateway
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-private-wireless-gateway
      description: Delete a Private Wireless Gateway
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-private-wireless-gateways.deletewirelessgateway
      outputParameters:
      - type: object
        mapping: $.
    - name: get-private-wireless-gateway
      description: Get a Private Wireless Gateway
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-private-wireless-gateways.getprivatewirelessgateway
      outputParameters:
      - type: object
        mapping: $.
