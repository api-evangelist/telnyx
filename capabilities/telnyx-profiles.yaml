        idempotent: false
      call: telnyx-profiles.createmessagingprofile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-messaging-profile
      description: Delete a messaging profile
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-profiles.deletemessagingprofile
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-messaging-profile
