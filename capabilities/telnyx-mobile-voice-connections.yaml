        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the mobile voice connection
          required: true
      - name: retrievemobilevoiceconnection
        method: GET
        description: Retrieve a Mobile Voice Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
