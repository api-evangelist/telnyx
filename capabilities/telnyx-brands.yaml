naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Brands
  description: 'Telnyx API — Brands. 15 operations. Lead operation: List Brands. Self-contained Naftiko capability covering
    one Telnyx business surface.'
  tags:
  - Telnyx
  - Brands
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
