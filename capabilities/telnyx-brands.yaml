    - name: 10dlc-brand
      path: /10dlc/brand
      operations:
      - name: getbrands
        method: GET
        description: List Brands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: recordsPerPage
          in: query
          type: integer
          description: number of records per page. maximum of 500
        - name: sort
          in: query
          type: string
          description: Specifies the sort order for results. If not given, results are sorted by createdAt in descending order.
        - name: displayName
          in: query
          type: string
        - name: entityType
          in: query
          type: string
        - name: state
          in: query
          type: string
        - name: country
          in: query
          type: string
        - name: brandId
          in: query
          type: string
          description: Filter results by the Telnyx Brand id
        - name: tcrBrandId
          in: query
          type: string
          description: Filter results by the TCR Brand id
      - name: createbrandpost
        method: POST
        description: Create Brand
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
