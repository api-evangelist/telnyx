naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Mobile Network Operators
  description: 'Telnyx API — Mobile Network Operators. 1 operations. Lead operation: List mobile network operators. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Mobile Network Operators
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-mobile-network-operators
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Mobile Network Operators business capability. Self-contained, no shared references.
    resources:
    - name: mobile_network_operators
      path: /mobile_network_operators
      operations:
      - name: getmobilenetworkoperators
        method: GET
        description: List mobile network operators
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-mobile-network-operators-rest
    port: 8080
    description: REST adapter for Telnyx API — Mobile Network Operators. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/mobile-network-operators
      name: mobile-network-operators
      description: REST surface for mobile_network_operators.
      operations:
      - method: GET
        name: getmobilenetworkoperators
        description: List mobile network operators
        call: telnyx-mobile-network-operators.getmobilenetworkoperators
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-mobile-network-operators-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Mobile Network Operators. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-mobile-network-operators
      description: List mobile network operators
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-mobile-network-operators.getmobilenetworkoperators
      outputParameters:
      - type: object
        mapping: $.
