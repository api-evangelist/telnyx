    namespace: telnyx-mdr-usage-reports
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — MDR Usage Reports business capability. Self-contained, no shared references.
    resources:
    - name: legacy-reporting-usage_reports-messaging
      path: /legacy/reporting/usage_reports/messaging
      operations:
      - name: getmdrusagereports
        method: GET
        description: List MDR usage reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number
        - name: per_page
          in: query
          type: integer
          description: Size of the page
      - name: submitmdrusagereport
        method: POST
        description: Create a new legacy usage V2 MDR report request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: legacy-reporting-usage_reports-messaging-id
      path: /legacy/reporting/usage_reports/messaging/{id}
      operations:
      - name: deletemdrusagereport
        method: DELETE
        description: Delete a V2 legacy usage MDR report request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: getmdrusagereport
        method: GET
        description: Get an MDR usage report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    - name: reports-mdr_usage_reports
      path: /reports/mdr_usage_reports
      operations:
      - name: getmdrusagereports
        method: GET
        description: Fetch all Messaging usage reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: object
          description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
      - name: submitusagereport
        method: POST
        description: Create MDR Usage Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: reports-mdr_usage_reports-sync
      path: /reports/mdr_usage_reports/sync
      operations:
      - name: getmdrusagereportsync
        method: GET
        description: Generate and fetch MDR Usage Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start_date
          in: query
          type: string
        - name: end_date
          in: query
          type: string
        - name: aggregation_type
          in: query
          type: string
          required: true
        - name: profiles
          in: query
          type: array
    - name: reports-mdr_usage_reports-id
      path: /reports/mdr_usage_reports/{id}
      operations:
      - name: deleteusagereport
        method: DELETE
        description: Delete MDR Usage Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: getusagereport
        method: GET
        description: Retrieve messaging report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
