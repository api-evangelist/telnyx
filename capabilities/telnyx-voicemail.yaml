      operations:
      - name: getvoicemail
        method: GET
        description: Get voicemail
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatevoicemail
        method: PATCH
        description: Update voicemail
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: createvoicemail
        method: POST
        description: Create voicemail
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
