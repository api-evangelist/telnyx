naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — OpenAI Embeddings
  description: 'Telnyx API — OpenAI Embeddings. 2 operations. Lead operation: Create embeddings. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - OpenAI Embeddings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-openai-embeddings
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — OpenAI Embeddings business capability. Self-contained, no shared references.
    resources:
    - name: ai-openai-embeddings
      path: /ai/openai/embeddings
      operations:
      - name: createopenaiembeddings
        method: POST
        description: Create embeddings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ai-openai-embeddings-models
      path: /ai/openai/embeddings/models
      operations:
      - name: listopenaiembeddingmodels
        method: GET
        description: List embedding models
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-openai-embeddings-rest
    port: 8080
    description: REST adapter for Telnyx API — OpenAI Embeddings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/ai/openai/embeddings
      name: ai-openai-embeddings
      description: REST surface for ai-openai-embeddings.
      operations:
      - method: POST
        name: createopenaiembeddings
        description: Create embeddings
        call: telnyx-openai-embeddings.createopenaiembeddings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ai/openai/embeddings/models
      name: ai-openai-embeddings-models
      description: REST surface for ai-openai-embeddings-models.
      operations:
      - method: GET
        name: listopenaiembeddingmodels
        description: List embedding models
        call: telnyx-openai-embeddings.listopenaiembeddingmodels
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-openai-embeddings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — OpenAI Embeddings. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-embeddings
      description: Create embeddings
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-openai-embeddings.createopenaiembeddings
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-embedding-models
      description: List embedding models
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-openai-embeddings.listopenaiembeddingmodels
      outputParameters:
      - type: object
        mapping: $.
