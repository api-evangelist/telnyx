naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Bucket Usage
  description: 'Telnyx API — Bucket Usage. 2 operations. Lead operation: Get API Usage. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Bucket Usage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-bucket-usage
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Bucket Usage business capability. Self-contained, no shared references.
    resources:
    - name: storage-buckets-bucketName-usage-api
      path: /storage/buckets/{bucketName}/usage/api
      operations:
      - name: getstorageapiusage
        method: GET
        description: Get API Usage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bucketName
          in: path
          type: string
          description: The name of the bucket
          required: true
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[start_time], filter[end_time]'
          required: true
    - name: storage-buckets-bucketName-usage-storage
      path: /storage/buckets/{bucketName}/usage/storage
      operations:
      - name: getbucketusage
        method: GET
        description: Get Bucket Usage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bucketName
          in: path
          type: string
          description: The name of the bucket
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-bucket-usage-rest
    port: 8080
    description: REST adapter for Telnyx API — Bucket Usage. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/storage/buckets/{bucketname}/usage/api
      name: storage-buckets-bucketname-usage-api
      description: REST surface for storage-buckets-bucketName-usage-api.
      operations:
      - method: GET
        name: getstorageapiusage
        description: Get API Usage
        call: telnyx-bucket-usage.getstorageapiusage
        with:
          bucketName: rest.bucketName
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/storage/buckets/{bucketname}/usage/storage
      name: storage-buckets-bucketname-usage-storage
      description: REST surface for storage-buckets-bucketName-usage-storage.
      operations:
      - method: GET
        name: getbucketusage
        description: Get Bucket Usage
        call: telnyx-bucket-usage.getbucketusage
        with:
          bucketName: rest.bucketName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-bucket-usage-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Bucket Usage. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-api-usage
      description: Get API Usage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-bucket-usage.getstorageapiusage
      with:
        bucketName: tools.bucketName
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bucket-usage
      description: Get Bucket Usage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-bucket-usage.getbucketusage
      with:
        bucketName: tools.bucketName
      outputParameters:
      - type: object
        mapping: $.
