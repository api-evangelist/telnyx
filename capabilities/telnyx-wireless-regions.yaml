naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Wireless Regions
  description: 'Telnyx API — Wireless Regions. 1 operations. Lead operation: Get all wireless regions. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Wireless Regions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-wireless-regions
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Wireless Regions business capability. Self-contained, no shared references.
    resources:
    - name: wireless-regions
      path: /wireless/regions
      operations:
      - name: wirelessregionsgetall
        method: GET
        description: Get all wireless regions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: product
          in: query
          type: string
          description: The product for which to list regions (e.g., 'public_ips', 'private_wireless_gateways').
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-wireless-regions-rest
    port: 8080
    description: REST adapter for Telnyx API — Wireless Regions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/wireless/regions
      name: wireless-regions
      description: REST surface for wireless-regions.
      operations:
      - method: GET
        name: wirelessregionsgetall
        description: Get all wireless regions
        call: telnyx-wireless-regions.wirelessregionsgetall
        with:
          product: rest.product
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-wireless-regions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Wireless Regions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-wireless-regions
      description: Get all wireless regions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-wireless-regions.wirelessregionsgetall
      with:
        product: tools.product
      outputParameters:
      - type: object
        mapping: $.
