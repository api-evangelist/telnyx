naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Wireless Blocklists
  description: 'Telnyx API — Wireless Blocklists. 6 operations. Lead operation: Get all possible wireless blocklist values.
    Self-contained Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Wireless Blocklists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-wireless-blocklists
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Wireless Blocklists business capability. Self-contained, no shared references.
    resources:
    - name: wireless_blocklist_values
      path: /wireless_blocklist_values
      operations:
      - name: wirelessblocklistsgetall
        method: GET
        description: Get all possible wireless blocklist values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: The Wireless Blocklist type for which to list possible values (e.g., `country`, `mcc`, `plmn`).
          required: true
    - name: wireless_blocklists
      path: /wireless_blocklists
      operations:
      - name: getwirelessblocklistsgateways
        method: GET
        description: Get all Wireless Blocklists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[name]
          in: query
          type: string
          description: The name of the Wireless Blocklist.
        - name: filter[type]
          in: query
          type: string
          description: When the Private Wireless Gateway was last updated.
        - name: filter[values]
          in: query
          type: string
          description: Values to filter on (inclusive).
      - name: createwirelessblocklist
        method: POST
        description: Create a Wireless Blocklist
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: wireless_blocklists-id
      path: /wireless_blocklists/{id}
      operations:
      - name: deletewirelessblocklist
        method: DELETE
        description: Delete a Wireless Blocklist
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getwirelessblocklist
        method: GET
        description: Get a Wireless Blocklist
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatewirelessblocklist
        method: PATCH
        description: Update a Wireless Blocklist
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-wireless-blocklists-rest
    port: 8080
    description: REST adapter for Telnyx API — Wireless Blocklists. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/wireless-blocklist-values
      name: wireless-blocklist-values
      description: REST surface for wireless_blocklist_values.
      operations:
      - method: GET
        name: wirelessblocklistsgetall
        description: Get all possible wireless blocklist values
        call: telnyx-wireless-blocklists.wirelessblocklistsgetall
        with:
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wireless-blocklists
      name: wireless-blocklists
      description: REST surface for wireless_blocklists.
      operations:
      - method: GET
        name: getwirelessblocklistsgateways
        description: Get all Wireless Blocklists
        call: telnyx-wireless-blocklists.getwirelessblocklistsgateways
        with:
          filter[name]: rest.filter[name]
          filter[type]: rest.filter[type]
          filter[values]: rest.filter[values]
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createwirelessblocklist
        description: Create a Wireless Blocklist
        call: telnyx-wireless-blocklists.createwirelessblocklist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wireless-blocklists/{id}
      name: wireless-blocklists-id
      description: REST surface for wireless_blocklists-id.
      operations:
      - method: DELETE
        name: deletewirelessblocklist
        description: Delete a Wireless Blocklist
        call: telnyx-wireless-blocklists.deletewirelessblocklist
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getwirelessblocklist
        description: Get a Wireless Blocklist
        call: telnyx-wireless-blocklists.getwirelessblocklist
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatewirelessblocklist
        description: Update a Wireless Blocklist
        call: telnyx-wireless-blocklists.updatewirelessblocklist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-wireless-blocklists-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Wireless Blocklists. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-possible-wireless-blocklist
      description: Get all possible wireless blocklist values
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-wireless-blocklists.wirelessblocklistsgetall
      with:
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-wireless-blocklists
      description: Get all Wireless Blocklists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-wireless-blocklists.getwirelessblocklistsgateways
      with:
        filter[name]: tools.filter[name]
        filter[type]: tools.filter[type]
        filter[values]: tools.filter[values]
      outputParameters:
      - type: object
        mapping: $.
    - name: create-wireless-blocklist
      description: Create a Wireless Blocklist
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-wireless-blocklists.createwirelessblocklist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-wireless-blocklist
      description: Delete a Wireless Blocklist
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-wireless-blocklists.deletewirelessblocklist
      outputParameters:
      - type: object
        mapping: $.
    - name: get-wireless-blocklist
      description: Get a Wireless Blocklist
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-wireless-blocklists.getwirelessblocklist
      outputParameters:
      - type: object
        mapping: $.
    - name: update-wireless-blocklist
      description: Update a Wireless Blocklist
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-wireless-blocklists.updatewirelessblocklist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
