naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Billing
  description: 'Telnyx API — Billing. 1 operations. Lead operation: Get user balance details. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Billing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-billing
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Billing business capability. Self-contained, no shared references.
    resources:
    - name: balance
      path: /balance
      operations:
      - name: getuserbalance
        method: GET
        description: Get user balance details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-billing-rest
    port: 8080
    description: REST adapter for Telnyx API — Billing. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/balance
      name: balance
      description: REST surface for balance.
      operations:
      - method: GET
        name: getuserbalance
        description: Get user balance details
        call: telnyx-billing.getuserbalance
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-billing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Billing. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-user-balance-details
      description: Get user balance details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-billing.getuserbalance
      outputParameters:
      - type: object
        mapping: $.
