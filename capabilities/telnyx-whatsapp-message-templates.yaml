      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-whatsapp-message-templates.getwhatsapptemplate
      outputParameters:
      - type: object
        mapping: $.
    - name: update-whatsapp-message-template
      description: Update a Whatsapp message template
      hints:
        readOnly: false
        destructive: false
