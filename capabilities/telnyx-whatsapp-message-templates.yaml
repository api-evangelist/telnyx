naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Whatsapp Message Templates
  description: 'Telnyx API — Whatsapp Message Templates. 5 operations. Lead operation: List Whatsapp message templates. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Whatsapp Message Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-whatsapp-message-templates
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Whatsapp Message Templates business capability. Self-contained, no shared references.
    resources:
    - name: v2-whatsapp-message_templates
      path: /v2/whatsapp/message_templates
      operations:
      - name: listwhatsapptemplates
        method: GET
        description: List Whatsapp message templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[waba_id]
          in: query
          type: string
          description: Filter by WABA ID
        - name: filter[category]
          in: query
          type: string
          description: Filter by category
        - name: filter[status]
          in: query
          type: string
          description: Filter by template status
        - name: filter[search]
          in: query
          type: string
          description: Search templates by name
      - name: postwhatsapptemplate
        method: POST
        description: Create a Whatsapp message template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-whatsapp_message_templates-id
      path: /v2/whatsapp_message_templates/{id}
      operations:
      - name: deletewhatsapptemplate
        method: DELETE
        description: Delete a Whatsapp message template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getwhatsapptemplate
        method: GET
        description: Get a Whatsapp message template by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchwhatsapptemplate
        method: PATCH
        description: Update a Whatsapp message template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-whatsapp-message-templates-rest
    port: 8080
    description: REST adapter for Telnyx API — Whatsapp Message Templates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/whatsapp/message-templates
      name: v2-whatsapp-message-templates
      description: REST surface for v2-whatsapp-message_templates.
      operations:
      - method: GET
        name: listwhatsapptemplates
        description: List Whatsapp message templates
        call: telnyx-whatsapp-message-templates.listwhatsapptemplates
        with:
          filter[waba_id]: rest.filter[waba_id]
          filter[category]: rest.filter[category]
          filter[status]: rest.filter[status]
          filter[search]: rest.filter[search]
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postwhatsapptemplate
        description: Create a Whatsapp message template
        call: telnyx-whatsapp-message-templates.postwhatsapptemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/whatsapp-message-templates/{id}
      name: v2-whatsapp-message-templates-id
      description: REST surface for v2-whatsapp_message_templates-id.
      operations:
      - method: DELETE
        name: deletewhatsapptemplate
        description: Delete a Whatsapp message template
        call: telnyx-whatsapp-message-templates.deletewhatsapptemplate
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getwhatsapptemplate
        description: Get a Whatsapp message template by ID
        call: telnyx-whatsapp-message-templates.getwhatsapptemplate
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patchwhatsapptemplate
        description: Update a Whatsapp message template
        call: telnyx-whatsapp-message-templates.patchwhatsapptemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-whatsapp-message-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Whatsapp Message Templates. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-whatsapp-message-templates
      description: List Whatsapp message templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-whatsapp-message-templates.listwhatsapptemplates
      with:
        filter[waba_id]: tools.filter[waba_id]
        filter[category]: tools.filter[category]
        filter[status]: tools.filter[status]
        filter[search]: tools.filter[search]
      outputParameters:
      - type: object
        mapping: $.
    - name: create-whatsapp-message-template
      description: Create a Whatsapp message template
      hints:
