naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Access Tokens
  description: 'Telnyx API — Access Tokens. 1 operations. Lead operation: Create an Access Token.. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Access Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-access-tokens
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Access Tokens business capability. Self-contained, no shared references.
    resources:
    - name: telephony_credentials-id-token
      path: /telephony_credentials/{id}/token
      operations:
      - name: createtelephonycredentialtoken
        method: POST
        description: Create an Access Token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Identifies the resource.
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-access-tokens-rest
    port: 8080
    description: REST adapter for Telnyx API — Access Tokens. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/telephony-credentials/{id}/token
      name: telephony-credentials-id-token
      description: REST surface for telephony_credentials-id-token.
      operations:
      - method: POST
        name: createtelephonycredentialtoken
        description: Create an Access Token.
        call: telnyx-access-tokens.createtelephonycredentialtoken
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-access-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Access Tokens. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-access-token
      description: Create an Access Token.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-access-tokens.createtelephonycredentialtoken
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
