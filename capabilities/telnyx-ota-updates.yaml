naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — OTA updates
  description: 'Telnyx API — OTA updates. 2 operations. Lead operation: List OTA updates. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - OTA updates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-ota-updates
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — OTA updates business capability. Self-contained, no shared references.
    resources:
    - name: ota_updates
      path: /ota_updates
      operations:
      - name: listotaupdates
        method: GET
        description: List OTA updates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ota_updates-id
      path: /ota_updates/{id}
      operations:
      - name: getotaupdate
        method: GET
        description: Get OTA update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-ota-updates-rest
    port: 8080
    description: REST adapter for Telnyx API — OTA updates. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/ota-updates
      name: ota-updates
      description: REST surface for ota_updates.
      operations:
      - method: GET
        name: listotaupdates
        description: List OTA updates
        call: telnyx-ota-updates.listotaupdates
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ota-updates/{id}
      name: ota-updates-id
      description: REST surface for ota_updates-id.
      operations:
      - method: GET
        name: getotaupdate
        description: Get OTA update
        call: telnyx-ota-updates.getotaupdate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-ota-updates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — OTA updates. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-ota-updates
      description: List OTA updates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-ota-updates.listotaupdates
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ota-update
      description: Get OTA update
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-ota-updates.getotaupdate
      outputParameters:
      - type: object
        mapping: $.
