naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Requirement Types
  description: 'Telnyx API — Requirement Types. 2 operations. Lead operation: List all requirement types. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Requirement Types
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-requirement-types
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Requirement Types business capability. Self-contained, no shared references.
    resources:
    - name: requirement_types
      path: /requirement_types
      operations:
      - name: listrequirementtypes
        method: GET
        description: List all requirement types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: requirement_types-id
      path: /requirement_types/{id}
      operations:
      - name: retrieverequirementtype
        method: GET
        description: Retrieve a requirement types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-requirement-types-rest
    port: 8080
    description: REST adapter for Telnyx API — Requirement Types. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/requirement-types
      name: requirement-types
      description: REST surface for requirement_types.
      operations:
      - method: GET
        name: listrequirementtypes
        description: List all requirement types
        call: telnyx-requirement-types.listrequirementtypes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/requirement-types/{id}
      name: requirement-types-id
      description: REST surface for requirement_types-id.
      operations:
      - method: GET
        name: retrieverequirementtype
        description: Retrieve a requirement types
        call: telnyx-requirement-types.retrieverequirementtype
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-requirement-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Requirement Types. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-requirement-types
      description: List all requirement types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-requirement-types.listrequirementtypes
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-requirement-types
      description: Retrieve a requirement types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-requirement-types.retrieverequirementtype
      outputParameters:
      - type: object
        mapping: $.
