naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Credentials
  description: 'Telnyx API — Credentials. 5 operations. Lead operation: List all credentials. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Credentials
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-credentials
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Credentials business capability. Self-contained, no shared references.
    resources:
    - name: telephony_credentials
      path: /telephony_credentials
      operations:
      - name: findtelephonycredentials
        method: GET
        description: List all credentials
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtelephonycredential
        method: POST
        description: Create a credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: telephony_credentials-id
      path: /telephony_credentials/{id}
      operations:
      - name: deletetelephonycredential
        method: DELETE
        description: Delete a credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Identifies the resource.
          required: true
      - name: gettelephonycredential
        method: GET
        description: Get a credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Identifies the resource.
          required: true
      - name: updatetelephonycredential
        method: PATCH
        description: Update a credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Identifies the resource.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-credentials-rest
    port: 8080
    description: REST adapter for Telnyx API — Credentials. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/telephony-credentials
      name: telephony-credentials
      description: REST surface for telephony_credentials.
      operations:
      - method: GET
        name: findtelephonycredentials
        description: List all credentials
        call: telnyx-credentials.findtelephonycredentials
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtelephonycredential
        description: Create a credential
        call: telnyx-credentials.createtelephonycredential
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/telephony-credentials/{id}
      name: telephony-credentials-id
      description: REST surface for telephony_credentials-id.
      operations:
      - method: DELETE
        name: deletetelephonycredential
        description: Delete a credential
        call: telnyx-credentials.deletetelephonycredential
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: gettelephonycredential
        description: Get a credential
        call: telnyx-credentials.gettelephonycredential
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatetelephonycredential
        description: Update a credential
        call: telnyx-credentials.updatetelephonycredential
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-credentials-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Credentials. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-credentials
      description: List all credentials
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-credentials.findtelephonycredentials
      outputParameters:
      - type: object
        mapping: $.
    - name: create-credential
      description: Create a credential
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-credentials.createtelephonycredential
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-credential
      description: Delete a credential
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-credentials.deletetelephonycredential
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-credential
      description: Get a credential
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-credentials.gettelephonycredential
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-credential
      description: Update a credential
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-credentials.updatetelephonycredential
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
