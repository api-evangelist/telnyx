naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — FQDNs
  description: 'Telnyx API — FQDNs. 5 operations. Lead operation: List FQDNs. Self-contained Naftiko capability covering one
    Telnyx business surface.'
  tags:
  - Telnyx
  - FQDNs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-fqdns
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — FQDNs business capability. Self-contained, no shared references.
    resources:
    - name: fqdns
      path: /fqdns
      operations:
      - name: listfqdns
        method: GET
        description: List FQDNs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[connection_id], filter[fqdn],
            filter[port], filter[dns_record_type]'
      - name: createfqdn
        method: POST
        description: Create an FQDN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: fqdns-id
      path: /fqdns/{id}
      operations:
      - name: deletefqdn
        method: DELETE
        description: Delete an FQDN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: retrievefqdn
        method: GET
        description: Retrieve an FQDN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatefqdn
        method: PATCH
        description: Update an FQDN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-fqdns-rest
    port: 8080
    description: REST adapter for Telnyx API — FQDNs. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/fqdns
      name: fqdns
      description: REST surface for fqdns.
      operations:
      - method: GET
        name: listfqdns
        description: List FQDNs
        call: telnyx-fqdns.listfqdns
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfqdn
        description: Create an FQDN
        call: telnyx-fqdns.createfqdn
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fqdns/{id}
      name: fqdns-id
      description: REST surface for fqdns-id.
      operations:
      - method: DELETE
        name: deletefqdn
        description: Delete an FQDN
        call: telnyx-fqdns.deletefqdn
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: retrievefqdn
        description: Retrieve an FQDN
        call: telnyx-fqdns.retrievefqdn
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatefqdn
        description: Update an FQDN
        call: telnyx-fqdns.updatefqdn
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-fqdns-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — FQDNs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-fqdns
      description: List FQDNs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-fqdns.listfqdns
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-fqdn
      description: Create an FQDN
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-fqdns.createfqdn
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-fqdn
      description: Delete an FQDN
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-fqdns.deletefqdn
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-fqdn
      description: Retrieve an FQDN
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-fqdns.retrievefqdn
      outputParameters:
      - type: object
        mapping: $.
    - name: update-fqdn
      description: Update an FQDN
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-fqdns.updatefqdn
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
