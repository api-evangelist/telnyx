naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Room Participants
  description: 'Telnyx API — Room Participants. 2 operations. Lead operation: View a list of room participants.. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Room Participants
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-room-participants
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Room Participants business capability. Self-contained, no shared references.
    resources:
    - name: room_participants
      path: /room_participants
      operations:
      - name: listroomparticipants
        method: GET
        description: View a list of room participants.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[date_joined_at][eq], filter[date_joined_at][gte],
            filter[date_joined_at][lte], filter[date_'
    - name: room_participants-room_participant_id
      path: /room_participants/{room_participant_id}
      operations:
      - name: viewroomparticipant
        method: GET
        description: View a room participant.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_participant_id
          in: path
          type: string
          description: The unique identifier of a room participant.
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-room-participants-rest
    port: 8080
    description: REST adapter for Telnyx API — Room Participants. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/room-participants
      name: room-participants
      description: REST surface for room_participants.
      operations:
      - method: GET
        name: listroomparticipants
        description: View a list of room participants.
        call: telnyx-room-participants.listroomparticipants
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/room-participants/{room-participant-id}
      name: room-participants-room-participant-id
      description: REST surface for room_participants-room_participant_id.
      operations:
      - method: GET
        name: viewroomparticipant
        description: View a room participant.
        call: telnyx-room-participants.viewroomparticipant
        with:
          room_participant_id: rest.room_participant_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-room-participants-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Room Participants. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: view-list-room-participants
      description: View a list of room participants.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-room-participants.listroomparticipants
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: view-room-participant
      description: View a room participant.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-room-participants.viewroomparticipant
      with:
        room_participant_id: tools.room_participant_id
      outputParameters:
      - type: object
        mapping: $.
