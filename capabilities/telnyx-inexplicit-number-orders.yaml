        description: Create an inexplicit number order
        call: telnyx-inexplicit-number-orders.createinexplicitnumberorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/inexplicit-number-orders/{id}
