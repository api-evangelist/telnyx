naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — SIM Card Groups
  description: 'Telnyx API — SIM Card Groups. 9 operations. Lead operation: Get all SIM card groups. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - SIM Card Groups
  created: '2026-05-19'
  modified: '2026-05-19'
