    resources:
    - name: sim_card_groups
      path: /sim_card_groups
      operations:
      - name: getallsimcardgroups
        method: GET
        description: Get all SIM card groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[name]
          in: query
          type: string
          description: A valid SIM card group name.
        - name: filter[private_wireless_gateway_id]
          in: query
          type: string
          description: A Private Wireless Gateway ID associated with the group.
        - name: filter[wireless_blocklist_id]
          in: query
          type: string
          description: A Wireless Blocklist ID associated with the group.
      - name: createsimcardgroup
        method: POST
        description: Create a SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sim_card_groups-id
      path: /sim_card_groups/{id}
      operations:
      - name: deletesimcardgroup
        method: DELETE
        description: Delete a SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getsimcardgroup
        method: GET
        description: Get SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatesimcardgroup
        method: PATCH
        description: Update a SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sim_card_groups-id-actions-remove_private_wireless_gateway
      path: /sim_card_groups/{id}/actions/remove_private_wireless_gateway
      operations:
      - name: removesimcardgroupprivatewirelessgateway
        method: POST
        description: Request Private Wireless Gateway removal from SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sim_card_groups-id-actions-remove_wireless_blocklist
      path: /sim_card_groups/{id}/actions/remove_wireless_blocklist
      operations:
      - name: removewirelessblocklistforsimcardgroup
        method: POST
        description: Request Wireless Blocklist removal from SIM card group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
