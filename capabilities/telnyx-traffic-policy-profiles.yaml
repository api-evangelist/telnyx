      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: telnyx-traffic-policy-profiles.deletetrafficpolicyprofile
      outputParameters:
      - type: object
        mapping: $.
    - name: get-traffic-policy-profile
      description: Get a traffic policy profile
      hints:
        readOnly: true
        destructive: false
