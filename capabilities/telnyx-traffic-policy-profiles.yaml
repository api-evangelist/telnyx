naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Traffic Policy Profiles
  description: 'Telnyx API — Traffic Policy Profiles. 6 operations. Lead operation: Get all traffic policy profiles. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Traffic Policy Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
