    namespace: telnyx-traffic-policy-profiles
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Traffic Policy Profiles business capability. Self-contained, no shared references.
    resources:
    - name: traffic_policy_profiles
      path: /traffic_policy_profiles
      operations:
      - name: gettrafficpolicyprofiles
        method: GET
        description: Get all traffic policy profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[type]
          in: query
          type: string
          description: Filter by traffic policy profile type.
        - name: filter[service]
          in: query
          type: string
          description: Filter by service ID.
        - name: sort
          in: query
          type: string
          description: Sorts traffic policy profiles by the given field. Defaults to ascending order unless field is prefixed
            with a minus sign.
      - name: createtrafficpolicyprofile
        method: POST
        description: Create a traffic policy profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: traffic_policy_profiles-services
      path: /traffic_policy_profiles/services
      operations:
      - name: gettrafficpolicyprofileservices
        method: GET
        description: Get all available traffic policy profile services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter[group]
          in: query
          type: string
          description: Filter services by group.
        - name: filter[name]
          in: query
          type: string
          description: Filter services by name.
    - name: traffic_policy_profiles-id
      path: /traffic_policy_profiles/{id}
      operations:
      - name: deletetrafficpolicyprofile
        method: DELETE
        description: Delete a traffic policy profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: gettrafficpolicyprofile
        method: GET
        description: Get a traffic policy profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatetrafficpolicyprofile
        method: PATCH
        description: Update a traffic policy profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-traffic-policy-profiles-rest
    port: 8080
    description: REST adapter for Telnyx API — Traffic Policy Profiles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/traffic-policy-profiles
      name: traffic-policy-profiles
      description: REST surface for traffic_policy_profiles.
      operations:
      - method: GET
        name: gettrafficpolicyprofiles
        description: Get all traffic policy profiles
        call: telnyx-traffic-policy-profiles.gettrafficpolicyprofiles
        with:
          filter[type]: rest.filter[type]
          filter[service]: rest.filter[service]
          sort: rest.sort
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtrafficpolicyprofile
        description: Create a traffic policy profile
        call: telnyx-traffic-policy-profiles.createtrafficpolicyprofile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/traffic-policy-profiles/services
      name: traffic-policy-profiles-services
      description: REST surface for traffic_policy_profiles-services.
      operations:
      - method: GET
        name: gettrafficpolicyprofileservices
        description: Get all available traffic policy profile services
        call: telnyx-traffic-policy-profiles.gettrafficpolicyprofileservices
        with:
          filter[group]: rest.filter[group]
          filter[name]: rest.filter[name]
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/traffic-policy-profiles/{id}
      name: traffic-policy-profiles-id
      description: REST surface for traffic_policy_profiles-id.
      operations:
      - method: DELETE
        name: deletetrafficpolicyprofile
        description: Delete a traffic policy profile
        call: telnyx-traffic-policy-profiles.deletetrafficpolicyprofile
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: gettrafficpolicyprofile
        description: Get a traffic policy profile
        call: telnyx-traffic-policy-profiles.gettrafficpolicyprofile
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatetrafficpolicyprofile
        description: Update a traffic policy profile
        call: telnyx-traffic-policy-profiles.updatetrafficpolicyprofile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
