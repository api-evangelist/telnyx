      operations:
      - name: submitrequirementgroup
        method: POST
        description: Submit a Requirement Group for Approval
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the requirement group to submit
          required: true
    - name: sub_number_orders-id-requirement_group
      path: /sub_number_orders/{id}/requirement_group
      operations:
      - name: updatesubnumberorderrequirementgroup
        method: POST
        description: Update requirement group for a sub number order
