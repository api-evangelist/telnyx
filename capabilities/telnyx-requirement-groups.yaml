      path: /number_order_phone_numbers/{id}/requirement_group
      operations:
      - name: updatenumberorderphonenumberrequirementgroup
        method: POST
        description: Update requirement group for a phone number order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique identifier of the number order phone number
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: requirement_groups
      path: /requirement_groups
      operations:
      - name: getrequirementgroups
        method: GET
        description: List requirement groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Consolidated filter parameter (deepObject style). Originally: filter[country_code], filter[phone_number_type],
            filter[action], filter[status], filter[customer_r'
      - name: createrequirementgroup
        method: POST
        description: Create a new requirement group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
