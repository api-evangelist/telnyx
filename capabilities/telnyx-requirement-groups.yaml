      operations:
      - name: deleterequirementgroup
        method: DELETE
        description: Delete a requirement group by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the requirement group
          required: true
      - name: getrequirementgroup
        method: GET
        description: Get a single requirement group by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the requirement group to retrieve
          required: true
      - name: updaterequirementgroup
        method: PATCH
        description: Update requirement values in requirement group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: ID of the requirement group
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
