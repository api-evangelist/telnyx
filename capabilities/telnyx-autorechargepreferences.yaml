naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — AutoRechargePreferences
  description: 'Telnyx API — AutoRechargePreferences. 2 operations. Lead operation: List auto recharge preferences. Self-contained
    Naftiko capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - AutoRechargePreferences
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-autorechargepreferences
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — AutoRechargePreferences business capability. Self-contained, no shared references.
    resources:
    - name: payment-auto_recharge_prefs
      path: /payment/auto_recharge_prefs
      operations:
      - name: getautorechargeprefs
        method: GET
        description: List auto recharge preferences
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateautorechargeprefs
        method: PATCH
        description: Update auto recharge preferences
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-autorechargepreferences-rest
    port: 8080
    description: REST adapter for Telnyx API — AutoRechargePreferences. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/payment/auto-recharge-prefs
      name: payment-auto-recharge-prefs
      description: REST surface for payment-auto_recharge_prefs.
      operations:
      - method: GET
        name: getautorechargeprefs
        description: List auto recharge preferences
        call: telnyx-autorechargepreferences.getautorechargeprefs
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateautorechargeprefs
        description: Update auto recharge preferences
        call: telnyx-autorechargepreferences.updateautorechargeprefs
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-autorechargepreferences-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — AutoRechargePreferences. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-auto-recharge-preferences
      description: List auto recharge preferences
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-autorechargepreferences.getautorechargeprefs
      outputParameters:
      - type: object
        mapping: $.
    - name: update-auto-recharge-preferences
      description: Update auto recharge preferences
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: telnyx-autorechargepreferences.updateautorechargeprefs
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
