naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Country Coverage
  description: 'Telnyx API — Country Coverage. 2 operations. Lead operation: Get country coverage. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Country Coverage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-country-coverage
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Country Coverage business capability. Self-contained, no shared references.
    resources:
    - name: country_coverage
      path: /country_coverage
      operations:
      - name: retreivecountrycoverage
        method: GET
        description: Get country coverage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: country_coverage-countries-country_code
      path: /country_coverage/countries/{country_code}
      operations:
      - name: retreivespecificcountrycoverage
        method: GET
        description: Get coverage for a specific country
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: country_code
          in: path
          type: string
          description: Country ISO code.
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-country-coverage-rest
    port: 8080
    description: REST adapter for Telnyx API — Country Coverage. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/country-coverage
      name: country-coverage
      description: REST surface for country_coverage.
      operations:
      - method: GET
        name: retreivecountrycoverage
        description: Get country coverage
        call: telnyx-country-coverage.retreivecountrycoverage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/country-coverage/countries/{country-code}
      name: country-coverage-countries-country-code
      description: REST surface for country_coverage-countries-country_code.
      operations:
      - method: GET
        name: retreivespecificcountrycoverage
        description: Get coverage for a specific country
        call: telnyx-country-coverage.retreivespecificcountrycoverage
        with:
          country_code: rest.country_code
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-country-coverage-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Country Coverage. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-country-coverage
      description: Get country coverage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-country-coverage.retreivecountrycoverage
      outputParameters:
      - type: object
        mapping: $.
    - name: get-coverage-specific-country
      description: Get coverage for a specific country
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-country-coverage.retreivespecificcountrycoverage
      with:
        country_code: tools.country_code
      outputParameters:
      - type: object
        mapping: $.
