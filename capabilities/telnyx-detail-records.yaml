naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Detail Records
  description: 'Telnyx API — Detail Records. 1 operations. Lead operation: Search detail records. Self-contained Naftiko capability
    covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Detail Records
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-detail-records
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Detail Records business capability. Self-contained, no shared references.
    resources:
    - name: detail_records
      path: /detail_records
      operations:
      - name: searchdetailrecords
        method: GET
        description: Search detail records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: object
          description: 'Filter records on a given record attribute and value. <br/>Example: filter[status]=delivered. <br/>Required:
            filter[record_type] must be specified.'
        - name: sort
          in: query
          type: array
          description: 'Specifies the sort order for results. <br/>Example: sort=-created_at'
        - name: page
          in: query
          type: object
          description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-detail-records-rest
    port: 8080
    description: REST adapter for Telnyx API — Detail Records. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/detail-records
      name: detail-records
      description: REST surface for detail_records.
      operations:
      - method: GET
        name: searchdetailrecords
        description: Search detail records
        call: telnyx-detail-records.searchdetailrecords
        with:
          filter: rest.filter
          sort: rest.sort
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-detail-records-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Detail Records. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-detail-records
      description: Search detail records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-detail-records.searchdetailrecords
      with:
        filter: tools.filter
        sort: tools.sort
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
