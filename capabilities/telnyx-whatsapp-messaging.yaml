naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Whatsapp messaging
  description: 'Telnyx API — Whatsapp messaging. 1 operations. Lead operation: Send a Whatsapp message. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Whatsapp messaging
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-whatsapp-messaging
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Whatsapp messaging business capability. Self-contained, no shared references.
    resources:
    - name: messages-whatsapp
      path: /messages/whatsapp
      operations:
      - name: sendwhatsappmessage
        method: POST
        description: Send a Whatsapp message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-whatsapp-messaging-rest
    port: 8080
    description: REST adapter for Telnyx API — Whatsapp messaging. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/messages/whatsapp
      name: messages-whatsapp
      description: REST surface for messages-whatsapp.
      operations:
      - method: POST
        name: sendwhatsappmessage
        description: Send a Whatsapp message
        call: telnyx-whatsapp-messaging.sendwhatsappmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-whatsapp-messaging-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Whatsapp messaging. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: send-whatsapp-message
      description: Send a Whatsapp message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telnyx-whatsapp-messaging.sendwhatsappmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
