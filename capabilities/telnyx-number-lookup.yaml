naftiko: 1.0.0-alpha2
info:
  label: Telnyx API — Number Lookup
  description: 'Telnyx API — Number Lookup. 1 operations. Lead operation: Lookup phone number data. Self-contained Naftiko
    capability covering one Telnyx business surface.'
  tags:
  - Telnyx
  - Number Lookup
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELNYX_API_KEY: TELNYX_API_KEY
capability:
  consumes:
  - type: http
    namespace: telnyx-number-lookup
    baseUri: https://api.telnyx.com/v2
    description: Telnyx API — Number Lookup business capability. Self-contained, no shared references.
    resources:
    - name: number_lookup-phone_number
      path: /number_lookup/{phone_number}
      operations:
      - name: lookupnumber
        method: GET
        description: Lookup phone number data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TELNYX_API_KEY}}'
  exposes:
  - type: rest
    namespace: telnyx-number-lookup-rest
    port: 8080
    description: REST adapter for Telnyx API — Number Lookup. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/number-lookup/{phone-number}
      name: number-lookup-phone-number
      description: REST surface for number_lookup-phone_number.
      operations:
      - method: GET
        name: lookupnumber
        description: Lookup phone number data
        call: telnyx-number-lookup.lookupnumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: telnyx-number-lookup-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telnyx API — Number Lookup. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: lookup-phone-number-data
      description: Lookup phone number data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: telnyx-number-lookup.lookupnumber
      outputParameters:
      - type: object
        mapping: $.
