delivery:
  source: https://developers.telnyx.com/docs/development/api-fundamentals/webhooks/receiving-webhooks + https://developers.telnyx.com/docs/voice/programmable-voice/voice-api-webhooks
    (2026-10-08)
  transport: HTTPS POST to a configured primary URL with an optional failover URL per product application/profile
  envelope: 'data{record_type: event, event_type, id, occurred_at, payload} + meta{attempt, delivered_to} for most
    V2 JSON callbacks; TeXML callbacks can be form-encoded'
  signature:
    headers:
    - telnyx-timestamp
    - telnyx-signature-ed25519
    algorithm: Ed25519 over the raw body bytes, verified against the account public key (https://portal.telnyx.com/#/api-keys/public-key)
    sdk_helpers: Node, Python, Go, Java, Ruby and PHP verification helpers reading TELNYX_PUBLIC_KEY
  acknowledgement: return 2xx promptly (some products require 200); process asynchronously and idempotently keyed
    on the event id
  retries: product-specific; Call Control retries on no response, 408 and 429 and fails over to webhook_event_failover_url;
    webhook_timeout_secs 0-30 per application; no single schedule is published
  ordering: events can be concurrent, duplicated, delayed or out of order; reconcile using occurred_at
  delivery_log: webhook_deliveries endpoints expose per-attempt request/response details
