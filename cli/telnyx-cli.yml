name: Telnyx CLI
binary: telnyx
description: The official command-line interface for the Telnyx REST API, generated with Stainless and auto-generated
  from the OpenAPI; resource-based `telnyx [resource] <command> [flags...]` with JSON, YAML, pretty-print and raw
  output and a debug mode.
docs: https://developers.telnyx.com/docs/development/cli
repo: https://github.com/team-telnyx/telnyx-cli
version: v0.32.0 (proxy.golang.org, 2026-09-23); npm @telnyx/cli 2.0.0 (2026-02-02)
install:
  go: go install 'github.com/team-telnyx/telnyx-cli/cmd/telnyx@latest'
  npm: npm package @telnyx/cli exists on the registry (repository team-telnyx/telnyx-cli); the current docs page
    installs via Go
  auth: export TELNYX_API_KEY=KEY_xxxxxxxxxxxxx (or --api-key flag)
commands:
  phone-numbers:
  - telnyx phone-numbers list
  available-phone-numbers:
  - telnyx available-phone-numbers list --filter.country-code US
  messages:
  - telnyx messages send --from +15551234567 --to +15559876543 --text "Hello from CLI!"
  balance:
  - telnyx balance retrieve
  calls:
  - telnyx calls dial --connection-id conn12345 --from +15557654321 --to +15551234567 --webhook-url https://your-webhook.url/events
  help:
  - telnyx [resource] <command> --help
key_flows:
- name: Send an SMS
  steps:
  - export TELNYX_API_KEY
  - telnyx messages send --from ... --to ... --text ...
- name: Find and list numbers
  steps:
  - telnyx available-phone-numbers list --filter.country-code US
  - telnyx phone-numbers list
- name: Place a call
  steps:
  - telnyx calls dial --connection-id ... --from ... --to ... --webhook-url ...
companion_cli:
  name: Telnyx Agent CLI
  package: '@telnyx/agent-cli'
  binary: telnyx-agent
  install: npm install -g @telnyx/agent-cli
  docs: https://developers.telnyx.com/docs/development/cli/agent-cli
  commands:
  - telnyx-agent status
  - telnyx-agent capabilities --json
  - telnyx-agent setup-sms --json
  - telnyx-agent setup-voice
  - telnyx-agent setup-verify
  note: Composite, idempotent setup commands for AI agents (re-running reuses provisioned resources); every command
    supports --json. Shares TELNYX_API_KEY with the Telnyx CLI. A `telnyx-edge` CLI is named in the 2026-10-07 StatefulActor
    release note; its install was not found this run.
