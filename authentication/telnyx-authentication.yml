- name: Payment
  type: x402
  description: 'Pay-per-call inference without an account: POST https://x402.telnyx.com/v1/chat/completions returns
    402 with a payment quote; retry with the signed EIP-3009 USDC quote in the X-Payment header (auth.md Method
    3; `Payment` securityScheme in https://telnyx.com/openapi.json).'
  sources:
  - https://telnyx.com/auth.md
  - https://telnyx.com/.well-known/x402
docs: https://developers.telnyx.com/docs/development/api-fundamentals/authentication
details:
  api_key:
    header: 'Authorization: Bearer <TELNYX_API_KEY>'
    issued_at: https://portal.telnyx.com/#/app/api-keys
    note: Keys may carry an expiration date; the docs list a seven-step rotation lifecycle.
    agent_signup: https://telnyx.com/agent-signup.md (programmatic bot-challenge signup named in auth.md; not exercised)
  oauth2:
    authorization_server: https://api.telnyx.com/.well-known/oauth-authorization-server
    grants_supported:
    - authorization_code
    - client_credentials
    - refresh_token
    credential_types_supported:
    - bearer_api_key
    - oauth_pkce
    pkce: S256 (auth.md Method 2)
    scopes: scopes/telnyx-scopes.yml
  unauthenticated_response: '401 with WWW-Authenticate: Bearer realm="Telnyx API", error="invalid_token" (auth.md)'
  webhooks:
    signature_headers:
    - telnyx-timestamp
    - telnyx-signature-ed25519
    public_key: https://portal.telnyx.com/#/api-keys/public-key
