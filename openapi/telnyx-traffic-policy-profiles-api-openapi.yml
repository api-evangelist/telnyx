          application/json:
            schema:
              type: object
              properties:
                type:
                  description: The type of the traffic policy profile.
                  type: string
                  enum:
                  - whitelist
                  - blacklist
                  - throttling
                  example: whitelist
                services:
                  description: Array of PCEF service IDs to include in the profile.
                  type: array
                  items:
                    type: string
                  example:
                  - service_123
                ip_ranges:
                  description: Array of IP ranges in CIDR notation.
                  type: array
                  items:
                    type: string
                  example:
                  - 10.64.0.0/24
                domains:
                  description: Array of domain names.
                  type: array
                  items:
                    type: string
                  example:
                  - netflix.com
                limit_bw_kbps:
                  description: Bandwidth limit in kbps. Must be 512 or 1024, or null to remove.
                  type:
                  - integer
                  - 'null'
                  enum:
                  - 512
                  - 1024
                  - null
                  example: 1024
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
