openapi: 3.2.0
info:
  title: Telnyx Traffic Policy Profiles API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Traffic Policy Profiles across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Traffic Policy Profiles
  description: Traffic Policy Profiles operations
paths:
  /traffic/policy/profiles:
    get:
      summary: Get all traffic policy profiles
      description: Get all traffic policy profiles belonging to the user that match the given filters.
      operationId: GetTrafficPolicyProfiles
      tags:
      - Traffic Policy Profiles
      parameters:
      - $ref: '#/components/parameters/wireless_PageNumber'
      - $ref: '#/components/parameters/wireless_PageSize'
      - name: filter[type]
        description: Filter by traffic policy profile type.
        in: query
        required: false
        schema:
          type: string
          enum:
          - whitelist
          - blacklist
          - throttling
        example: whitelist
      - name: filter[service]
        description: Filter by service ID.
        in: query
        required: false
        schema:
          type: string
        example: service_123
      - name: sort
        description: Sorts traffic policy profiles by the given field. Defaults to ascending order unless field is prefixed with a minus sign.
        in: query
        required: false
        schema:
          type: string
          enum:
          - service
          - -service
          - type
          - -type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficPolicyProfile'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        default:
          $ref: '#/components/responses/sim-cards-configuration_wireless_GenericErrorResponse'
      x-latency-category: responsive
    post:
      summary: Create a traffic policy profile
      description: Create a new traffic policy profile. At least one of `services`, `ip_ranges`, or `domains` must be provided.
      operationId: CreateTrafficPolicyProfile
      tags:
      - Traffic Policy Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  description: The type of the traffic policy profile.
                  type: string
                  enum:
                  - whitelist
                  - blacklist
                  example: whitelist
                services:
                  description: Array of PCEF service IDs to include in the profile.
                  type: array
                  items:
                    type: string
                  example:
                  - service_123
                  - service_456
                ip_ranges:
                  description: Array of IP ranges in CIDR notation.
                  type: array
                  items:
                    type: string
                  example:
                  - 10.64.0.0/24
                  - 10.64.0.0/25
                domains:
                  description: Array of domain names.
                  type: array
                  items:
                    type: string
                  example:
                  - www.hbomax.com
                  - netflix.com
                limit_bw_kbps:
                  description: Bandwidth limit in kbps. Must be 512 or 1024.
                  type: integer
                  enum:
                  - 512
                  - 1024
                  example: 512
              required:
              - type
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrafficPolicyProfile'
        '422':
          $ref: '#/components/responses/sim-cards-configuration_wireless_UnprocessableEntity'
        default:
          $ref: '#/components/responses/sim-cards-configuration_wireless_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /traffic/policy/profiles/services:
    get:
      summary: Get all available traffic policy profile services
      description: Get all available PCEF services that can be used in traffic policy profiles.
      operationId: GetTrafficPolicyProfileServices
      tags:
      - Traffic Policy Profiles
      parameters:
      - $ref: '#/components/parameters/wireless_PageNumber'
      - $ref: '#/components/parameters/wireless_PageSize'
      - name: filter[group]
        description: Filter services by group.
        in: query
        required: false
        schema:
          type: string
        example: Social Media
      - name: filter[name]
        description: Filter services by name.
        in: query
        required: false
        schema:
          type: string
        example: Netflix
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WirelessPcrfService'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        default:
          $ref: '#/components/responses/sim-cards-configuration_wireless_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /traffic/policy/profiles/{id}:
    delete:
      summary: Delete a traffic policy profile
      description: Permanently deletes the specified traffic policy profile from your account.
      operationId: DeleteTrafficPolicyProfile
      tags:
      - Traffic Policy Profiles
      parameters:
      - $ref: '#/components/parameters/TrafficPolicyProfileId'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Identifies the resource.
                        example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        '404':
          $ref: '#/components/responses/wireless_ResourceNotFound'
        default:
          $ref: '#/components/responses/sim-cards-configuration_wireless_GenericErrorResponse'
      x-latency-category: responsive
    get:
      summary: Get a traffic policy profile
      description: Returns the details regarding a specific traffic policy profile.
      operationId: GetTrafficPolicyProfile
      tags:
      - Traffic Policy Profiles
      parameters:
      - $ref: '#/components/parameters/TrafficPolicyProfileId'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrafficPolicyProfile'
        '404':
          $ref: '#/components/responses/wireless_ResourceNotFound'
        default:
          $ref: '#/components/responses/sim-cards-configuration_wireless_GenericErrorResponse'
      x-latency-category: responsive
    patch:
      summary: Update a traffic policy profile
      description: Updates the specified traffic policy profile and returns the updated profile.
      operationId: UpdateTrafficPolicyProfile
      tags:
      - Traffic Policy Profiles
      parameters:
      - $ref: '#/components/parameters/TrafficPolicyProfileId'
      requestBody:
