openapi: 3.2.0
info:
  title: Telnyx Regulatory Requirements API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Regulatory Requirements across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Regulatory Requirements
  description: Regulatory Requirements
paths:
  /phone_numbers/regulatory_requirements:
    get:
      summary: Retrieve regulatory requirements for a list of phone numbers
      operationId: ListRegulatoryRequirementsPhoneNumbers
      tags:
      - Regulatory Requirements
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[phone_number]'
        schema:
          type: object
          properties:
            phone_number:
              type: string
              example: +41215470622,+41215470633
              description: Record type phone number/ phone numbers
      responses:
        '200':
          description: An array of Regulatory Requirements Responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegulatoryRequirementsPhoneNumbers'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/numbers_GenericErrorResponse'
      x-latency-category: responsive
      description: Retrieve the regulatory requirements that apply to a list of phone numbers.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers_regulatory_requirements:
    get:
      summary: Retrieve regulatory requirements for a list of phone numbers
      operationId: ListRegulatoryRequirementsPhoneNumbers_2
      tags:
      - Regulatory Requirements
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[phone_number]'
        schema:
          type: object
          properties:
            phone_number:
              type: string
              example: +41215470622,+41215470633
              description: Record type phone number/ phone numbers
      responses:
        '200':
          description: An array of Regulatory Requirements Responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegulatoryRequirementsPhoneNumbers'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the regulatory requirements that apply to the supplied comma-separated phone numbers. The response includes the matching requirement records and pagination metadata.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /regulatory_requirements:
    get:
      summary: Retrieve regulatory requirements
      operationId: ListRegulatoryRequirements
      tags:
      - Regulatory Requirements
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[phone_number], filter[requirement_group_id], filter[country_code], filter[phone_number_type], filter[action]'
        schema:
          type: object
          properties:
            phone_number:
              type: string
              example: '+41215470622'
              description: Phone number to check requirements for
            requirement_group_id:
              type: string
              example: d4c0b4a6-7bd2-40c5-a3b9-2acd99e212b2
              description: ID of requirement group to check requirements for
            country_code:
              type: string
              example: DE
              description: Country code(iso2) to check requirements for
            phone_number_type:
              type: string
              enum:
              - local
              - toll_free
              - mobile
              - national
              - shared_cost
              description: Phone number type to check requirements for
            action:
              type: string
              enum:
              - ordering
              - porting
              - action
              description: Action to check requirements for
      responses:
        '200':
          description: An array of Regulatory Requirements Responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegulatoryRequirements'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns regulatory requirements for number ordering, porting, or other supported actions. Results can be filtered by phone number, requirement group, country, number type, and action.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    numbers_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/numbers_Error'
      type: object
    numbers_Error:
      properties:
        code:
          type: string
          example: '10007'
        title:
          type: string
          example: Unexpected error
        detail:
          type: string
          example: An unexpected error occured.
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              example: /base
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties:
            url:
              type: string
              description: URL with additional information on the error.
              example: https://developers.telnyx.com/docs/overview/errors/10015
      type: object
    RegulatoryRequirementsPhoneNumbers:
      properties:
        phone_number:
          type: string
          example: '+41215471644'
          readOnly: true
        phone_number_type:
          type: string
          example: local
          readOnly: true
        region_information:
          type: array
          items:
            type: object
            properties:
              region_name:
                type: string
                example: CH
              region_type:
                type: string
                example: country_code
        record_type:
          type: string
          example: phone_number_regulatory_requirements
          readOnly: true
        regulatory_requirements:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                example: Address matching the DID area code (street, building number, postal code, city and country)
                readOnly: true
              id:
                type: string
                format: uuid
                example: 12ade33a-21c0-473b-b055-b3c836e1c292
                readOnly: true
              example:
                type: string
                example: 600 Congress Avenue, 14th Floor, Austin, TX 78701
                readOnly: true
              label:
                type: string
                example: Address matching the DID area code
              field_type:
                type: string
                example: address_id
              acceptance_criteria:
                type: object
                properties:
                  locality_limit:
                    type: string
                    example: Identical locality as the numbers desired
                  field_value:
                    type: string
                    example: 45f45a04-b4be-4592-95b1-9306b9db2b21
                  field_type:
                    type: string
                    example: address
              record_type:
                type: string
                example: regulatory_requirement
                readOnly: true
      type: object
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    RegulatoryRequirements:
      properties:
        country_code:
          type: string
          example: DE
          readOnly: true
        phone_number_type:
          type: string
          example: local
          readOnly: true
        action:
          type: string
          example: ordering
          readOnly: true
        regulatory_requirements:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                example: Address matching the DID area code (street, building number, postal code, city and country)
                readOnly: true
              id:
                type: string
                format: uuid
                example: 12ade33a-21c0-473b-b055-b3c836e1c292
                readOnly: true
              example:
                type: string
                example: 600 Congress Avenue, 14th Floor, Austin, TX 78701
                readOnly: true
              name:
                type: string
                example: Address matching the DID area code
              field_type:
                type: string
                example: address_id
              acceptance_criteria:
                type: object
                properties:
                  locality_limit:
                    type: string
                    example: Identical locality as the numbers desired
                  time_limit:
                    type: string
                    example: Less than 5 months old
                  regex:
                    type: string
                    example: regex field value must match
                  case_sensitive:
                    type: string
                    example: Whether field value is case sensitive
                  acceptable_characters:
                    type: string
                    example: Characters that can be included in field value
                  acceptable_values:
                    type: array
                    items:
                      type: string
                  max_length:
                    type: string
                    example: '10'
                  min_length:
                    type: string
                    example: '5'
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
