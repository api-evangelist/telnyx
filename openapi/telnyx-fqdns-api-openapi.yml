openapi: 3.2.0
info:
  title: Telnyx FQDNs API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged FQDNs across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: FQDNs
  description: FQDN operations
paths:
  /fqdns:
    get:
      summary: List FQDNs
      description: Get all FQDNs belonging to the user that match the given filters.
      operationId: ListFqdns
      tags:
      - FQDNs
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/connections_PageConsolidated'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[connection_id], filter[fqdn], filter[port], filter[dns_record_type]'
        schema:
          type: object
          properties:
            connection_id:
              type: string
              description: ID of the FQDN connection to which the FQDN belongs.
            fqdn:
              type: string
              example: example.com
              description: FQDN represented by the resource.
            port:
              type: integer
              example: 5060
              description: Port to use when connecting to the FQDN.
            dns_record_type:
              type: string
              example: a
              description: DNS record type used by the FQDN.
      responses:
        '200':
          description: Successful response with a list of FQDN connections.
          content:
            application/json:
              schema:
                type: object
                title: List FQDNs Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fqdn'
                  meta:
                    $ref: '#/components/schemas/connections_PaginationMeta'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
    post:
      description: Creates a new FQDN record and attaches it to the specified connection.
      summary: Create an FQDN
      operationId: CreateFqdn
      tags:
      - FQDNs
      x-endpoint-cost: medium
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFqdnRequest'
      responses:
        '201':
          description: Successful response with details about an FQDN connection.
          content:
            application/json:
              schema:
                type: object
                title: FQDN Response
                properties:
                  data:
                    $ref: '#/components/schemas/Fqdn'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /fqdns/{id}:
    delete:
      description: Permanently deletes the specified FQDN record from its connection.
      summary: Delete an FQDN
      operationId: DeleteFqdn
      tags:
      - FQDNs
      parameters:
      - $ref: '#/components/parameters/FqdnId'
      responses:
        '200':
          description: Successful response with details about an FQDN connection.
          content:
            application/json:
              schema:
                type: object
                title: FQDN Response
                properties:
                  data:
                    $ref: '#/components/schemas/Fqdn'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    get:
      description: Return the details regarding a specific FQDN.
      summary: Retrieve an FQDN
      operationId: RetrieveFqdn
      tags:
      - FQDNs
      parameters:
      - $ref: '#/components/parameters/FqdnId'
      responses:
        '200':
          description: Successful response with details about an FQDN connection.
          content:
            application/json:
              schema:
                type: object
                title: FQDN Response
                properties:
                  data:
                    $ref: '#/components/schemas/Fqdn'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    patch:
      description: Updates the details of the specified FQDN record and returns the updated FQDN.
      summary: Update an FQDN
      operationId: UpdateFqdn
      tags:
      - FQDNs
      parameters:
      - $ref: '#/components/parameters/FqdnId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFqdnRequest'
      responses:
        '200':
          description: Successful response with details about an FQDN connection.
          content:
            application/json:
              schema:
                type: object
                title: FQDN Response
                properties:
                  data:
                    $ref: '#/components/schemas/Fqdn'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
        '409':
          description: Conflict. Another update to this connection is still in progress. Wait and retry the request later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connections_ErrorResponse'
              example:
                errors:
                - detail: A previous update to this connection is still in progress. Please try again later.
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
