        digits:
          description: 'DTMF digits to send. Valid characters: 0-9, A-D, *, #, w (0.5s pause), W (1s pause).'
          type: string
          example: 1234#
        call_control_ids:
          description: Array of participant call control IDs to send DTMF to. When empty, DTMF will be sent to all participants.
          type: array
