openapi: 3.2.0
info:
  title: Telnyx WDR Detail Reports API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged WDR Detail Reports across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: WDR Detail Reports
paths:
  /reports/wdrs:
    get:
      tags:
      - WDR Detail Reports
      description: Returns wireless detail records (WDRs) matching the provided criteria, such as date range, SIM card, IMSI, or phone number, with pagination and sorting.
      summary: Fetches all Wdr records
      operationId: GetPaginatedWdrs
      parameters:
      - name: start_date
        in: query
        description: Start date
        schema:
          type: string
          example: '2021-05-01T00:00:00Z'
      - name: end_date
        in: query
        description: End date
        schema:
          type: string
          example: '2021-06-01T00:00:00Z'
      - name: id
        in: query
        description: Filter results by identifier.
        schema:
          type: string
          description: WDR uuid
          example: e093fbe0-5bde-11eb-ae93-0242ac130002
      - name: mcc
        in: query
        description: Filter results by mcc.
        schema:
          type: string
          description: Mobile country code
          example: '204'
      - name: mnc
        in: query
        description: Filter results by mnc.
        schema:
          type: string
          description: Mobile network code
          example: '01'
      - name: imsi
        in: query
        description: Filter results by imsi.
        schema:
          type: string
          description: International mobile subscriber identity
          example: '123456'
      - name: sim_group_name
        in: query
        description: Filter results by sim group name.
        schema:
          type: string
          description: Sim group name
          example: sim name
      - name: sim_group_id
        in: query
        description: Filter results by sim group id.
        schema:
          type: string
          description: Sim group unique identifier
          example: f05a189f-7c46-4531-ac56-1460dc465a42
      - name: sim_card_id
        in: query
        description: Filter results by sim card id.
        schema:
          type: string
          description: Sim card unique identifier
          example: 877f80a6-e5b2-4687-9a04-88076265720f
      - name: phone_number
        in: query
        description: Filter results by phone number.
        schema:
          type: string
          description: Phone number
          example: '+12345678910'
      - name: sort
        in: query
        description: Field and direction to sort the results by.
        schema:
          type: array
          items:
            type: string
          description: Field used to order the data. If no field is specified, default value is 'created_at'
          example:
          - created_at
          default:
          - created_at
      - name: page
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
        schema:
          type: object
          properties:
            number:
              type: integer
              format: int32
              default: 1
              description: Page number
            size:
              type: integer
              format: int32
              default: 20
              description: Size of the page
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wireless-public_ExternalWdrGetDetailResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wireless-public_ErrorResponse_ea8f2ad863'
      x-latency-category: interactive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    wireless-public_Error_ea8f2ad863:
      type: object
      properties:
        code:
          type: string
          example: '10011'
        title:
          type: string
          example: Bad Request
        detail:
          type: string
          example: Invalid parameter value
    ExternalWdrDetailRecordDto:
      type: object
      properties:
        id:
          type: string
          description: WDR id
          example: 3ca7bd3d-7d82-4e07-9df4-009123068320
        created_at:
          type: string
          description: Record created time
          format: date-time
          example: '2020-07-01T00:00:00-06:00'
        cost:
          $ref: '#/components/schemas/WirelessCost'
        mcc:
          type: string
          description: Mobile country code.
          example: '204'
        mnc:
          type: string
          description: Mobile network code.
          example: '01'
        downlink_data:
          $ref: '#/components/schemas/DownlinkData'
        duration_seconds:
          type: number
          description: Session duration in seconds.
          example: 1
        imsi:
          type: string
          description: International mobile subscriber identity.
          example: '123'
        rate:
          $ref: '#/components/schemas/WirelessRate'
        sim_group_name:
          type: string
          description: Defined sim group name
          example: sim name
        sim_group_id:
          type: string
          description: Sim group unique identifier
          example: f05a189f-7c46-4531-ac56-1460dc465a42
        sim_card_id:
          type: string
          description: Sim card unique identifier
          example: 877f80a6-e5b2-4687-9a04-88076265720f
        phone_number:
          type: string
          description: Phone number
          example: '+12345678910'
        uplink_data:
          $ref: '#/components/schemas/UplinkData'
        record_type:
          type: string
          example: wdr
    WirelessCost:
      type: object
      properties:
        amount:
          type: string
          description: Final cost. Cost is calculated as rate * unit
          example: '0.1'
        currency:
          type: string
          description: Currency of the rate and cost
          example: USD
          enum:
          - AUD
          - CAD
          - EUR
          - GBP
          - USD
    wireless-public_ExternalWdrGetDetailResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalWdrDetailRecordDto'
        meta:
          $ref: '#/components/schemas/wireless-public_PaginationMeta_ea8f2ad863'
    UplinkData:
      type: object
      properties:
        amount:
          type: number
          description: Uplink data
          example: 1
        unit:
          description: Transmission unit
          type: string
          enum:
          - B
          - KB
          - MB
          default: MB
    DownlinkData:
      type: object
      properties:
        amount:
          type: number
          description: Downlink data
          example: 1
        unit:
          description: Transmission unit
          type: string
          enum:
          - B
          - KB
          - MB
          default: MB
    wireless-public_PaginationMeta_ea8f2ad863:
      type: object
      properties:
        total_pages:
          type: integer
          format: int32
          example: 3
        total_results:
          type: integer
          format: int32
          example: 55
        page_number:
          type: integer
          format: int32
          example: 2
        page_size:
          type: integer
          format: int32
          example: 25
    WirelessRate:
      type: object
      properties:
        amount:
          type: string
          description: Rate from which cost is calculated
          example: '0.1'
        currency:
          type: string
          description: Currency of the rate and cost
          example: USD
          enum:
          - AUD
          - CAD
          - EUR
          - GBP
          - USD
    wireless-public_ErrorResponse_ea8f2ad863:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/wireless-public_Error_ea8f2ad863'
    ExternalWdrGetDetailResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ExternalWdrDetailRecordDto'
          type: array
        meta:
          $ref: '#/components/schemas/wireless-public_PaginationMeta'
      type: object
    wireless-public_ErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/wireless-public_Error'
          type: array
      type: object
    wireless-public_PaginationMeta:
      properties:
        page_number:
          example: 2
          format: int32
          type: integer
        page_size:
          example: 25
          format: int32
          type: integer
        total_pages:
          example: 3
          format: int32
          type: integer
        total_results:
          example: 55
          format: int32
          type: integer
      type: object
    wireless-public_Error:
      properties:
        code:
          example: '10011'
          type: string
        detail:
          example: Invalid parameter value
          type: string
        title:
          example: Bad Request
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
