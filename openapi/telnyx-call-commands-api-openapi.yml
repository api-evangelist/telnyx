          language: en-US
          interruptible: speech
          interruptible_greeting: dtmf
          custom_parameters:
            customer_id: '12345'
      properties:
        assistant:
          $ref: '#/components/schemas/CallAssistantRequest'
        conversation_relay_config:
          $ref: '#/components/schemas/ConversationRelayEmbeddedConfig'
        to:
          description: The DID or SIP URI to dial out to. Multiple DID or SIP URIs can be provided using an array of strings. For SIP URI destinations, append `;secure=true` or `;secure=srtp` to enable SRTP media encryption for that endpoint, or `;secure=dtls` to enable DTLS media encryption for that endpoint. If `media_encryption` is set to `SRTP` or `DTLS`, it takes precedence over any per-endpoint `secure` URI parameter. For a single string destination, you may append a comma followed by DTMF digits (e.g. `+18004247767,200`) to play those digits as DTMF once the called party answers — equivalent to setting `send_digits_on_answer` separately. If both are present, the explicit `send_digits_on_answer` parameter takes precedence. This shorthand is not supported when `to` is an array.
          oneOf:
          - type: string
            example: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
          - type: array
            items:
              type: string
            example:
            - '+18005550100'
            - sip:username@sip.telnyx.com;secure=srtp
        from:
          description: The `from` number to be used as the caller id presented to the destination (`to` number). The number should be in +E164 format.
          type: string
          example: '+18005550101'
        diversion:
          description: The `to` number of an active inbound call, in +E164 format. Telnyx checks whether there is currently an active inbound call where `to` matches this `diversion` value and `from` matches the `from` number supplied for this request. If such a call exists, the `from` number is treated as verified (since it is already on an active inbound call to you) and can be used as the caller id for this outbound call.
          type: string
          example: '+18005550101'
        from_display_name:
          description: The `from_display_name` string to be used as the caller id name (SIP From Display Name) presented to the destination (`to` number). The string should have a maximum of 128 characters, containing only letters, numbers, spaces, and -_~!.+ special characters. If ommited, the display name will be the same as the number in the `from` field.
          type: string
          example: Company Name
        privacy:
          type: string
          description: Indicates the privacy level to be used for the call. When set to `id`, caller ID information (name and number) will be hidden from the called party. When set to `none` or omitted, caller ID will be shown normally.
          enum:
          - id
          - none
          example: id
        connection_id:
          type: string
          description: The ID of the Call Control App (formerly ID of the connection) to be used when dialing the destination.
        audio_url:
          type: string
          example: http://example.com/message.wav
          description: The URL of a file to be played back to the callee when the call is answered. The URL can point to either a WAV or MP3 file. media_name and audio_url cannot be used together in one request.
        send_digits_on_answer:
          type: string
          example: wwww200
          description: 'DTMF digits to send automatically after the called party answers. Useful for reaching an extension behind an IVR (e.g. `"200"` to dial extension 200 once the called party picks up). Allowed characters: `0-9`, `A-D`, `w` (0.5s pause), `W` (1s pause), `*`, `#`. Maximum 64 characters. When omitted, no automatic DTMF is sent. May also be supplied inline by appending `,<digits>` to `to` (e.g. `to=+18004247767,200`); if both forms are present, this explicit field takes precedence.'
        media_name:
          type: string
          example: my_media_uploaded_to_media_storage_api
          description: The media_name of a file to be played back to the callee when the call is answered. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
        preferred_codecs:
          type: string
          description: The list of comma-separated codecs in a preferred order for the forked media to be received.
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
        timeout_secs:
          description: The number of seconds that Telnyx will wait for the call to be answered by the destination to which it is being called. If the timeout is reached before an answer is received, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `timeout` will be sent. Minimum value is 5 seconds. Maximum value is 600 seconds.
          default: 30
          type: integer
          example: 60
          format: int32
        retry_on_timeout:
          description: Whether to keep trying the remaining routing paths (e.g. alternate providers/gateways) for the same destination after `timeout_secs` is reached for the current attempt. When set to `false`, reaching `timeout_secs` aborts the entire dial attempt and the `call.hangup` webhook reports a `hangup_cause` of `no_answer` instead of `timeout`.
          default: true
          type: boolean
          example: true
        time_limit_secs:
          description: Sets the maximum duration of a Call Control Leg in seconds. If the time limit is reached, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `time_limit` will be sent. For example, by setting a time limit of 120 seconds, a Call Leg will be automatically terminated two minutes after being answered. The default time limit is 14400 seconds or 4 hours and this is also the maximum allowed call length.
          default: 14400
          type: integer
          example: 600
          format: int32
          minimum: 30
          maximum: 14400
        answering_machine_detection:
          description: 'Enables Answering Machine Detection. Telnyx offers Premium and Standard detections. With Premium detection, when a call is answered, Telnyx runs real-time detection and sends a `call.machine.premium.detection.ended` webhook with one of the following results: `human_residence`, `human_business`, `machine`, `silence` or `fax_detected`. If we detect a beep, we also send a `call.machine.premium.greeting.ended` webhook with the result of `beep_detected`. If we detect a beep before `call.machine.premium.detection.ended` we only send `call.machine.premium.greeting.ended`, and if we detect a beep after `call.machine.premium.detection.ended`, we send both webhooks. With Standard detection, when a call is answered, Telnyx runs real-time detection to determine if it was picked up by a human or a machine and sends an `call.machine.detection.ended` webhook with the analysis result. If `greeting_end` or `detect_words` is used and a `machine` is detected, you will receive another `call.machine.greeting.ended` webhook when the answering machine greeting ends with a beep or silence. If `detect_beep` is used, you will only receive `call.machine.greeting.ended` if a beep is detected. If `answering_machine_detection` is set to `premium_ios_call_screening_detection`, Premium AMD runs with iOS Call Screening support: after an initial `machine` result, Telnyx listens for the iOS call-screening prompt to end or for an Apple Call Screening tone, sends `call.machine.premium.greeting.ended` with `result=prompt_ended` or `call.machine.premium.call_screening.detected` with `result=screening` respectively. When the Apple Call Screening tone is detected, Premium AMD is restarted on the screened call and a `call.machine.premium.detection.ended` webhook with the post-screening classification follows.'
          default: disabled
          type: string
          enum:
          - premium
          - premium_ios_call_screening_detection
          - detect
          - detect_beep
          - detect_words
          - greeting_end
          - disabled
        answering_machine_detection_config:
          description: Optional configuration parameters to modify 'answering_machine_detection' performance. Only `total_analysis_time_millis` and `greeting_duration_millis` parameters are applicable when `premium` is selected as answering_machine_detection. `prompt_end_timeout_millis` is additionally applicable when `premium_ios_call_screening_detection` is selected.
          type: object
          properties:
            total_analysis_time_millis:
              description: Maximum timeout threshold for overall detection.
              default: 3500
              type: integer
              example: 5000
              format: int32
            beep_detection_profile:
              description: Selects which detectors must validate a beep. `both` requires the amplitude and frequency detectors to agree. `freq_only` uses the frequency detector alone, for beeps whose volume is too unsteady for the default profile.
              default: both
              type: string
              example: freq_only
              enum:
              - both
              - freq_only
            beep_min_frequency_hz:
              description: Lowest frequency, in Hz, that a tone must reach to be treated as a beep. Raising it above 480 excludes North American ringback (440 + 480 Hz), which can otherwise be reported as a beep when the `freq_only` profile is in use. Only used when beep detection is active.
              type: integer
              example: 550
              format: int32
              minimum: 200
              maximum: 4000
            beep_max_frequency_hz:
              description: Highest frequency, in Hz, that a tone can reach and still be treated as a beep. Only used when beep detection is active.
              type: integer
              example: 2000
              format: int32
              minimum: 200
              maximum: 4000
            beep_min_tone_duration_millis:
              description: Shortest tone, in milliseconds, that can be treated as a beep. Raising it rejects brief tones such as call-progress blips. Only used when beep detection is active.
              type: integer
              example: 300
              format: int32
              minimum: 50
              maximum: 5000
            beep_spectral_confirmation:
              description: When enabled, a candidate beep must pass an additional spectral check before it is reported. Only used when beep detection is active.
              type: boolean
              example: true
            beep_spectral_window_millis:
              description: Length of the spectral confirmation window, in milliseconds. Only used when beep detection is active.
              type: integer
              example: 100
              format: int32
              minimum: 20
              maximum: 1000
            beep_spectral_min_purity:
              description: Minimum spectral purity, from 0 to 1, for a tone to be treated as a beep. Raising it rejects mixed tones such as ringback, which combines two frequencies. Only used when beep detection is active.
              type: number
              example: 0.8
              minimum: 0
              maximum: 1
            beep_spectral_reject_fax_cng:
              description: When enabled, the fax CNG tone is rejected rather than reported as a beep. Only used when beep detection is active.
              type: boolean
              example: true
            after_greeting_silence_millis:
              description: Silence duration threshold after a greeting message or voice for it be considered human.
              default: 800
              type: integer
              example: 1000
              format: int32
            between_words_silence_millis:
              description: Maximum threshold for silence between words.
              default: 50
              type: integer
              example: 100
              format: int32
            greeting_duration_millis:
              description: Maximum threshold of a human greeting. If greeting longer than this value, considered machine.
              default: 3500
              type: integer
              example: 1500
              format: int32
            initial_silence_millis:
              description: If initial silence duration is greater than this value, consider it a machine.
              default: 3500
              type: integer
              example: 1800
              format: int32
            maximum_number_of_words:
              description: If number of detected words is greater than this value, consder it a machine.
              default: 5
              type: integer
              example: 3
              format: int32
            maximum_word_length_millis:
              description: If a single word lasts longer than this threshold, consider it a machine.
              default: 3500
              type: integer
              example: 2000
              format: int32
            silence_threshold:
              description: Minimum noise threshold for any analysis.
              default: 256
              type: integer
              example: 512
              format: int32
            greeting_total_analysis_time_millis:
              description: If machine already detected, maximum timeout threshold to determine the end of the machine greeting.
              default: 5000
              type: integer
              example: 7500
              format: int32
            greeting_silence_duration_millis:
              description: If machine already detected, maximum threshold for silence between words. If exceeded, the greeting is considered ended.
              default: 1500
              type: integer
              example: 2000
              format: int32
            prompt_end_timeout_millis:
              description: Maximum time Telnyx waits, in milliseconds, for the iOS call-screening prompt to end after Premium AMD initially detects a `machine`. Used when `answering_machine_detection` is `premium_ios_call_screening_detection`. Defaults to 5000 milliseconds.
              default: 5000
              type: integer
              example: 5000
              format: int32
              minimum: 1000
              maximum: 120000
        deepfake_detection:
          description: Enables deepfake detection on the call. When enabled, audio from the remote party is streamed to a detection service that analyzes whether the voice is AI-generated. Results are delivered via the `call.deepfake_detection.result` webhook.
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether deepfake detection is enabled.
            timeout:
              type: integer
              format: int32
              default: 15
              minimum: 5
              maximum: 60
              description: Maximum time in seconds to wait for a detection result before timing out.
            rtp_timeout:
              type: integer
              format: int32
              default: 30
              minimum: 5
              maximum: 120
              description: Maximum time in seconds to wait for RTP audio before timing out. If no audio is received within this window, detection stops with an error.
        conference_config:
          description: Optional configuration parameters to dial new participant into a conference.
          type: object
          properties:
            id:
              description: Conference ID to be joined
              type: string
              example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
              format: uuid
            conference_name:
              description: Conference name to be joined
              type: string
              example: telnyx-conference
            early_media:
              description: Controls the moment when dialled call is joined into conference. If set to `true` user will be joined as soon as media is available (ringback). If `false` user will be joined when call is answered. Defaults to `true`
              type: boolean
              example: false
              default: true
            end_conference_on_exit:
              description: Whether the conference should end and all remaining participants be hung up after the participant leaves the conference. Defaults to "false".
              example: true
              type: boolean
            soft_end_conference_on_exit:
              description: Whether the conference should end after the participant leaves the conference. NOTE this doesn't hang up the other participants. Defaults to "false".
              example: true
              type: boolean
            hold:
              description: Whether the participant should be put on hold immediately after joining the conference. Defaults to "false".
              example: true
              type: boolean
            hold_audio_url:
              type: string
              example: http://example.com/message.wav
              description: The URL of a file to be played to the participant when they are put on hold after joining the conference. hold_media_name and hold_audio_url cannot be used together in one request. Takes effect only when "start_conference_on_create" is set to "false". This property takes effect only if "hold" is set to "true".
            hold_media_name:
              type: string
              example: my_media_uploaded_to_media_storage_api
              description: The media_name of a file to be played to the participant when they are put on hold after joining the conference. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file. Takes effect only when "start_conference_on_create" is set to "false". This property takes effect only if "hold" is set to "true".
            mute:
              description: Whether the participant should be muted immediately after joining the conference. Defaults to "false".
              example: true
              type: boolean
            start_conference_on_enter:
              description: Whether the conference should be started after the participant joins the conference. Defaults to "false".
              example: true
              type: boolean
            start_conference_on_create:
              description: Whether the conference should be started on creation. If the conference isn't started all participants that join are automatically put on hold. Defaults to "true".
              example: false
              type: boolean
            supervisor_role:
              description: Sets the joining participant as a supervisor for the conference. A conference can have multiple supervisors. "barge" means the supervisor enters the conference as a normal participant. This is the same as "none". "monitor" means the supervisor is muted but can hear all participants. "whisper" means that only the specified "whisper_call_control_ids" can hear the supervisor. Defaults to "none".
              example: whisper
              type: string
              enum:
              - barge
              - monitor
              - none
              - whisper
            whisper_call_control_ids:
              description: Array of unique call_control_ids the joining supervisor can whisper to. If none provided, the supervisor will join the conference as a monitoring participant only.
              example:
              - v2:Sg1xxxQ_U3ixxxyXT_VDNI3xxxazZdg6Vxxxs4-GNYxxxVaJPOhFMRQ
              - v2:qqpb0mmvd-ovhhBr0BUQQn0fld5jIboaaX3-De0DkqXHzbf8d75xkw
              type: array
              items:
                type: string
            beep_enabled:
              description: Whether a beep sound should be played when the participant joins and/or leaves the conference. Can be used to override the conference-level setting.
              enum:
              - always
              - never
              - on_enter
              - on_exit
              example: on_exit
              type: string
        custom_headers:
          description: Custom headers to be added to the SIP INVITE.
          type: array
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
        billing_group_id:
          description: Use this field to set the Billing Group ID for the call. Must be a valid and existing Billing Group ID.
          type: string
          format: uuid
          example: f5586561-8ff0-4291-a0ac-84fe544797bd
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore others Dial commands with the same `command_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        link_to:
          description: Use another call's control id for sharing the same call session id
          type: string
          example: ilditnZK_eVysupV21KzmzN_sM29ygfauQojpm4BgFtfX5hXAcjotg==
        bridge_intent:
          description: Indicates the intent to bridge this call with the call specified in link_to. When bridge_intent is true, link_to becomes required and the from number will be overwritten by the from number from the linked call.
          type: boolean
          default: false
          example: true
        bridge_on_answer:
          description: Whether to automatically bridge answered call to the call specified in link_to. When bridge_on_answer is true, link_to becomes required.
          type: boolean
          default: false
          example: true
        prevent_double_bridge:
          description: Prevents bridging and hangs up the call if the target is already bridged. Disabled by default.
          type: boolean
          default: false
          example: true
        park_after_unbridge:
          description: If supplied with the value `self`, the current leg will be parked after unbridge. If not set, the default behavior is to hang up the leg. When park_after_unbridge is set, link_to becomes required.
          type: string
          example: self
        media_encryption:
          description: 'Defines whether media should be encrypted on the call. For SIP URI destinations, media encryption can also be requested per endpoint with the `secure` URI parameter: `;secure=true` or `;secure=srtp` enables SRTP, and `;secure=dtls` enables DTLS. This parameter, when set to `SRTP` or `DTLS`, takes precedence over the per-endpoint `secure` value.'
          default: disabled
          type: string
          enum:
          - disabled
          - SRTP
          - DTLS
        sip_auth_username:
          description: SIP Authentication username used for SIP challenges.
          type: string
        sip_auth_password:
          description: SIP Authentication password used for SIP challenges.
          type: string
        sip_headers:
          description: SIP headers to be added to the SIP INVITE request. Currently only User-to-User header is supported.
          type: array
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
        sip_transport_protocol:
          description: Defines SIP transport protocol to be used on the call.
          default: UDP
          type: string
          enum:
          - UDP
          - TCP
          - TLS
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        stream_url:
          description: The destination WebSocket address where the stream is going to be delivered.
          type: string
          example: wss://www.example.com/websocket
        stream_track:
          description: Specifies which track should be streamed.
          type: string
          enum:
          - inbound_track
          - outbound_track
          - both_tracks
          default: inbound_track
          example: both_tracks
        stream_codec:
          $ref: '#/components/schemas/StreamCodec'
        stream_bidirectional_mode:
          $ref: '#/components/schemas/StreamBidirectionalMode'
        stream_bidirectional_codec:
          $ref: '#/components/schemas/StreamBidirectionalCodec'
        stream_bidirectional_target_legs:
          $ref: '#/components/schemas/StreamBidirectionalTargetLegs'
        stream_bidirectional_sampling_rate:
          $ref: '#/components/schemas/StreamBidirectionalSamplingRate'
        stream_establish_before_call_originate:
          description: Establish websocket connection before dialing the destination. This is useful for cases where the websocket connection takes a long time to establish.
          type: boolean
          default: false
          example: true
        send_silence_when_idle:
          description: Generate silence RTP packets when no transmission available.
          type: boolean
          default: false
          example: true
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          type: string
          example: https://www.example.com/server-b/
        webhook_url_method:
          description: HTTP request type used for `webhook_url`.
          default: POST
          type: string
          enum:
          - POST
          - GET
          example: GET
        webhook_urls:
          description: A map of event types to arrays of webhook URLs. When an event of the specified type occurs, the webhook URLs associated with that event type will be called instead of the default webhook URL. Events not mapped here will use the default webhook URL.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uri
          example:
            call.hangup:
            - https://www.example.com/webhooks/hangup
            call.bridge:
            - https://www.example.com/webhooks/bridge
        webhook_urls_method:
          description: HTTP request method to invoke `webhook_urls`.
          type: string
          enum:
          - POST
          - GET
          default: POST
          example: POST
        webhook_retries_policies:
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          type: object
          additionalProperties:
            type: object
            properties:
              retries_ms:
                type: array
                items:
                  type: integer
                maxItems: 5
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
          example:
            call.hangup:
              retries_ms:
              - 1000
              - 2000
              - 5000
        record:
          description: Start recording automatically after an event. Disabled by default.
          type: string
          enum:
          - record-from-answer
          example: record-from-answer
        record_channels:
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          type: string
          enum:
          - single
          - dual
          default: dual
          example: single
        record_format:
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          type: string
          enum:
          - wav
          - mp3
          default: mp3
          example: wav
        record_max_length:
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 1000
        record_timeout_secs:
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 100
        record_track:
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          type: string
          example: outbound
          default: both
          enum:
          - both
          - inbound
          - outbound
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          type: string
          example: trim-silence
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          type: string
          minLength: 1
          maxLength: 40
          example: my_recording_file_name
        supervise_call_control_id:
          description: The call leg which will be supervised by the new call.
          type: string
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        supervisor_role:
          description: The role of the supervisor call. 'barge' means that supervisor call hears and is being heard by both ends of the call (caller & callee). 'whisper' means that only supervised_call_control_id hears supervisor but supervisor can hear everything. 'monitor' means that nobody can hear supervisor call, but supervisor can hear everything on the call.
          type: string
          enum:
          - barge
          - whisper
          - monitor
          default: barge
        enable_dialogflow:
          description: Enables Dialogflow for the current call. The default value is false.
          type: boolean
          default: false
          example: true
        dialogflow_config:
          $ref: '#/components/schemas/DialogflowConfig'
        transcription:
          description: Enable transcription upon call answer. The default value is false.
          type: boolean
          default: false
          example: true
        transcription_config:
          $ref: '#/components/schemas/TranscriptionStartRequest'
        sip_region:
          description: Defines the SIP region to be used for the call.
          type: string
          default: US
          enum:
          - US
          - Europe
          - Canada
          - Australia
          - Middle East
          example: Canada
        stream_auth_token:
          description: An authentication token to be sent as part of the WebSocket connection when using streaming. Maximum length is 4000 characters.
          type: string
          maxLength: 4000
          example: your-auth-token
        route_to_mobile:
          description: When set to true, routes the call directly to the mobile device associated with the destination Telnyx Mobile number, bypassing Inbound Calls Interception configured in the Telnyx Portal under Mobile Numbers → select the number → Voice → Call Interception. Use this when transferring an intercepted call to the mobile device to prevent the call from being intercepted again. Defaults to false.
          type: boolean
          default: false
          example: true
    PayRequest_2:
      type: object
      title: Pay Request
      properties:
        connector_name:
          type: string
          default: Default
          description: Name of the Pay connector used to process the transaction.
          example: Default
        amount:
          type: number
          minimum: 0
          description: Amount to charge. Required when `transaction_type` is `charge`.
          example: 10.5
        currency:
          type: string
          default: USD
          enum:
          - USD
          - usd
          description: Currency used for the transaction. Pay currently supports USD only.
          example: USD
        payment_token:
          type: string
          description: Existing payment token. When supplied, payment-detail collection is skipped.
          example: tok_abc123
        payment_method:
          type: string
          default: credit-card
          enum:
          - credit-card
          - ach-debit
          description: Payment method to collect.
        valid_card_types:
          type: array
          items:
            type: string
            enum:
            - visa
            - mastercard
            - amex
            - maestro
            - discover
            - optima
            - jcb
            - diners-club
            - enroute
          minItems: 1
          description: Restricts accepted card numbers to the listed card types. When the caller enters a card number that does not match one of the listed types, Pay treats the input as invalid and re-prompts for the card number. Cannot be used together with `payment_token`.
          example:
          - visa
          - mastercard
        postal_code:
          oneOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: boolean
          default: 'true'
          description: Controls billing postal code collection for credit-card payments when no `payment_token` is supplied. Set to `true` or the string `"true"` (the default) to prompt the caller for a postal code. Set to `false` or the string `"false"` to skip the postal code prompt without supplying a postal code to the payment connector. Supply any other non-empty string, such as `"90210"`, to use that postal code without prompting. Empty or whitespace-only strings are rejected. This option does not affect ACH debit payments or payments using an existing token.
          example: false
        min_postal_code_length:
          type: integer
          minimum: 1
          maximum: 128
          default: 1
          description: Minimum number of digits the caller must enter when collecting a credit-card billing postal code. Applies only when `postal_code` is `true` or `"true"` and no `payment_token` is supplied. The default is 1. The maximum number of digits collected is the greater of 10 and this value. This does not validate the length of a postal code supplied directly in `postal_code`.
          example: 5
        transaction_type:
          type: string
          enum:
          - charge
          - tokenize
          description: Transaction to perform. If omitted, Pay infers `tokenize` when `amount` is absent or zero and `charge` when `amount` is positive.
        description:
          type: string
          description: Optional description forwarded with the payment transaction.
          example: Order 12345
        client_state:
          type: string
          description: Base64-encoded state included in subsequent webhooks.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        metadata:
          type: object
          description: Metadata forwarded to the Pay connector.
          additionalProperties: true
          example:
            order_id: ORD-12345
        parameters:
          type: object
          description: Additional parameters forwarded to the Pay connector.
          additionalProperties: true
          example:
            customer_id: CUST-67890
        prompts:
          $ref: '#/components/schemas/PayPrompts'
        max_attempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          default: 3
          description: Maximum number of attempts for each payment collection step.
        timeout_millis:
          type: integer
          format: int32
          minimum: 1
          maximum: 600000
          default: 5000
          description: Time in milliseconds to wait for DTMF input for each collection step.
        inter_digit_timeout_millis:
          type: integer
          format: int32
          minimum: 1
          maximum: 600000
          default: 5000
          description: Time in milliseconds to wait between consecutive DTMF digits.
        voice:
          type: string
          default: female
          description: Voice used for payment prompts. Accepts `male`, `female`, or a provider voice in `<Provider>.<Model>.<VoiceId>` format, for example `AWS.Polly.Joanna` or `Telnyx.KokoroTTS.af`.
          example: female
        language:
          type: string
          default: en-US
          description: Language used for payment prompts.
          example: en-US
        service_level:
          type: string
          default: premium
          description: Speech synthesis service level used for payment prompts. Pay defaults to `premium`.
        command_id:
          type: string
          description: Idempotency key for the command. Telnyx ignores a duplicate command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
      example:
        connector_name: Default
        amount: 10.5
        currency: USD
        payment_method: credit-card
        transaction_type: charge
        max_attempts: 3
        timeout_millis: 5000
        inter_digit_timeout_millis: 5000
        voice: female
        language: en-US
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    TranscriptionConfig_3:
      type: object
      description: The settings associated with speech to text for the voice assistant. This is only relevant if the assistant uses a text-to-text language model. Any assistant using a model with native audio support (e.g. `fixie-ai/ultravox-v0_4`) will ignore this field.
      properties:
        model:
          description: 'The speech to text model to be used by the voice assistant. Supported models include:


            - `deepgram/flux` (or `flux`) for live streaming turn-taking.

            - `deepgram/nova-3` and `deepgram/nova-2` for live streaming transcription.

            - `speechmatics/standard` and `speechmatics/enhanced` for live streaming transcription.

            - `speechmatics/linden-1` (preview, vendor-hosted) for live streaming transcription; no auto-detect, so set `language` from Speechmatics'' Realtime language list (defaults to `en`).

            - `assemblyai/universal-3-6-pro` (AssemblyAI Universal-3.6 Pro) for live streaming transcription. The legacy aliases `assemblyai/universal-3-5-pro` and `assemblyai/universal-streaming` are still accepted and run the same Universal-3.6 Pro model.

            - `xai/grok-stt` for live streaming transcription.

            - `soniox/stt-rt-v4` for live streaming multilingual transcription with automatic language detection.

            - `nvidia/parakeet-v3` for multilingual transcription with automatic language detection.

            - `omi-health/omi-med-stt-v1` for English-only medical transcription (Parakeet-based).

            - `humain/realtime` for live streaming transcription with native Arabic and Arabic/English code-switching support.

            - `reson8/turns` for live streaming turn-based transcription of 10 European languages with automatic language detection.

            - `cohere/ar-stt` for non-streaming Arabic and English transcription.

            - `azure/fast` and `azure/realtime`; Azure models require `region`, and unsupported regions require `api_key_ref`.

            - `google/latest_long` for non-streaming multilingual transcription.

            - `distil-whisper/distil-large-v2` for lower-latency English-only non-streaming transcription.

            - `openai/whisper-large-v3-turbo` for multilingual non-streaming transcription with automatic language detection.'
          type: string
          enum:
          - deepgram/flux
          - flux
          - deepgram/nova-3
          - deepgram/nova-2
          - speechmatics/standard
          - speechmatics/enhanced
          - speechmatics/linden-1
          - assemblyai/universal-3-6-pro
          - assemblyai/universal-3-5-pro
          - assemblyai/universal-streaming
          - xai/grok-stt
          - soniox/stt-rt-v4
          - nvidia/parakeet-v3
          - omi-health/omi-med-stt-v1
          - humain/realtime
          - reson8/turns
          - cohere/ar-stt
          - azure/fast
          - azure/realtime
          - google/latest_long
          - distil-whisper/distil-large-v2
          - openai/whisper-large-v3-turbo
          default: distil-whisper/distil-large-v2
          example: distil-whisper/distil-large-v2
        language:
          type: string
          description: 'The language of the audio to be transcribed. If not set, or if set to `auto`, supported models will automatically detect the language. Supported and meaningful values depend on the selected transcription `model`. For `deepgram/flux`, supported values are: `auto` (Telnyx language detection controls the language hint), `multi` (no language hint), and language-specific hints `en`, `es`, `fr`, `de`, `hi`, `ru`, `pt`, `ja`, `it`, and `nl`. For `soniox/stt-rt-v4`, `auto` omits the language hint and lets Soniox auto-detect; ISO 639-1 codes (e.g. `en`, `es`) bias detection toward that language. For `assemblyai/universal-3-6-pro` (and its legacy aliases `assemblyai/universal-3-5-pro` and `assemblyai/universal-streaming`), `auto` (or unset) enables native multilingual code-switching; language codes (`en`, `es`, `de`, `fr`, `pt`, `it`, `tr`, `nl`, `sv`, `no`, `da`, `fi`, `hi`, `vi`, `ar`, `he`, `ja`, `zh`, `ur`, `ru`, `ko`, `ca`, `gl`, `ro`, `et`, `fa`, `yue`, `af`, `mr`, `zu`, `xh`, `nn`) bias the session to that language. For `humain/realtime`, supported values are `ar`, `en`, `codeswitch` (Arabic/English code-switching), and `auto` (resolves server-side to code-switching). Unlike other models, `humain/realtime` does not fall back to `auto` when `language` is omitted — omitting it applies `en` instead. For `reson8/turns`, supported values are `auto` (or unset) for automatic language detection, and the language codes `nl`, `en`, `fr`, `fy`, `de`, `it`, `pl`, `pt`, `es`, and `sv` to fix the transcription language. For `cohere/ar-stt`, supported values are `ar` and `en`; unlike other models, this model does not auto-detect and defaults to `ar` when `language` is omitted. For `speechmatics/linden-1`, there is no auto-detect; set a code from Speechmatics'' Realtime language list (see `SpeechmaticsTranscriptionLanguage`); unset defaults to `en`, while an explicit `auto`, `auto_beta`, or `multi` is rejected (unlike `speechmatics/standard`, which defaults to `en`).'
    DeepgramEnglishTranscriptionLanguage:
      type: string
      enum:
      - en
      - en-US
      - en-AU
      - en-GB
      - en-IN
      - en-NZ
      default: en
      description: Language to transcribe. Deepgram's medical and phonecall models support English only.
    ConversationRelayStartRequest_2:
      type: object
      title: Conversation Relay Start Request
      description: 'Start a Conversation Relay session. A WebSocket URL is required: provide it as `url`, `conversation_relay_url`, or `conversation_relay_settings.url`; top-level values take precedence over nested settings. Use `transcription_engine` and `transcription_engine_config` for speech-to-text configuration; the `transcription` object is not supported.'
      properties:
        conversation_relay_settings:
          $ref: '#/components/schemas/ConversationRelaySettings'
        url:
          type: string
          pattern: ^wss?://
          description: Public alias for `conversation_relay_url`. Must start with `ws://` or `wss://`. If both are present, this value wins.
          example: wss://example.com/conversation-relay
        dtmf_detection:
          type: boolean
          description: Public alias for `conversation_relay_dtmf_detection`. If both are present, this value wins.
          default: false
          example: true
        conversation_relay_url:
          type: string
          pattern: ^wss?://
          description: WebSocket URL for your Conversation Relay server. Must start with `ws://` or `wss://`.
          example: wss://example.com/conversation-relay
        conversation_relay_dtmf_detection:
          type: boolean
          description: Enable DTMF detection for the relay session.
          default: false
          example: true
        voice:
          $ref: '#/components/schemas/VoiceConfig_3'
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        greeting:
          type: string
          description: Text played when the relay session starts.
          example: Hi! Ask me anything!
        language:
          type: string
          description: Default language for the relay session. This value is used for both text-to-speech and speech recognition.
          default: en
          example: en-US
        languages:
          type: array
          description: Per-language TTS and transcription settings.
          items:
            $ref: '#/components/schemas/ConversationRelayLanguage'
        interruption_settings:
          $ref: '#/components/schemas/ConversationRelayInterruptionSettings'
        transcription:
          type: object
          deprecated: true
          description: Not supported for Conversation Relay start requests. Use `transcription_engine` and `transcription_engine_config` instead.
          additionalProperties: true
        assistant:
          $ref: '#/components/schemas/ConversationRelayAssistant'
        client_state:
          type: string
          description: Use this field to add state to subsequent webhooks. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        tts_provider:
          type: string
          description: Text-to-speech provider. If omitted, Telnyx derives it from `voice` or `provider`.
          example: telnyx
        provider:
          type: string
          description: Structured voice provider. Must be supplied together with `structured_provider`.
          example: elevenlabs
        structured_provider:
          $ref: '#/components/schemas/ConversationRelayStructuredProvider'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. For Conversation Relay, use this field with `transcription_engine_config`; the `transcription` object is not supported.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig_2'
        interruptible:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruptible_greeting:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        custom_parameters:
          type: object
          description: Custom key-value parameters forwarded to the relay session as `assistant.dynamic_variables`. If `assistant.dynamic_variables` is also present, these values are merged in.
          additionalProperties: true
          example:
            customer_id: '12345'
      example:
        url: wss://example.com/conversation-relay
        dtmf_detection: true
        interruptible: speech
        interruptible_greeting: dtmf
        greeting: Hi! Ask me anything!
        voice: Telnyx.KokoroTTS.af
        tts_provider: telnyx
        voice_settings:
          type: telnyx
        language: en-US
        languages:
        - language: en-US
          tts_provider: telnyx
          voice: Telnyx.KokoroTTS.af
          transcription_engine: Deepgram
          transcription_engine_config:
            transcription_model: deepgram/nova-3
        custom_parameters:
          customer_id: '12345'
      allOf:
      - if:
          not:
            anyOf:
            - properties:
                url:
                  type: string
              required:
              - url
            - properties:
                conversation_relay_url:
                  type: string
              required:
              - conversation_relay_url
        then:
          properties:
            conversation_relay_settings:
              type: object
          required:
          - conversation_relay_settings
    SpeechmaticsTranscriptionLanguage_2:
      title: Speechmatics transcription engine list of languages
      type: string
      description: 'Language to use for speech recognition. Accepted values depend on the selected `transcription_model`. `speechmatics/standard` supports: `en`, `ba`, `eu`, `gl`, `ga`, `mt`, `mn`, `sw`, `ug`, `cy`, `ar_en`, `cmn_en`, `en_ms`, `en_ta`, `tl`, `es-bilingual-en`, `cmn_en_ms_ta`. `speechmatics/linden-1` (preview) supports the same languages as Speechmatics Realtime: `ar`, `ar_en`, `ba`, `be`, `bg`, `bn`, `ca`, `cmn`, `cmn_en`, `cmn_en_ms_ta`, `cs`, `cy`, `da`, `de`, `el`, `en`, `en_ms`, `en_ta`, `eo`, `es`, `es-bilingual-en`, `et`, `eu`, `fa`, `fi`, `fr`, `ga`, `gl`, `he`, `hi`, `hr`, `hu`, `ia`, `id`, `it`, `ja`, `ko`, `lt`, `lv`, `mn`, `mr`, `ms`, `mt`, `nl`, `no`, `pl`, `pt`, `ro`, `ru`, `sk`, `sl`, `sv`, `sw`, `ta`, `th`, `tl`, `tr`, `ug`, `uk`, `ur`, `vi`, `yue`, plus the spelling and script variants `en-US`, `en-GB`, `en-AU`, `cmn-Hans`, and `cmn-Hant` (`en` alone uses the default spelling). A value outside the selected model''s list is rejected. For `speechmatics/standard`, unset, blank, `auto`, `auto_beta`, or `multi` defaults to `en`; for `speechmatics/linden-1`, only an unset language defaults to `en`, and `auto`, `auto_beta`, or `multi` is rejected.'
      example: en
      default: en
      enum:
      - en
      - ba
      - eu
      - gl
      - ga
      - mt
      - mn
      - sw
      - ug
      - cy
      - ar_en
      - cmn_en
      - en_ms
      - en_ta
      - tl
      - es-bilingual-en
      - cmn_en_ms_ta
      - ar
      - be
      - bg
      - bn
      - ca
      - cmn
      - cs
      - da
      - de
      - el
      - eo
      - es
      - et
      - fa
      - fi
      - fr
      - he
      - hi
      - hr
      - hu
      - ia
      - id
      - it
      - ja
      - ko
      - lt
      - lv
      - mr
      - ms
      - nl
      - 'no'
      - pl
      - pt
      - ro
      - ru
      - sk
      - sl
      - sv
      - ta
      - th
      - tr
      - uk
      - ur
      - vi
      - yue
      - en-US
      - en-GB
      - en-AU
      - cmn-Hans
      - cmn-Hant
    HangupRequest_2:
      type: object
      title: Hangup Request
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        custom_headers:
          description: Custom headers to be added to the SIP BYE message.
          type: array
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
        reason:
          description: 'Text for the SIP `Reason` header (RFC 3326) sent when cancelling an unanswered outbound leg. The SIP CANCEL carries `Reason: SIP;cause=200;text="<reason>"`; phones such as Poly and Yealink use it to suppress the missed-call entry for a call answered elsewhere. Has no effect on an answered leg or an inbound leg. A hangup sent before the leg''s `call.initiated` webhook still hangs up the leg, but without the `Reason` header. Must not contain `"`, `\`, control characters, or characters outside the Basic Multilingual Plane (such as emoji); invalid values are rejected with a 422.'
          type: string
          maxLength: 128
          example: Call completed elsewhere
      example:
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    DeepgramNova3MedicalConfig:
      type: object
      title: DeepgramNova3MedicalConfig
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-3-medical
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramEnglishTranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        keyterms:
          type: array
          description: Keyterm prompting. Up to 100 domain-specific terms or brand names to bias recognition toward. Supported on Nova-3 and Flux models (`deepgram/nova-3`, `deepgram/nova-3-medical`, `deepgram/flux`, `deepgram/flux-multi`); use `hints` on Nova-2.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-3-medical
        language: en-US
        smart_format: false
        keyterms:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
      description: Deepgram Nova-3 medical model, tuned for medical vocabulary. English only.
    TranscriptionEngineDeepgramConfig_2:
      oneOf:
      - $ref: '#/components/schemas/DeepgramNova2Config_3'
      - $ref: '#/components/schemas/DeepgramNova2SpecialtyConfig'
      - $ref: '#/components/schemas/DeepgramNova3Config_3'
      - $ref: '#/components/schemas/DeepgramNova3MedicalConfig'
      - $ref: '#/components/schemas/DeepgramFluxConfig'
      - $ref: '#/components/schemas/DeepgramFluxMultiConfig'
      discriminator:
        propertyName: transcription_model
        mapping:
          deepgram/nova-2: '#/components/schemas/DeepgramNova2Config'
          deepgram/nova-2-medical: '#/components/schemas/DeepgramNova2SpecialtyConfig'
          deepgram/nova-2-phonecall: '#/components/schemas/DeepgramNova2SpecialtyConfig'
          deepgram/nova-3: '#/components/schemas/DeepgramNova3Config'
          deepgram/nova-3-medical: '#/components/schemas/DeepgramNova3MedicalConfig'
          deepgram/flux: '#/components/schemas/DeepgramFluxConfig'
          deepgram/flux-multi: '#/components/schemas/DeepgramFluxMultiConfig'
    DeepgramFluxMultiTranscriptionLanguage:
      type: string
      enum:
      - en
      - es
      - fr
      - de
      - hi
      - ru
      - pt
      - ja
      - it
      - nl
      - auto
      default: en
      description: Language to transcribe. Flux-multi uses the language as a hint; `auto` lets Flux detect the language.
    TranscriptionEngineSpeechmaticsConfig_2:
      type: object
      title: Transcription engine Speechmatics config
      properties:
        transcription_engine:
          type: string
          enum:
          - Speechmatics
          description: Engine identifier for Speechmatics transcription service
        language:
          $ref: '#/components/schemas/SpeechmaticsTranscriptionLanguage_2'
        transcription_model:
          description: The model to use for transcription. `speechmatics/linden-1` is a preview, vendor-hosted model with its own language support (see `language`).
          type: string
          enum:
          - speechmatics/standard
          - speechmatics/linden-1
          default: speechmatics/standard
        interim_results:
          type: boolean
          description: Whether to send also interim results. If set to false, only final results will be sent.
          default: false
          example: true
    TransferCallRequest_3:
      type: object
      title: Transfer Call Request
      required:
      - to
      example:
        to: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
        from: '+18005550101'
        from_display_name: Company Name
        audio_url: http://www.example.com/sounds/greeting.wav
        send_digits_on_answer: wwww200
        timeout_secs: 60
        time_limit_secs: 60
        webhook_url: https://www.example.com/server-b/
        webhook_url_method: POST
        answering_machine_detection: detect
        answering_machine_detection_config:
          total_analysis_time_millis: 5000
          after_greeting_silence_millis: 1000
          between_words_silence_millis: 1000
          greeting_duration_millis: 1000
          initial_silence_millis: 1000
          maximum_number_of_words: 1000
          maximum_word_length_millis: 2000
          silence_threshold: 512
          greeting_total_analysis_time_millis: 50000
          greeting_silence_duration_millis: 2000
        custom_headers:
        - name: head_1
          value: val_1
        - name: head_2
          value: val_2
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        early_media: true
        media_encryption: SRTP
        sip_auth_username: username
        sip_auth_password: password
        sip_headers:
        - name: User-to-User
          value: value
        sip_transport_protocol: TLS
      properties:
        to:
          description: The DID or SIP URI to dial out to. For SIP URI destinations, append `;secure=true` or `;secure=srtp` to enable SRTP media encryption for that endpoint, or `;secure=dtls` to enable DTLS media encryption for that endpoint. If `media_encryption` is set to `SRTP` or `DTLS`, it takes precedence over any per-endpoint `secure` URI parameter. You may also append a comma followed by DTMF digits (e.g. `+18004247767,200`) to play those digits as DTMF once the transfer destination answers — equivalent to setting `send_digits_on_answer` separately. If both are present, the explicit `send_digits_on_answer` parameter takes precedence.
          type: string
          example: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
        from:
          description: The `from` number to be used as the caller id presented to the destination (`to` number). The number should be in +E164 format. This attribute will default to the `to` number of the original call if omitted.
          type: string
          example: '+18005550101'
        diversion:
          description: The `to` number of an active inbound call, in +E164 format. Telnyx checks whether there is currently an active inbound call where `to` matches this `diversion` value and `from` matches the `from` number supplied for this request. If such a call exists, the `from` number is treated as verified (since it is already on an active inbound call to you) and can be used as the caller id for this outbound call.
          type: string
          example: '+18005550101'
        from_display_name:
          description: The `from_display_name` string to be used as the caller id name (SIP From Display Name) presented to the destination (`to` number). The string should have a maximum of 128 characters, containing only letters, numbers, spaces, and -_~!.+ special characters. If ommited, the display name will be the same as the number in the `from` field.
          type: string
          example: Company Name
        privacy:
          type: string
          description: Indicates the privacy level to be used for the call. When set to `id`, caller ID information (name and number) will be hidden from the called party. When set to `none` or omitted, caller ID will be shown normally.
          enum:
          - id
          - none
          example: id
        audio_url:
          type: string
          example: http://example.com/message.wav
          description: The URL of a file to be played back when the transfer destination answers before bridging the call. The URL can point to either a WAV or MP3 file. media_name and audio_url cannot be used together in one request.
        send_digits_on_answer:
          type: string
          example: wwww200
          description: 'DTMF digits to send automatically after the transfer destination answers. Useful for reaching an extension behind an IVR (e.g. `"200"` to dial extension 200 once the called party picks up). Allowed characters: `0-9`, `A-D`, `w` (0.5s pause), `W` (1s pause), `*`, `#`. Maximum 64 characters. When omitted, no automatic DTMF is sent. May also be supplied inline by appending `,<digits>` to `to` (e.g. `to=+18004247767,200`); if both forms are present, this explicit field takes precedence.'
        early_media:
          type: boolean
          default: true
          example: false
          description: If set to false, early media will not be passed to the originating leg.
        media_name:
          type: string
          example: my_media_uploaded_to_media_storage_api
          description: The media_name of a file to be played back when the transfer destination answers before bridging the call. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
        timeout_secs:
          description: The number of seconds that Telnyx will wait for the call to be answered by the destination to which it is being transferred. If the timeout is reached before an answer is received, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `timeout` will be sent. Minimum value is 5 seconds. Maximum value is 600 seconds.
          default: 30
          type: integer
          example: 60
          format: int32
        time_limit_secs:
          description: Sets the maximum duration of a Call Control Leg in seconds. If the time limit is reached, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `time_limit` will be sent. For example, by setting a time limit of 120 seconds, a Call Leg will be automatically terminated two minutes after being answered. The default time limit is 14400 seconds or 4 hours and this is also the maximum allowed call length.
          default: 14400
          type: integer
          example: 600
          format: int32
          minimum: 30
          maximum: 14400
        park_after_unbridge:
          description: Specifies behavior after the bridge ends (i.e. the opposite leg either hangs up or is transferred). If supplied with the value `self`, the current leg will be parked after unbridge. If not set, the default behavior is to hang up the leg.
          type: string
          example: self
        answering_machine_detection:
          description: 'Enables Answering Machine Detection. When a call is answered, Telnyx runs real-time detection to determine if it was picked up by a human or a machine and sends an `call.machine.detection.ended` webhook with the analysis result. If ''greeting_end'' or ''detect_words'' is used and a ''machine'' is detected, you will receive another ''call.machine.greeting.ended'' webhook when the answering machine greeting ends with a beep or silence. If `detect_beep` is used, you will only receive ''call.machine.greeting.ended'' if a beep is detected. If `answering_machine_detection` is set to `premium_ios_call_screening_detection`, Premium AMD runs with iOS Call Screening support: after an initial `machine` result, Telnyx listens for the iOS call-screening prompt to end or for an Apple Call Screening tone, sends `call.machine.premium.greeting.ended` with `result=prompt_ended` or `call.machine.premium.call_screening.detected` with `result=screening` respectively. When the Apple Call Screening tone is detected, Premium AMD is restarted on the screened call and a `call.machine.premium.detection.ended` webhook with the post-screening classification follows.'
          default: disabled
          type: string
          enum:
          - premium
          - premium_ios_call_screening_detection
          - detect
          - detect_beep
          - detect_words
          - greeting_end
          - disabled
        answering_machine_detection_config:
          description: Optional configuration parameters to modify 'answering_machine_detection' performance. Only `total_analysis_time_millis` and `greeting_duration_millis` parameters are applicable when `premium` is selected as answering_machine_detection. `prompt_end_timeout_millis` is additionally applicable when `premium_ios_call_screening_detection` is selected.
          type: object
          properties:
            total_analysis_time_millis:
              description: Maximum timeout threshold for overall detection.
              default: 3500
              type: integer
              example: 5000
              format: int32
            beep_detection_profile:
              description: Selects which detectors must validate a beep. `both` requires the amplitude and frequency detectors to agree. `freq_only` uses the frequency detector alone, for beeps whose volume is too unsteady for the default profile.
              default: both
              type: string
              example: freq_only
              enum:
              - both
              - freq_only
            beep_min_frequency_hz:
              description: Lowest frequency, in Hz, that a tone must reach to be treated as a beep. Raising it above 480 excludes North American ringback (440 + 480 Hz), which can otherwise be reported as a beep when the `freq_only` profile is in use. Only used when beep detection is active.
              type: integer
              example: 550
              format: int32
              minimum: 200
              maximum: 4000
            beep_max_frequency_hz:
              description: Highest frequency, in Hz, that a tone can reach and still be treated as a beep. Only used when beep detection is active.
              type: integer
              example: 2000
              format: int32
              minimum: 200
              maximum: 4000
            beep_min_tone_duration_millis:
              description: Shortest tone, in milliseconds, that can be treated as a beep. Raising it rejects brief tones such as call-progress blips. Only used when beep detection is active.
              type: integer
              example: 300
              format: int32
              minimum: 50
              maximum: 5000
            beep_spectral_confirmation:
              description: When enabled, a candidate beep must pass an additional spectral check before it is reported. Only used when beep detection is active.
              type: boolean
              example: true
            beep_spectral_window_millis:
              description: Length of the spectral confirmation window, in milliseconds. Only used when beep detection is active.
              type: integer
              example: 100
              format: int32
              minimum: 20
              maximum: 1000
            beep_spectral_min_purity:
              description: Minimum spectral purity, from 0 to 1, for a tone to be treated as a beep. Raising it rejects mixed tones such as ringback, which combines two frequencies. Only used when beep detection is active.
              type: number
              example: 0.8
              minimum: 0
              maximum: 1
            beep_spectral_reject_fax_cng:
              description: When enabled, the fax CNG tone is rejected rather than reported as a beep. Only used when beep detection is active.
              type: boolean
              example: true
            after_greeting_silence_millis:
              description: Silence duration threshold after a greeting message or voice for it be considered human.
              default: 800
              type: integer
              example: 1000
              format: int32
            between_words_silence_millis:
              description: Maximum threshold for silence between words.
              default: 50
              type: integer
              example: 100
              format: int32
            greeting_duration_millis:
              description: Maximum threshold of a human greeting. If greeting longer than this value, considered machine.
              default: 3500
              type: integer
              example: 1500
              format: int32
            initial_silence_millis:
              description: If initial silence duration is greater than this value, consider it a machine.
              default: 3500
              type: integer
              example: 1800
              format: int32
            maximum_number_of_words:
              description: If number of detected words is greater than this value, consder it a machine.
              default: 5
              type: integer
              example: 3
              format: int32
            maximum_word_length_millis:
              description: If a single word lasts longer than this threshold, consider it a machine.
              default: 3500
              type: integer
              example: 2000
              format: int32
            silence_threshold:
              description: Minimum noise threshold for any analysis.
              default: 256
              type: integer
              example: 512
              format: int32
            greeting_total_analysis_time_millis:
              description: If machine already detected, maximum timeout threshold to determine the end of the machine greeting.
              default: 5000
              type: integer
              example: 7500
              format: int32
            greeting_silence_duration_millis:
              description: If machine already detected, maximum threshold for silence between words. If exceeded, the greeting is considered ended.
              default: 1500
              type: integer
              example: 2000
              format: int32
            prompt_end_timeout_millis:
              description: Maximum time Telnyx waits, in milliseconds, for the iOS call-screening prompt to end after Premium AMD initially detects a `machine`. Used when `answering_machine_detection` is `premium_ios_call_screening_detection`. Defaults to 5000 milliseconds.
              default: 5000
              type: integer
              example: 5000
              format: int32
              minimum: 1000
              maximum: 120000
        custom_headers:
          description: Custom headers to be added to the SIP INVITE.
          type: array
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        target_leg_client_state:
          description: Use this field to add state to every subsequent webhook for the new leg. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        media_encryption:
          description: 'Defines whether media should be encrypted on the new call leg. For SIP URI destinations, media encryption can also be requested per endpoint with the `secure` URI parameter: `;secure=true` or `;secure=srtp` enables SRTP, and `;secure=dtls` enables DTLS. This parameter, when set to `SRTP` or `DTLS`, takes precedence over the per-endpoint `secure` value.'
          default: disabled
          type: string
          enum:
          - disabled
          - SRTP
          - DTLS
        sip_auth_username:
          description: SIP Authentication username used for SIP challenges.
          type: string
          example: username
        sip_auth_password:
          description: SIP Authentication password used for SIP challenges.
          type: string
          example: password
        sip_headers:
          description: SIP headers to be added to the SIP INVITE. Currently only User-to-User header is supported.
          type: array
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
        sip_transport_protocol:
          description: Defines SIP transport protocol to be used on the call.
          default: UDP
          type: string
          enum:
          - UDP
          - TCP
          - TLS
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          type: string
          example: https://www.example.com/server-b/
        webhook_url_method:
          description: HTTP request type used for `webhook_url`.
          default: POST
          type: string
          enum:
          - POST
          - GET
          example: GET
        mute_dtmf:
          description: When enabled, DTMF tones are not passed to the call participant. The webhooks containing the DTMF information will be sent.
          type: string
          enum:
          - none
          - both
          - self
          - opposite
          default: none
          example: opposite
        record:
          description: Start recording automatically after an event. Disabled by default.
          type: string
          enum:
          - record-from-answer
          example: record-from-answer
        record_channels:
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          type: string
          enum:
          - single
          - dual
          default: dual
          example: single
        record_format:
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          type: string
          enum:
          - wav
          - mp3
          default: mp3
          example: wav
        record_max_length:
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 1000
        record_timeout_secs:
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 100
        record_track:
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          type: string
          example: outbound
          default: both
          enum:
          - both
          - inbound
          - outbound
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          type: string
          example: trim-silence
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          type: string
          minLength: 1
          maxLength: 40
          example: my_recording_file_name
        sip_region:
          description: Defines the SIP region to be used for the call.
          type: string
          default: US
          enum:
          - US
          - Europe
          - Canada
          - Australia
          - Middle East
          example: Canada
        preferred_codecs:
          description: The list of comma-separated codecs in order of preference to be used during the call. The codecs supported are `G722`, `PCMU`, `PCMA`, `G729`, `OPUS`, `VP8`, `H264`, `AMR-WB`.
          type: string
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
        webhook_urls:
          description: A map of event types to arrays of webhook URLs. When an event of the specified type occurs, the webhook URLs associated with that event type will be called instead of `webhook_url`. Events not mapped here will use the default `webhook_url`.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uri
          example:
            call.answered:
            - https://www.example.com/webhooks/answered
            call.hangup:
            - https://www.example.com/webhooks/hangup
        webhook_urls_method:
          description: HTTP request method to invoke `webhook_urls`.
          type: string
          enum:
          - POST
          - GET
          default: POST
          example: POST
        webhook_retries_policies:
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          type: object
          additionalProperties:
            type: object
            properties:
              retries_ms:
                type: array
                items:
                  type: integer
                maxItems: 5
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
          example:
            call.answered:
              retries_ms:
              - 1000
              - 2000
              - 5000
        route_to_mobile:
          description: When set to true, routes the call directly to the mobile device associated with the destination Telnyx Mobile number, bypassing Inbound Calls Interception configured in the Telnyx Portal under Mobile Numbers → select the number → Voice → Call Interception. Use this when transferring an intercepted call to the mobile device to prevent the call from being intercepted again. Defaults to false.
          type: boolean
          default: false
          example: true
    DeepgramNova3Config_3:
      type: object
      title: DeepgramNova3Config
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-3
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramNova3TranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        keyterms:
          type: array
          description: Keyterm prompting. Up to 100 domain-specific terms or brand names to bias recognition toward. Supported on Nova-3 and Flux models (`deepgram/nova-3`, `deepgram/nova-3-medical`, `deepgram/flux`, `deepgram/flux-multi`); use `hints` on Nova-2.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-3
        language: en
        smart_format: false
        keyterms:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
    DeepgramNova2Config_3:
      type: object
      title: DeepgramNova2Config
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-2
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramNova2TranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        hints:
          type: array
          description: Nova-2 keyword biasing without intensifiers. Up to 100 terms to bias recognition toward. For weighted biasing, use `keywords_boosting` instead. Supported on Nova-2 models only (`deepgram/nova-2`, `deepgram/nova-2-medical`, `deepgram/nova-2-phonecall`); use `keyterms` on Nova-3 and Flux.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-2
        language: en
        smart_format: false
        hints:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
    VoiceConfig_3:
      description: "The voice to be used by the voice assistant. Currently we support ElevenLabs, Telnyx and AWS voices.\n\n **Supported Providers:**\n- **AWS:** Use `AWS.Polly.<VoiceId>` (e.g., `AWS.Polly.Joanna`). For neural voices, which provide more realistic, human-like speech, append `-Neural` to the `VoiceId` (e.g., `AWS.Polly.Joanna-Neural`). Check the [available voices](https://docs.aws.amazon.com/polly/latest/dg/available-voices.html) for compatibility.\n- **Azure:** Use `Azure.<VoiceId>` (e.g., `Azure.en-CA-ClaraNeural`, `Azure.en-CA-LiamNeural`, `Azure.en-US-BrianMultilingualNeural`, `Azure.en-US-Ava:DragonHDLatestNeural`). For a complete list of voices, go to [Azure Voice Gallery](https://speech.microsoft.com/portal/voicegallery).\n- **ElevenLabs:** Use `ElevenLabs.<ModelId>.<VoiceId>` (e.g., `ElevenLabs.BaseModel.John`). The `ModelId` part is optional. To use ElevenLabs, you must provide your ElevenLabs API key as an integration secret under `\"voice_settings\": {\"api_key_ref\": \"<secret_id>\"}`. See [integration secrets documentation](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) for details. Check [available voices](https://elevenlabs.io/docs/api-reference/get-voices).\n - **Telnyx:** Use `Telnyx.<model_id>.<voice_id>`\n- **Inworld:** Use `Inworld.<ModelId>.<VoiceId>` (e.g., `Inworld.Mini.Loretta`, `Inworld.Max.Oliver`, `Inworld.TTS2.Loretta`). Supported models: `Mini`, `Max`, `TTS2`.\n- **Fish Audio:** Use `FishAudio.<ModelId>.<VoiceId>` (e.g., `FishAudio.s2.1-pro.<reference_id>`). Supported models: `s2.1-pro`, `s2-pro`, `s1`. `VoiceId` is a Fish Voice-Library reference ID.\n- **Soniox:** Use `Soniox.<ModelId>.<VoiceId>` (e.g., `Soniox.tts-rt-v2.Emma`). Supported model: `tts-rt-v2`. Browse the catalog via the [Voices API](https://developers.telnyx.com/api-reference/text-to-speech-commands/list-available-voices). Every voice speaks all supported languages; set `language` to the two-letter ISO 639-1 code of the text, for example `it`. SSML is not supported. Use `voice_settings` to configure `speed` (0.7 to 1.3) and `reduce_silence`.\n- **xAI:** Use `xAI.<VoiceId>` (e.g., `xAI.eve`). Available voices: `eve`, `ara`, `rex`, `sal`, `leo`.\n- **Humain:** Use `Humain.<VoiceId>` (e.g., `Humain.sara-ar`). Available voices: `sara-en`, `abdulaziz-en`, `sara-ar`, `abdulaziz-ar`, `nourah-ar`, `abdullah-ar`. Native Arabic (Saudi dialect) and English voices only — no `ModelId` segment."
      type: string
      default: Telnyx.KokoroTTS.af
      example: Telnyx.KokoroTTS.af
    ConversationRelayTranscriptionEngineConfig_2:
      type: object
      title: Conversation Relay Transcription Engine Config
      description: Engine-specific transcription settings for Conversation Relay. This accepts the same provider-specific options used by the Call Transcription Start command, such as `transcription_model`, without requiring the engine discriminator to be repeated inside this object. With Deepgram Flux (`deepgram/flux`), `interim_results`, `eot_threshold` and `eager_eot_threshold` control the interim prompts and the `eagerEndOfTurn` and `turnResumed` frames sent to your WebSocket server.
      properties:
        interim_results:
          type: boolean
          default: false
          description: 'Deepgram Flux: send interim transcripts as `prompt` frames with `last: false`.'
        eot_threshold:
          type: number
          minimum: 0.5
          maximum: 0.9
          default: 0.7
          description: 'Deepgram Flux: confidence required to end the caller''s turn.'
        eager_eot_threshold:
          type: number
          minimum: 0.3
          maximum: 0.7
          description: 'Deepgram Flux: confidence at which an `eagerEndOfTurn` frame is sent before the final prompt, followed by `turnResumed` if the caller keeps talking. When omitted, these frames are not sent.'
      additionalProperties: true
      example:
        transcription_model: deepgram/flux
        interim_results: true
        eager_eot_threshold: 0.5
    AnswerRequest_3:
      type: object
      title: Answer Request
      properties:
        assistant:
          $ref: '#/components/schemas/CallAssistantRequest'
        conversation_relay_config:
          $ref: '#/components/schemas/ConversationRelayEmbeddedConfig'
        billing_group_id:
          description: Use this field to set the Billing Group ID for the call. Must be a valid and existing Billing Group ID.
          type: string
          format: uuid
          example: f5586561-8ff0-4291-a0ac-84fe544797bd
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        custom_headers:
          description: Custom headers to be added to the SIP INVITE response.
          type: array
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
        preferred_codecs:
          type: string
          description: The list of comma-separated codecs in a preferred order for the forked media to be received.
          enum:
          - G722,PCMU,PCMA,G729,OPUS,VP8,H264
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
        sip_headers:
          description: SIP headers to be added to the SIP INVITE response. Currently only User-to-User header is supported.
          type: array
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        stream_url:
          description: The destination WebSocket address where the stream is going to be delivered.
          type: string
          example: wss://www.example.com/websocket
        stream_track:
          description: Specifies which track should be streamed.
          type: string
          enum:
          - inbound_track
          - outbound_track
          - both_tracks
          default: inbound_track
          example: both_tracks
        stream_codec:
          $ref: '#/components/schemas/StreamCodec'
        stream_bidirectional_mode:
          $ref: '#/components/schemas/StreamBidirectionalMode'
        stream_bidirectional_codec:
          $ref: '#/components/schemas/StreamBidirectionalCodec'
        stream_bidirectional_target_legs:
          $ref: '#/components/schemas/StreamBidirectionalTargetLegs'
        send_silence_when_idle:
          description: Generate silence RTP packets when no transmission available.
          type: boolean
          default: false
          example: true
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          type: string
          example: https://www.example.com/server-b/
        webhook_url_method:
          description: HTTP request type used for `webhook_url`.
          default: POST
          type: string
          enum:
          - POST
          - GET
          example: GET
        transcription:
          description: Enable standalone call transcription upon call answer. The default value is false. Configure this feature with `transcription_config`. To configure speech recognition for an AI assistant, use `assistant.transcription` instead.
          type: boolean
          default: false
          example: true
        transcription_config:
          $ref: '#/components/schemas/TranscriptionStartRequest'
        record:
          description: Start recording automatically after an event. Disabled by default.
          type: string
          enum:
          - record-from-answer
          example: record-from-answer
        record_channels:
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          type: string
          enum:
          - single
          - dual
          default: dual
          example: single
        record_format:
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          type: string
          enum:
          - wav
          - mp3
          default: mp3
          example: wav
        record_max_length:
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 1000
        record_timeout_secs:
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 100
        record_track:
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          type: string
          example: outbound
          default: both
          enum:
          - both
          - inbound
          - outbound
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          type: string
          example: trim-silence
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          type: string
          minLength: 1
          maxLength: 40
          example: my_recording_file_name
        webhook_urls:
          description: A map of event types to arrays of webhook URLs. When an event of the specified type occurs, the webhook URLs associated with that event type will be called instead of `webhook_url`. Events not mapped here will use the default `webhook_url`.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uri
          example:
            call.hangup:
            - https://www.example.com/webhooks/hangup
            call.bridge:
            - https://www.example.com/webhooks/bridge
        webhook_urls_method:
          description: HTTP request method to invoke `webhook_urls`.
          type: string
          enum:
          - POST
          - GET
          default: POST
          example: POST
        webhook_retries_policies:
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          type: object
          additionalProperties:
            type: object
            properties:
              retries_ms:
                type: array
                items:
                  type: integer
                maxItems: 5
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
          example:
            call.hangup:
              retries_ms:
              - 1000
              - 2000
              - 5000
        deepfake_detection:
          description: Enables deepfake detection on the call. When enabled, audio from the remote party is streamed to a detection service that analyzes whether the voice is AI-generated. Results are delivered via the `call.deepfake_detection.result` webhook.
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether deepfake detection is enabled.
            timeout:
              type: integer
              format: int32
              default: 15
              minimum: 5
              maximum: 60
              description: Maximum time in seconds to wait for a detection result before timing out.
            rtp_timeout:
              type: integer
              format: int32
              default: 30
              minimum: 5
              maximum: 120
              description: Maximum time in seconds to wait for RTP audio before timing out. If no audio is received within this window, detection stops with an error.
      example:
        assistant:
          id: asst_123
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        webhook_url: https://www.example.com/server-b/
        webhook_url_method: POST
        send_silence_when_idle: true
        deepfake_detection:
          enabled: true
          timeout: 15
          rtp_timeout: 30
    TranscriptionEngineAssemblyaiConfig_3:
      type: object
      title: Transcription engine AssemblyAI config
      properties:
        transcription_engine:
          type: string
          enum:
          - AssemblyAI
          description: Engine identifier for AssemblyAI transcription service
        transcription_model:
          description: The model to use for transcription. `assemblyai/universal-3-6-pro` is the AssemblyAI Universal-3.6 Pro model. `assemblyai/universal-3-5-pro` (the default) and `assemblyai/universal-streaming` are legacy aliases that run the same Universal-3.6 Pro model.
          type: string
          enum:
          - assemblyai/universal-3-6-pro
          - assemblyai/universal-3-5-pro
          - assemblyai/universal-streaming
          default: assemblyai/universal-3-5-pro
        interim_results:
          type: boolean
          description: Whether to send also interim results. If set to false, only final results will be sent.
          default: false
          example: true
    DeepgramNova2SpecialtyConfig:
      type: object
      title: DeepgramNova2SpecialtyConfig
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-2-medical
          - deepgram/nova-2-phonecall
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramEnglishTranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        hints:
          type: array
          description: Nova-2 keyword biasing without intensifiers. Up to 100 terms to bias recognition toward. For weighted biasing, use `keywords_boosting` instead. Supported on Nova-2 models only (`deepgram/nova-2`, `deepgram/nova-2-medical`, `deepgram/nova-2-phonecall`); use `keyterms` on Nova-3 and Flux.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-2-medical
        language: en-US
        smart_format: false
        hints:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
      description: 'Deepgram Nova-2 specialty models: `deepgram/nova-2-medical` (medical vocabulary) and `deepgram/nova-2-phonecall` (low-bandwidth phone audio). English only.'
    GatherUsingSpeakRequest_3:
      type: object
      title: Gather Using Speak Request
      required:
      - voice
      - payload
      properties:
        payload:
          description: The text or SSML to be converted into speech. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        invalid_payload:
          description: The text or SSML to be converted into speech when digits don't match the `valid_digits` parameter or the number of digits is not between `min` and `max`. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        payload_type:
          description: The type of the provided payload. The payload can either be plain text, or Speech Synthesis Markup Language (SSML).
          default: text
          type: string
          enum:
          - text
          - ssml
          example: ssml
        service_level:
          description: This parameter impacts speech quality, language options and payload types. When using `basic`, only the `en-US` language and payload type `text` are allowed.
          default: premium
          type: string
          enum:
          - basic
          - premium
          example: premium
        voice:
          description: "Specifies the voice used in speech synthesis.\n\n- Define voices using the format `<Provider>.<Model>.<VoiceId>`. Specifying only the provider will give default values for voice_id and model_id.\n\n **Supported Providers:**\n- **AWS:** Use `AWS.Polly.<VoiceId>` (e.g., `AWS.Polly.Joanna`). For neural voices, which provide more realistic, human-like speech, append `-Neural` to the `VoiceId` (e.g., `AWS.Polly.Joanna-Neural`). Check the [available voices](https://docs.aws.amazon.com/polly/latest/dg/available-voices.html) for compatibility.\n- **Azure:** Use `Azure.<VoiceId>` (e.g., `Azure.en-CA-ClaraNeural`, `Azure.en-US-BrianMultilingualNeural`, `Azure.en-US-Ava:DragonHDLatestNeural`). For a complete list of voices, go to [Azure Voice Gallery](https://speech.microsoft.com/portal/voicegallery). Use `voice_settings` to configure custom deployments, regions, or API keys.\n- **ElevenLabs:** Use `ElevenLabs.<ModelId>.<VoiceId>` (e.g., `ElevenLabs.eleven_multilingual_v2.21m00Tcm4TlvDq8ikWAM`). The `ModelId` part is optional. To use ElevenLabs, you must provide your ElevenLabs API key as an integration identifier secret in `\"voice_settings\": {\"api_key_ref\": \"<secret_identifier>\"}`. See [integration secrets documentation](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) for details. Check [available voices](https://elevenlabs.io/docs/api-reference/get-voices).\n- **Telnyx:** Use `Telnyx.<model_id>.<voice_id>` (e.g., `Telnyx.KokoroTTS.af`). Use `voice_settings` to configure voice_speed and other synthesis parameters. `Bayan` provides Arabic (multiple dialects) and English voices (e.g., `Telnyx.Bayan.Ahmed`, `Telnyx.Bayan.Amanda`). `Sukhan` provides Urdu voices (e.g., `Telnyx.Sukhan.urdu-professor`); `voice_speed` is not supported.\n- **Minimax:** Use `Minimax.<ModelId>.<VoiceId>` (e.g., `Minimax.speech-02-hd.Wise_Woman`). Supported models: `speech-02-turbo`, `speech-02-hd`, `speech-2.6-turbo`, `speech-2.8-turbo`. Use `voice_settings` to configure speed, volume, pitch, and language_boost.\n- **Resemble:** Use `Resemble.<ModelId>.<VoiceId>` (e.g., `Resemble.Turbo.Aaron_en-US`). Supported models: `Pro`, `Turbo`, `Urdu`. `<VoiceId>` is a stock voice name or the ID of a Resemble voice clone. Use `voice_settings` to configure precision, sample_rate, and format.\n- **Inworld:** Use `Inworld.<ModelId>.<VoiceId>` (e.g., `Inworld.Mini.Loretta`, `Inworld.Max.Oliver`, `Inworld.TTS2.Loretta`). Supported models: `Mini`, `Max`, `TTS2`. Use `voice_settings` to configure `delivery_mode` (`STABLE`, `BALANCED`, `CREATIVE`), supported by `TTS2` only.\n- **Fish Audio:** Use `FishAudio.<ModelId>.<VoiceId>` (e.g., `FishAudio.s2.1-pro.<reference_id>`). Supported models: `s2.1-pro`, `s2-pro`, `s1`. `VoiceId` is a Fish Voice-Library reference ID.\n- **Soniox:** Use `Soniox.<ModelId>.<VoiceId>` (e.g., `Soniox.tts-rt-v2.Emma`). Supported model: `tts-rt-v2`. Browse the catalog via the [Voices API](https://developers.telnyx.com/api-reference/text-to-speech-commands/list-available-voices). Every voice speaks all supported languages; set `language` to the two-letter ISO 639-1 code of the text, for example `it`. SSML is not supported. Use `voice_settings` to configure `speed` (0.7 to 1.3) and `reduce_silence`.\n- **xAI:** Use `xAI.<VoiceId>` (e.g., `xAI.eve`). Available voices: `eve`, `ara`, `rex`, `sal`, `leo`.\n- **Humain:** Use `Humain.<VoiceId>` (e.g., `Humain.sara-ar`). Available voices: `sara-en`, `abdulaziz-en`, `sara-ar`, `abdulaziz-ar`, `nourah-ar`, `abdullah-ar`. Native Arabic (Saudi dialect) and English voices only — no `ModelId` segment.\n\nFor service_level basic, you may define the gender of the speaker (male or female)."
          type: string
          example: Telnyx.KokoroTTS.af
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        language:
          description: The language you want spoken. This parameter is ignored when a `Polly.*` voice is specified.
          type: string
          enum:
          - arb
          - cmn-CN
          - cy-GB
          - da-DK
          - de-DE
          - en-AU
          - en-GB
          - en-GB-WLS
          - en-IN
          - en-US
          - es-ES
          - es-MX
          - es-US
          - fr-CA
          - fr-FR
          - hi-IN
          - is-IS
          - it-IT
          - ja-JP
          - ko-KR
          - nb-NO
          - nl-NL
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sv-SE
          - tr-TR
          example: en-US
        minimum_digits:
          description: The minimum number of digits to fetch. This parameter has a minimum value of 1.
          default: 1
          type: integer
          example: 1
          format: int32
        maximum_digits:
          description: The maximum number of digits to fetch. This parameter has a maximum value of 128.
          default: 128
          type: integer
          example: 10
          format: int32
        maximum_tries:
          description: The maximum number of times that a file should be played back if there is no input from the user on the call.
          default: 3
          type: integer
          example: 3
          format: int32
        timeout_millis:
          description: The number of milliseconds to wait for a DTMF response after speak ends before a replaying the sound file.
          default: 60000
          type: integer
          example: 60000
          format: int32
        terminating_digit:
          description: The digit used to terminate input if fewer than `maximum_digits` digits have been gathered. Set to an empty string to disable the terminating digit entirely, so that a digit such as `#` can be collected as input per `valid_digits`.
          default: '#'
          type: string
          example: '#'
        valid_digits:
          description: A list of all digits accepted as valid.
          default: 0123456789#*
          type: string
          example: '123'
        inter_digit_timeout_millis:
          description: The number of milliseconds to wait for input between digits.
          default: 5000
          type: integer
          example: 10000
          format: int32
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
      example:
        payload: say this on call
        invalid_payload: say this on call
        payload_type: text
        service_level: premium
        voice: male
        language: arb
        minimum_digits: 1
        maximum_digits: 10
        terminating_digit: '#'
        valid_digits: '123'
        inter_digit_timeout_millis: 10000
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    SpeakRequest_3:
      type: object
      title: Speak Request
      required:
      - payload
      - voice
      properties:
        payload:
          description: The text or SSML to be converted into speech. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        payload_type:
          description: The type of the provided payload. The payload can either be plain text, or Speech Synthesis Markup Language (SSML).
          default: text
          type: string
          enum:
          - text
          - ssml
          example: ssml
        service_level:
          description: This parameter impacts speech quality, language options and payload types. When using `basic`, only the `en-US` language and payload type `text` are allowed.
          default: premium
          type: string
          enum:
          - basic
          - premium
          example: premium
        stop:
          description: When specified, it stops the current audio being played. Specify `current` to stop the current audio being played, and to play the next file in the queue. Specify `all` to stop the current audio file being played and to also clear all audio files from the queue.
          type: string
          example: current
        voice:
          description: "Specifies the voice used in speech synthesis.\n\n- Define voices using the format `<Provider>.<Model>.<VoiceId>`. Specifying only the provider will give default values for voice_id and model_id.\n\n **Supported Providers:**\n- **AWS:** Use `AWS.Polly.<VoiceId>` (e.g., `AWS.Polly.Joanna`). For neural voices, which provide more realistic, human-like speech, append `-Neural` to the `VoiceId` (e.g., `AWS.Polly.Joanna-Neural`). Check the [available voices](https://docs.aws.amazon.com/polly/latest/dg/available-voices.html) for compatibility.\n- **Azure:** Use `Azure.<VoiceId>` (e.g., `Azure.en-CA-ClaraNeural`, `Azure.en-US-BrianMultilingualNeural`, `Azure.en-US-Ava:DragonHDLatestNeural`). For a complete list of voices, go to [Azure Voice Gallery](https://speech.microsoft.com/portal/voicegallery). Use `voice_settings` to configure custom deployments, regions, or API keys.\n- **ElevenLabs:** Use `ElevenLabs.<ModelId>.<VoiceId>` (e.g., `ElevenLabs.eleven_multilingual_v2.21m00Tcm4TlvDq8ikWAM`). The `ModelId` part is optional. To use ElevenLabs, you must provide your ElevenLabs API key as an integration identifier secret in `\"voice_settings\": {\"api_key_ref\": \"<secret_identifier>\"}`. See [integration secrets documentation](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) for details. Check [available voices](https://elevenlabs.io/docs/api-reference/get-voices).\n- **Telnyx:** Use `Telnyx.<model_id>.<voice_id>` (e.g., `Telnyx.KokoroTTS.af`). Use `voice_settings` to configure voice_speed and other synthesis parameters. `Bayan` provides Arabic (multiple dialects) and English voices (e.g., `Telnyx.Bayan.Ahmed`, `Telnyx.Bayan.Amanda`). `Sukhan` provides Urdu voices (e.g., `Telnyx.Sukhan.urdu-professor`); `voice_speed` is not supported.\n- **Minimax:** Use `Minimax.<ModelId>.<VoiceId>` (e.g., `Minimax.speech-02-hd.Wise_Woman`). Supported models: `speech-02-turbo`, `speech-02-hd`, `speech-2.6-turbo`, `speech-2.8-turbo`. Use `voice_settings` to configure speed, volume, pitch, and language_boost.\n- **Resemble:** Use `Resemble.<ModelId>.<VoiceId>` (e.g., `Resemble.Turbo.Aaron_en-US`). Supported models: `Pro`, `Turbo`, `Urdu`. `<VoiceId>` is a stock voice name or the ID of a Resemble voice clone. Use `voice_settings` to configure precision, sample_rate, and format.\n- **Inworld:** Use `Inworld.<ModelId>.<VoiceId>` (e.g., `Inworld.Mini.Loretta`, `Inworld.Max.Oliver`, `Inworld.TTS2.Loretta`). Supported models: `Mini`, `Max`, `TTS2`. Use `voice_settings` to configure `delivery_mode` (`STABLE`, `BALANCED`, `CREATIVE`), supported by `TTS2` only.\n- **Fish Audio:** Use `FishAudio.<ModelId>.<VoiceId>` (e.g., `FishAudio.s2.1-pro.<reference_id>`). Supported models: `s2.1-pro`, `s2-pro`, `s1`. `VoiceId` is a Fish Voice-Library reference ID.\n- **Soniox:** Use `Soniox.<ModelId>.<VoiceId>` (e.g., `Soniox.tts-rt-v2.Emma`). Supported model: `tts-rt-v2`. Browse the catalog via the [Voices API](https://developers.telnyx.com/api-reference/text-to-speech-commands/list-available-voices). Every voice speaks all supported languages; set `language` to the two-letter ISO 639-1 code of the text, for example `it`. SSML is not supported. Use `voice_settings` to configure `speed` (0.7 to 1.3) and `reduce_silence`.\n- **xAI:** Use `xAI.<VoiceId>` (e.g., `xAI.eve`). Available voices: `eve`, `ara`, `rex`, `sal`, `leo`.\n- **Humain:** Use `Humain.<VoiceId>` (e.g., `Humain.sara-ar`). Available voices: `sara-en`, `abdulaziz-en`, `sara-ar`, `abdulaziz-ar`, `nourah-ar`, `abdullah-ar`. Native Arabic (Saudi dialect) and English voices only — no `ModelId` segment.\n\nFor service_level basic, you may define the gender of the speaker (male or female)."
          type: string
          example: Telnyx.KokoroTTS.af
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        language:
          description: The language you want spoken. This parameter is ignored when a `Polly.*` voice is specified.
          type: string
          enum:
          - arb
          - cmn-CN
          - cy-GB
          - da-DK
          - de-DE
          - en-AU
          - en-GB
          - en-GB-WLS
          - en-IN
          - en-US
          - es-ES
          - es-MX
          - es-US
          - fr-CA
          - fr-FR
          - hi-IN
          - is-IS
          - it-IT
          - ja-JP
          - ko-KR
          - nb-NO
          - nl-NL
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sv-SE
          - tr-TR
          example: en-US
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        loop:
