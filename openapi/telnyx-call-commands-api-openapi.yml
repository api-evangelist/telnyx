    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /calls/{call_control_id}/actions/ai_assistant_start:
    post:
      summary: Start AI Assistant
      description: 'Start an AI assistant on the call.


        **Expected Webhooks:**


