    PayPrompt:
      type: object
      title: Pay Prompt
      description: A text-to-speech prompt with optional matching qualifiers.
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          description: Text spoken for the payment collection step.
          example: Please enter your card number.
        attempt:
          type: string
          description: Space-separated 1-based attempt numbers for which this prompt applies.
          example: 2 3
        error_type:
          type: string
          description: Step error for which this prompt applies.
          enum:
          - timeout
          - invalid-card-number
          - invalid-card-type
          - invalid-date
          - invalid-security-code
          - invalid-postal-code
          - invalid-bank-routing-number
          - invalid-bank-account-number
          - input-matching-failed
          example: invalid-card-number
        card_type:
          type: string
          description: Lowercase, case-sensitive detected card type for which this prompt applies.
          enum:
          - visa
          - mastercard
          - amex
          - optima
          - discover
          - diners-club
          - jcb
          - maestro
          - enroute
          example: amex
      additionalProperties: false
    DeepgramNova2Config_2:
      type: object
      title: DeepgramNova2Config
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-2
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramNova2TranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        hints:
          type: array
          description: Nova-2 keyword biasing without intensifiers. Up to 100 terms to bias recognition toward. For weighted biasing, use `keywords_boosting` instead. Nova-2-only; use `keyterms` on Nova-3.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-2
        language: en
        smart_format: false
        hints:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
    NoiseSuppressionEngine_2:
