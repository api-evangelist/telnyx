  /calls/{call_control_id}/actions/gather_using_ai:
    post:
      summary: Gather using AI
      description: 'Gather parameters defined in the request payload using a voice assistant.


        You can pass parameters described as a JSON Schema object and the voice assistant will attempt to gather these informations.


        **Expected Webhooks:**


        - `call.ai_gather.ended`

        - `call.conversation.ended`

        - `call.ai_gather.partial_results` (if `send_partial_results` is set to `true`)

        - `call.ai_gather.message_history_updated` (if `send_message_history_updates` is set to `true`)'
      operationId: callGatherUsingAI
      tags:
      - Call Commands
      parameters:
      - $ref: '#/components/parameters/CallControlId'
      requestBody:
        description: Gather using AI request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatherUsingAIRequest'
      responses:
        '200':
          description: Successful response upon making a call control command that includes conversation_id.
          content:
            application/json:
              schema:
                type: object
                title: Call Control Command Response With Conversation ID
                properties:
                  data:
                    $ref: '#/components/schemas/CallControlCommandResultWithConversationId'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/call-control_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /calls/{call_control_id}/actions/gather_using_audio:
    post:
      summary: Gather using audio
      description: 'Play an audio file on the call until the required DTMF signals are gathered to build interactive menus.


        You can pass a list of valid digits along with an ''invalid_audio_url'', which will be played back at the beginning of each prompt. Playback will be interrupted when a DTMF signal is received. The `Answer command must be issued before the `gather_using_audio` command.


        **Expected Webhooks:**


        - `call.playback.started`

        - `call.playback.ended`

        - `call.dtmf.received` (you may receive many of these webhooks)

        - `call.gather.ended`'
      operationId: GatherUsingAudio
      tags:
      - Call Commands
      parameters:
      - $ref: '#/components/parameters/CallControlId'
      requestBody:
        description: Gather using audio request
        required: true
        content:
