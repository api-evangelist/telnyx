          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        greeting:
          type: string
          description: Text played when the relay session starts.
          example: Hi! Ask me anything!
        language:
          type: string
          description: Default language for the relay session. This value is used for both text-to-speech and speech recognition.
          default: en
          example: en-US
        languages:
          type: array
          description: Per-language TTS and transcription settings.
          items:
            $ref: '#/components/schemas/ConversationRelayLanguage'
        interruption_settings:
          $ref: '#/components/schemas/ConversationRelayInterruptionSettings'
        transcription:
          type: object
          deprecated: true
          description: Not supported for Conversation Relay start requests. Use `transcription_engine` and `transcription_engine_config` instead.
          additionalProperties: true
        assistant:
          $ref: '#/components/schemas/ConversationRelayAssistant'
        client_state:
          type: string
          description: Use this field to add state to subsequent webhooks. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        tts_provider:
          type: string
          description: Text-to-speech provider. If omitted, Telnyx derives it from `voice` or `provider`.
          example: telnyx
        provider:
          type: string
          description: Structured voice provider. Must be supplied together with `structured_provider`.
          example: elevenlabs
        structured_provider:
          $ref: '#/components/schemas/ConversationRelayStructuredProvider'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. For Conversation Relay, use this field with `transcription_engine_config`; the `transcription` object is not supported.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig'
        interruptible:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruptible_greeting:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        custom_parameters:
          type: object
          description: Custom key-value parameters forwarded to the relay session as `assistant.dynamic_variables`. If `assistant.dynamic_variables` is also present, these values are merged in.
          additionalProperties: true
          example:
            customer_id: '12345'
      example:
        url: wss://example.com/conversation-relay
        dtmf_detection: true
        interruptible: speech
        interruptible_greeting: dtmf
        greeting: Hi! Ask me anything!
        voice: Telnyx.KokoroTTS.af
        tts_provider: telnyx
        voice_settings:
          type: telnyx
        language: en-US
        languages:
        - language: en-US
          tts_provider: telnyx
          voice: Telnyx.KokoroTTS.af
          transcription_engine: Deepgram
          transcription_engine_config:
            transcription_model: deepgram/nova-3
        custom_parameters:
          customer_id: '12345'
      anyOf:
      - required:
        - url
      - required:
        - conversation_relay_url
      - required:
        - conversation_relay_settings
    DialogflowConfig:
      type: object
