            transcription_model: deepgram/nova-3
    ConversationRelayTranscriptionEngineConfig:
      type: object
      title: Conversation Relay Transcription Engine Config
      description: Engine-specific transcription settings for Conversation Relay. This accepts the same provider-specific options used by the Call Transcription Start command, such as `transcription_model`, without requiring the engine discriminator to be repeated inside this object.
      additionalProperties: true
