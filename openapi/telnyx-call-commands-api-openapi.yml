openapi: 3.2.0
info:
  title: Telnyx Call Commands API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Call Commands across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Call Commands
  description: Call Control command operations
paths:
  /calls:
    post:
      summary: Dial
      description: 'Dial a number or SIP URI from a given connection. A successful response will include a `call_leg_id` which can be used to correlate the command with subsequent webhooks.


        **Expected Webhooks:**


        - `call.initiated`

        - `call.answered` or `call.hangup`

        - `call.hold` and `call.unhold` if the call is held/unheld

        - `call.machine.detection.ended` if `answering_machine_detection` was requested

        - `call.machine.greeting.ended` if `answering_machine_detection` was requested to detect the end of machine greeting

        - `call.machine.premium.detection.ended` if `answering_machine_detection=premium` was requested

        - `call.machine.premium.greeting.ended` if `answering_machine_detection=premium` was requested and a beep was detected

        - `call.deepfake_detection.result` if `deepfake_detection` was enabled

        - `call.deepfake_detection.error` if `deepfake_detection` was enabled and an error occurred

        - `streaming.started`, `streaming.stopped` or `streaming.failed` if `stream_url` was set


        When the `record` parameter is set to `record-from-answer`, the response will include a `recording_id` field.'
      operationId: DialCall
      tags:
      - Call Commands
      requestBody:
        description: Call request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallRequest'
      responses:
        '200':
          description: Successful response with details about a call status that includes recording_id.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve Call Status Response With Recording ID
                properties:
                  data:
                    $ref: '#/components/schemas/CallWithRecordingId'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
        default:
          $ref: '#/components/responses/call-control_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /calls/{call_control_id}/actions/ai_assistant_add_messages:
    post:
      summary: Add messages to AI Assistant
      description: Add messages to the conversation started by an AI assistant on the call.
      operationId: CallAddMessagesToAIAssistant
      tags:
