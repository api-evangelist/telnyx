        api_key_ref:
          type: string
          description: Reference to an integration secret that contains your Cal.com API key. You would pass the `identifier` for an integration secret [/v2/integration_secrets](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) that refers to your Cal.com API key.
          example: my_calcom_api_key
      type: object
      required:
      - event_type_id
      - api_key_ref
      title: CheckAvailabilityToolParams
    DeepgramNova3Config:
      type: object
      title: DeepgramNova3Config
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-3
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramNova3TranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        keyterms:
          type: array
          description: Nova-3 keyterm prompting. Up to 100 domain-specific terms or brand names to bias recognition toward. Nova-3-only; use `hints` on Nova-2.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-3
        language: en
        smart_format: false
        keyterms:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
    PayPrompts:
      type: object
      title: Pay Prompts
      description: Custom text-to-speech prompts keyed by payment collection step.
      properties:
        payment-card-number:
          $ref: '#/components/schemas/PayPromptValue'
        expiration-date:
          $ref: '#/components/schemas/PayPromptValue'
        postal-code:
          $ref: '#/components/schemas/PayPromptValue'
        security-code:
          $ref: '#/components/schemas/PayPromptValue'
        bank-routing-number:
          $ref: '#/components/schemas/PayPromptValue'
        bank-account-number:
          $ref: '#/components/schemas/PayPromptValue'
      additionalProperties: false
      example:
        payment-card-number:
        - text: Please enter your card number.
        - text: That card number was not accepted. Please try again.
          attempt: 2 3
          error_type: invalid-card-number
    ConversationRelayEmbeddedConfig:
      type: object
      title: Conversation Relay Embedded Config
      description: Starts a Conversation Relay session automatically when the answered/dialed call is answered. This embedded shape is supported on `answer` and `dial`. It uses public field names (`url`, `dtmf_detection`, `greeting`, `voice`, `language`, etc.) and maps them to the underlying Conversation Relay action. `client_state`, `tts_language`, and `transcription_language` inside this object are ignored; use the parent command's `client_state` and `command_id` fields instead.
      properties:
        url:
          type: string
          pattern: ^wss?://
          description: WebSocket URL for your Conversation Relay server. Must start with `ws://` or `wss://`.
          example: wss://example.com/conversation-relay
        dtmf_detection:
          type: boolean
          description: Enable DTMF detection for the relay session.
          default: false
          example: true
        greeting:
          type: string
          description: Text played when the relay session starts.
          example: Hi! Ask me anything!
        voice:
          $ref: '#/components/schemas/VoiceConfig'
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        tts_provider:
          type: string
          description: Text-to-speech provider. If omitted, Telnyx derives it from `voice` or `provider`.
          example: telnyx
        provider:
          type: string
          description: Structured voice provider. Must be supplied together with `structured_provider`.
          example: elevenlabs
        structured_provider:
          $ref: '#/components/schemas/ConversationRelayStructuredProvider'
        language:
          type: string
          description: Default language for both text-to-speech and speech recognition.
          default: en
          example: en-US
        languages:
          type: array
          description: Per-language TTS and transcription settings.
          items:
            $ref: '#/components/schemas/ConversationRelayLanguage'
        interruptible:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruptible_greeting:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruption_settings:
          $ref: '#/components/schemas/ConversationRelayInterruptionSettings'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. For Conversation Relay, use this field with `transcription_engine_config`; the `transcription` object is not supported.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig'
        custom_parameters:
          type: object
          description: Custom key-value parameters forwarded to the relay session as assistant dynamic variables.
          additionalProperties: true
          example:
            customer_id: '12345'
      required:
      - url
      example:
        url: wss://example.com/conversation-relay
        dtmf_detection: true
        greeting: Hi! Ask me anything!
        voice: Telnyx.KokoroTTS.af
        tts_provider: telnyx
        voice_settings:
          type: telnyx
        language: en-US
        languages:
        - language: en-US
          voice: Telnyx.Ultra.alloy
          tts_provider: telnyx
          transcription_engine: Deepgram
          transcription_engine_config:
            transcription_model: deepgram/nova-3
        interruptible: speech
        interruptible_greeting: dtmf
        custom_parameters:
          customer_id: '12345'
