      description: Version 2.0.0 of the Telnyx API
  /calls/{call_control_id}/actions/conversation_relay_start:
    post:
      summary: Start Conversation Relay
      description: 'Start a Conversation Relay session on an active call. Conversation Relay connects the call audio to your WebSocket so your application can exchange realtime messages with the caller while Telnyx handles speech recognition and text-to-speech. Only one AI Assistant or Conversation Relay session can be active on a call at a time.


        **Expected Webhooks:**


        - `call.conversation.ended` - Sent when the Conversation Relay session ends. If the customer WebSocket disconnects, the webhook payload `reason` is `customer_disconnect`.'
      operationId: CallStartConversationRelay
      tags:
      - Call Commands
      parameters:
      - $ref: '#/components/parameters/CallControlId'
      requestBody:
        description: Conversation Relay start request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRelayStartRequest'
      responses:
        '200':
          description: Successful response upon starting Conversation Relay.
          content:
            application/json:
              schema:
                type: object
                title: Call Control Command Response With Conversation Relay ID
                properties:
                  data:
                    $ref: '#/components/schemas/CallControlCommandResultWithConversationRelayId'
        '422':
