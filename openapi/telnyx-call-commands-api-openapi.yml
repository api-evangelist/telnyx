            type: array
          - description: A dynamic variable string like `{{ targets }}` where `targets` is returned by the dynamic variables webhook and resolves to an array of target objects at runtime.
            example: '{{ targets }}'
            type: string
      required:
      - targets
      - from
      title: TransferToolParams
      type: object
