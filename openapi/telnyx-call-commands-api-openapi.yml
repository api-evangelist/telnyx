    SpeakRequest_2:
      type: object
      title: Speak Request
      required:
      - payload
      - voice
      properties:
        payload:
          description: The text or SSML to be converted into speech. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        payload_type:
          description: The type of the provided payload. The payload can either be plain text, or Speech Synthesis Markup Language (SSML).
          default: text
          type: string
          enum:
          - text
          - ssml
          example: ssml
        service_level:
          description: This parameter impacts speech quality, language options and payload types. When using `basic`, only the `en-US` language and payload type `text` are allowed.
          default: premium
          type: string
          enum:
          - basic
          - premium
          example: premium
        stop:
          description: When specified, it stops the current audio being played. Specify `current` to stop the current audio being played, and to play the next file in the queue. Specify `all` to stop the current audio file being played and to also clear all audio files from the queue.
          type: string
          example: current
        voice:
          description: "Specifies the voice used in speech synthesis.\n\n- Define voices using the format `<Provider>.<Model>.<VoiceId>`. Specifying only the provider will give default values for voice_id and model_id.\n\n **Supported Providers:**\n- **AWS:** Use `AWS.Polly.<VoiceId>` (e.g., `AWS.Polly.Joanna`). For neural voices, which provide more realistic, human-like speech, append `-Neural` to the `VoiceId` (e.g., `AWS.Polly.Joanna-Neural`). Check the [available voices](https://docs.aws.amazon.com/polly/latest/dg/available-voices.html) for compatibility.\n- **Azure:** Use `Azure.<VoiceId>` (e.g., `Azure.en-CA-ClaraNeural`, `Azure.en-US-BrianMultilingualNeural`, `Azure.en-US-Ava:DragonHDLatestNeural`). For a complete list of voices, go to [Azure Voice Gallery](https://speech.microsoft.com/portal/voicegallery). Use `voice_settings` to configure custom deployments, regions, or API keys.\n- **ElevenLabs:** Use `ElevenLabs.<ModelId>.<VoiceId>` (e.g., `ElevenLabs.eleven_multilingual_v2.21m00Tcm4TlvDq8ikWAM`). The `ModelId` part is optional. To use ElevenLabs, you must provide your ElevenLabs API key as an integration identifier secret in `\"voice_settings\": {\"api_key_ref\": \"<secret_identifier>\"}`. See [integration secrets documentation](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) for details. Check [available voices](https://elevenlabs.io/docs/api-reference/get-voices).\n- **Telnyx:** Use `Telnyx.<model_id>.<voice_id>` (e.g., `Telnyx.KokoroTTS.af`). Use `voice_settings` to configure voice_speed and other synthesis parameters. `Bayan` provides Arabic (multiple dialects) and English voices (e.g., `Telnyx.Bayan.Ahmed`, `Telnyx.Bayan.Amanda`). `Sukhan` provides Urdu voices (e.g., `Telnyx.Sukhan.urdu-professor`); `voice_speed` is not supported.\n- **Minimax:** Use `Minimax.<ModelId>.<VoiceId>` (e.g., `Minimax.speech-02-hd.Wise_Woman`). Supported models: `speech-02-turbo`, `speech-02-hd`, `speech-2.6-turbo`, `speech-2.8-turbo`. Use `voice_settings` to configure speed, volume, pitch, and language_boost.\n- **Resemble:** Use `Resemble.Turbo.<voice_id>` (e.g., `Resemble.Turbo.my_voice`). Only `Turbo` model is supported. Use `voice_settings` to configure precision, sample_rate, and format.\n- **Inworld:** Use `Inworld.<ModelId>.<VoiceId>` (e.g., `Inworld.Mini.Loretta`, `Inworld.Max.Oliver`, `Inworld.TTS2.Loretta`). Supported models: `Mini`, `Max`, `TTS2`. Use `voice_settings` to configure `delivery_mode` (`STABLE`, `BALANCED`, `CREATIVE`), supported by `TTS2` only.\n- **Fish Audio:** Use `FishAudio.<ModelId>.<VoiceId>` (e.g., `FishAudio.s2.1-pro.<reference_id>`). Supported models: `s2.1-pro`, `s2-pro`, `s1`. `VoiceId` is a Fish Voice-Library reference ID.\n- **Soniox:** Use `Soniox.<ModelId>.<VoiceId>` (e.g., `Soniox.tts-rt-v2.Emma`). Supported model: `tts-rt-v2`. Browse the catalog via the [Voices API](https://developers.telnyx.com/api-reference/text-to-speech-commands/list-available-voices). Every voice speaks all supported languages; set `language` to the two-letter ISO 639-1 code of the text, for example `it`. SSML is not supported. Use `voice_settings` to configure `speed` (0.7 to 1.3) and `reduce_silence`.\n- **xAI:** Use `xAI.<VoiceId>` (e.g., `xAI.eve`). Available voices: `eve`, `ara`, `rex`, `sal`, `leo`.\n- **Humain:** Use `Humain.<VoiceId>` (e.g., `Humain.sara-ar`). Available voices: `sara-en`, `abdulaziz-en`, `sara-ar`, `abdulaziz-ar`, `nourah-ar`, `abdullah-ar`. Native Arabic (Saudi dialect) and English voices only — no `ModelId` segment.\n\nFor service_level basic, you may define the gender of the speaker (male or female)."
          type: string
          example: Telnyx.KokoroTTS.af
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings_2'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        language:
          description: The language you want spoken. This parameter is ignored when a `Polly.*` voice is specified.
          type: string
          enum:
          - arb
          - cmn-CN
          - cy-GB
          - da-DK
          - de-DE
          - en-AU
          - en-GB
          - en-GB-WLS
          - en-IN
          - en-US
          - es-ES
          - es-MX
          - es-US
          - fr-CA
          - fr-FR
          - hi-IN
          - is-IS
          - it-IT
          - ja-JP
          - ko-KR
          - nb-NO
          - nl-NL
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sv-SE
          - tr-TR
          example: en-US
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        loop:
          $ref: '#/components/schemas/Loopcount'
          description: The number of times to play the audio file. Use `infinity` to loop indefinitely. Defaults to 1.
        target_legs:
          description: Specifies which legs of the call should receive the spoken audio.
          type: string
          enum:
          - self
          - opposite
          - both
          default: self
          example: both
      example:
        payload: Say this on the call
        payload_type: text
        service_level: basic
        stop: current
        voice: female
        language: arb
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    TranscriptionStartRequest_2:
      type: object
      title: Transcription start request
      properties:
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - Parakeet
          - Humain
          - Reson8
          - Cohere
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          oneOf:
          - $ref: '#/components/schemas/TranscriptionEngineGoogleConfig'
          - $ref: '#/components/schemas/TranscriptionEngineTelnyxConfig'
          - $ref: '#/components/schemas/TranscriptionEngineDeepgramConfig'
          - $ref: '#/components/schemas/TranscriptionEngineAzureConfig'
          - $ref: '#/components/schemas/TranscriptionEngineXaiConfig'
          - $ref: '#/components/schemas/TranscriptionEngineAssemblyaiConfig_2'
          - $ref: '#/components/schemas/TranscriptionEngineSpeechmaticsConfig'
          - $ref: '#/components/schemas/TranscriptionEngineSonioxConfig'
          - $ref: '#/components/schemas/TranscriptionEngineParakeetConfig'
          - $ref: '#/components/schemas/TranscriptionEngineHumainConfig'
          - $ref: '#/components/schemas/TranscriptionEngineReson8Config'
          - $ref: '#/components/schemas/TranscriptionEngineCohereConfig'
          - $ref: '#/components/schemas/TranscriptionEngineAConfig'
          - $ref: '#/components/schemas/TranscriptionEngineBConfig'
          discriminator:
            propertyName: transcription_engine
            mapping:
              Google: '#/components/schemas/TranscriptionEngineGoogleConfig'
              Telnyx: '#/components/schemas/TranscriptionEngineTelnyxConfig'
              Deepgram: '#/components/schemas/TranscriptionEngineDeepgramConfig'
              Azure: '#/components/schemas/TranscriptionEngineAzureConfig'
              xAI: '#/components/schemas/TranscriptionEngineXaiConfig'
              AssemblyAI: '#/components/schemas/TranscriptionEngineAssemblyaiConfig'
              Speechmatics: '#/components/schemas/TranscriptionEngineSpeechmaticsConfig'
              Soniox: '#/components/schemas/TranscriptionEngineSonioxConfig'
              Parakeet: '#/components/schemas/TranscriptionEngineParakeetConfig'
              Humain: '#/components/schemas/TranscriptionEngineHumainConfig'
              Reson8: '#/components/schemas/TranscriptionEngineReson8Config'
              Cohere: '#/components/schemas/TranscriptionEngineCohereConfig'
              A: '#/components/schemas/TranscriptionEngineAConfig'
              B: '#/components/schemas/TranscriptionEngineBConfig'
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        transcription_tracks:
          description: Indicates which leg of the call will be transcribed. Use `inbound` for the leg that requested the transcription, `outbound` for the other leg, and `both` for both legs of the call. Will default to `inbound`.
          type: string
          example: both
          default: inbound
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
      example:
        transcription_engine: Google
        transcription_engine_config:
          transcription_engine: Google
          language: en
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    ConversationRelayStructuredProvider:
