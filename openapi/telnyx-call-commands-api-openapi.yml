    CallRequest:
      example:
        answering_machine_detection: detect
        answering_machine_detection_config:
          after_greeting_silence_millis: 1000
          between_words_silence_millis: 1000
          greeting_duration_millis: 1000
          greeting_silence_duration_millis: 2000
          greeting_total_analysis_time_millis: 50000
          initial_silence_millis: 1000
          maximum_number_of_words: 1000
          maximum_word_length_millis: 2000
          silence_threshold: 512
          total_analysis_time_millis: 5000
        audio_url: http://www.example.com/sounds/greeting.wav
        bridge_intent: true
        bridge_on_answer: true
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        conference_config:
          conference_name: telnyx-conference
          start_conference_on_enter: true
        connection_id: 7267xxxxxxxxxxxxxx
        custom_headers:
        - name: head_1
          value: val_1
        - name: head_2
          value: val_2
        deepfake_detection:
          enabled: true
          rtp_timeout: 30
          timeout: 15
        dialogflow_config:
          analyze_sentiment: false
          partial_automated_agent_reply: false
        enable_dialogflow: false
        from: '+18005550101'
        from_display_name: Company Name
        link_to: ilditnZK_eVysupV21KzmzN_sM29ygfauQojpm4BgFtfX5hXAcjotg==
        media_encryption: SRTP
        send_silence_when_idle: true
        sip_auth_password: password
        sip_auth_username: username
        sip_headers:
        - name: User-to-User
          value: '12345'
        sip_transport_protocol: TLS
        stream_track: both_tracks
        stream_url: wss://www.example.com/websocket
        time_limit_secs: 60
        timeout_secs: 60
        to: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
        webhook_retries_policies:
          call.hangup:
            retries_ms:
            - 1000
            - 2000
            - 5000
        webhook_url: https://www.example.com/server-b/
        webhook_url_method: POST
        webhook_urls:
          call.bridge: https://www.example.com/webhooks/bridge
          call.hangup: https://www.example.com/webhooks/hangup
        webhook_urls_method: POST
      properties:
        answering_machine_detection:
          default: disabled
          description: 'Enables Answering Machine Detection. Telnyx offers Premium and Standard detections. With Premium detection, when a call is answered, Telnyx runs real-time detection and sends a `call.machine.premium.detection.ended` webhook with one of the following results: `human_residence`, `human_business`, `machine`, `silence` or `fax_detected`. If we detect a beep, we also send a `call.machine.premium.greeting.ended` webhook with the result of `beep_detected`. If we detect a beep before `call.machine.premium.detection.ended` we only send `call.machine.premium.greeting.ended`, and if we detect a beep after `call.machine.premium.detection.ended`, we send both webhooks. With Standard detection, when a call is answered, Telnyx runs real-time detection to determine if it was picked up by a human or a machine and sends an `call.machine.detection.ended` webhook with the analysis result. If `greeting_end` or `detect_words` is used and a `machine` is detected, you will receive another `call.machine.greeting.ended` webhook when the answering machine greeting ends with a beep or silence. If `detect_beep` is used, you will only receive `call.machine.greeting.ended` if a beep is detected.'
          enum:
          - premium
          - detect
          - detect_beep
          - detect_words
          - greeting_end
          - disabled
          type: string
        answering_machine_detection_config:
          description: Optional configuration parameters to modify 'answering_machine_detection' performance. Only `total_analysis_time_millis` and `greeting_duration_millis` parameters are applicable when `premium` is selected as answering_machine_detection.
          properties:
            after_greeting_silence_millis:
              default: 800
              description: Silence duration threshold after a greeting message or voice for it be considered human.
              example: 1000
              format: int32
              type: integer
            between_words_silence_millis:
              default: 50
              description: Maximum threshold for silence between words.
              example: 100
              format: int32
              type: integer
            greeting_duration_millis:
              default: 3500
              description: Maximum threshold of a human greeting. If greeting longer than this value, considered machine.
              example: 1500
              format: int32
              type: integer
            greeting_silence_duration_millis:
              default: 1500
              description: If machine already detected, maximum threshold for silence between words. If exceeded, the greeting is considered ended.
              example: 2000
              format: int32
              type: integer
            greeting_total_analysis_time_millis:
              default: 5000
              description: If machine already detected, maximum timeout threshold to determine the end of the machine greeting.
              example: 7500
              format: int32
              type: integer
            initial_silence_millis:
              default: 3500
              description: If initial silence duration is greater than this value, consider it a machine.
              example: 1800
              format: int32
              type: integer
            maximum_number_of_words:
              default: 5
              description: If number of detected words is greater than this value, consder it a machine.
              example: 3
              format: int32
              type: integer
            maximum_word_length_millis:
              default: 3500
              description: If a single word lasts longer than this threshold, consider it a machine.
              example: 2000
              format: int32
              type: integer
            silence_threshold:
              default: 256
              description: Minimum noise threshold for any analysis.
              example: 512
              format: int32
              type: integer
            total_analysis_time_millis:
              default: 3500
              description: Maximum timeout threshold for overall detection.
              example: 5000
              format: int32
              type: integer
          type: object
        assistant:
          $ref: '#/components/schemas/CallAssistantRequest'
        audio_url:
          description: The URL of a file to be played back to the callee when the call is answered. The URL can point to either a WAV or MP3 file. media_name and audio_url cannot be used together in one request.
          example: http://example.com/message.wav
          type: string
        billing_group_id:
          description: Use this field to set the Billing Group ID for the call. Must be a valid and existing Billing Group ID.
          example: f5586561-8ff0-4291-a0ac-84fe544797bd
          format: uuid
          type: string
        bridge_intent:
          default: false
          description: Indicates the intent to bridge this call with the call specified in link_to. When bridge_intent is true, link_to becomes required and the from number will be overwritten by the from number from the linked call.
          example: true
          type: boolean
        bridge_on_answer:
          default: false
          description: Whether to automatically bridge answered call to the call specified in link_to. When bridge_on_answer is true, link_to becomes required.
          example: true
          type: boolean
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore others Dial commands with the same `command_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        conference_config:
          description: Optional configuration parameters to dial new participant into a conference.
          properties:
            beep_enabled:
              description: Whether a beep sound should be played when the participant joins and/or leaves the conference. Can be used to override the conference-level setting.
              enum:
              - always
              - never
              - on_enter
              - on_exit
              example: on_exit
              type: string
            conference_name:
              description: Conference name to be joined
              example: telnyx-conference
              type: string
            early_media:
              default: true
              description: Controls the moment when dialled call is joined into conference. If set to `true` user will be joined as soon as media is available (ringback). If `false` user will be joined when call is answered. Defaults to `true`
              example: false
              type: boolean
            end_conference_on_exit:
              description: Whether the conference should end and all remaining participants be hung up after the participant leaves the conference. Defaults to "false".
              example: true
              type: boolean
            hold:
              description: Whether the participant should be put on hold immediately after joining the conference. Defaults to "false".
              example: true
              type: boolean
            hold_audio_url:
              description: The URL of a file to be played to the participant when they are put on hold after joining the conference. hold_media_name and hold_audio_url cannot be used together in one request. Takes effect only when "start_conference_on_create" is set to "false". This property takes effect only if "hold" is set to "true".
              example: http://example.com/message.wav
              type: string
            hold_media_name:
              description: The media_name of a file to be played to the participant when they are put on hold after joining the conference. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file. Takes effect only when "start_conference_on_create" is set to "false". This property takes effect only if "hold" is set to "true".
              example: my_media_uploaded_to_media_storage_api
              type: string
            id:
              description: Conference ID to be joined
              example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
              format: uuid
              type: string
            mute:
              description: Whether the participant should be muted immediately after joining the conference. Defaults to "false".
              example: true
              type: boolean
            soft_end_conference_on_exit:
              description: Whether the conference should end after the participant leaves the conference. NOTE this doesn't hang up the other participants. Defaults to "false".
              example: true
              type: boolean
            start_conference_on_create:
              description: Whether the conference should be started on creation. If the conference isn't started all participants that join are automatically put on hold. Defaults to "true".
              example: false
              type: boolean
            start_conference_on_enter:
              description: Whether the conference should be started after the participant joins the conference. Defaults to "false".
              example: true
              type: boolean
            supervisor_role:
              description: Sets the joining participant as a supervisor for the conference. A conference can have multiple supervisors. "barge" means the supervisor enters the conference as a normal participant. This is the same as "none". "monitor" means the supervisor is muted but can hear all participants. "whisper" means that only the specified "whisper_call_control_ids" can hear the supervisor. Defaults to "none".
              enum:
              - barge
              - monitor
              - none
              - whisper
              example: whisper
              type: string
            whisper_call_control_ids:
              description: Array of unique call_control_ids the joining supervisor can whisper to. If none provided, the supervisor will join the conference as a monitoring participant only.
              example:
              - v2:Sg1xxxQ_U3ixxxyXT_VDNI3xxxazZdg6Vxxxs4-GNYxxxVaJPOhFMRQ
              - v2:qqpb0mmvd-ovhhBr0BUQQn0fld5jIboaaX3-De0DkqXHzbf8d75xkw
              items:
                type: string
              type: array
          type: object
        connection_id:
          description: The ID of the Call Control App (formerly ID of the connection) to be used when dialing the destination.
          type: string
        custom_headers:
          description: Custom headers to be added to the SIP INVITE.
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
          type: array
        deepfake_detection:
          description: Enables deepfake detection on the call. When enabled, audio from the remote party is streamed to a detection service that analyzes whether the voice is AI-generated. Results are delivered via the `call.deepfake_detection.result` webhook.
          properties:
            enabled:
              default: false
              description: Whether deepfake detection is enabled.
              type: boolean
            rtp_timeout:
              default: 30
              description: Maximum time in seconds to wait for RTP audio before timing out. If no audio is received within this window, detection stops with an error.
              format: int32
              maximum: 120
              minimum: 5
              type: integer
            timeout:
              default: 15
              description: Maximum time in seconds to wait for a detection result before timing out.
              format: int32
              maximum: 60
              minimum: 5
              type: integer
          required:
          - enabled
          type: object
        dialogflow_config:
          $ref: '#/components/schemas/DialogflowConfig'
        enable_dialogflow:
          default: false
          description: Enables Dialogflow for the current call. The default value is false.
          example: true
          type: boolean
        from:
          description: The `from` number to be used as the caller id presented to the destination (`to` number). The number should be in +E164 format.
          example: '+18005550101'
          type: string
        from_display_name:
          description: The `from_display_name` string to be used as the caller id name (SIP From Display Name) presented to the destination (`to` number). The string should have a maximum of 128 characters, containing only letters, numbers, spaces, and -_~!.+ special characters. If ommited, the display name will be the same as the number in the `from` field.
          example: Company Name
          type: string
        link_to:
          description: Use another call's control id for sharing the same call session id
          example: ilditnZK_eVysupV21KzmzN_sM29ygfauQojpm4BgFtfX5hXAcjotg==
          type: string
        media_encryption:
          default: disabled
          description: 'Defines whether media should be encrypted on the call. For SIP URI destinations, media encryption can also be requested per endpoint with the `secure` URI parameter: `;secure=true` or `;secure=srtp` enables SRTP, and `;secure=dtls` enables DTLS. This parameter, when set to `SRTP` or `DTLS`, takes precedence over the per-endpoint `secure` value.'
          enum:
          - disabled
          - SRTP
          - DTLS
          type: string
        media_name:
          description: The media_name of a file to be played back to the callee when the call is answered. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
          example: my_media_uploaded_to_media_storage_api
          type: string
        park_after_unbridge:
          description: If supplied with the value `self`, the current leg will be parked after unbridge. If not set, the default behavior is to hang up the leg. When park_after_unbridge is set, link_to becomes required.
          example: self
          type: string
        preferred_codecs:
          description: The list of comma-separated codecs in a preferred order for the forked media to be received.
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
          type: string
        prevent_double_bridge:
          default: false
          description: Prevents bridging and hangs up the call if the target is already bridged. Disabled by default.
          example: true
          type: boolean
        privacy:
          description: Indicates the privacy level to be used for the call. When set to `id`, caller ID information (name and number) will be hidden from the called party. When set to `none` or omitted, caller ID will be shown normally.
          enum:
          - id
          - none
          example: id
          type: string
        record:
          description: Start recording automatically after an event. Disabled by default.
          enum:
          - record-from-answer
          example: record-from-answer
          type: string
        record_channels:
          default: dual
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          enum:
          - single
          - dual
          example: single
          type: string
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          example: my_recording_file_name
          maxLength: 40
          minLength: 1
          type: string
        record_format:
          default: mp3
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          enum:
          - wav
          - mp3
          example: wav
          type: string
        record_max_length:
          default: 0
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          example: 1000
          format: int32
          type: integer
        record_timeout_secs:
          default: 0
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          example: 100
          format: int32
          type: integer
        record_track:
          default: both
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          enum:
          - both
          - inbound
          - outbound
          example: outbound
          type: string
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          example: trim-silence
          type: string
        send_silence_when_idle:
          default: false
          description: Generate silence RTP packets when no transmission available.
          example: true
          type: boolean
        sip_auth_password:
          description: SIP Authentication password used for SIP challenges.
          type: string
        sip_auth_username:
          description: SIP Authentication username used for SIP challenges.
          type: string
        sip_headers:
          description: SIP headers to be added to the SIP INVITE request. Currently only User-to-User header is supported.
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
          type: array
        sip_region:
          default: US
          description: Defines the SIP region to be used for the call.
          enum:
          - US
          - Europe
          - Canada
          - Australia
          - Middle East
          example: Canada
          type: string
        sip_transport_protocol:
          default: UDP
          description: Defines SIP transport protocol to be used on the call.
          enum:
          - UDP
          - TCP
          - TLS
          type: string
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        stream_auth_token:
          description: An authentication token to be sent as part of the WebSocket connection when using streaming. Maximum length is 4000 characters.
          example: your-auth-token
          maxLength: 4000
          type: string
        stream_bidirectional_codec:
          $ref: '#/components/schemas/StreamBidirectionalCodec'
        stream_bidirectional_mode:
          $ref: '#/components/schemas/StreamBidirectionalMode'
        stream_bidirectional_sampling_rate:
          $ref: '#/components/schemas/StreamBidirectionalSamplingRate'
        stream_bidirectional_target_legs:
          $ref: '#/components/schemas/StreamBidirectionalTargetLegs'
        stream_codec:
          $ref: '#/components/schemas/StreamCodec'
        stream_establish_before_call_originate:
          default: false
          description: Establish websocket connection before dialing the destination. This is useful for cases where the websocket connection takes a long time to establish.
          example: true
          type: boolean
        stream_track:
          default: inbound_track
          description: Specifies which track should be streamed.
          enum:
          - inbound_track
          - outbound_track
          - both_tracks
          example: both_tracks
          type: string
        stream_url:
          description: The destination WebSocket address where the stream is going to be delivered.
          example: wss://www.example.com/websocket
          type: string
        supervise_call_control_id:
          description: The call leg which will be supervised by the new call.
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
          type: string
        supervisor_role:
          default: barge
          description: The role of the supervisor call. 'barge' means that supervisor call hears and is being heard by both ends of the call (caller & callee). 'whisper' means that only supervised_call_control_id hears supervisor but supervisor can hear everything. 'monitor' means that nobody can hear supervisor call, but supervisor can hear everything on the call.
          enum:
          - barge
          - whisper
          - monitor
          type: string
        time_limit_secs:
          default: 14400
          description: Sets the maximum duration of a Call Control Leg in seconds. If the time limit is reached, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `time_limit` will be sent. For example, by setting a time limit of 120 seconds, a Call Leg will be automatically terminated two minutes after being answered. The default time limit is 14400 seconds or 4 hours and this is also the maximum allowed call length.
          example: 600
          format: int32
          maximum: 14400
          minimum: 30
          type: integer
        timeout_secs:
          default: 30
          description: The number of seconds that Telnyx will wait for the call to be answered by the destination to which it is being called. If the timeout is reached before an answer is received, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `timeout` will be sent. Minimum value is 5 seconds. Maximum value is 600 seconds.
          example: 60
          format: int32
          type: integer
        to:
          description: The DID or SIP URI to dial out to. Multiple DID or SIP URIs can be provided using an array of strings. For SIP URI destinations, append `;secure=true` or `;secure=srtp` to enable SRTP media encryption for that endpoint, or `;secure=dtls` to enable DTLS media encryption for that endpoint. If `media_encryption` is set to `SRTP` or `DTLS`, it takes precedence over any per-endpoint `secure` URI parameter.
          oneOf:
          - example: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
            type: string
          - example:
            - '+18005550100'
            - sip:username@sip.telnyx.com;secure=srtp
            items:
              type: string
            type: array
        transcription:
          default: false
          description: Enable transcription upon call answer. The default value is false.
          example: true
          type: boolean
        transcription_config:
          $ref: '#/components/schemas/TranscriptionStartRequest'
        webhook_retries_policies:
          additionalProperties:
            properties:
              retries_ms:
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
                items:
                  type: integer
                maxItems: 5
                type: array
            type: object
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          example:
            call.hangup:
              retries_ms:
              - 1000
              - 2000
              - 5000
          type: object
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          example: https://www.example.com/server-b/
          type: string
        webhook_url_method:
          default: POST
          description: HTTP request type used for `webhook_url`.
          enum:
          - POST
          - GET
          example: GET
          type: string
        webhook_urls:
          additionalProperties:
            format: uri
            type: string
          description: A map of event types to webhook URLs. When an event of the specified type occurs, the webhook URL associated with that event type will be called instead of the default webhook URL. Events not mapped here will use the default webhook URL.
          example:
            call.bridge: https://www.example.com/webhooks/bridge
            call.hangup: https://www.example.com/webhooks/hangup
          type: object
        webhook_urls_method:
          default: POST
          description: HTTP request method to invoke `webhook_urls`.
          enum:
          - POST
          - GET
          example: POST
          type: string
      required:
      - connection_id
      - to
      - from
      title: Dial Request
      type: object
    GatherUsingAudioRequest:
      example:
        audio_url: http://example.com/message.wav
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        inter_digit_timeout_millis: 10000
        invalid_audio_url: http://example.com/message.wav
        maximum_digits: 10
        minimum_digits: 1
        terminating_digit: '#'
        timeout_millis: 10000
        valid_digits: '123'
      properties:
        audio_url:
          description: The URL of a file to be played back at the beginning of each prompt. The URL can point to either a WAV or MP3 file. media_name and audio_url cannot be used together in one request.
          example: http://example.com/message.wav
          type: string
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        inter_digit_timeout_millis:
          default: 5000
          description: The number of milliseconds to wait for input between digits.
          example: 10000
          format: int32
          type: integer
        invalid_audio_url:
          description: The URL of a file to play when digits don't match the `valid_digits` parameter or the number of digits is not between `min` and `max`. The URL can point to either a WAV or MP3 file. invalid_media_name and invalid_audio_url cannot be used together in one request.
          example: http://example.com/invalid.wav
          type: string
        invalid_media_name:
          description: The media_name of a file to be played back when digits don't match the `valid_digits` parameter or the number of digits is not between `min` and `max`. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
          example: my_media_uploaded_to_media_storage_api
          type: string
        maximum_digits:
          default: 128
          description: The maximum number of digits to fetch. This parameter has a maximum value of 128.
          example: 10
          format: int32
          type: integer
        maximum_tries:
          default: 3
          description: The maximum number of times the file should be played if there is no input from the user on the call.
          example: 3
          format: int32
          type: integer
        media_name:
          description: The media_name of a file to be played back at the beginning of each prompt. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
          example: my_media_uploaded_to_media_storage_api
          type: string
        minimum_digits:
          default: 1
          description: The minimum number of digits to fetch. This parameter has a minimum value of 1.
          example: 1
          format: int32
          type: integer
        terminating_digit:
          default: '#'
          description: The digit used to terminate input if fewer than `maximum_digits` digits have been gathered.
          example: '#'
          type: string
        timeout_millis:
          default: 60000
          description: The number of milliseconds to wait for a DTMF response after file playback ends before a replaying the sound file.
          example: 60000
          format: int32
          type: integer
        valid_digits:
          default: 0123456789#*
          description: A list of all digits accepted as valid.
          example: '123'
          type: string
      title: Gather Using Audio Request
      type: object
    AzureTranscriptionRegion:
      description: Azure region to use for speech recognition
      enum:
      - australiaeast
      - centralindia
      - eastus
      - northcentralus
      - westeurope
      - westus2
      example: eastus
      title: Azure transcription engine list of regions
      type: string
    RimeVoiceSettings:
      properties:
        type:
          description: Voice settings provider type
          enum:
          - rime
          type: string
        voice_speed:
          default: 1.0
          description: Speech speed multiplier. Default is 1.0.
          example: 1.0
          format: float
          type: number
      required:
      - type
      title: Rime Voice Settings
      type: object
    CallControlRetrievalTool:
      properties:
        retrieval:
          $ref: '#/components/schemas/CallControlBucketIds'
        type:
          enum:
          - retrieval
          type: string
      required:
      - type
      - retrieval
      title: RetrievalTool
      type: object
    CallWithRecordingId:
      example:
        call_control_id: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        call_duration: 50
        call_leg_id: 2dc6fc34-f9e0-11ea-b68e-02420a0f7768
        call_session_id: 2dc1b3c8-f9e0-11ea-bc5a-02420a0f7768
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        end_time: '2019-01-23T18:11:52.574Z'
        is_alive: false
        record_type: call
        recording_id: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
        start_time: '2019-01-23T18:10:02.574Z'
      properties:
        call_control_id:
          description: Unique identifier and token for controlling the call.
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
          type: string
        call_duration:
          description: Indicates the duration of the call in seconds
          example: 50
          type: integer
        call_leg_id:
          description: ID that is unique to the call and can be used to correlate webhook events
          example: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
          type: string
        call_session_id:
          description: ID that is unique to the call session and can be used to correlate webhook events. Call session is a group of related call legs that logically belong to the same phone call, e.g. an inbound and outbound leg of a transferred call
          example: 428c31b6-7af4-4bcb-b68e-5013ef9657c1
          type: string
        client_state:
          description: State received from a command.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        end_time:
          description: ISO 8601 formatted date indicating when the call ended. Only present when the call is not alive
          example: '2019-01-23T18:11:52.574Z'
          type: string
        is_alive:
          description: Indicates whether the call is alive or not. For Dial command it will always be `false` (dialing is asynchronous).
          example: true
          type: boolean
        record_type:
          enum:
          - call
          example: call
          type: string
        recording_id:
          description: The ID of the recording. Only present when the record parameter is set to record-from-answer.
          example: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
          format: uuid
          type: string
        start_time:
          description: ISO 8601 formatted date indicating when the call started
          example: '2019-01-23T18:10:02.574Z'
          type: string
      required:
      - call_control_id
      - call_leg_id
      - call_session_id
      - is_alive
      - record_type
      title: Call With Recording ID
      type: object
    TranscriptionEngineDeepgramConfig:
      discriminator:
        mapping:
          deepgram/nova-2: '#/components/schemas/DeepgramNova2Config'
          deepgram/nova-3: '#/components/schemas/DeepgramNova3Config'
        propertyName: transcription_model
      oneOf:
      - $ref: '#/components/schemas/DeepgramNova2Config'
      - $ref: '#/components/schemas/DeepgramNova3Config'
    AIAssistantAddMessagesRequest:
      example:
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        messages:
        - content: Get the user's favorite color
          role: system
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        messages:
          description: The messages to add to the conversation.
          items:
            discriminator:
              mapping:
                assistant: '#/components/schemas/AssistantMessage'
                developer: '#/components/schemas/DeveloperMessage'
                system: '#/components/schemas/SystemMessage'
                tool: '#/components/schemas/ToolMessage'
                user: '#/components/schemas/UserMessage'
              propertyName: role
            oneOf:
            - $ref: '#/components/schemas/UserMessage'
            - $ref: '#/components/schemas/AssistantMessage'
            - $ref: '#/components/schemas/ToolMessage'
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/DeveloperMessage'
          type: array
      title: AI Assistant Add Messages Request
      type: object
    StreamBidirectionalCodec:
      default: PCMU
      description: Indicates codec for bidirectional streaming RTP payloads. Used only with stream_bidirectional_mode=rtp. Case sensitive.
      enum:
      - PCMU
      - PCMA
      - G722
      - OPUS
      - AMR-WB
      - L16
      example: G722
      title: Bidirectional Stream Codec
      type: string
    TranscriptionEngineAConfig:
      properties:
        enable_speaker_diarization:
          default: false
          description: Enables speaker diarization.
          example: true
          type: boolean
        hints:
          default: []
          description: Hints to improve transcription accuracy.
          example:
          - Telnyx
          items:
            type: string
          type: array
        interim_results:
          default: false
          description: Whether to send also interim results. If set to false, only final results will be sent.
          example: true
          type: boolean
        language:
          $ref: '#/components/schemas/GoogleTranscriptionLanguage'
        max_speaker_count:
          default: 6
          description: Defines maximum number of speakers in the conversation.
          example: 4
          format: int32
          type: integer
        min_speaker_count:
          default: 2
          description: Defines minimum number of speakers in the conversation.
          example: 4
          format: int32
          type: integer
        model:
          description: The model to use for transcription.
          enum:
          - latest_long
          - latest_short
          - command_and_search
          - phone_call
          - video
          - default
          - medical_conversation
          - medical_dictation
          type: string
        profanity_filter:
          default: false
          description: Enables profanity_filter.
          example: true
          type: boolean
        speech_context:
          description: Speech context to improve transcription accuracy.
          items:
            properties:
              boost:
                default: 1.0
                description: Boost factor for the speech context.
                example: 1.0
                maximum: 20.0
                minimum: 0.0
                type: number
              phrases:
                default: []
                example:
                - Telnyx
                items:
                  type: string
                type: array
            type: object
          type: array
        transcription_engine:
          description: Engine identifier for Google transcription service
          enum:
          - A
          type: string
        use_enhanced:
          default: false
          description: Enables enhanced transcription, this works for models `phone_call` and `video`.
          example: true
          type: boolean
      title: Transcription engine A config
      type: object
    TransferCallRequest:
      example:
        answering_machine_detection: detect
        answering_machine_detection_config:
          after_greeting_silence_millis: 1000
          between_words_silence_millis: 1000
          greeting_duration_millis: 1000
          greeting_silence_duration_millis: 2000
          greeting_total_analysis_time_millis: 50000
          initial_silence_millis: 1000
          maximum_number_of_words: 1000
          maximum_word_length_millis: 2000
          silence_threshold: 512
          total_analysis_time_millis: 5000
        audio_url: http://www.example.com/sounds/greeting.wav
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        custom_headers:
        - name: head_1
          value: val_1
        - name: head_2
          value: val_2
        early_media: true
        from: '+18005550101'
        from_display_name: Company Name
        media_encryption: SRTP
        sip_auth_password: password
        sip_auth_username: username
        sip_headers:
        - name: User-to-User
          value: value
        sip_transport_protocol: TLS
        time_limit_secs: 60
        timeout_secs: 60
        to: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
        webhook_url: https://www.example.com/server-b/
        webhook_url_method: POST
      properties:
        answering_machine_detection:
          default: disabled
          description: Enables Answering Machine Detection. When a call is answered, Telnyx runs real-time detection to determine if it was picked up by a human or a machine and sends an `call.machine.detection.ended` webhook with the analysis result. If 'greeting_end' or 'detect_words' is used and a 'machine' is detected, you will receive another 'call.machine.greeting.ended' webhook when the answering machine greeting ends with a beep or silence. If `detect_beep` is used, you will only receive 'call.machine.greeting.ended' if a beep is detected.
          enum:
          - premium
          - detect
          - detect_beep
          - detect_words
          - greeting_end
          - disabled
          type: string
        answering_machine_detection_config:
          description: Optional configuration parameters to modify 'answering_machine_detection' performance. Only `total_analysis_time_millis` and `greeting_duration_millis` parameters are applicable when `premium` is selected as answering_machine_detection.
          properties:
            after_greeting_silence_millis:
              default: 800
              description: Silence duration threshold after a greeting message or voice for it be considered human.
              example: 1000
              format: int32
              type: integer
            between_words_silence_millis:
              default: 50
              description: Maximum threshold for silence between words.
              example: 100
              format: int32
              type: integer
            greeting_duration_millis:
              default: 3500
              description: Maximum threshold of a human greeting. If greeting longer than this value, considered machine.
              example: 1500
              format: int32
              type: integer
            greeting_silence_duration_millis:
              default: 1500
              description: If machine already detected, maximum threshold for silence between words. If exceeded, the greeting is considered ended.
              example: 2000
              format: int32
              type: integer
            greeting_total_analysis_time_millis:
              default: 5000
              description: If machine already detected, maximum timeout threshold to determine the end of the machine greeting.
              example: 7500
              format: int32
              type: integer
            initial_silence_millis:
              default: 3500
              description: If initial silence duration is greater than this value, consider it a machine.
              example: 1800
              format: int32
              type: integer
            maximum_number_of_words:
              default: 5
              description: If number of detected words is greater than this value, consder it a machine.
              example: 3
              format: int32
              type: integer
            maximum_word_length_millis:
              default: 3500
              description: If a single word lasts longer than this threshold, consider it a machine.
              example: 2000
              format: int32
              type: integer
            silence_threshold:
              default: 256
              description: Minimum noise threshold for any analysis.
              example: 512
              format: int32
              type: integer
            total_analysis_time_millis:
              default: 3500
              description: Maximum timeout threshold for overall detection.
              example: 5000
              format: int32
              type: integer
          type: object
        audio_url:
          description: The URL of a file to be played back when the transfer destination answers before bridging the call. The URL can point to either a WAV or MP3 file. media_name and audio_url cannot be used together in one request.
          example: http://example.com/message.wav
          type: string
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        custom_headers:
          description: Custom headers to be added to the SIP INVITE.
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
          type: array
        early_media:
          default: true
          description: If set to false, early media will not be passed to the originating leg.
          example: false
          type: boolean
        from:
          description: The `from` number to be used as the caller id presented to the destination (`to` number). The number should be in +E164 format. This attribute will default to the `to` number of the original call if omitted.
          example: '+18005550101'
          type: string
        from_display_name:
          description: The `from_display_name` string to be used as the caller id name (SIP From Display Name) presented to the destination (`to` number). The string should have a maximum of 128 characters, containing only letters, numbers, spaces, and -_~!.+ special characters. If ommited, the display name will be the same as the number in the `from` field.
          example: Company Name
          type: string
        media_encryption:
          default: disabled
          description: 'Defines whether media should be encrypted on the new call leg. For SIP URI destinations, media encryption can also be requested per endpoint with the `secure` URI parameter: `;secure=true` or `;secure=srtp` enables SRTP, and `;secure=dtls` enables DTLS. This parameter, when set to `SRTP` or `DTLS`, takes precedence over the per-endpoint `secure` value.'
          enum:
          - disabled
          - SRTP
          - DTLS
          type: string
        media_name:
          description: The media_name of a file to be played back when the transfer destination answers before bridging the call. The media_name must point to a file previously uploaded to api.telnyx.com/v2/media by the same user/organization. The file must either be a WAV or MP3 file.
          example: my_media_uploaded_to_media_storage_api
          type: string
        mute_dtmf:
          default: none
          description: When enabled, DTMF tones are not passed to the call participant. The webhooks containing the DTMF information will be sent.
          enum:
          - none
          - both
          - self
          - opposite
          example: opposite
          type: string
        park_after_unbridge:
          description: Specifies behavior after the bridge ends (i.e. the opposite leg either hangs up or is transferred). If supplied with the value `self`, the current leg will be parked after unbridge. If not set, the default behavior is to hang up the leg.
          example: self
          type: string
        preferred_codecs:
          description: The list of comma-separated codecs in order of preference to be used during the call. The codecs supported are `G722`, `PCMU`, `PCMA`, `G729`, `OPUS`, `VP8`, `H264`, `AMR-WB`.
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
          type: string
        privacy:
          description: Indicates the privacy level to be used for the call. When set to `id`, caller ID information (name and number) will be hidden from the called party. When set to `none` or omitted, caller ID will be shown normally.
          enum:
          - id
          - none
          example: id
          type: string
        record:
          description: Start recording automatically after an event. Disabled by default.
          enum:
          - record-from-answer
          example: record-from-answer
          type: string
        record_channels:
          default: dual
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          enum:
          - single
          - dual
          example: single
          type: string
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          example: my_recording_file_name
          maxLength: 40
          minLength: 1
          type: string
        record_format:
          default: mp3
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          enum:
          - wav
          - mp3
          example: wav
          type: string
        record_max_length:
          default: 0
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          example: 1000
          format: int32
          type: integer
        record_timeout_secs:
          default: 0
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          example: 100
          format: int32
          type: integer
        record_track:
          default: both
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          enum:
          - both
          - inbound
          - outbound
          example: outbound
          type: string
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          example: trim-silence
          type: string
        sip_auth_password:
          description: SIP Authentication password used for SIP challenges.
          example: password
          type: string
        sip_auth_username:
          description: SIP Authentication username used for SIP challenges.
          example: username
          type: string
        sip_headers:
          description: SIP headers to be added to the SIP INVITE. Currently only User-to-User header is supported.
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
          type: array
        sip_region:
          default: US
          description: Defines the SIP region to be used for the call.
          enum:
          - US
          - Europe
          - Canada
          - Australia
          - Middle East
          example: Canada
          type: string
        sip_transport_protocol:
          default: UDP
          description: Defines SIP transport protocol to be used on the call.
          enum:
          - UDP
          - TCP
          - TLS
          type: string
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        target_leg_client_state:
          description: Use this field to add state to every subsequent webhook for the new leg. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        time_limit_secs:
          default: 14400
          description: Sets the maximum duration of a Call Control Leg in seconds. If the time limit is reached, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `time_limit` will be sent. For example, by setting a time limit of 120 seconds, a Call Leg will be automatically terminated two minutes after being answered. The default time limit is 14400 seconds or 4 hours and this is also the maximum allowed call length.
          example: 600
          format: int32
          maximum: 14400
          minimum: 30
          type: integer
        timeout_secs:
          default: 30
          description: The number of seconds that Telnyx will wait for the call to be answered by the destination to which it is being transferred. If the timeout is reached before an answer is received, the call will hangup and a `call.hangup` webhook with a `hangup_cause` of `timeout` will be sent. Minimum value is 5 seconds. Maximum value is 600 seconds.
          example: 60
          format: int32
          type: integer
        to:
          description: The DID or SIP URI to dial out to. For SIP URI destinations, append `;secure=true` or `;secure=srtp` to enable SRTP media encryption for that endpoint, or `;secure=dtls` to enable DTLS media encryption for that endpoint. If `media_encryption` is set to `SRTP` or `DTLS`, it takes precedence over any per-endpoint `secure` URI parameter.
          example: +18005550100 or sip:username@sip.telnyx.com;secure=srtp
          type: string
        webhook_retries_policies:
          additionalProperties:
            properties:
              retries_ms:
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
                items:
                  type: integer
                maxItems: 5
                type: array
            type: object
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          example:
            call.answered:
              retries_ms:
              - 1000
              - 2000
              - 5000
          type: object
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          example: https://www.example.com/server-b/
          type: string
        webhook_url_method:
          default: POST
          description: HTTP request type used for `webhook_url`.
          enum:
          - POST
          - GET
          example: GET
          type: string
        webhook_urls:
          additionalProperties:
            format: uri
            type: string
          description: A map of event types to webhook URLs. When an event of the specified type occurs, the webhook URL associated with that event type will be called instead of `webhook_url`. Events not mapped here will use the default `webhook_url`.
          example:
            call.answered: https://www.example.com/webhooks/answered
            call.hangup: https://www.example.com/webhooks/hangup
          type: object
        webhook_urls_method:
          default: POST
          description: HTTP request method to invoke `webhook_urls`.
          enum:
          - POST
          - GET
          example: POST
          type: string
      required:
      - to
      title: Transfer Call Request
      type: object
    StopGatherRequest:
      example:
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
      title: Stop Gather Request
      type: object
    TransferTool:
      properties:
        transfer:
          $ref: '#/components/schemas/CallControlTransferToolParams'
        type:
          enum:
          - transfer
          type: string
      required:
      - type
      - transfer
      title: TransferTool
      type: object
    StartForkingRequest:
      example:
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        rx: udp:192.0.2.1:9000
        tx: udp:192.0.2.1:9001
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        rx:
          description: The network target, <udp:ip_address:port>, where the call's incoming RTP media packets should be forwarded.
          example: udp:192.0.2.1:9000
          type: string
        stream_type:
          default: decrypted
          description: Optionally specify a media type to stream. If `decrypted` selected, Telnyx will decrypt incoming SIP media before forking to the target. `rx` and `tx` are required fields if `decrypted` selected.
          enum:
          - decrypted
          example: decrypted
          type: string
        tx:
          description: The network target, <udp:ip_address:port>, where the call's outgoing RTP media packets should be forwarded.
          example: udp:192.0.2.1:9001
          type: string
      title: Start Forking Request
      type: object
    StreamBidirectionalTargetLegs:
      default: opposite
      description: Specifies which call legs should receive the bidirectional stream audio.
      enum:
      - both
      - self
      - opposite
      example: both
      title: Bidirectional Stream Target Legs
      type: string
    TranscriptionEngineXaiConfig:
      properties:
        interim_results:
          default: false
          description: Whether to send also interim results. If set to false, only final results will be sent.
          example: true
          type: boolean
        language:
          $ref: '#/components/schemas/XaiTranscriptionLanguage'
        transcription_engine:
          description: Engine identifier for xAI transcription service
          enum:
          - xAI
          type: string
        transcription_model:
          default: xai/grok-stt
          description: The model to use for transcription.
          enum:
          - xai/grok-stt
          type: string
      title: Transcription engine xAI config
      type: object
    SystemMessage:
      description: Developer-provided instructions that the model should follow, regardless of messages sent by the user.
      example:
        content: Get the user's favorite color
        role: system
      properties:
        content:
          description: The contents of the system message.
          type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        role:
          description: The role of the messages author, in this case `system`.
          enum:
          - system
          type: string
      required:
      - role
      - content
      title: System Message
      type: object
    SoundModifications:
      description: Use this field to modify sound effects, for example adjust the pitch.
      example:
        octaves: 0.1
        pitch: 0.8
        semitone: -2
        track: both
      properties:
        octaves:
          description: Adjust the pitch in octaves, values should be between -1 and 1, default 0
          example: -0.5
          format: float
          type: number
        pitch:
          description: Set the pitch directly, value should be > 0, default 1 (lower = lower tone)
          example: 0.8
          format: float
          type: number
        semitone:
          description: Adjust the pitch in semitones, values should be between -14 and 14, default 0
          example: -10
          format: float
          type: number
        track:
          default: outbound
          description: The track to which the sound modifications will be applied. Accepted values are `inbound` or `outbound`
          example: inbound
          type: string
      title: Sound modifications
      type: object
    SwitchSupervisorRoleRequest:
      example:
        role: barge
      properties:
        role:
          description: The supervisor role to switch to. 'barge' allows speaking to both parties, 'whisper' allows speaking to caller only, 'monitor' allows listening only.
          enum:
          - barge
          - whisper
          - monitor
          example: barge
          type: string
      required:
      - role
      title: Switch Supervisor Role Request
      type: object
    StreamBidirectionalSamplingRate:
      default: 8000
      description: Audio sampling rate.
      enum:
      - 8000
      - 16000
      - 22050
      - 24000
      - 48000
      example: 16000
      title: Bidirectional Stream Sampling Rate
      type: integer
    TranscriptionEngineSonioxConfig:
      type: object
      title: Transcription engine Soniox config
      required:
      - transcription_engine
      properties:
        transcription_engine:
          type: string
          enum:
          - Soniox
          description: Engine identifier for Soniox transcription service
        transcription_model:
          description: The model to use for transcription.
          type: string
          enum:
          - soniox/stt-rt-v4
          default: soniox/stt-rt-v4
        language:
          type: string
          description: ISO 639-1 language hint (e.g. `en`, `es`), or `auto` to omit the hint and let Soniox auto-detect supported languages multilingually.
          default: auto
          example: auto
        interim_results:
          type: boolean
          description: Whether to send also interim results. If set to false, only final results will be sent.
          default: false
          example: true
        enable_endpoint_detection:
          type: boolean
          description: When true, Soniox emits end-of-utterance events at the cadence configured by `max_endpoint_delay_ms`.
          default: false
          example: false
        max_endpoint_delay_ms:
          type: integer
          minimum: 500
          maximum: 3000
          description: 'Maximum silence (in milliseconds) before Soniox emits an end-of-utterance event. Only honored when `enable_endpoint_detection` is true. Range: 500-3000 ms.'
          example: 1000
    CallControlCommandResultWithConversationRelayId:
      type: object
      title: Call Control Command Result With Conversation Relay ID
      example:
        result: ok
        conversation_relay_id: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
      properties:
        result:
          type: string
          example: ok
        conversation_relay_id:
          type: string
          example: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
          description: The ID of the Conversation Relay session created by the command.
    TranscriptionEngineSpeechmaticsConfig:
      type: object
      title: Transcription engine Speechmatics config
      properties:
        transcription_engine:
          type: string
          enum:
          - Speechmatics
          description: Engine identifier for Speechmatics transcription service
        language:
          $ref: '#/components/schemas/SpeechmaticsTranscriptionLanguage'
        transcription_model:
          description: The model to use for transcription.
          type: string
          enum:
          - speechmatics/standard
          default: speechmatics/standard
        interim_results:
          type: boolean
          description: Whether to send also interim results. If set to false, only final results will be sent.
          default: false
          example: true
    TranscriptionEngineReson8Config:
      type: object
      title: Transcription engine Reson8 config
      properties:
        transcription_engine:
          type: string
          enum:
          - Reson8
          description: Engine identifier for Reson8 transcription service
        transcription_model:
          description: The model to use for transcription.
          type: string
          enum:
          - reson8/turns
          default: reson8/turns
        language:
          type: string
          description: The language of the audio to be transcribed. `auto` (the default, also applied when `language` is omitted) enables automatic language detection.
          enum:
          - auto
          - nl
          - en
          - fr
          - fy
          - de
          - it
          - pl
          - pt
          - es
          - sv
          default: auto
          example: auto
    PayPromptValue:
      title: Pay Prompt Value
      description: A default prompt string or an ordered list of qualified prompts.
      oneOf:
      - type: string
        minLength: 1
      - type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/PayPrompt'
    AIAssistantStartRequest_2:
      type: object
      properties:
        assistant:
          $ref: '#/components/schemas/CallAssistantRequest_2'
        greeting:
          description: Text that will be played when the assistant starts, if none then nothing will be played when the assistant starts. The greeting can be text for any voice or SSML for `AWS.Polly.<voice_id>` voices. There is a 3,000 character limit.
          type: string
          example: Hello, can you tell me your age and where you live?
        interruption_settings:
          $ref: '#/components/schemas/InterruptionSettings'
        transcription:
          $ref: '#/components/schemas/TranscriptionConfig_2'
        message_history:
          type: array
          description: A list of messages to seed the conversation history before the assistant starts. Follows the same message format as the `ai_assistant_add_messages` command.
          items:
            oneOf:
            - $ref: '#/components/schemas/UserMessage'
            - $ref: '#/components/schemas/AssistantMessage'
            - $ref: '#/components/schemas/ToolMessage'
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/DeveloperMessage'
            discriminator:
              propertyName: role
              mapping:
                user: '#/components/schemas/UserMessage'
                assistant: '#/components/schemas/AssistantMessage'
                tool: '#/components/schemas/ToolMessage'
                system: '#/components/schemas/SystemMessage'
                developer: '#/components/schemas/DeveloperMessage'
          default: []
        send_message_history_updates:
          type: boolean
          description: When `true`, a `call.ai_gather.message_history_updated` webhook carrying the full message history is sent each time the conversation message history is updated. The assistant's own `telephony_settings.send_message_history_updates` overrides this value when it is set.
          default: false
        participants:
          type: array
          description: A list of participants to add to the conversation when it starts.
          items:
            $ref: '#/components/schemas/AIAssistantJoinParticipant'
          default: []
        client_state:
          type: string
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
    ConversationRelayInterruptible:
      type: string
      description: Controls when caller input can interrupt assistant speech. `any` allows speech or DTMF interruptions; `none` disables interruptions; `speech` allows speech only; `dtmf` allows DTMF only.
      enum:
      - none
      - any
      - speech
      - dtmf
      default: any
      example: speech
    ConversationRelayStartRequest:
      type: object
      title: Conversation Relay Start Request
      description: Start a Conversation Relay session. You may provide the WebSocket URL as `url`, `conversation_relay_url`, or `conversation_relay_settings.url`; top-level values take precedence over nested settings. Use `transcription_engine` and `transcription_engine_config` for speech-to-text configuration; the `transcription` object is not supported.
      properties:
        conversation_relay_settings:
          $ref: '#/components/schemas/ConversationRelaySettings'
        url:
          type: string
          pattern: ^wss?://
          description: Public alias for `conversation_relay_url`. Must start with `ws://` or `wss://`. If both are present, this value wins.
          example: wss://example.com/conversation-relay
        dtmf_detection:
          type: boolean
          description: Public alias for `conversation_relay_dtmf_detection`. If both are present, this value wins.
          default: false
          example: true
        conversation_relay_url:
          type: string
          pattern: ^wss?://
          description: WebSocket URL for your Conversation Relay server. Must start with `ws://` or `wss://`.
          example: wss://example.com/conversation-relay
        conversation_relay_dtmf_detection:
          type: boolean
          description: Enable DTMF detection for the relay session.
          default: false
          example: true
        voice:
          $ref: '#/components/schemas/VoiceConfig_2'
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings_2'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        greeting:
          type: string
          description: Text played when the relay session starts.
          example: Hi! Ask me anything!
        language:
          type: string
          description: Default language for the relay session. This value is used for both text-to-speech and speech recognition.
          default: en
          example: en-US
        languages:
          type: array
          description: Per-language TTS and transcription settings.
          items:
            $ref: '#/components/schemas/ConversationRelayLanguage'
        interruption_settings:
          $ref: '#/components/schemas/ConversationRelayInterruptionSettings'
        transcription:
          type: object
          deprecated: true
          description: Not supported for Conversation Relay start requests. Use `transcription_engine` and `transcription_engine_config` instead.
          additionalProperties: true
        assistant:
          $ref: '#/components/schemas/ConversationRelayAssistant'
        client_state:
          type: string
          description: Use this field to add state to subsequent webhooks. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        tts_provider:
          type: string
          description: Text-to-speech provider. If omitted, Telnyx derives it from `voice` or `provider`.
          example: telnyx
        provider:
          type: string
          description: Structured voice provider. Must be supplied together with `structured_provider`.
          example: elevenlabs
        structured_provider:
          $ref: '#/components/schemas/ConversationRelayStructuredProvider'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. For Conversation Relay, use this field with `transcription_engine_config`; the `transcription` object is not supported.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig'
        interruptible:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruptible_greeting:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        custom_parameters:
          type: object
          description: Custom key-value parameters forwarded to the relay session as `assistant.dynamic_variables`. If `assistant.dynamic_variables` is also present, these values are merged in.
          additionalProperties: true
          example:
            customer_id: '12345'
      example:
        url: wss://example.com/conversation-relay
        dtmf_detection: true
        interruptible: speech
        interruptible_greeting: dtmf
        greeting: Hi! Ask me anything!
        voice: Telnyx.KokoroTTS.af
        tts_provider: telnyx
        voice_settings:
          type: telnyx
        language: en-US
        languages:
        - language: en-US
          tts_provider: telnyx
          voice: Telnyx.KokoroTTS.af
          transcription_engine: Deepgram
          transcription_engine_config:
            transcription_model: deepgram/nova-3
        custom_parameters:
          customer_id: '12345'
      anyOf:
      - required:
        - url
      - required:
        - conversation_relay_url
      - required:
        - conversation_relay_settings
    ConversationRelayEmbeddedConfig:
      type: object
      title: Conversation Relay Embedded Config
      description: Starts a Conversation Relay session automatically when the answered/dialed call is answered. This embedded shape is supported on `answer` and `dial`. It uses public field names (`url`, `dtmf_detection`, `greeting`, `voice`, `language`, etc.) and maps them to the underlying Conversation Relay action. `client_state`, `tts_language`, and `transcription_language` inside this object are ignored; use the parent command's `client_state` and `command_id` fields instead.
      properties:
        url:
          type: string
          pattern: ^wss?://
          description: WebSocket URL for your Conversation Relay server. Must start with `ws://` or `wss://`.
          example: wss://example.com/conversation-relay
        dtmf_detection:
          type: boolean
          description: Enable DTMF detection for the relay session.
          default: false
          example: true
        greeting:
          type: string
          description: Text played when the relay session starts.
          example: Hi! Ask me anything!
        voice:
          $ref: '#/components/schemas/VoiceConfig_2'
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings_2'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        tts_provider:
          type: string
          description: Text-to-speech provider. If omitted, Telnyx derives it from `voice` or `provider`.
          example: telnyx
        provider:
          type: string
          description: Structured voice provider. Must be supplied together with `structured_provider`.
          example: elevenlabs
        structured_provider:
          $ref: '#/components/schemas/ConversationRelayStructuredProvider'
        language:
          type: string
          description: Default language for both text-to-speech and speech recognition.
          default: en
          example: en-US
        languages:
          type: array
          description: Per-language TTS and transcription settings.
          items:
            $ref: '#/components/schemas/ConversationRelayLanguage'
        interruptible:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruptible_greeting:
          $ref: '#/components/schemas/ConversationRelayInterruptible'
        interruption_settings:
          $ref: '#/components/schemas/ConversationRelayInterruptionSettings'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. For Conversation Relay, use this field with `transcription_engine_config`; the `transcription` object is not supported.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig'
        custom_parameters:
          type: object
          description: Custom key-value parameters forwarded to the relay session as assistant dynamic variables.
          additionalProperties: true
          example:
            customer_id: '12345'
      required:
      - url
      example:
        url: wss://example.com/conversation-relay
        dtmf_detection: true
        greeting: Hi! Ask me anything!
        voice: Telnyx.KokoroTTS.af
        tts_provider: telnyx
        voice_settings:
          type: telnyx
        language: en-US
        languages:
        - language: en-US
          voice: Telnyx.Ultra.alloy
          tts_provider: telnyx
          transcription_engine: Deepgram
          transcription_engine_config:
            transcription_model: deepgram/nova-3
        interruptible: speech
        interruptible_greeting: dtmf
        custom_parameters:
          customer_id: '12345'
    GatherUsingAIRequest_2:
      type: object
      title: Gather Using AI Request
      required:
      - parameters
      properties:
        parameters:
          description: The parameters described as a JSON Schema object that needs to be gathered by the voice assistant. See the [JSON Schema reference](https://json-schema.org/understanding-json-schema) for documentation about the format
          type: object
          example:
            properties:
              age:
                description: The age of the customer.
                type: integer
              location:
                description: The location of the customer.
                type: string
            required:
            - age
            - location
            type: object
        assistant:
          $ref: '#/components/schemas/Assistant'
        transcription:
          $ref: '#/components/schemas/TranscriptionConfig_2'
        language:
          oneOf:
          - $ref: '#/components/schemas/GoogleTranscriptionLanguage'
        voice:
          $ref: '#/components/schemas/VoiceConfig_2'
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        greeting:
          description: Text that will be played when the gathering starts, if none then nothing will be played when the gathering starts. The greeting can be text for any voice or SSML for `AWS.Polly.<voice_id>` voices. There is a 3,000 character limit.
          type: string
          example: Hello, can you tell me your age and where you live?
        send_partial_results:
          description: Default is `false`. If set to `true`, the voice assistant will send partial results via the `call.ai_gather.partial_results` callback in real time as individual fields are gathered. If set to `false`, the voice assistant will only send the final result via the `call.ai_gather.ended` callback.
          type: boolean
          example: false
        send_message_history_updates:
          description: Default is `false`. If set to `true`, the voice assistant will send updates to the message history via the `call.ai_gather.message_history_updated` callback in real time as the message history is updated.
          type: boolean
          example: false
        message_history:
          description: The message history you want the voice assistant to be aware of, this can be useful to keep the context of the conversation, or to pass additional information to the voice assistant.
          type: array
          items:
            type: object
            properties:
              content:
                type: string
                example: Hello, I'm 29 and I live in Paris.
                description: The content of the message
              role:
                type: string
                enum:
                - assistant
                - user
                example: user
                description: The role of the message sender
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        interruption_settings:
          $ref: '#/components/schemas/InterruptionSettings'
        user_response_timeout_ms:
          description: The maximum time in milliseconds to wait for user response before timing out.
          type: integer
          default: 10000
          example: 15000
        gather_ended_speech:
          description: Text that will be played when the gathering has finished. There is a 3,000 character limit.
          type: string
          maxLength: 3000
          example: Thank you for providing the information.
      example:
        parameters:
          properties:
            age:
              description: The age of the customer.
              type: integer
            location:
              description: The location of the customer.
              type: string
          required:
          - age
          - location
          type: object
        voice: Telnyx.KokoroTTS.af
        greeting: Hello, can you tell me your age and where you live?
        send_partial_results: true
        send_message_history_updates: true
        message_history:
        - content: Hello, what's your name?
          role: assistant
        - content: Hello, I'm John.
          role: user
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        user_response_timeout_ms: 5000
    TranscriptionEngineCohereConfig:
      type: object
      title: Transcription engine Cohere config
      properties:
        transcription_engine:
          type: string
          enum:
          - Cohere
          description: Engine identifier for Cohere transcription service
        transcription_model:
          description: The model to use for transcription.
          type: string
          enum:
          - cohere/ar-stt
          default: cohere/ar-stt
        language:
          type: string
          description: The language of the audio to be transcribed. Unlike other self-hosted models, Cohere does not auto-detect the language; `auto` is not supported.
          enum:
          - ar
          - en
          default: ar
          example: ar
    PayRequest:
      type: object
      title: Pay Request
      properties:
        connector_name:
          type: string
          default: Default
          description: Name of the Pay connector used to process the transaction.
          example: Default
        amount:
          type: number
          minimum: 0
          description: Amount to charge. Required when `transaction_type` is `charge`.
          example: 10.5
        currency:
          type: string
          default: USD
          enum:
          - USD
          - usd
          description: Currency used for the transaction. Pay currently supports USD only.
          example: USD
        payment_token:
          type: string
          description: Existing payment token. When supplied, payment-detail collection is skipped.
          example: tok_abc123
        payment_method:
          type: string
          default: credit-card
          enum:
          - credit-card
          - ach-debit
          description: Payment method to collect.
        valid_card_types:
          type: array
          items:
            type: string
            enum:
            - visa
            - mastercard
            - amex
            - maestro
            - discover
            - optima
            - jcb
            - diners-club
            - enroute
          minItems: 1
          description: Restricts accepted card numbers to the listed card types. When the caller enters a card number that does not match one of the listed types, Pay treats the input as invalid and re-prompts for the card number. Cannot be used together with `payment_token`.
          example:
          - visa
          - mastercard
        transaction_type:
          type: string
          enum:
          - charge
          - tokenize
          description: Transaction to perform. If omitted, Pay infers `tokenize` when `amount` is absent or zero and `charge` when `amount` is positive.
        description:
          type: string
          description: Optional description forwarded with the payment transaction.
          example: Order 12345
        client_state:
          type: string
          description: Base64-encoded state included in subsequent webhooks.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        metadata:
          type: object
          description: Metadata forwarded to the Pay connector.
          additionalProperties: true
          example:
            order_id: ORD-12345
        parameters:
          type: object
          description: Additional parameters forwarded to the Pay connector.
          additionalProperties: true
          example:
            customer_id: CUST-67890
        prompts:
          $ref: '#/components/schemas/PayPrompts'
        max_attempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          default: 3
          description: Maximum number of attempts for each payment collection step.
        timeout_millis:
          type: integer
          format: int32
          minimum: 1
          maximum: 600000
          default: 5000
          description: Time in milliseconds to wait for DTMF input for each collection step.
        inter_digit_timeout_millis:
          type: integer
          format: int32
          minimum: 1
          maximum: 600000
          default: 5000
          description: Time in milliseconds to wait between consecutive DTMF digits.
        voice:
          type: string
          default: female
          description: Voice used for payment prompts. Accepts `male`, `female`, or a provider voice in `<Provider>.<Model>.<VoiceId>` format, for example `AWS.Polly.Joanna` or `Telnyx.KokoroTTS.af`.
          example: female
        language:
          type: string
          default: en-US
          description: Language used for payment prompts.
          example: en-US
        service_level:
          type: string
          default: premium
          description: Speech synthesis service level used for payment prompts. Pay defaults to `premium`.
        command_id:
          type: string
          description: Idempotency key for the command. Telnyx ignores a duplicate command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
      example:
        connector_name: Default
        amount: 10.5
        currency: USD
        payment_method: credit-card
        transaction_type: charge
        max_attempts: 3
        timeout_millis: 5000
        inter_digit_timeout_millis: 5000
        voice: female
        language: en-US
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    GatherRequest_2:
      type: object
      title: Gather
      properties:
        minimum_digits:
          description: The minimum number of digits to fetch. This parameter has a minimum value of 1.
          default: 1
          type: integer
          example: 1
          format: int32
        maximum_digits:
          description: The maximum number of digits to fetch. This parameter has a maximum value of 128.
          default: 128
          type: integer
          example: 10
          format: int32
        timeout_millis:
          description: The number of milliseconds to wait to complete the request.
          default: 60000
          type: integer
          example: 60000
          format: int32
        inter_digit_timeout_millis:
          description: The number of milliseconds to wait for input between digits.
          default: 5000
          type: integer
          example: 10000
          format: int32
        initial_timeout_millis:
          description: The number of milliseconds to wait for the first DTMF.
          default: 5000
          type: integer
          example: 10000
          format: int32
        terminating_digit:
          description: The digit used to terminate input if fewer than `maximum_digits` digits have been gathered. Set to an empty string to disable the terminating digit entirely, so that a digit such as `#` can be collected as input per `valid_digits`.
          default: '#'
          type: string
          example: '#'
        valid_digits:
          description: A list of all digits accepted as valid.
          default: 0123456789#*
          type: string
          example: '123'
        gather_id:
          description: An id that will be sent back in the corresponding `call.gather.ended` webhook. Will be randomly generated if not specified.
          type: string
          example: my_gather_id
          minLength: 1
          maxLength: 40
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
    InworldVoiceSettings_2:
      type: object
      title: Inworld Voice Settings
      properties:
        type:
          type: string
          enum:
          - inworld
          description: Voice settings provider type
        delivery_mode:
          type: string
          enum:
          - STABLE
          - BALANCED
          - CREATIVE
          description: Controls the expressiveness and consistency of the Inworld `TTS2` model's speech synthesis. `STABLE` favors consistent, predictable output, `CREATIVE` allows more expressive variation, and `BALANCED` sits in between. Optional and only supported by `TTS2`; when omitted, the provider default applies.
      required:
      - type
    TranscriptionConfig_2:
      type: object
      description: The settings associated with speech to text for the voice assistant. This is only relevant if the assistant uses a text-to-text language model. Any assistant using a model with native audio support (e.g. `fixie-ai/ultravox-v0_4`) will ignore this field.
      properties:
        model:
          description: 'The speech to text model to be used by the voice assistant. Supported models include:


            - `deepgram/flux` (or `flux`) for live streaming turn-taking.

            - `deepgram/nova-3` and `deepgram/nova-2` for live streaming transcription.

            - `speechmatics/standard` and `speechmatics/enhanced` for live streaming transcription.

            - `assemblyai/universal-3-5-pro` for live streaming transcription. The legacy alias `assemblyai/universal-streaming` is still accepted and resolves to the same model.

            - `xai/grok-stt` for live streaming transcription.

            - `soniox/stt-rt-v4` for live streaming multilingual transcription with automatic language detection.

            - `nvidia/parakeet-v3` for multilingual transcription with automatic language detection.

            - `omi-health/omi-med-stt-v1` for English-only medical transcription (Parakeet-based).

            - `humain/realtime` for live streaming transcription with native Arabic and Arabic/English code-switching support.

            - `reson8/turns` for live streaming turn-based transcription of 10 European languages with automatic language detection.

            - `cohere/ar-stt` for non-streaming Arabic and English transcription.

            - `azure/fast` and `azure/realtime`; Azure models require `region`, and unsupported regions require `api_key_ref`.

            - `google/latest_long` for non-streaming multilingual transcription.

            - `distil-whisper/distil-large-v2` for lower-latency English-only non-streaming transcription.

            - `openai/whisper-large-v3-turbo` for multilingual non-streaming transcription with automatic language detection.'
          type: string
          enum:
          - deepgram/flux
          - flux
          - deepgram/nova-3
          - deepgram/nova-2
          - speechmatics/standard
          - speechmatics/enhanced
          - assemblyai/universal-3-5-pro
          - assemblyai/universal-streaming
          - xai/grok-stt
          - soniox/stt-rt-v4
          - nvidia/parakeet-v3
          - omi-health/omi-med-stt-v1
          - humain/realtime
          - reson8/turns
          - cohere/ar-stt
          - azure/fast
          - azure/realtime
          - google/latest_long
          - distil-whisper/distil-large-v2
          - openai/whisper-large-v3-turbo
          default: distil-whisper/distil-large-v2
          example: distil-whisper/distil-large-v2
        language:
          type: string
          description: 'The language of the audio to be transcribed. If not set, or if set to `auto`, supported models will automatically detect the language. Supported and meaningful values depend on the selected transcription `model`. For `deepgram/flux`, supported values are: `auto` (Telnyx language detection controls the language hint), `multi` (no language hint), and language-specific hints `en`, `es`, `fr`, `de`, `hi`, `ru`, `pt`, `ja`, `it`, and `nl`. For `soniox/stt-rt-v4`, `auto` omits the language hint and lets Soniox auto-detect; ISO 639-1 codes (e.g. `en`, `es`) bias detection toward that language. For `assemblyai/universal-3-5-pro` (and its legacy alias `assemblyai/universal-streaming`), `auto` (or unset) enables native multilingual code-switching; ISO 639-1 codes (`en`, `es`, `de`, `fr`, `pt`, `it`, `tr`, `nl`, `sv`, `no`, `da`, `fi`, `hi`, `vi`, `ar`, `he`, `ja`, `zh`) bias the session to that language. For `humain/realtime`, supported values are `ar`, `en`, `codeswitch` (Arabic/English code-switching), and `auto` (resolves server-side to code-switching). Unlike other models, `humain/realtime` does not fall back to `auto` when `language` is omitted — omitting it applies `en` instead. For `reson8/turns`, supported values are `auto` (or unset) for automatic language detection, and the language codes `nl`, `en`, `fr`, `fy`, `de`, `it`, `pl`, `pt`, `es`, and `sv` to fix the transcription language. For `cohere/ar-stt`, supported values are `ar` and `en`; unlike other models, this model does not auto-detect and defaults to `ar` when `language` is omitted.'
    DeepgramNova3Config_2:
      type: object
      title: DeepgramNova3Config
      properties:
        transcription_engine:
          type: string
          enum:
          - Deepgram
        transcription_model:
          type: string
          enum:
          - deepgram/nova-3
        interim_results:
          type: boolean
          default: false
          example: true
          description: Whether to send also interim results. If set to false, only final results will be sent.
        utterance_end_ms:
          type: integer
          default: 1000
          example: 800
          minimum: 0
          maximum: 5000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
        language:
          $ref: '#/components/schemas/DeepgramNova3TranscriptionLanguage'
        smart_format:
          type: boolean
          default: true
          example: false
          description: 'Enable Deepgram''s smart formatting (capitalization, punctuation, and digit normalization). Note: Telnyx defaults this to `true`, overriding Deepgram''s underlying default of `false` — omit the field to get a smart-formatted transcript, or set it to `false` to receive the raw lowercase transcript without punctuation.'
        keywords_boosting:
          type: object
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          additionalProperties:
            type: number
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
          default: null
          example:
            snuffleupagus: 5
            systrom: 2
            krieger: 1
        keyterms:
          type: array
          description: Nova-3 keyterm prompting. Up to 100 domain-specific terms or brand names to bias recognition toward. Nova-3-only; use `hints` on Nova-2.
          items:
            type: string
          maxItems: 100
          default: []
          example:
          - Telnyx
          - LiveKit
          - VoIP
      additionalProperties: false
      required:
      - transcription_engine
      - transcription_model
      example:
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-3
        language: en
        smart_format: false
        keyterms:
        - Telnyx
        - LiveKit
        - VoIP
        keywords_boosting:
          snuffleupagus: 5
          systrom: 2
          krieger: 1
    RejectRequest_2:
      type: object
      title: Reject Request
      required:
      - cause
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        cause:
          description: 'Cause for call rejection. The cause sets the SIP response the caller receives: `USER_BUSY` sends 486 User Busy, `CALL_REJECTED` sends 603 Decline, `NOT_FOUND` sends 404 Not Found, and `TEMPORARILY_UNAVAILABLE` sends 480 Temporarily Unavailable.'
          type: string
          enum:
          - CALL_REJECTED
          - NOT_FOUND
          - TEMPORARILY_UNAVAILABLE
          - USER_BUSY
          example: USER_BUSY
      example:
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        cause: USER_BUSY
    ConversationRelayLanguage:
      type: object
      title: Conversation Relay Language
      description: Language-specific TTS and transcription settings for Conversation Relay.
      properties:
        language:
          type: string
          description: BCP 47 language tag for this language configuration.
          example: en-US
        tts_provider:
          type: string
          description: Text-to-speech provider for this language. If omitted and `voice` is provided, Telnyx derives the provider from the voice identifier.
          example: telnyx
        voice:
          type: string
          description: Voice identifier for this language.
          example: Telnyx.KokoroTTS.af
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings_2'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        transcription_engine:
          description: Engine to use for speech recognition. Legacy values `A` - `Google`, `B` - `Telnyx` are supported for backward compatibility. When provided in a Conversation Relay language entry, Telnyx derives `transcription_provider` and `speech_model` for that language.
          type: string
          enum:
          - Google
          - Telnyx
          - Deepgram
          - Azure
          - xAI
          - AssemblyAI
          - Speechmatics
          - Soniox
          - A
          - B
          default: Google
          example: Google
        transcription_engine_config:
          $ref: '#/components/schemas/ConversationRelayTranscriptionEngineConfig'
        transcription_provider:
          type: string
          description: Conversation Relay transcription provider name. Prefer `transcription_engine` when configuring speech-to-text.
          example: Deepgram
        speech_model:
          type: string
          description: Conversation Relay speech model. Prefer `transcription_engine_config.transcription_model` when configuring speech-to-text.
          example: nova-3
      required:
      - language
    AnswerRequest_2:
      type: object
      title: Answer Request
      properties:
        assistant:
          $ref: '#/components/schemas/CallAssistantRequest_2'
        conversation_relay_config:
          $ref: '#/components/schemas/ConversationRelayEmbeddedConfig'
        billing_group_id:
          description: Use this field to set the Billing Group ID for the call. Must be a valid and existing Billing Group ID.
          type: string
          format: uuid
          example: f5586561-8ff0-4291-a0ac-84fe544797bd
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
        custom_headers:
          description: Custom headers to be added to the SIP INVITE response.
          type: array
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
        preferred_codecs:
          type: string
          description: The list of comma-separated codecs in a preferred order for the forked media to be received.
          enum:
          - G722,PCMU,PCMA,G729,OPUS,VP8,H264
          example: G722,PCMU,PCMA,G729,OPUS,VP8,H264
        sip_headers:
          description: SIP headers to be added to the SIP INVITE response. Currently only User-to-User header is supported.
          type: array
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
        sound_modifications:
          $ref: '#/components/schemas/SoundModifications'
        stream_url:
          description: The destination WebSocket address where the stream is going to be delivered.
          type: string
          example: wss://www.example.com/websocket
        stream_track:
          description: Specifies which track should be streamed.
          type: string
          enum:
          - inbound_track
          - outbound_track
          - both_tracks
          default: inbound_track
          example: both_tracks
        stream_codec:
          $ref: '#/components/schemas/StreamCodec'
        stream_bidirectional_mode:
          $ref: '#/components/schemas/StreamBidirectionalMode'
        stream_bidirectional_codec:
          $ref: '#/components/schemas/StreamBidirectionalCodec'
        stream_bidirectional_target_legs:
          $ref: '#/components/schemas/StreamBidirectionalTargetLegs'
        send_silence_when_idle:
          description: Generate silence RTP packets when no transmission available.
          type: boolean
          default: false
          example: true
        webhook_url:
          description: Use this field to override the URL for which Telnyx will send subsequent webhooks to for this call.
          type: string
          example: https://www.example.com/server-b/
        webhook_url_method:
          description: HTTP request type used for `webhook_url`.
          default: POST
          type: string
          enum:
          - POST
          - GET
          example: GET
        transcription:
          description: Enable standalone call transcription upon call answer. The default value is false. Configure this feature with `transcription_config`. To configure speech recognition for an AI assistant, use `assistant.transcription` instead.
          type: boolean
          default: false
          example: true
        transcription_config:
          $ref: '#/components/schemas/TranscriptionStartRequest_2'
        record:
          description: Start recording automatically after an event. Disabled by default.
          type: string
          enum:
          - record-from-answer
          example: record-from-answer
        record_channels:
          description: Defines which channel should be recorded ('single' or 'dual') when `record` is specified.
          type: string
          enum:
          - single
          - dual
          default: dual
          example: single
        record_format:
          description: Defines the format of the recording ('wav' or 'mp3') when `record` is specified.
          type: string
          enum:
          - wav
          - mp3
          default: mp3
          example: wav
        record_max_length:
          description: Defines the maximum length for the recording in seconds when `record` is specified. The minimum value is 0. The maximum value is 43200. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 1000
        record_timeout_secs:
          description: The number of seconds that Telnyx will wait for the recording to be stopped if silence is detected when `record` is specified. The timer only starts when the speech is detected. Please note that call transcription is used to detect silence and the related charge will be applied. The minimum value is 0. The default value is 0 (infinite).
          type: integer
          format: int32
          default: 0
          example: 100
        record_track:
          description: The audio track to be recorded. Can be either `both`, `inbound` or `outbound`. If only single track is specified (`inbound`, `outbound`), `channels` configuration is ignored and it will be recorded as mono (single channel).
          type: string
          example: outbound
          default: both
          enum:
          - both
          - inbound
          - outbound
        record_trim:
          description: When set to `trim-silence`, silence will be removed from the beginning and end of the recording.
          enum:
          - trim-silence
          type: string
          example: trim-silence
        record_custom_file_name:
          description: The custom recording file name to be used instead of the default `call_leg_id`. Telnyx will still add a Unix timestamp suffix.
          type: string
          minLength: 1
          maxLength: 40
          example: my_recording_file_name
        webhook_urls:
          description: A map of event types to arrays of webhook URLs. When an event of the specified type occurs, the webhook URLs associated with that event type will be called instead of `webhook_url`. Events not mapped here will use the default `webhook_url`.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uri
          example:
            call.hangup:
            - https://www.example.com/webhooks/hangup
            call.bridge:
            - https://www.example.com/webhooks/bridge
        webhook_urls_method:
          description: HTTP request method to invoke `webhook_urls`.
          type: string
          enum:
          - POST
          - GET
          default: POST
          example: POST
        webhook_retries_policies:
          description: A map of event types to retry policies. Each retry policy contains an array of `retries_ms` specifying the delays between retry attempts in milliseconds. Maximum 5 retries, total delay cannot exceed 60 seconds.
          type: object
          additionalProperties:
            type: object
            properties:
              retries_ms:
                type: array
                items:
                  type: integer
                maxItems: 5
                description: Array of delays in milliseconds between retry attempts. Total sum cannot exceed 60000ms.
          example:
            call.hangup:
              retries_ms:
              - 1000
              - 2000
              - 5000
        deepfake_detection:
          description: Enables deepfake detection on the call. When enabled, audio from the remote party is streamed to a detection service that analyzes whether the voice is AI-generated. Results are delivered via the `call.deepfake_detection.result` webhook.
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether deepfake detection is enabled.
            timeout:
              type: integer
              format: int32
              default: 15
              minimum: 5
              maximum: 60
              description: Maximum time in seconds to wait for a detection result before timing out.
            rtp_timeout:
              type: integer
              format: int32
              default: 30
              minimum: 5
              maximum: 120
              description: Maximum time in seconds to wait for RTP audio before timing out. If no audio is received within this window, detection stops with an error.
      example:
        assistant:
          id: asst_123
          greeting: Hi, I'm your assistant. How can I help?
          voice_settings:
            voice: Telnyx.KokoroTTS.af_heart
          transcription:
            model: deepgram/flux
            language: en
          tools:
          - type: hangup
            hangup: {}
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        webhook_url: https://www.example.com/server-b/
        webhook_url_method: POST
        send_silence_when_idle: true
        deepfake_detection:
          enabled: true
          timeout: 15
          rtp_timeout: 30
    GatherUsingSpeakRequest_2:
      type: object
      title: Gather Using Speak Request
      required:
      - voice
      - payload
      properties:
        payload:
          description: The text or SSML to be converted into speech. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        invalid_payload:
          description: The text or SSML to be converted into speech when digits don't match the `valid_digits` parameter or the number of digits is not between `min` and `max`. There is a 3,000 character limit.
          type: string
          example: Say this on the call
        payload_type:
          description: The type of the provided payload. The payload can either be plain text, or Speech Synthesis Markup Language (SSML).
          default: text
          type: string
          enum:
          - text
          - ssml
          example: ssml
        service_level:
          description: This parameter impacts speech quality, language options and payload types. When using `basic`, only the `en-US` language and payload type `text` are allowed.
          default: premium
          type: string
          enum:
          - basic
          - premium
          example: premium
        voice:
          description: "Specifies the voice used in speech synthesis.\n\n- Define voices using the format `<Provider>.<Model>.<VoiceId>`. Specifying only the provider will give default values for voice_id and model_id.\n\n **Supported Providers:**\n- **AWS:** Use `AWS.Polly.<VoiceId>` (e.g., `AWS.Polly.Joanna`). For neural voices, which provide more realistic, human-like speech, append `-Neural` to the `VoiceId` (e.g., `AWS.Polly.Joanna-Neural`). Check the [available voices](https://docs.aws.amazon.com/polly/latest/dg/available-voices.html) for compatibility.\n- **Azure:** Use `Azure.<VoiceId>` (e.g., `Azure.en-CA-ClaraNeural`, `Azure.en-US-BrianMultilingualNeural`, `Azure.en-US-Ava:DragonHDLatestNeural`). For a complete list of voices, go to [Azure Voice Gallery](https://speech.microsoft.com/portal/voicegallery). Use `voice_settings` to configure custom deployments, regions, or API keys.\n- **ElevenLabs:** Use `ElevenLabs.<ModelId>.<VoiceId>` (e.g., `ElevenLabs.eleven_multilingual_v2.21m00Tcm4TlvDq8ikWAM`). The `ModelId` part is optional. To use ElevenLabs, you must provide your ElevenLabs API key as an integration identifier secret in `\"voice_settings\": {\"api_key_ref\": \"<secret_identifier>\"}`. See [integration secrets documentation](https://developers.telnyx.com/api/secrets-manager/integration-secrets/create-integration-secret) for details. Check [available voices](https://elevenlabs.io/docs/api-reference/get-voices).\n- **Telnyx:** Use `Telnyx.<model_id>.<voice_id>` (e.g., `Telnyx.KokoroTTS.af`). Use `voice_settings` to configure voice_speed and other synthesis parameters. `Bayan` provides Arabic (multiple dialects) and English voices (e.g., `Telnyx.Bayan.Ahmed`, `Telnyx.Bayan.Amanda`). `Sukhan` provides Urdu voices (e.g., `Telnyx.Sukhan.urdu-professor`); `voice_speed` is not supported.\n- **Minimax:** Use `Minimax.<ModelId>.<VoiceId>` (e.g., `Minimax.speech-02-hd.Wise_Woman`). Supported models: `speech-02-turbo`, `speech-02-hd`, `speech-2.6-turbo`, `speech-2.8-turbo`. Use `voice_settings` to configure speed, volume, pitch, and language_boost.\n- **Resemble:** Use `Resemble.Turbo.<voice_id>` (e.g., `Resemble.Turbo.my_voice`). Only `Turbo` model is supported. Use `voice_settings` to configure precision, sample_rate, and format.\n- **Inworld:** Use `Inworld.<ModelId>.<VoiceId>` (e.g., `Inworld.Mini.Loretta`, `Inworld.Max.Oliver`, `Inworld.TTS2.Loretta`). Supported models: `Mini`, `Max`, `TTS2`. Use `voice_settings` to configure `delivery_mode` (`STABLE`, `BALANCED`, `CREATIVE`), supported by `TTS2` only.\n- **Fish Audio:** Use `FishAudio.<ModelId>.<VoiceId>` (e.g., `FishAudio.s2.1-pro.<reference_id>`). Supported models: `s2.1-pro`, `s2-pro`, `s1`. `VoiceId` is a Fish Voice-Library reference ID.\n- **Soniox:** Use `Soniox.<ModelId>.<VoiceId>` (e.g., `Soniox.tts-rt-v2.Emma`). Supported model: `tts-rt-v2`. Browse the catalog via the [Voices API](https://developers.telnyx.com/api-reference/text-to-speech-commands/list-available-voices). Every voice speaks all supported languages; set `language` to the two-letter ISO 639-1 code of the text, for example `it`. SSML is not supported. Use `voice_settings` to configure `speed` (0.7 to 1.3) and `reduce_silence`.\n- **xAI:** Use `xAI.<VoiceId>` (e.g., `xAI.eve`). Available voices: `eve`, `ara`, `rex`, `sal`, `leo`.\n- **Humain:** Use `Humain.<VoiceId>` (e.g., `Humain.sara-ar`). Available voices: `sara-en`, `abdulaziz-en`, `sara-ar`, `abdulaziz-ar`, `nourah-ar`, `abdullah-ar`. Native Arabic (Saudi dialect) and English voices only — no `ModelId` segment.\n\nFor service_level basic, you may define the gender of the speaker (male or female)."
          type: string
          example: Telnyx.KokoroTTS.af
        voice_settings:
          description: The settings associated with the voice selected
          oneOf:
          - $ref: '#/components/schemas/ElevenLabsVoiceSettings'
          - $ref: '#/components/schemas/TelnyxVoiceSettings_2'
          - $ref: '#/components/schemas/AWSVoiceSettings'
          - $ref: '#/components/schemas/MinimaxVoiceSettings'
          - $ref: '#/components/schemas/AzureVoiceSettings'
          - $ref: '#/components/schemas/ResembleVoiceSettings'
          - $ref: '#/components/schemas/InworldVoiceSettings_2'
          - $ref: '#/components/schemas/XAIVoiceSettings'
          - $ref: '#/components/schemas/SonioxVoiceSettings'
          discriminator:
            propertyName: type
            mapping:
              elevenlabs: '#/components/schemas/ElevenLabsVoiceSettings'
              telnyx: '#/components/schemas/TelnyxVoiceSettings'
              aws: '#/components/schemas/AWSVoiceSettings'
              minimax: '#/components/schemas/MinimaxVoiceSettings'
              azure: '#/components/schemas/AzureVoiceSettings'
              resemble: '#/components/schemas/ResembleVoiceSettings'
              inworld: '#/components/schemas/InworldVoiceSettings'
              xai: '#/components/schemas/XAIVoiceSettings'
              soniox: '#/components/schemas/SonioxVoiceSettings'
        language:
          description: The language you want spoken. This parameter is ignored when a `Polly.*` voice is specified.
          type: string
          enum:
          - arb
          - cmn-CN
          - cy-GB
          - da-DK
          - de-DE
          - en-AU
          - en-GB
          - en-GB-WLS
          - en-IN
          - en-US
          - es-ES
          - es-MX
          - es-US
          - fr-CA
          - fr-FR
          - hi-IN
          - is-IS
          - it-IT
          - ja-JP
          - ko-KR
          - nb-NO
          - nl-NL
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sv-SE
          - tr-TR
          example: en-US
        minimum_digits:
          description: The minimum number of digits to fetch. This parameter has a minimum value of 1.
          default: 1
          type: integer
          example: 1
          format: int32
        maximum_digits:
          description: The maximum number of digits to fetch. This parameter has a maximum value of 128.
          default: 128
          type: integer
          example: 10
          format: int32
        maximum_tries:
          description: The maximum number of times that a file should be played back if there is no input from the user on the call.
          default: 3
          type: integer
          example: 3
          format: int32
        timeout_millis:
          description: The number of milliseconds to wait for a DTMF response after speak ends before a replaying the sound file.
          default: 60000
          type: integer
          example: 60000
          format: int32
        terminating_digit:
          description: The digit used to terminate input if fewer than `maximum_digits` digits have been gathered. Set to an empty string to disable the terminating digit entirely, so that a digit such as `#` can be collected as input per `valid_digits`.
          default: '#'
          type: string
          example: '#'
        valid_digits:
          description: A list of all digits accepted as valid.
          default: 0123456789#*
          type: string
          example: '123'
        inter_digit_timeout_millis:
          description: The number of milliseconds to wait for input between digits.
          default: 5000
          type: integer
          example: 10000
          format: int32
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          type: string
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          type: string
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
      example:
        payload: say this on call
        invalid_payload: say this on call
        payload_type: text
        service_level: premium
        voice: male
        language: arb
        minimum_digits: 1
        maximum_digits: 10
        terminating_digit: '#'
        valid_digits: '123'
        inter_digit_timeout_millis: 10000
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
    SonioxVoiceSettings:
      type: object
      title: Soniox Voice Settings
      properties:
        type:
          type: string
          enum:
          - soniox
          description: Voice settings provider type
        speed:
          type: number
          format: float
          minimum: 0.7
          maximum: 1.3
          default: 1
          description: Speaking rate. 1.0 is normal speed.
        reduce_silence:
