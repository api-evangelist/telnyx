    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /calls/{call_control_id}/actions/pay:
    post:
      summary: Process a payment
      description: 'Collect payment details from the caller using DTMF and either charge or tokenize the payment method through a configured Pay connector. Pay pauses active call recordings while sensitive payment details are collected.


        When `payment_token` is supplied, the DTMF collection steps are skipped and the existing token is sent to the connector.


        **Expected Webhooks:**


        - `call.payment.progress`

        - `call.payment.completed`


        **Test mode card numbers:** `4111111111111111` (Visa), `5555555555554444` (Mastercard), `378282246310005` (American Express), `6011111111111117` (Discover), `3065930009020004` (Diners Club), `3566002020360505` (JCB), `6200000000000005` (UnionPay), and `6771798021000008` (Maestro). Test-mode connectors reject other card numbers before contacting the configured processor. The UnionPay and Maestro numbers are accepted for processor testing, but Pay currently does not emit a card type for them.'
      operationId: PayCall
      tags:
      - Call Commands
      parameters:
      - $ref: '#/components/parameters/CallControlId'
      requestBody:
        description: Pay request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: Successful response upon making a call control command.
          content:
            application/json:
              schema:
                type: object
                title: Call Control Command Response
                properties:
                  data:
                    $ref: '#/components/schemas/CallControlCommandResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/call-control_GenericErrorResponse_2'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    ToolMessage:
      example:
        content: Hello, I'm John.
        role: tool
        tool_call_id: call_123
      properties:
        content:
          description: The contents of the tool message.
          type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        role:
          description: The role of the messages author, in this case `tool`.
          enum:
          - tool
          type: string
        tool_call_id:
          description: Tool call that this message is responding to.
          type: string
      required:
      - role
      - content
      - tool_call_id
      title: Tool Message
      type: object
    CallControlCommandResultWithConversationId:
      example:
        conversation_id: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
        result: ok
      properties:
        conversation_id:
          description: The ID of the conversation created by the command.
          example: d7e9c1d4-8b2a-4b8f-b3a7-9a671c9e9b0a
          format: uuid
          type: string
        result:
          example: ok
          type: string
      title: Call Control Command Result With Conversation ID
      type: object
    TranscriptionEngineTelnyxConfig:
      properties:
        language:
          $ref: '#/components/schemas/TelnyxTranscriptionLanguage'
        transcription_engine:
          description: Engine identifier for Telnyx transcription service
          enum:
          - Telnyx
          type: string
        transcription_model:
          default: openai/whisper-tiny
          description: The model to use for transcription.
          enum:
          - openai/whisper-tiny
          - openai/whisper-large-v3-turbo
          type: string
      title: Transcription engine Telnyx config
      type: object
    call-control_Error:
      properties:
        code:
          format: integer
          type: string
        detail:
          type: string
        meta:
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              format: json-pointer
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
    SendSIPInfoRequest:
      example:
        body: '{"key": "value", "numValue": 100}'
        client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
        command_id: 891510ac-f3e4-11e8-af5b-de00688a4901
        content_type: application/json
      properties:
        body:
          description: Content of the SIP INFO
          example: '{"key": "value", "numValue": 100}'
          type: string
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid duplicate commands. Telnyx will ignore any command with the same `command_id` for the same `call_control_id`.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        content_type:
          description: Content type of the INFO body. Must be MIME type compliant. There is a 1,400 bytes limit
          example: application/json
          type: string
      required:
      - content_type
      - body
      title: Send SIP Info Request
      type: object
    ReferRequest:
      example:
        sip_address: sip:username@sip.non-telnyx-address.com
      properties:
        client_state:
          description: Use this field to add state to every subsequent webhook. It must be a valid Base-64 encoded string.
          example: aGF2ZSBhIG5pY2UgZGF5ID1d
          type: string
        command_id:
          description: Use this field to avoid execution of duplicate commands. Telnyx will ignore subsequent commands with the same `command_id` as one that has already been executed.
          example: 891510ac-f3e4-11e8-af5b-de00688a4901
          type: string
        custom_headers:
          description: Custom headers to be added to the SIP INVITE.
          example:
          - name: head_1
            value: val_1
          - name: head_2
            value: val_2
          items:
            $ref: '#/components/schemas/CustomSipHeader'
          type: array
        sip_address:
          description: The SIP URI to which the call will be referred to.
          example: sip:username@sip.non-telnyx-address.com
          type: string
        sip_auth_password:
          description: SIP Authentication password used for SIP challenges.
          type: string
        sip_auth_username:
          description: SIP Authentication username used for SIP challenges.
          type: string
        sip_headers:
          description: SIP headers to be added to the request. Currently only User-to-User header is supported.
          example:
          - name: User-to-User
            value: value
          items:
            $ref: '#/components/schemas/SipHeader'
          type: array
      required:
      - sip_address
      title: Refer request
      type: object
    TranscriptionLanguage:
