        role: user
      properties:
        content:
          description: The contents of the user message.
          type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        role:
          description: The role of the messages author, in this case `user`.
          enum:
          - user
          type: string
      required:
      - role
      - content
      title: User message.
      type: object
    StopRecordingRequest:
