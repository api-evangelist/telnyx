    TranscriptionConfig:
      description: The settings associated with speech to text for the voice assistant. This is only relevant if the assistant uses a text-to-text language model. Any assistant using a model with native audio support (e.g. `fixie-ai/ultravox-v0_4`) will ignore this field.
      properties:
        language:
          default: auto
          description: 'The language of the audio to be transcribed. If not set, or if set to `auto`, supported models will automatically detect the language. Supported and meaningful values depend on the selected transcription `model`. For `deepgram/flux`, supported values are: `auto` (Telnyx language detection controls the language hint), `multi` (no language hint), and language-specific hints `en`, `es`, `fr`, `de`, `hi`, `ru`, `pt`, `ja`, `it`, and `nl`.'
          example: auto
          type: string
        model:
          default: distil-whisper/distil-large-v2
          description: 'The speech to text model to be used by the voice assistant. Supported models include:


            - `deepgram/flux` (or `flux`) for live streaming turn-taking.

            - `deepgram/nova-3` and `deepgram/nova-2` for live streaming transcription.

            - `speechmatics/standard` and `speechmatics/enhanced` for live streaming transcription.

            - `assemblyai/universal-streaming` for live streaming transcription.

            - `xai/grok-stt` for live streaming transcription.

            - `azure/fast` and `azure/realtime`; Azure models require `region`, and unsupported regions require `api_key_ref`.

            - `google/latest_long` for non-streaming multilingual transcription.

            - `distil-whisper/distil-large-v2` for lower-latency English-only non-streaming transcription.

            - `openai/whisper-large-v3-turbo` for multilingual non-streaming transcription with automatic language detection.'
          enum:
          - deepgram/flux
          - flux
          - deepgram/nova-3
          - deepgram/nova-2
          - speechmatics/standard
          - speechmatics/enhanced
          - assemblyai/universal-streaming
          - xai/grok-stt
          - azure/fast
          - azure/realtime
          - google/latest_long
          - distil-whisper/distil-large-v2
          - openai/whisper-large-v3-turbo
          example: distil-whisper/distil-large-v2
          type: string
      type: object
    DeepgramNova3Config:
      example:
        keywords_boosting:
          krieger: 1
          snuffleupagus: 5
          systrom: 2
        language: en
        transcription_engine: Deepgram
        transcription_model: deepgram/nova-3
      properties:
        interim_results:
          default: false
          description: Whether to send also interim results. If set to false, only final results will be sent.
          example: true
          type: boolean
        keywords_boosting:
          additionalProperties:
            description: Boost intensifier for the keyword. Higher values increase recognition confidence.
            type: number
          default: null
          description: 'Keywords and their respective intensifiers (boosting values) to improve transcription accuracy for specific words or phrases. The intensifier should be a numeric value. Example: `{"snuffleupagus": 5, "systrom": 2, "krieger": 1}`.'
          example:
            krieger: 1
            snuffleupagus: 5
            systrom: 2
          type: object
        language:
          $ref: '#/components/schemas/DeepgramNova3TranscriptionLanguage'
        transcription_engine:
          enum:
          - Deepgram
          type: string
        transcription_model:
          enum:
          - deepgram/nova-3
          type: string
        utterance_end_ms:
          default: 1000
          description: Number of milliseconds of silence to consider an utterance ended. Ranges from 0 to 5000 ms.
          example: 800
          maximum: 5000
          minimum: 0
          type: integer
      required:
      - transcription_engine
      - transcription_model
      title: DeepgramNova3Config
      type: object
