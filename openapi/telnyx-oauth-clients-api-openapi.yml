components:
  schemas:
    OAuthClientCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the OAuth client
          example: My OAuth client
        allowed_scopes:
          type: array
          items:
            type: string
          description: List of allowed OAuth scopes
          example:
          - admin
        client_type:
          type: string
          enum:
          - public
          - confidential
          description: OAuth client type
        require_pkce:
          type: boolean
          description: Whether PKCE (Proof Key for Code Exchange) is required for this client
          default: false
        allowed_grant_types:
          type: array
          items:
            type: string
            enum:
            - client_credentials
            - authorization_code
            - refresh_token
          description: List of allowed OAuth grant types
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: List of redirect URIs (required for authorization_code flow)
          default: []
        logo_uri:
          type: string
          format: uri
          description: URL of the client logo
        policy_uri:
          type: string
          format: uri
          description: URL of the client's privacy policy
        tos_uri:
          type: string
          format: uri
          description: URL of the client's terms of service
      required:
      - name
      - allowed_scopes
      - client_type
      - allowed_grant_types
      additionalProperties: false
    OAuthClient:
      type: object
      properties:
        record_type:
          type: string
          enum:
          - oauth_client
          description: Record type identifier
        client_id:
          type: string
          description: OAuth client identifier
        name:
          type: string
          description: Human-readable name for the OAuth client
        org_id:
          type: string
          description: Organization ID that owns this OAuth client
        user_id:
          type: string
          description: User ID that created this OAuth client
        allowed_scopes:
          type: array
          items:
            type: string
          description: List of allowed OAuth scopes
        client_type:
          type: string
          enum:
          - public
          - confidential
          description: OAuth client type
        require_pkce:
          type: boolean
          description: Whether PKCE (Proof Key for Code Exchange) is required for this client
        allowed_grant_types:
          type: array
          items:
            type: string
            enum:
            - client_credentials
            - authorization_code
            - refresh_token
          description: List of allowed OAuth grant types
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: List of allowed redirect URIs
        logo_uri:
          type:
          - string
          - 'null'
          format: uri
          description: URL of the client logo
        tos_uri:
          type:
          - string
          - 'null'
          format: uri
          description: URL of the client's terms of service
        policy_uri:
          type:
          - string
          - 'null'
          format: uri
          description: URL of the client's privacy policy
        client_secret:
          type:
          - string
          - 'null'
          description: Client secret (only included when available, for confidential clients)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the client was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the client was last updated
      required:
      - record_type
      - client_id
      - name
      - org_id
      - user_id
      - client_type
      - require_pkce
      - created_at
      - updated_at
    oauth_oauth_Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        error_description:
          type: string
          description: Human-readable error description
      required:
      - error
    oauth_Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        error_description:
          type: string
          description: Human-readable error description
      required:
      - error
    oauth_oauth_PaginationMeta:
      type: object
      properties:
        page_number:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_results:
          type: integer
          description: Total number of results
        total_pages:
          type: integer
          description: Total number of pages
    oauth_PaginationMeta:
      type: object
      properties:
        page_number:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_results:
          type: integer
          description: Total number of results
        total_pages:
          type: integer
          description: Total number of pages
    OAuthClientUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the OAuth client
        allowed_scopes:
          type: array
          items:
            type: string
          description: List of allowed OAuth scopes
          example:
          - admin
        require_pkce:
          type: boolean
          description: Whether PKCE (Proof Key for Code Exchange) is required for this client
        allowed_grant_types:
          type: array
          items:
            type: string
            enum:
            - client_credentials
            - authorization_code
            - refresh_token
          description: List of allowed OAuth grant types
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: List of redirect URIs
        logo_uri:
          type: string
          format: uri
          description: URL of the client logo
        policy_uri:
          type: string
          format: uri
          description: URL of the client's privacy policy
        tos_uri:
          type: string
          format: uri
          description: URL of the client's terms of service
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
