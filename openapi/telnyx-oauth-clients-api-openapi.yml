openapi: 3.2.0
info:
  title: Telnyx OAuth Clients API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged OAuth Clients across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: OAuth Clients
paths:
  /oauth/clients:
    get:
      operationId: ListOAuthClients
      tags:
      - OAuth Clients
      summary: List OAuth clients
      description: Retrieve a paginated list of OAuth clients for the authenticated user
      parameters:
      - name: page[size]
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of results per page
      - name: page[number]
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number
      - name: filter[client_type]
        in: query
        schema:
          type: string
          enum:
          - confidential
          - public
        description: Filter by client type
      - name: filter[verified]
        in: query
        schema:
          type: boolean
        description: Filter by verification status
      - name: filter[allowed_grant_types][contains]
        in: query
        schema:
          type: string
          enum:
          - client_credentials
          - authorization_code
          - refresh_token
        description: Filter by allowed grant type
      - name: filter[name]
        in: query
        schema:
          type: string
        description: Filter by exact client name
      - name: filter[name][contains]
        in: query
        schema:
          type: string
        description: Filter by client name containing text
      - name: filter[client_id]
        in: query
        schema:
          type: string
        description: Filter by client ID
      responses:
        '200':
          description: List of OAuth clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthClient'
                  meta:
                    $ref: '#/components/schemas/oauth_PaginationMeta'
              example:
                data:
                - record_type: oauth_client
                  client_id: string
                  name: string
                  org_id: string
                  user_id: string
                  allowed_scopes:
                  - string
                  client_type: public
                  require_pkce: false
                  allowed_grant_types:
                  - client_credentials
                  redirect_uris:
                  - https://example.com
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
                meta:
                  page_number: 0
                  page_size: 0
                  total_results: 0
                  total_pages: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    post:
      operationId: CreateOAuthClient
      tags:
      - OAuth Clients
      summary: Create OAuth client
      description: Creates a new OAuth client on your account for authenticating third-party integrations, and returns the created client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientCreateRequest'
      responses:
        '201':
          description: OAuth client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthClient'
              example:
                data:
                  record_type: oauth_client
                  client_id: string
                  name: string
                  org_id: string
                  user_id: string
                  allowed_scopes:
                  - string
                  client_type: public
                  require_pkce: false
                  allowed_grant_types:
                  - client_credentials
                  redirect_uris:
                  - https://example.com
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /oauth/clients/{id}:
    delete:
      operationId: DeleteOAuthClient
      tags:
      - OAuth Clients
      summary: Delete OAuth client
      description: Permanently deletes the specified OAuth client from your account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: OAuth client ID
      responses:
        '204':
          description: OAuth client deleted successfully
        '404':
          description: OAuth client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
              example:
                error: string
                error_description: string
      x-latency-category: responsive
    get:
      operationId: GetOAuthClient
      tags:
      - OAuth Clients
      summary: Get OAuth client
      description: Returns the details of a single OAuth client on your account by its ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: OAuth client ID
      responses:
        '200':
          description: OAuth client details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthClient'
              example:
                data:
                  record_type: oauth_client
                  client_id: string
                  name: string
                  org_id: string
                  user_id: string
                  allowed_scopes:
                  - string
                  client_type: public
                  require_pkce: false
                  allowed_grant_types:
                  - client_credentials
                  redirect_uris:
                  - https://example.com
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '404':
          description: OAuth client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    put:
      operationId: UpdateOAuthClient
      tags:
      - OAuth Clients
      summary: Update OAuth client
      description: Updates the specified OAuth client's configuration and returns the updated client.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: OAuth client ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateRequest'
      responses:
        '200':
          description: OAuth client updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthClient'
              example:
                data:
                  record_type: oauth_client
                  client_id: string
                  name: string
                  org_id: string
                  user_id: string
                  allowed_scopes:
                  - string
                  client_type: public
                  require_pkce: false
                  allowed_grant_types:
                  - client_credentials
                  redirect_uris:
                  - https://example.com
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '404':
          description: OAuth client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
