openapi: 3.2.0
info:
  title: Telnyx Missions API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Missions across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Missions
paths:
  /ai/missions:
    get:
      tags:
      - Missions
      summary: List missions
      description: Returns a paginated list of all mission definitions in your organization. Missions describe a goal and the tools, knowledge bases, and MCP servers agents may use to accomplish it.
      operationId: get_public_missions_missions
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page[Number]
        description: Page number (1-based)
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          exclusiveMinimum: 0
          description: Number of items per page
          default: 20
          title: Page[Size]
        description: Number of items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionsListResponse'
              example:
                data:
                - mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Name
                  description: Description
                  model: Model
                  instructions: Instructions
                  execution_mode: external
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
                meta:
                  total_pages: 0
                  total_results: 0
                  page_number: 0
                  page_size: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Missions
      summary: Create mission
      description: Creates a new mission definition from the provided configuration and returns the created mission. Execute the mission by starting runs against it.
      operationId: post_public_missions_missions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRequest'
            example:
              name: Name
              description: Description
              model: Model
              instructions: Instructions
              execution_mode: external
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
              example:
                data:
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Name
                  description: Description
                  model: Model
                  instructions: Instructions
                  execution_mode: external
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/events:
    get:
      tags:
      - Missions
      summary: List recent events
      description: Returns a paginated list of recent events across every mission in your organization, optionally filtered by event type. Useful for building activity feeds or monitoring dashboards.
      operationId: get_public_missions_missions_events
      parameters:
      - name: type
        in: query
        description: Filter results by type.
        required: false
        schema:
          title: Type
          type: string
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page[Number]
        description: Page number (1-based)
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          exclusiveMinimum: 0
          description: Number of items per page
          default: 50
          title: Page[Size]
        description: Number of items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListResponse'
              example:
                data:
                - event_id: Event Id
                  run_id: Run Id
                  type: status_change
                  summary: Summary
                  timestamp: '2024-01-23T18:10:02.574Z'
                  step_id: Step Id
                  agent_id: Agent Id
                  idempotency_key: Idempotency Key
                meta:
                  total_pages: 0
                  total_results: 0
                  page_number: 0
                  page_size: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/runs:
    get:
      tags:
      - Missions
      summary: List recent runs
      description: Returns a paginated list of recent runs across every mission in your organization, optionally filtered by run status. Useful for monitoring overall mission activity without querying each mission individually.
      operationId: get_public_missions_missions_runs
      parameters:
      - name: status
        in: query
        description: Filter results by status.
        required: false
        schema:
          title: Status
          type: string
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page[Number]
        description: Page number (1-based)
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          exclusiveMinimum: 0
          description: Number of items per page
          default: 20
          title: Page[Size]
        description: Number of items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionRunsListResponse'
              example:
                data:
                - run_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  status: pending
                  started_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
                meta:
                  total_pages: 0
                  total_results: 0
                  page_number: 0
                  page_size: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}:
    delete:
      tags:
      - Missions
      summary: Delete mission
      description: Permanently deletes the specified mission definition and returns no content on success.
      operationId: delete_public_missions_missions_mission_id
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
    get:
      tags:
      - Missions
      summary: Get mission
      description: Get a mission by ID (includes tools, knowledge_bases, mcp_servers)
      operationId: get_public_missions_missions_mission_id
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
              example:
                data:
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Name
                  description: Description
                  model: Model
                  instructions: Instructions
                  execution_mode: external
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Missions
      summary: Update mission
      description: Replaces the specified mission's definition with the provided configuration and returns the updated mission.
      operationId: put_public_missions_missions_mission_id
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionRequest'
            example:
              name: Name
              description: Description
              model: Model
              instructions: Instructions
              execution_mode: external
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
              example:
                data:
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Name
                  description: Description
                  model: Model
                  instructions: Instructions
                  execution_mode: external
                  created_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/clone:
    post:
      tags:
      - Missions
      summary: Clone mission
      description: Creates a copy of the specified mission as a new mission definition, so you can iterate on its configuration without modifying the original.
      operationId: post_public_missions_missions_mission_id_clone
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/knowledge-bases:
    get:
      tags:
      - Missions
      summary: List knowledge bases
      description: Returns the knowledge bases attached to the specified mission. Knowledge bases provide reference content agents can draw on during runs.
      operationId: get_public_missions_missions_mission_id_knowledge_bases
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Missions
      summary: Create knowledge base
      description: Create a new knowledge base for a mission
      operationId: post_public_missions_missions_mission_id_knowledge_bases
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/knowledge-bases/{knowledge_base_id}:
    delete:
      tags:
      - Missions
      summary: Delete knowledge base
      description: Detaches the specified knowledge base from the mission so its content is no longer available to agents in subsequent runs.
      operationId: DeleteMissionKnowledgeBase
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: knowledge_base_id
        in: path
        description: Unique identifier of the knowledge base.
        required: true
        schema:
          type: string
          title: Knowledge Base Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
    get:
      tags:
      - Missions
      summary: Get knowledge base
      description: Returns the details of a single knowledge base attached to the specified mission.
      operationId: GetMissionKnowledgeBase
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: knowledge_base_id
        in: path
        description: Unique identifier of the knowledge base.
        required: true
        schema:
          type: string
          title: Knowledge Base Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Missions
      summary: Update knowledge base
      description: Replaces the definition of the specified knowledge base on this mission.
      operationId: PutMissionKnowledgeBase
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: knowledge_base_id
        in: path
        description: Unique identifier of the knowledge base.
        required: true
        schema:
          type: string
          title: Knowledge Base Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/mcp-servers:
    get:
      tags:
      - Missions
      summary: List MCP servers
      description: Returns the MCP servers configured on the specified mission. MCP servers expose external tools and data sources agents can use during runs.
      operationId: get_public_missions_missions_mission_id_mcp_servers
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Missions
      summary: Create MCP server
      description: Adds an MCP server to the specified mission, making the server's tools available to agents during runs of this mission.
      operationId: post_public_missions_missions_mission_id_mcp_servers
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/mcp-servers/{mcp_server_id}:
    delete:
      tags:
      - Missions
      summary: Delete MCP server
      description: Removes the specified MCP server from the mission, revoking agent access to its tools in subsequent runs.
      operationId: DeleteMissionMcpServer
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: mcp_server_id
        in: path
        description: Unique identifier of the mcp server.
        required: true
        schema:
          type: string
          title: Mcp Server Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
    get:
      tags:
      - Missions
      summary: Get MCP server
      description: Returns the configuration of a single MCP server attached to the specified mission.
      operationId: GetMissionMcpServer
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: mcp_server_id
        in: path
        description: Unique identifier of the mcp server.
        required: true
        schema:
          type: string
          title: Mcp Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Missions
      summary: Update MCP server
      description: Replaces the configuration of the specified MCP server on this mission.
      operationId: PutMissionMcpServer
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          title: Mission Id
      - name: mcp_server_id
        in: path
        description: Unique identifier of the mcp server.
        required: true
        schema:
          type: string
          title: Mcp Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/runs:
    get:
      tags:
      - Missions
      summary: List runs for mission
      description: Returns a paginated list of runs for the specified mission, optionally filtered by run status, so you can track the mission's execution history over time.
      operationId: get_public_missions_missions_mission_id_runs
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      - name: status
        in: query
        description: Filter results by status.
        required: false
        schema:
          title: Status
          type: string
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page[Number]
        description: Page number (1-based)
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          exclusiveMinimum: 0
          description: Number of items per page
          default: 20
          title: Page[Size]
        description: Number of items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionRunsListResponse'
              example:
                data:
                - run_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  status: pending
                  started_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
                meta:
                  total_pages: 0
                  total_results: 0
                  page_number: 0
                  page_size: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Missions
      summary: Start a run
      description: Starts a new run of the specified mission and returns the created run object. Track its progress through the run detail, plan, and events endpoints.
      operationId: post_public_missions_missions_mission_id_runs
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRunRequest'
              default: {}
            example:
              input:
                objective: Summarize yesterday's failed call attempts
              metadata:
                requested_by: docs-example
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionRunResponse'
              example:
                data:
                  run_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  status: pending
                  started_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/missions/{mission_id}/runs/{run_id}:
    get:
      tags:
      - Missions
      summary: Get run details
      description: Returns the full details of a single run, including its current status. Use this to poll an in-flight run or inspect the outcome of a completed one.
      operationId: get_public_missions_missions_mission_id_runs_run_id
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      - name: run_id
        in: path
        description: Unique identifier of the run.
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionRunResponse'
              example:
                data:
                  run_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  mission_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  status: pending
                  started_at: '2024-01-23T18:10:02.574Z'
                  updated_at: '2024-01-23T18:10:02.574Z'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Missions
      summary: Update run
      description: Updates a run's status and/or result and returns the updated run object. Typically used by executing agents to report progress or record the final outcome.
      operationId: patch_public_missions_missions_mission_id_runs_run_id
      parameters:
      - name: mission_id
        in: path
        description: Unique identifier of the mission.
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      - name: run_id
        in: path
        description: Unique identifier of the run.
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionRunRequest'
            example:
              status: succeeded
              result_summary: Processed 24 customer records successfully.
      responses:
