openapi: 3.2.0
info:
  title: Telnyx Verify API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Verify across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Verify
  description: Two factor authentication API
paths:
  /verifications/by_phone_number/{phone_number}:
    get:
      tags:
      - Verify
      summary: List verifications by phone number
      operationId: ListVerifications
      parameters:
      - required: true
        description: The phone number associated with the verifications to retrieve.
        schema:
          example: '+13035551234'
          type: string
          description: +E164 formatted phone number.
        name: phone_number
        in: path
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVerificationsResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Returns a paginated list of verifications associated with the specified phone number.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/by_phone_number/{phone_number}/actions/verify:
    post:
      tags:
      - Verify
      summary: Verify verification code by phone number
      operationId: VerifyVerificationCodeByPhoneNumber
      parameters:
      - required: true
        description: The phone number associated with the verification code being verified.
        schema:
          example: '+13035551234'
          type: string
          description: +E164 formatted phone number.
        name: phone_number
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyVerificationCodeRequestByPhoneNumber'
        required: true
      responses:
        '200':
          description: Expected verify response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyVerificationCodeResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Submits a verification code for the specified phone number and Verify profile. The response indicates whether the code was accepted or rejected.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/call:
    post:
      tags:
      - Verify
      summary: Trigger Call verification
      operationId: CreateVerificationCall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequestCall'
        required: true
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVerificationResponse'
              example:
                data:
                  id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  type: call
                  record_type: verification
                  phone_number: '+13035551234'
                  verify_profile_id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  timeout_secs: 300
                  status: pending
                  created_at: '2020-09-14T17:03:32.965812'
                  updated_at: '2020-09-14T17:03:32.965812'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Starts a verification for the specified phone number and delivers its code in a voice call using the selected Verify profile. Returns the pending verification record.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/flashcall:
    post:
      tags:
      - Verify
      summary: Trigger Flash call verification
      operationId: CreateFlashcallVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequest'
        required: true
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVerificationResponse'
              example:
                data:
                  id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  type: flashcall
                  record_type: verification
                  phone_number: '+13035551234'
                  verify_profile_id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  timeout_secs: 300
                  status: pending
                  created_at: '2020-09-14T17:03:32.965812'
                  updated_at: '2020-09-14T17:03:32.965812'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Starts a verification for the specified phone number and places a brief call with the code embedded in the caller ID. Returns the pending verification record.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/sms:
    post:
      tags:
      - Verify
      summary: Trigger SMS verification
      operationId: CreateVerificationSms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequestSMS'
        required: true
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVerificationResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Starts a verification for the specified phone number and sends its code by SMS using the selected Verify profile. Returns the pending verification record.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/whatsapp:
    post:
      tags:
      - Verify
      summary: Trigger WhatsApp verification
      operationId: CreateWhatsappVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequestWhatsapp'
        required: true
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVerificationResponse'
              example:
                data:
                  id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  type: whatsapp
                  record_type: verification
                  phone_number: '+13035551234'
                  verify_profile_id: 12ade33a-21c0-473b-b055-b3c836e1c292
                  custom_code: '43612'
                  timeout_secs: 300
                  status: pending
                  created_at: '2020-09-14T17:03:32.965812'
                  updated_at: '2020-09-14T17:03:32.965812'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Starts a verification for the specified phone number and sends its code over WhatsApp using the selected Verify profile. Returns the pending verification record.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/{verification_id}:
    get:
      tags:
      - Verify
      summary: Retrieve verification
      operationId: RetrieveVerification
      parameters:
      - required: true
        description: The identifier of the verification to retrieve.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: verification_id
        in: path
      responses:
        '200':
          description: Expected verifications response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveVerificationResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Returns the verification identified by ID, including its channel, phone number, Verify profile, timeout, and current status.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verifications/{verification_id}/actions/verify:
    post:
      tags:
      - Verify
      summary: Verify verification code by ID
      operationId: VerifyVerificationCodeById
      parameters:
      - required: true
        description: The identifier of the verification to retrieve.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: verification_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyVerificationCodeRequestById'
        required: true
      responses:
        '200':
          description: Expected verify response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyVerificationCodeResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Checks the supplied code, or the supplied status for a custom-code verification, against the verification identified by ID. The response indicates whether the verification was accepted or rejected.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verify_profiles:
    get:
      tags:
      - Verify
      x-group-parameters: 'true'
      summary: List all Verify profiles
      description: Gets a paginated list of Verify profiles.
      operationId: ListProfiles
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[name]'
        schema:
          type: object
          properties:
            name:
              title: filter[name]
              type: string
              description: Optional filter for profile names.
      - name: page
        in: query
        required: false
        style: deepObject
        explode: true
        description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
        schema:
          type: object
          properties:
            size:
              title: page[size]
              type: integer
              default: 25
            number:
              title: page[number]
              type: integer
              default: 1
      responses:
        '200':
          description: Expected Verify profile response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVerifyProfilesResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    post:
      tags:
      - Verify
      summary: Create a Verify profile
      description: Creates a new Verify profile to associate verifications with.
      operationId: CreateVerifyProfile
      requestBody:
        content:
          application/json:
            schema:
              title: Create Verify Profile Request
              type: object
              required:
              - name
              properties:
                name:
                  example: Test Profile
                  type: string
                language:
                  type: string
                  example: en-US
                webhook_url:
                  type: string
                  example: http://example.com/webhook
                webhook_failover_url:
                  type: string
                  example: http://example.com/webhook/failover
                sms:
                  type: object
                  $ref: '#/components/schemas/CreateVerifyProfileSMSRequest'
                  additionalProperties: true
                call:
                  type: object
                  $ref: '#/components/schemas/CreateVerifyProfileCallRequest'
                  additionalProperties: true
                flashcall:
                  type: object
                  $ref: '#/components/schemas/CreateVerifyProfileSettingsRequest'
                  additionalProperties: true
                whatsapp:
                  type: object
                  $ref: '#/components/schemas/CreateVerifyProfileSettingsWhatsAppRequest'
                  additionalProperties: true
                daily_spend_limit_enabled:
                  type: boolean
                  default: false
                  description: Whether the daily spend limit is enforced for this verify profile.
                  example: true
                daily_spend_limit:
                  type: number
                  minimum: 0
                  description: The maximum daily spend allowed on this verify profile, in USD.
                  example: 100
        required: true
      responses:
        '200':
          description: Expected Verify profile response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfileResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verify_profiles/templates:
    get:
      tags:
      - Verify
      summary: Retrieve Verify profile message templates
      description: List all Verify profile message templates.
      operationId: ListProfileMessageTemplates
      responses:
        '200':
          description: Expected Verify profile message template response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVerifyProfileMessageTemplateResponse'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
        '500':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    post:
      tags:
      - Verify
      summary: Create message template
      description: Create a new Verify profile message template.
      operationId: CreateMessageTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageTemplateRequest'
        required: true
      responses:
        '200':
          description: Expected message template response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verify_profiles/templates/{template_id}:
    patch:
      tags:
      - Verify
      summary: Update message template
      description: Update an existing Verify profile message template.
      operationId: UpdateMessageTemplate
      parameters:
      - required: true
        description: The identifier of the message template to update.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: template_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageTemplateRequest'
        required: true
      responses:
        '200':
          description: Expected message template response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /verify_profiles/{verify_profile_id}:
    delete:
      tags:
      - Verify
      summary: Delete Verify profile
      operationId: DeleteProfile
      parameters:
      - required: true
        description: The identifier of the Verify profile to delete.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: verify_profile_id
        in: path
      responses:
        '200':
          description: Expected Verify profile response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfileResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Deletes the specified Verify profile and returns the deleted profile record.
    get:
      tags:
      - Verify
      summary: Retrieve Verify profile
      description: Returns the details of a single Verify profile by its ID, including its verification channel configuration.
      operationId: GetVerifyProfile
      parameters:
      - required: true
        description: The identifier of the Verify profile to retrieve.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: verify_profile_id
        in: path
      responses:
        '200':
          description: Expected Verify profile response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfileResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
    patch:
      tags:
      - Verify
      summary: Update Verify profile
      operationId: UpdateVerifyProfile
      parameters:
      - required: true
        description: The identifier of the Verify profile to update.
        schema:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
        name: verify_profile_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              title: Update Verify Profile Request
              type: object
              properties:
                name:
                  example: Test Profile
                  type: string
                webhook_url:
                  type: string
                  example: http://example.com/webhook
                webhook_failover_url:
                  type: string
                  example: http://example.com/webhook/failover
                sms:
                  type: object
                  $ref: '#/components/schemas/UpdateVerifyProfileSMSRequest'
                  additionalProperties: true
                call:
                  type: object
                  $ref: '#/components/schemas/UpdateVerifyProfileCallRequest'
                  additionalProperties: true
                whatsapp:
                  type: object
                  $ref: '#/components/schemas/UpdateVerifyProfileSettingsWhatsAppRequest'
                  additionalProperties: true
                language:
                  type: string
                  example: en-US
                daily_spend_limit_enabled:
                  type: boolean
                  description: Whether the daily spend limit is enforced for this verify profile.
                  example: true
                daily_spend_limit:
                  type: number
                  minimum: 0
                  description: The maximum daily spend allowed on this verify profile, in USD.
                  example: 100
        required: true
      responses:
        '200':
          description: Expected Verify profile response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfileResponseDataWrapper'
        '400':
          $ref: '#/components/responses/verify_GenericErrorResponse'
      description: Updates the specified Verify profile's name, webhook destinations, language, daily spend limits, or channel-specific settings. Returns the updated profile.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    CreateMessageTemplateRequest:
      title: CreateMessageTemplateRequest
      description: The request body when creating a message template.
      required:
      - text
      type: object
      properties:
        text:
          example: 'Your {{app_name}} verification code is: {{code}}.'
          type: string
          description: The text content of the message template.
    CreateVerificationResponse:
      title: CreateVerifyVerificationResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Verification'
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    VerifyVerificationCodeResponse:
      title: VerifyVerificationCodeResponse
      required:
      - data
      type: object
      properties:
        data:
          required:
          - phone_number
          - response_code
          type: object
          properties:
            phone_number:
              example: '+13035551234'
              type: string
              description: +E164 formatted phone number.
            response_code:
              enum:
              - accepted
              - rejected
              type: string
              example: accepted
              description: Identifies if the verification code has been accepted or rejected.
    UpdateVerifyProfileCallRequest:
      title: UpdateVerifyProfileCallRequest
      type: object
      properties:
        messaging_template_id:
          example: 0abb5b4f-459f-445a-bfcd-488998b7572d
          format: uuid
          type: string
          description: The message template identifier selected from /verify_profiles/templates
        app_name:
          example: Example Secure App
          description: The name that identifies the application requesting 2fa in the verification message.
          type: string
          pattern: ^[A-Za-z0-9 -]{1,30}$
        code_length:
          example: 6
          type: integer
          description: The length of the verify code to generate.
          default: 5
        whitelisted_destinations:
          description: Enabled country destinations to send verification codes. The elements in the list must be valid ISO 3166-1 alpha-2 country codes. If set to `["*"]`, all destinations will be allowed. **Conditionally required:** this field must be provided when your organization is configured to require explicit whitelisted destinations; otherwise it is optional.
          example:
          - US
          - CA
          type: array
          items:
            description: ISO 3166-1 alpha-2 country code
            type: string
            pattern: ^[A-Z]{2}$
        default_verification_timeout_secs:
          example: 300
          description: For every request that is initiated via this Verify profile, this sets the number of seconds before a verification request code expires. Once the verification request expires, the user cannot use the code to verify their identity.
          type: integer
          default: 300
    VerifyProfileMessageTemplateResponse:
      title: VerifyProfileResponse
      type: object
      properties:
        id:
          example: 0abb5b4f-459f-445a-bfcd-488998b7572d
          format: uuid
          type: string
        text:
          example: 'Your {{app_name}} verification code is: {{code}}.'
          type: string
    ListVerifyProfileMessageTemplateResponse:
      title: ListVerifyProfileMessageTemplateResponse
      description: A list of Verify profile message templates
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VerifyProfileMessageTemplateResponse'
    CreateVerifyProfileCallRequest:
      title: CreateVerifyProfileCallRequest
      type: object
      properties:
        messaging_template_id:
          example: 0abb5b4f-459f-445a-bfcd-488998b7572d
          format: uuid
          type: string
          description: The message template identifier selected from /verify_profiles/templates
        app_name:
          example: Example Secure App
          description: The name that identifies the application requesting 2fa in the verification message.
          type: string
          pattern: ^[A-Za-z0-9 -]{1,30}$
        code_length:
          example: 6
          type: integer
          description: The length of the verify code to generate.
          default: 5
        whitelisted_destinations:
          description: Enabled country destinations to send verification codes. The elements in the list must be valid ISO 3166-1 alpha-2 country codes. If set to `["*"]`, all destinations will be allowed. **Conditionally required:** this field must be provided when your organization is configured to require explicit whitelisted destinations; otherwise it is optional.
          example:
          - US
          - CA
          type: array
          items:
            description: ISO 3166-1 alpha-2 country code
            type: string
            pattern: ^[A-Z]{2}$
        default_verification_timeout_secs:
          example: 300
          description: For every request that is initiated via this Verify profile, this sets the number of seconds before a verification request code expires. Once the verification request expires, the user cannot use the code to verify their identity.
          type: integer
          default: 300
    VerifyProfileResponseDataWrapper:
      title: VerifyProfileResponseDataWrapper
      type: object
      properties:
        data:
          type: object
          $ref: '#/components/schemas/VerifyProfileResponse'
          additionalProperties: true
    VerifyVerificationCodeRequestByPhoneNumber:
      title: VerifyVerificationCodeRequestByPhoneNumber
      required:
      - code
      - verify_profile_id
      type: object
      properties:
        code:
          example: '17686'
          type: string
          description: This is the code the user submits for verification.
        verify_profile_id:
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          type: string
          format: uuid
          description: The identifier of the associated Verify profile.
    Verification:
      title: Verification
      type: object
      properties:
        id:
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/VerificationType'
        record_type:
          $ref: '#/components/schemas/VerificationRecordType'
        phone_number:
          example: '+13035551234'
          type: string
          description: +E164 formatted phone number.
        verify_profile_id:
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          type: string
          format: uuid
          description: The identifier of the associated Verify profile.
        custom_code:
          example: '43612'
          type:
          - string
          - 'null'
          description: Send a self-generated numeric code to the end-user
          default: null
        timeout_secs:
          example: 300
          type: integer
          description: 'This is the number of seconds before the code of the request is expired. Once this request has expired, the code will no longer verify the user. Note: this will override the `default_verification_timeout_secs` on the Verify profile.'
        status:
          $ref: '#/components/schemas/VerificationStatus'
        created_at:
          example: '2020-09-14T17:03:32.965812'
          type: string
        updated_at:
          example: '2020-09-14T17:03:32.965812'
          type: string
    CreateVerificationRequestWhatsapp:
      title: CreateVerificationRequestWhatsapp
      description: The request body when creating a WhatsApp verification.
      required:
      - phone_number
      - verify_profile_id
      type: object
      properties:
        phone_number:
          example: '+13035551234'
          type: string
          description: +E164 formatted phone number.
        verify_profile_id:
