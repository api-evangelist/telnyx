openapi: 3.2.0
info:
  title: Telnyx Global IPs API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Global IPs across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Global IPs
  description: Global IPs
paths:
  /global_ip_allowed_ports:
    get:
      summary: List all Global IP Allowed Ports
      description: Returns the ports allowed for Global IP traffic, for use when configuring Global IP resources.
      operationId: ListGlobalIpAllowedPorts
      tags:
      - Global IPs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIPAllowedPort'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_assignment_health:
    description: Global IP Assignment Health Check Metrics over time
    get:
      summary: Global IP Assignment Health Check Metrics
      operationId: GetGlobalIpAssignmentHealth
      tags:
      - Global IPs
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[global_ip_id][in], filter[global_ip_assignment_id][in]'
        schema:
          type: object
          properties:
            global_ip_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
            global_ip_assignment_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP Assignment ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP Assignment ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
          additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpAssignmentHealthMetric'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
      description: Retrieve health check metrics for your Global IP assignments.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_assignments:
    get:
      summary: List all Global IP assignments
      description: Returns a paginated list of your Global IP assignments, the links between Global IPs and the WireGuard peers that receive their traffic.
      operationId: ListGlobalIpAssignments
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpAssignment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a Global IP assignment
      description: Assigns a Global IP to a WireGuard peer so traffic destined for the IP is delivered over that peer's tunnel. Assignment is asynchronous, so the request is accepted and completes in the background.
      operationId: CreateGlobalIpAssignment
      tags:
      - Global IPs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalIpAssignment'
        required: true
      responses:
        '202':
          description: Assignment request accepted. Provisioning is asynchronous; poll GET /global_ip_assignments/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIpAssignment'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_assignments/usage:
    description: Global IP Assignment Usage Metrics over time
    get:
      summary: Global IP Assignment Usage Metrics
      operationId: GetGlobalIpAssignmentUsage
      tags:
      - Global IPs
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[global_ip_assignment_id][in], filter[global_ip_id][in]'
        schema:
          type: object
          properties:
            global_ip_assignment_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP Assignment ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP Assignment ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
            global_ip_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
          additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpAssignmentUsageMetric'
        '422':
          $ref: '#/components/responses/netapps_GenericErrorResponse'
        default:
          $ref: '#/components/responses/netapps_GenericErrorResponse'
      x-latency-category: responsive
      description: Retrieve usage metrics for your Global IP assignments.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_assignments/{id}:
    delete:
      summary: Delete a Global IP assignment
      description: Deletes the specified Global IP assignment, detaching the Global IP from its WireGuard peer.
      operationId: DeleteGlobalIpAssignment
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIpAssignment'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve a Global IP assignment
      description: Returns the details of a single Global IP assignment, including the Global IP and WireGuard peer it links.
      operationId: GetGlobalIpAssignment
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIpAssignment'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update a Global IP assignment
      description: Updates the specified Global IP assignment with the provided fields and returns the updated assignment.
      operationId: UpdateGlobalIpAssignment
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalIpAssignmentUpdate'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIpAssignment'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_assignments_usage:
    description: Global IP Assignment Usage Metrics over time
    get:
      summary: Global IP Assignment Usage Metrics
      operationId: GetGlobalIpAssignmentUsage_2
      tags:
      - Global IPs
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[global_ip_assignment_id][in], filter[global_ip_id][in]'
        schema:
          type: object
          properties:
            global_ip_assignment_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP Assignment ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP Assignment ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
            global_ip_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
          additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpAssignmentUsageMetric'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
      description: Retrieve usage metrics for your Global IP assignments.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_health_check_types:
    get:
      summary: List all Global IP Health check types
      description: Returns the health check types available for Global IPs, for use when creating Global IP health checks.
      operationId: ListGlobalIpHealthCheckTypes
      tags:
      - Global IPs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpHealthCheckType'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_health_checks:
    get:
      summary: List all Global IP health checks
      description: Returns a paginated list of the Global IP health checks configured on your account.
      operationId: ListGlobalIpHealthChecks
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIPHealthCheck'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a Global IP health check
      description: Creates a health check for a Global IP to monitor the health of its assignments. Creation is asynchronous, so the request is accepted and the health check becomes active once provisioning completes.
      operationId: CreateGlobalIpHealthCheck
      tags:
      - Global IPs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalIPHealthCheck'
        required: true
      responses:
        '202':
          description: Creation request accepted. Provisioning is asynchronous; poll GET /global_ip_health_checks/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIPHealthCheck'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_health_checks/{id}:
    delete:
      summary: Delete a Global IP health check
      description: Deletes the specified Global IP health check so it no longer monitors the Global IP's assignments.
      operationId: DeleteGlobalIpHealthCheck
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIPHealthCheck'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve a Global IP health check
      description: Returns the details of a single Global IP health check, including its type and configuration.
      operationId: GetGlobalIpHealthCheck
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIPHealthCheck'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_latency:
    description: Global IP Latency Metrics over time
    get:
      summary: Global IP Latency Metrics
      operationId: GetGlobalIpLatency
      tags:
      - Global IPs
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[global_ip_id][in]'
        schema:
          type: object
          properties:
            global_ip_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
          additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpLatencyMetric'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
      description: Retrieve latency metrics measured for your Global IPs.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_protocols:
    get:
      summary: List all Global IP Protocols
      description: Returns the network protocols supported for Global IP traffic, for use when configuring Global IP resources.
      operationId: ListGlobalIpProtocols
      tags:
      - Global IPs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIPProtocol'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ip_usage:
    description: Global IP Usage Metrics over time
    get:
      summary: Global IP Usage Metrics
      operationId: GetGlobalIpUsage
      tags:
      - Global IPs
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[global_ip_id][in]'
        schema:
          type: object
          properties:
            global_ip_id:
              oneOf:
              - type: string
                description: Filter by exact Global IP ID
              - type: object
                properties:
                  in:
                    type: string
                    description: Filter by Global IP ID(s) separated by commas
                additionalProperties: false
                description: Filtering operations
          additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIpUsageMetric'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
      description: Retrieve usage metrics for your Global IPs.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ips:
    get:
      summary: List all Global IPs
      description: Returns a paginated list of the Global IPs on your account, including each IP's address and configuration.
      operationId: ListGlobalIps
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIP'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a Global IP
      description: Requests creation of a new Global IP, a static IP address announced from the Telnyx network. Provisioning is asynchronous, so the request is accepted and the Global IP becomes available once provisioning completes.
      operationId: CreateGlobalIp
      tags:
      - Global IPs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalIP'
        required: true
      responses:
        '202':
          description: Creation request accepted. Provisioning is asynchronous; poll GET /global_ips/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIP'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /global_ips/{id}:
    delete:
      summary: Delete a Global IP
      description: Deletes the specified Global IP and releases its address back to Telnyx.
      operationId: DeleteGlobalIp
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIP'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve a Global IP
      description: Returns the details of a single Global IP, including its address and current configuration.
      operationId: GetGlobalIp
      tags:
      - Global IPs
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GlobalIP'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    GlobalIPProtocol:
      allOf:
      - type: object
        title: Global IP Protocol
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: global_ip_protocol
          code:
            type: string
            description: The Global IP Protocol code.
            readOnly: true
            example: tcp
          name:
            type: string
            description: A name for Global IP Protocol.
            example: TCP
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    GlobalIpLatencyMetric:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: The timestamp of the metric.
          example: '2020-01-01T00:00:00.000Z'
        global_ip:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Global IP ID.
              example: a836125b-20b6-452e-9c03-2653f09c7ed7
            ip_address:
              type: string
              description: The Global IP address.
              readOnly: true
              example: 192.0.2.1
        prober_location:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Location ID.
              example: a836125b-20b6-452e-9c03-2653f09c7ed7
            name:
              type: string
              description: Location name.
              example: Amsterdam
            lat:
              type: number
              description: Latitude.
              example: 52.370216
            lon:
              type: number
              description: Longitude.
              example: 4.895168
        mean_latency:
          type: object
          properties:
            amount:
              type: number
              description: The average latency.
              example: 100
            unit:
              type: string
              description: The unit of the average latency.
              example: ms
        percentile_latency:
          type: object
          properties:
            '0':
              type: object
              properties:
                amount:
                  type: number
                  description: The minimum latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the minimum latency.
                  example: ms
            '25':
              type: object
              properties:
                amount:
                  type: number
                  description: The 25th percentile latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the 25th percentile latency.
                  example: ms
            '50':
              type: object
              properties:
                amount:
                  type: number
                  description: The 50th percentile latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the 50th percentile latency.
                  example: ms
            '75':
              type: object
              properties:
                amount:
                  type: number
                  description: The 75th percentile latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the 75th percentile latency.
                  example: ms
            '90':
              type: object
              properties:
                amount:
                  type: number
                  description: The 90th percentile latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the 90th percentile latency.
                  example: ms
            '99':
              type: object
              properties:
                amount:
                  type: number
                  description: The 99th percentile latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the 99th percentile latency.
                  example: ms
            '100':
              type: object
              properties:
                amount:
                  type: number
                  description: The maximum latency.
                  example: 100
                unit:
                  type: string
                  description: The unit of the maximum latency.
                  example: ms
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    netapps_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/netapps_Error'
      type: object
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    GlobalIpUsageMetric:
      type: object
      properties:
        timestamp:
          type: string
