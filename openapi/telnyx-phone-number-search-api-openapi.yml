      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    Feature:
      properties:
        name:
          type: string
          example: sms
      example:
        name: sms
      type: object
    AvailablePhoneNumberBlock:
      type: object
      properties:
        record_type:
          type: string
          example: available_phone_number_block
          enum:
          - available_phone_number_block
        phone_number:
          type: string
          example: '+19705555000'
        range:
          type: integer
          example: 10
        region_information:
          type: array
          items:
            $ref: '#/components/schemas/RegionInformation'
        cost_information:
          $ref: '#/components/schemas/CostInformation'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
      example:
        record_type: available_phone_number_block
        phone_number: '+19705555000'
        range: 10
        region_information:
        - region_type: country_code
          region_name: US
        cost_information:
          upfront_cost: '3.21'
          monthly_cost: '6.54'
          currency: USD
        features:
        - name: sms
        - name: voice
    CostInformation:
      type: object
      properties:
        upfront_cost:
          type: string
          example: '3.21'
        monthly_cost:
          type: string
          example: '6.54'
        currency:
          type: string
          description: The ISO 4217 code for the currency.
          example: USD
      example:
        upfront_cost: '3.21'
        monthly_cost: '6.54'
        currency: USD
    AvailablePhoneNumber:
      type: object
      properties:
        record_type:
          type: string
          example: available_phone_number
          enum:
          - available_phone_number
        phone_number:
          type: string
          example: '+19705555098'
        vanity_format:
          type: string
        best_effort:
          type: boolean
          description: Specifies whether the phone number is an exact match based on the search criteria or not.
          example: false
        quickship:
          type: boolean
          description: Specifies whether the phone number can receive calls immediately after purchase or not.
          example: true
        reservable:
          type: boolean
          description: Specifies whether the phone number can be reserved before purchase or not.
          example: true
        region_information:
          type: array
          items:
            $ref: '#/components/schemas/RegionInformation'
        cost_information:
          $ref: '#/components/schemas/CostInformation'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
      example:
        record_type: available_phone_number
        phone_number: '+19705555098'
        vanity_format: ''
        best_effort: false
        quickship: true
        reservable: true
        region_information:
        - region_type: country_code
          region_name: US
        cost_information:
          upfront_cost: '3.21'
          monthly_cost: '6.54'
          currency: USD
        features:
        - name: sms
        - name: voice
    RegionInformation:
      properties:
        region_type:
          type: string
          example: country_code
          enum:
          - country_code
          - rate_center
          - state
          - location
        region_name:
          type: string
          example: US
      example:
        region_type: country_code
        region_name: US
      type: object
    numbers_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/numbers_Error'
          type: array
      type: object
    numbers_Error:
      properties:
        code:
          example: '10007'
          type: string
        detail:
          example: An unexpected error occured.
          type: string
        meta:
          properties:
            url:
              description: URL with additional information on the error.
              example: https://developers.telnyx.com/docs/overview/errors/10015
              type: string
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              example: /base
              type: string
          type: object
        title:
          example: Unexpected error
          type: string
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
