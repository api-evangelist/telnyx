openapi: 3.2.0
info:
  title: Telnyx Outbound Voice Profiles API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Outbound Voice Profiles across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Outbound Voice Profiles
  description: Outbound voice profiles operations
paths:
  /outbound_voice_profiles:
    get:
      description: Get all outbound voice profiles belonging to the user that match the given filters.
      summary: Get all outbound voice profiles
      operationId: ListOutboundVoiceProfiles
      tags:
      - Outbound Voice Profiles
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/outbound-voice-profiles_PageConsolidated'
      - $ref: '#/components/parameters/outbound-voice-profiles_FilterConsolidated'
      - $ref: '#/components/parameters/SortOutboundVoiceProfile'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: List Outbound Voice Profiles Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboundVoiceProfile'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '422':
          description: Bad request
    post:
      description: Creates a new outbound voice profile defining calling permissions, destinations, and limits for outbound calls, and returns the created profile.
      summary: Create an outbound voice profile
      operationId: CreateVoiceProfile
      tags:
      - Outbound Voice Profiles
      requestBody:
        description: Parameters that can be defined when creating an outbound voice profile
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutboundVoiceProfileRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Outbound Voice Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/OutboundVoiceProfile'
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '422':
          description: Bad request
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /outbound_voice_profiles/{id}:
    delete:
      description: Deletes an existing outbound voice profile.
      summary: Delete an outbound voice profile
      operationId: DeleteOutboundVoiceProfile
      tags:
      - Outbound Voice Profiles
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Outbound Voice Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/OutboundVoiceProfile'
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '422':
          description: Bad request
    get:
      description: Retrieves the details of an existing outbound voice profile.
      summary: Retrieve an outbound voice profile
      operationId: GetOutboundVoiceProfile
      tags:
      - Outbound Voice Profiles
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Outbound Voice Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/OutboundVoiceProfile'
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '422':
          description: Bad request
    patch:
      description: Updates an existing outbound voice profile.
      summary: Updates an existing outbound voice profile
      operationId: UpdateOutboundVoiceProfile
      tags:
      - Outbound Voice Profiles
      requestBody:
        description: Parameters that can be updated on an outbound voice profile
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutboundVoiceProfileRequest'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Outbound Voice Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/OutboundVoiceProfile'
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '409':
          description: Conflict. Another update to this outbound voice profile is still in progress. Wait and retry the request later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/outbound-voice-profiles_ErrorResponse'
              example:
                errors:
                - detail: A previous update to this outbound voice profile is still in progress. Please try again later.
        '422':
          description: Bad request
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
