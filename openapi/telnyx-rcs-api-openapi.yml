openapi: 3.2.0
info:
  title: Telnyx RCS API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged RCS across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: RCS
  description: Send RCS messages
paths:
  /messages/rcs:
    post:
      tags:
      - RCS
      summary: Send an RCS message
      operationId: SendRCSMessage
      requestBody:
        description: RCS message body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RCSMessage'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Queues an outbound RCS message through the selected RCS agent. Check recipient capabilities before sending features that require RCS support.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messages/rcs/deeplinks/{agent_id}:
    get:
      summary: Generate RCS deeplink
      description: Generate a deeplink URL that can be used to start an RCS conversation with a specific agent.
      operationId: GenerateRCSDeeplink
      tags:
      - RCS
      parameters:
      - name: agent_id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      - name: phone_number
        in: query
        description: Phone number in E164 format (URL encoded)
        required: false
        schema:
          type: string
        example: '%2B18445550001'
      - name: body
        in: query
        description: Pre-filled message body (URL encoded)
        required: false
        schema:
          type: string
        example: hello%20world
      responses:
        '200':
          description: Successful response with deeplink URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSDeeplinkResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messages/rcs_deeplinks/{agent_id}:
    get:
      summary: Generate RCS deeplink
      description: Generate a deeplink URL that can be used to start an RCS conversation with a specific agent.
      operationId: GenerateRCSDeeplink_2
      tags:
      - RCS
      parameters:
      - name: agent_id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      - name: phone_number
        in: query
        description: Phone number in E164 format (URL encoded)
        required: false
        schema:
          type: string
        example: '%2B18445550001'
      - name: body
        in: query
        description: Pre-filled message body (URL encoded)
        required: false
        schema:
          type: string
        example: hello%20world
      responses:
        '200':
          description: Successful response with deeplink URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSDeeplinkResponse'
        4XX:
          $ref: '#/components/responses/rcs_messaging_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging/rcs/agents:
    get:
      summary: List all RCS agents
      operationId: ListRCSAgents
      tags:
      - RCS
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful reponse with the list of RCS agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messaging_RCSAgentsResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns RCS agents available to the authenticated account.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging/rcs/agents/{id}:
    get:
      summary: Retrieve an RCS agent
      operationId: GetRCSAgentById
      tags:
      - RCS
      parameters:
      - name: id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with the RCS agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSAgentResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the configuration and current state of the specified RCS agent.
    patch:
      summary: Modify an RCS agent
      operationId: UpdateRCSAgentById
      tags:
      - RCS
      parameters:
      - name: id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RCSAgentUpdate'
      responses:
        '200':
          description: Successful response with the updated RCS agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSAgentResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Updates the supplied configuration fields on the specified RCS agent.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging/rcs/bulk_capabilities:
    post:
      summary: Check RCS capabilities (batch)
      operationId: ListRCSCapabilitiesOfAPhoneNumbersBatch
      tags:
      - RCS
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RCSCapabilityListRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSCapabilitiesBulk'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns RCS capability information for multiple recipients in one request.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging/rcs/capabilities/{agent_id}/{phone_number}:
    get:
      summary: Check RCS capabilities
      operationId: ListRCSCapabilitiesOfAPhoneNumber
      tags:
      - RCS
      parameters:
      - name: agent_id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      - name: phone_number
        in: path
        description: Phone number in E164 format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSCapabilitiesSingle'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the RCS features supported by the specified recipient for the selected agent.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging/rcs/test_number_invite/{id}/{phone_number}:
    put:
      summary: Add RCS test number
      description: Adds a test phone number to an RCS agent for testing purposes.
      operationId: InviteATestNumberToRCS
      tags:
      - RCS
      parameters:
      - name: id
        in: path
        description: RCS agent ID
        required: true
        schema:
          type: string
      - name: phone_number
        in: path
        description: Phone number in E164 format to invite for testing
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Test number successfully invited to RCS agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSTestNumberInviteResponse'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    RCSMessage:
      required:
      - agent_id
      - to
      - messaging_profile_id
      - agent_message
      type: object
      properties:
        agent_id:
          type: string
          description: RCS Agent ID
          example: Agent007
        to:
          type: string
          description: Phone number in +E.164 format
          example: '+13125551234'
        messaging_profile_id:
          type: string
          description: A valid messaging profile ID
        type:
          type: string
          description: Message type - must be set to "RCS"
          example: RCS
          enum:
          - RCS
        webhook_url:
          description: The URL where webhooks related to this message will be sent.
          type: string
          format: url
        agent_message:
          $ref: '#/components/schemas/RCSAgentMessage'
        sms_fallback:
          $ref: '#/components/schemas/SMSFallback'
        mms_fallback:
          $ref: '#/components/schemas/MMSFallback'
    RCSTestNumberInviteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            record_type:
              type: string
              example: rcs.test_number_invite
              enum:
              - rcs.test_number_invite
              description: Identifies the type of the resource
            agent_id:
              type: string
              example: TestAgent
              description: RCS agent ID
            phone_number:
              type: string
              example: '+13125551234'
              description: Phone number that was invited for testing
            status:
              type: string
              example: PENDING
              description: Status of the test number invitation
      required:
      - data
    RCSContentMessage:
      type: object
      properties:
        suggestions:
          type: array
          description: List of suggested actions and replies
          items:
            $ref: '#/components/schemas/RCSSuggestion'
        text:
          type: string
          description: Text (maximum 3072 characters)
          example: Hello world!
        rich_card:
          $ref: '#/components/schemas/RCSRichCard'
        content_info:
          $ref: '#/components/schemas/RCSContentInfo'
    RCSAction:
      type: object
      description: When tapped, initiates the corresponding native action on the device.
      properties:
        text:
          type: string
          description: Text that is shown in the suggested action. Maximum 25 characters.
          example: Hello world
        postback_data:
          type: string
          description: Payload (base64 encoded) that will be sent to the agent in the user event that results when the user taps the suggested action. Maximum 2048 characters.
        fallback_url:
          type: string
          description: Fallback URL to use if a client doesn't support a suggested action. Fallback URLs open in new browser windows. Maximum 2048 characters.
          format: url
        dial_action:
          $ref: '#/components/schemas/RCSDialAction'
        view_location_action:
          $ref: '#/components/schemas/RCSViewLocationAction'
        create_calendar_event_action:
          $ref: '#/components/schemas/RCSCreateCalendarEventAction'
        open_url_action:
          $ref: '#/components/schemas/RCSOpenUrlAction'
        share_location_action:
          $ref: '#/components/schemas/RCSShareLocationAction'
    RCSAgentMessage:
      type: object
      properties:
        content_message:
          $ref: '#/components/schemas/RCSContentMessage'
        event:
          $ref: '#/components/schemas/RCSEvent'
        expire_time:
          type: string
          format: date-time
          description: Timestamp in UTC of when this message is considered expired
          example: '2024-10-02T15:01:23Z'
        ttl:
          type: string
          description: Duration in seconds ending with 's'
          example: 10.5s
    RCSOpenUrlAction:
      required:
      - url
      - application
      - webview_view_mode
      type: object
      description: Opens the user's default web browser app to the specified URL.
      properties:
        url:
          type: string
          format: url
          example: http://example.com
        application:
          type: string
          example: BROWSER
          description: URL open application, browser or webview.
          enum:
          - OPEN_URL_APPLICATION_UNSPECIFIED
          - BROWSER
          - WEBVIEW
        webview_view_mode:
          type: string
          example: HALF
          enum:
          - WEBVIEW_VIEW_MODE_UNSPECIFIED
          - FULL
          - HALF
          - TALL
        description:
          type: string
          description: Accessbility description for webview.
    RCSDeeplinkResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            url:
              type: string
              description: The generated deeplink URL
              example: sms:+18445550001?service_id=my_agent_id%40rbm.goog&body=hello%20world
          required:
          - url
      required:
      - data
    RCSAgent:
      type: object
      properties:
        agent_id:
          type: string
          description: RCS Agent ID
          example: TestAgent
        user_id:
          type: string
          description: User ID associated with the RCS Agent
          example: 2ecf295b-36c6-4d43-ad05-71eb1e560518
        profile_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Messaging profile ID associated with the RCS Agent
          example: 4001932a-b8a3-42fc-9389-021be6388909
        webhook_url:
          type:
          - string
          - 'null'
          format: url
          description: URL to receive RCS events
          example: http://example.com
        webhook_failover_url:
          type:
          - string
          - 'null'
          format: url
          description: Failover URL to receive RCS events
          example: http://example.com
        agent_name:
          type: string
          description: Human readable agent name
          example: Test Agent
        enabled:
          type: boolean
          description: Specifies whether the agent is enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: Date and time when the resource was created
          example: '2024-01-01T12:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: Date and time when the resource was updated
          example: '2024-01-01T12:00:00.000Z'
    RCSShareLocationAction:
      type: object
      description: Opens the RCS app's location chooser so the user can pick a location to send back to the agent.
    RCSCreateCalendarEventAction:
      type: object
      description: Opens the user's default calendar app and starts the new calendar event flow with the agent-specified event data pre-filled.
      properties:
        start_time:
          type: string
          format: date-time
          example: '2024-10-02T15:01:23Z'
        end_time:
          type: string
          format: date-time
          example: '2024-10-02T15:02:31Z'
        title:
          type: string
          description: Event title. Maximum 100 characters.
        description:
          type: string
          description: Event description. Maximum 500 characters.
    messaging_PaginationMeta_0b38e7044b:
      type: object
      required:
      - total_pages
      - total_results
      - page_size
      - page_number
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    RCSCapabilitiesInternal:
      type: object
      properties:
        record_type:
          type: string
          example: rcs.capabilities
          enum:
          - rcs.capabilities
          description: Identifies the type of the resource
        phone_number:
          type: string
          example: '+13125551234'
          description: Phone number
        agent_id:
          type: string
          example: TestAgent
          description: RCS agent ID
        agent_name:
          type: string
          example: Testing agent
          description: RCS agent name
        features:
          type: array
          description: List of RCS capabilities
          items:
            type: string
    RCSCapabilitiesBulk:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RCSCapabilitiesInternal'
    RCSTo:
      type: array
      items:
        $ref: '#/components/schemas/RCSToItem'
    RCSContentInfo:
      required:
      - file_url
      type: object
      properties:
        file_url:
          type: string
          format: url
          description: Publicly reachable URL of the file.
          example: https://example.com/elephant.jpg
        thumbnail_url:
          type: string
          format: url
          description: Publicly reachable URL of the thumbnail. Maximum size of 100 kB.
        force_refresh:
          type: boolean
          description: If set the URL content will not be cached.
    RCSReply:
      type: object
      properties:
        text:
          type: string
          description: Text that is shown in the suggested reply (maximum 25 characters)
        postback_data:
          type: string
          description: Payload (base64 encoded) that will be sent to the agent in the user event that results when the user taps the suggested action. Maximum 2048 characters.
    RCSCarouselCard:
      required:
      - card_width
      - card_contents
      type: object
      description: Carousel of cards.
      properties:
        card_width:
          type: string
          example: SMALL
          description: The width of the cards in the carousel.
          enum:
          - CARD_WIDTH_UNSPECIFIED
          - SMALL
          - MEDIUM
        card_contents:
          description: The list of contents for each card in the carousel. A carousel can have a minimum of 2 cards and a maximum 10 cards.
          type: array
          items:
            $ref: '#/components/schemas/RCSCardContent'
    RCSStandaloneCard:
      required:
      - card_orientation
      - thumbnail_image_alignment
      - card_content
      type: object
      description: Standalone card
      properties:
        card_orientation:
          type: string
          example: HORIZONTAL
          description: Orientation of the card.
          enum:
          - CARD_ORIENTATION_UNSPECIFIED
          - HORIZONTAL
          - VERTICAL
        thumbnail_image_alignment:
          type: string
          example: LEFT
          description: Image preview alignment for standalone cards with horizontal layout.
          enum:
          - THUMBNAIL_IMAGE_ALIGNMENT_UNSPECIFIED
          - LEFT
          - RIGHT
        card_content:
          $ref: '#/components/schemas/RCSCardContent'
    RCSMedia:
      type: object
      description: A media file within a rich card.
      properties:
        height:
          type: string
          example: MEDIUM
          description: The height of the media within a rich card with a vertical layout. For a standalone card with horizontal layout, height is not customizable, and this field is ignored.
          enum:
          - HEIGHT_UNSPECIFIED
          - SHORT
          - MEDIUM
          - TALL
        content_info:
          $ref: '#/components/schemas/RCSContentInfo'
    RCSCapabilityListRequest:
      type: object
      required:
      - agent_id
      - phone_numbers
      properties:
        agent_id:
          type: string
          description: RCS Agent ID
          example: TestAgent
        phone_numbers:
          type: array
          items:
            type: string
            example: '+13125551234'
          description: List of phone numbers to check
    messaging_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    RCSSuggestion:
      type: object
      properties:
        reply:
          $ref: '#/components/schemas/RCSReply'
        action:
          $ref: '#/components/schemas/RCSAction'
    RCSCapabilitiesSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RCSCapabilitiesInternal'
    RCSEvent:
      type: object
      description: RCS Event to send to the recipient
      properties:
        event_type:
          type: string
          example: IS_TYPING
          enum:
          - TYPE_UNSPECIFIED
          - IS_TYPING
          - READ
    RCSResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            record_type:
              type: string
              example: message
            direction:
              type: string
              example: outbound
            id:
              type: string
              description: message ID
              example: 4031938e-60e4-4235-a8dd-0b1c55a23e7a
            type:
              type: string
              example: RCS
            organization_id:
              type: string
              example: 9f61d8e1-7687-4d6d-9cae-9ff682985983
            messaging_profile_id:
              type: string
              example: 4001781e-626f-4a41-a914-b1b682150f94
            from:
              $ref: '#/components/schemas/RCSFrom'
            to:
              $ref: '#/components/schemas/RCSTo'
            body:
              $ref: '#/components/schemas/RCSAgentMessage'
            encoding:
              type: string
              example: utf-8
            received_at:
              type: string
              format: date-time
            wait_seconds:
              type:
              - number
              - 'null'
              format: float
              description: Seconds the message is queued due to rate limiting before being sent to the carrier. Represents the maximum wait across all applicable rate limits (account, carrier, campaign). 0.0 = no queuing delay.
              example: 0.5
    MMSFallback:
      type: object
      properties:
        from:
          type: string
          description: Phone number in +E.164 format
          example: '+13125551234'
        subject:
          type: string
          description: Subject of the message
          example: Test Message
        media_urls:
          type: array
          description: List of media URLs
          items:
            type: string
        text:
          type: string
          description: Text
          example: Hello world!
    RCSCardContent:
      type: object
      properties:
        title:
          type: string
          description: Title of the card (at most 200 characters)
          example: Elephant
        description:
          type: string
          description: Description of the card (at most 2000 characters)
        media:
          $ref: '#/components/schemas/RCSMedia'
        suggestions:
          type: array
          description: List of suggestions to include in the card. Maximum 10 suggestions.
          items:
            $ref: '#/components/schemas/RCSSuggestion'
    RCSDialAction:
      required:
      - phone_number
      type: object
      description: Opens the user's default dialer app with the agent-specified phone number filled in.
      properties:
        phone_number:
          type: string
          description: Phone number in +E.164 format
          example: '+13125551234'
    SMSFallback:
      type: object
      properties:
        from:
          type: string
          description: Phone number in +E.164 format
          example: '+13125551234'
        text:
          type: string
          description: Text (maximum 3072 characters)
          example: Hello world!
    messaging_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/messaging_Error'
    RCSRichCard:
      type: object
      properties:
        carousel_card:
          $ref: '#/components/schemas/RCSCarouselCard'
        standalone_card:
          $ref: '#/components/schemas/RCSStandaloneCard'
    messaging_Error_0b38e7044b:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    messaging_Errors_0b38e7044b:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/messaging_Error_0b38e7044b'
    messaging_RCSAgentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RCSAgent'
        meta:
          $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
    RCSAgentUpdate:
      type: object
      properties:
        profile_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Messaging profile ID associated with the RCS Agent
          example: 4001932a-b8a3-42fc-9389-021be6388909
        webhook_url:
          type:
          - string
          - 'null'
          format: url
          description: URL to receive RCS events
          example: http://example.com
        webhook_failover_url:
          type:
          - string
          - 'null'
          format: url
          description: Failover URL to receive RCS events
