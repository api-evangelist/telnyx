          default: US
        comments:
          type: string
          maxLength: 255
          title: Comments
          default: ''
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
          title: Quantity
          default: 1
        area_code:
          type: string
          maxLength: 3
          title: Area Code
          default: ''
        phone_number_type:
          type: string
          enum:
          - local
          - mobile
          - toll_free
          - shared_cost
          - national
          - landline
