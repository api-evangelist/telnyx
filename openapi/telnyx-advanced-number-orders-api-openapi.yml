tags:
- name: Advanced Number Orders
paths:
  /advanced_orders:
    get:
      summary: List Advanced Orders
      tags:
      - Advanced Number Orders
      operationId: list_advanced_orders_v2
      responses:
        '200':
          $ref: '#/components/responses/ListAdvancedOrderResponse'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the advanced number orders associated with the account. Each result includes the order configuration and its current state.
    post:
      summary: Create Advanced Order
      operationId: create_advanced_order_v2
      tags:
      - Advanced Number Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancedOrderRequest'
      responses:
        '200':
          description: An Advanced Order Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedOrder'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Creates an advanced number order from the requested order configuration. The response contains the resulting advanced order and its initial state.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /advanced_orders/{advanced-order-id}/requirement_group:
    patch:
      summary: Update Advanced Order
      operationId: update_advanced_order_v2
      parameters:
      - name: advanced-order-id
        in: path
        description: Unique identifier of the advanced order.
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      tags:
      - Advanced Number Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancedOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdvancedOrderResponse'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Updates the requirement-group configuration for the specified advanced number order. The response contains the updated advanced order.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /advanced_orders/{order_id}:
    get:
      summary: Get Advanced Order
      operationId: get_advanced_order_v2
      parameters:
      - name: order_id
        in: path
        description: Unique identifier of the order.
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      tags:
      - Advanced Number Orders
      responses:
        '200':
          $ref: '#/components/responses/AdvancedOrderResponse'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the advanced number order identified by `order_id`, including its configuration and current state.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
