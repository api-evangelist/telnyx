  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Advanced Number Orders across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
