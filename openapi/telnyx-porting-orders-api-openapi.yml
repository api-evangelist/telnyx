openapi: 3.2.0
info:
  title: Telnyx Porting Orders API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Porting Orders across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Porting Orders
  description: Endpoints related to porting orders management.
paths:
  /porting/events:
    get:
      summary: List all porting events
      tags:
      - Porting Orders
      description: Returns a paginated list of porting-related events on your account, such as status changes on porting orders. Supports filtering and is useful for auditing or reconciling webhook deliveries.
      operationId: listPortingEvents
      parameters:
      - $ref: '#/components/parameters/porting-order_PageConsolidated'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[type], filter[porting_order_id], filter[created_at][gte], filter[created_at][lte]'
        schema:
          type: object
          properties:
            type:
              type: string
              enum:
              - porting_order.deleted
              - porting_order.loa_updated
              - porting_order.messaging_changed
              - porting_order.status_changed
              - porting_order.sharing_token_expired
              - porting_order.new_comment
              - porting_order.split
              example: porting_order.deleted
              description: Filter by event type.
            porting_order_id:
              type: string
              format: uuid
              example: 34dc46a9-53ed-4e01-9454-26227ea13326
              description: Filter by porting order ID.
            created_at:
              type: object
              properties:
                gte:
                  type: string
                  format: date-time
                  description: Filter by created at greater than or equal to.
                  example: '2021-01-01T00:00:00Z'
                lte:
                  type: string
                  format: date-time
                  description: Filter by created at less than or equal to.
                  example: '2021-01-01T00:00:00Z'
              description: Created at date range filtering operations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          description: Unprocessable entity. Check the 'detail' field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/events/{id}:
    get:
      summary: Show a porting event
      tags:
      - Porting Orders
      description: Returns the details of a single porting event, including its type and payload.
      operationId: showPortingEvent
      parameters:
      - name: id
        description: Identifies the porting event.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingEvent'
        '404':
          description: Not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/events/{id}/republish:
    post:
      summary: Republish a porting event
      tags:
      - Porting Orders
      description: Republishes the specified porting event, triggering re-delivery of the corresponding webhook to your account.
      operationId: republishPortingEvent
      parameters:
      - name: id
        description: Identifies the porting event.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '404':
          description: Not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/loa_configurations:
    get:
      tags:
      - Porting Orders
      summary: List LOA configurations
      description: Returns a paginated list of your LOA (Letter of Authorization) configurations. LOA configurations customize the company details and branding used on generated LOA documents.
      operationId: ListLoaConfigurations
      parameters:
      - $ref: '#/components/parameters/porting-order_PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingLOAConfiguration'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    post:
      tags:
      - Porting Orders
      summary: Create a LOA configuration
      description: Creates a new LOA configuration with your company details and branding for use when generating LOA documents for porting orders.
      operationId: CreateLoaConfiguration
      requestBody:
        $ref: '#/components/requestBodies/CreatePortingLOAConfiguration'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingLOAConfiguration'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/loa_configurations/preview:
    post:
      tags:
      - Porting Orders
      summary: Preview the LOA configuration parameters
      description: Preview the LOA template that would be generated without need to create LOA configuration.
      operationId: PreviewLoaConfigurationParams
      requestBody:
        $ref: '#/components/requestBodies/CreatePortingLOAConfiguration'
      responses:
        '200':
          description: Successful response
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                example: '%PDF-1.4...'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/loa_configurations/{id}:
    delete:
      tags:
      - Porting Orders
      summary: Delete a LOA configuration
      description: Permanently deletes the specified LOA configuration so it can no longer be used when generating LOA documents.
      operationId: DeleteLoaConfiguration
      parameters:
      - name: id
        description: Identifies a LOA configuration.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    get:
      tags:
      - Porting Orders
      summary: Retrieve a LOA configuration
      description: Returns the details of a single LOA (Letter of Authorization) configuration by its identifier.
      operationId: GetLoaConfiguration
      parameters:
      - name: id
        description: Identifies a LOA configuration.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingLOAConfiguration'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    patch:
      tags:
      - Porting Orders
      summary: Update a LOA configuration
      description: Updates the specified LOA configuration with the provided fields and returns the updated configuration.
      operationId: UpdateLoaConfiguration
      parameters:
      - name: id
        description: Identifies a LOA configuration.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CreatePortingLOAConfiguration'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingLOAConfiguration'
        '404':
          description: Resource not found
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/loa_configurations/{id}/preview:
    get:
      tags:
      - Porting Orders
      summary: Preview a LOA configuration
      description: Renders a preview of the LOA document produced by this configuration so you can verify company details and branding before using it on porting orders.
      operationId: PreviewLoaConfiguration
      parameters:
      - name: id
        description: Identifies a LOA configuration.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                example: '%PDF-1.4...'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/reports:
    get:
      tags:
      - Porting Orders
      summary: List porting related reports
      description: List the reports generated about porting operations.
      operationId: ListPortingReports
      parameters:
      - $ref: '#/components/parameters/porting-order_PageConsolidated'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[report_type], filter[status]'
        schema:
          type: object
          properties:
            report_type:
              type: string
              enum:
              - export_porting_orders_csv
              example: export_porting_orders_csv
              description: Filter reports of a specific type
            status:
              type: string
              enum:
              - pending
              - completed
              example: completed
              description: Filter reports of a specific status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingReport'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    post:
      tags:
      - Porting Orders
      summary: Create a porting related report
      description: Generate reports about porting operations.
      operationId: CreatePortingReport
      requestBody:
        $ref: '#/components/requestBodies/CreatePortingReport'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingReport'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/reports/{id}:
    get:
      tags:
      - Porting Orders
      summary: Retrieve a report
      description: Returns the details of a previously requested porting report, including its status and parameters.
      operationId: GetPortingReport
      parameters:
      - name: id
        description: Identifies a report.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingReport'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting/uk_carriers:
    get:
      summary: List available carriers in the UK
      tags:
      - Porting Orders
      description: Returns the list of UK carriers available for porting, for use when preparing porting orders for UK numbers.
      operationId: listPortingUKCarriers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingUKCarrier'
        '422':
          description: Unprocessable entity. Check message field in response for details.
        '500':
          description: Internal server error
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting_orders:
    get:
      summary: List all porting orders
      tags:
      - Porting Orders
      description: Returns a paginated list of your porting orders. Supports filtering and sorting, and can optionally include the phone numbers attached to each order.
      operationId: ListPortingOrders
      parameters:
      - $ref: '#/components/parameters/porting-order_PageConsolidated'
      - $ref: '#/components/parameters/QueryIncludePhoneNumbers'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[customer_reference], filter[customer_group_reference], filter[parent_support_key], filter[phone_numbers.country_code], filter[phone_numbers.carrier_name], filter[misc.type], filter[end_user.admin.entity_name], filter[end_user.admin.auth_person_name], filter[activation_settings.fast_port_eligible], filter[activation_settings.foc_datetime_requested][gt], filter[activation_settings.foc_datetime_requested][lt], filter[phone_numbers.phone_number][contains]'
        schema:
          type: object
          properties:
            customer_reference:
              type: string
              description: Filter results by customer_reference
            customer_group_reference:
              type: string
              description: Filter results by customer_group_reference
            parent_support_key:
              type: string
              description: Filter results by parent_support_key
            phone_numbers:
              type: object
              properties:
                country_code:
                  type: string
                  description: Filter results by country ISO 3166-1 alpha-2 code
                carrier_name:
                  type: string
                  description: Filter results by old service provider
                phone_number:
                  type: object
                  properties:
                    contains:
                      type: string
                      description: Filter results by full or partial phone_number
                  description: Phone number pattern filtering operations
            misc:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/PortingOrderType'
                  description: Filter results by porting order type
            end_user:
              type: object
              properties:
                admin:
                  type: object
                  properties:
                    entity_name:
                      type: string
                      description: Filter results by person or company name
                    auth_person_name:
                      type: string
                      description: Filter results by authorized person
            activation_settings:
              type: object
              properties:
                fast_port_eligible:
                  type: boolean
                  description: Filter results by fast port eligible
                foc_datetime_requested:
                  type: object
                  properties:
                    gt:
                      type: string
                      description: Filter results by foc date later than this value
                      example: '2021-03-25T10:00:00.000Z'
                    lt:
                      type: string
                      description: Filter results by foc date earlier than this value
                      example: '2021-03-25T10:00:00.000Z'
                  description: FOC datetime range filtering operations
      - name: sort
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated sort parameter (deepObject style). Originally: sort[value]'
        schema:
          type: object
          properties:
            value:
              type: string
              enum:
              - created_at
              - -created_at
              - activation_settings.foc_datetime_requested
              - -activation_settings.foc_datetime_requested
              example: created_at
              description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    post:
      summary: Create a porting order
      tags:
      - Porting Orders
      description: Creates a new porting order to bring phone numbers from another carrier to Telnyx. Complete the order's requirements and then confirm it to submit the port.
      operationId: CreatePortingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortingOrder'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingOrder'
                example:
                  data:
                  - activation_settings:
                      activation_status: null
                      fast_port_eligible: true
                      foc_datetime_actual: null
                      foc_datetime_requested: null
                    created_at: '2022-03-17T18:01:01Z'
                    customer_reference: null
                    customer_group_reference: null
                    description: FP Telnyx
                    documents:
                      loa: null
                      invoice: null
                    end_user:
                      admin:
                        account_number: null
                        auth_person_name: null
                        billing_phone_number: null
                        business_identifier: null
                        entity_name: null
                        pin_passcode: null
                        tax_identifier: null
                      location:
                        administrative_area: null
                        country_code: null
                        extended_address: null
                        locality: null
                        postal_code: null
                        street_address: null
                    id: b0ea6d6f-de31-4079-a536-992e0c98b037
                    misc: null
                    old_service_provider_ocn: Unreal Communications
                    parent_support_key: null
                    phone_number_configuration:
                      billing_group_id: null
                      connection_id: null
                      emergency_address_id: null
                      messaging_profile_id: null
                      tags: []
                    phone_number_type: local
                    phone_numbers:
                    - activation_status: Activate RDY
                      phone_number: '{e.164 TN}'
                      phone_number_type: local
                      portability_status: confirmed
                      porting_order_id: b0ea6d6f-de31-4079-a536-992e0c98b037
                      porting_order_status: draft
                      record_type: porting_phone_number
                      requirements_status: requirement-info-pending
                      support_key: sr_10b316
                    porting_phone_numbers_count: 1
                    record_type: porting_order
                    requirements: []
                    requirements_met: false
                    status:
                      details: []
                      value: draft
                    support_key: null
                    updated_at: '2022-03-17T18:01:01Z'
                    user_feedback:
                      user_comment: null
                      user_rating: null
                    messaging:
                      messaging_capable: true
                      enable_messaging: false
                      messaging_port_status: not_applicable
                      messaging_port_completed: false
                    user_id: 40d68ba2-0847-4df2-be9c-b0e0cb673e75
                    webhook_url: null
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting_orders/exception_types:
    get:
      summary: List all exception types
      tags:
      - Porting Orders
      description: Returns a list of all possible exception types for a porting order.
      operationId: ListExceptionTypes
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingOrdersExceptionType'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting_orders/phone_number_configurations:
    get:
      summary: List all phone number configurations
      tags:
      - Porting Orders
      description: Returns a list of phone number configurations paginated.
      operationId: ListPhoneNumberConfigurations
      parameters:
      - $ref: '#/components/parameters/porting-order_PageConsolidated'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[porting_order.status][in][], filter[porting_phone_number][in][], filter[user_bundle_id][in][]'
        schema:
          type: object
          properties:
            porting_order:
              type: object
              properties:
                status:
                  type: array
                  items:
                    type: string
                    example: in-process
                    enum:
                    - activation-in-progress
                    - cancel-pending
                    - cancelled
                    - draft
                    - exception
                    - foc-date-confirmed
                    - in-process
                    - ported
                    - submitted
                  description: Filter results by specific porting order statuses
            porting_phone_number:
              type: array
              items:
                type: string
                format: uuid
                example: 5d6f7ede-1961-4717-bfb5-db392c5efc2d
              description: Filter results by a list of porting phone number IDs
            user_bundle_id:
              type: array
              items:
                type: string
                format: uuid
                example: 5d6f7ede-1961-4717-bfb5-db392c5efc2d
              description: Filter results by a list of user bundle IDs
      - name: sort
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated sort parameter (deepObject style). Originally: sort[value]'
        schema:
          type: object
          properties:
            value:
              type: string
              enum:
              - created_at
              - -created_at
              example: created_at
              description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingPhoneNumberConfiguration'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    post:
      summary: Create a list of phone number configurations
      tags:
      - Porting Orders
      description: Creates a list of phone number configurations.
      operationId: CreatePhoneNumberConfigurations
      requestBody:
        $ref: '#/components/requestBodies/CreatePortingPhoneNumberConfigurations'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortingPhoneNumberConfiguration'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /porting_orders/{id}:
    delete:
      summary: Delete a porting order
      tags:
      - Porting Orders
      description: Deletes an existing porting order. This operation is restrict to porting orders in draft state.
      operationId: DeletePortingOrder
      parameters:
      - $ref: '#/components/parameters/PathPortingOrderID'
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable entity. Check message field in response for details.
    get:
      summary: Retrieve a porting order
      tags:
      - Porting Orders
      description: Retrieves the details of an existing porting order.
      operationId: GetPortingOrder
      parameters:
      - $ref: '#/components/parameters/PathPortingOrderID'
      - $ref: '#/components/parameters/QueryIncludePhoneNumbers'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortingOrder'
                  meta:
                    type: object
                    properties:
                      phone_numbers_url:
                        type: string
                        description: Link to list all phone numbers
                        example: /v2/porting_phone_numbers?filter[porting_order_id]=eef10fb8-f3df-4c67-97c5-e18179723222
        '401':
          description: Unauthorized
    patch:
      summary: Edit a porting order
      tags:
      - Porting Orders
      description: 'Edits the details of an existing porting order.


        Any or all of a porting orders attributes may be included in the resource object included in a PATCH request.


        If a request does not include all of the attributes for a resource, the system will interpret the missing attributes as if they were included with their current values. To explicitly set something to null, it must be included in the request with a null value.'
