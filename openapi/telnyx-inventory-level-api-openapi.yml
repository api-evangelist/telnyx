  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Inventory Level
  description: Inventory Level
paths:
  /inventory_coverage:
    get:
      summary: Create an inventory coverage request
      description: Creates an inventory coverage request. If locality, npa or national_destination_code is used in groupBy, and no region or locality filters are used, the whole paginated set is returned.
      operationId: CreateInventoryCoverage
      tags:
      - Inventory Level
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[npa], filter[nxx], filter[administrative_area], filter[phone_number_type], filter[country_code], filter[count], filter[features], filter[groupBy]'
        schema:
          type: object
          properties:
            npa:
              type: integer
              description: Filter by npa
            nxx:
              type: integer
              description: Filter by nxx
            administrative_area:
              type: string
              description: Filter by administrative area
            phone_number_type:
              type: string
              description: Filter by phone number type
              enum:
              - local
              - toll_free
              - national
              - mobile
              - landline
              - shared_cost
            country_code:
              type: string
              description: Filter by country. Defaults to US
              enum:
              - AT
              - AU
              - BE
              - BG
              - CA
              - CH
              - CN
              - CY
              - CZ
              - DE
              - DK
              - EE
              - ES
              - FI
              - FR
              - GB
              - GR
              - HU
              - HR
              - IE
              - IT
              - LT
              - LU
              - LV
              - NL
              - NZ
              - MX
              - 'NO'
              - PL
              - PT
              - RO
              - SE
              - SG
              - SI
              - SK
              - US
            count:
              type: boolean
              description: Include count in the result
            features:
              type: array
              items:
                type: string
                enum:
                - sms
                - mms
                - voice
                - fax
                - emergency
              example:
              - voice
              - sms
              description: Filter if the phone number should be used for voice, fax, mms, sms, emergency. Returns features in the response when used.
            groupBy:
              type: string
              description: Filter to group results
              enum:
              - locality
              - npa
              - national_destination_code
      responses:
        '200':
          description: Successful response with a list of inventory coverage levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryCoverage'
                  meta:
                    $ref: '#/components/schemas/InventoryCoverageMetadata'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    InventoryCoverage:
      type: object
      properties:
        group:
          type: string
          example: '318'
        group_type:
          type: string
          example: npa
        number_range:
          type: integer
          example: 1
        number_type:
          type: string
          enum:
          - did
          - toll-free
          example: did
        phone_number_type:
          type: string
          enum:
          - local
          - toll_free
          - national
          - landline
          - shared_cost
          - mobile
          example: local
        coverage_type:
          type: string
          enum:
          - number
          - block
          example: number
        record_type:
          type: string
          example: inventory_coverage_group
        administrative_area:
          type: string
          example: NJ
        count:
          type: integer
          example: 3
        advance_requirements:
          type: boolean
          example: true
          description: Indicates if the phone number requires advance requirements.
      example:
        group: '318'
        group_type: npa
        number_range: 1
        number_type: did
        phone_number_type: local
        coverage_type: number
        record_type: inventory_coverage_group
        administrative_area: NJ
        count: 3
        advance_requirements: true
    InventoryCoverageMetadata:
      type: object
      example:
        total_results: 25
      properties:
        total_results:
          type: integer
          example: 25
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    numbers_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/numbers_Error'
          type: array
      type: object
    numbers_Error:
      properties:
        code:
          example: '10007'
          type: string
        detail:
          example: An unexpected error occured.
          type: string
        meta:
          properties:
            url:
              description: URL with additional information on the error.
              example: https://developers.telnyx.com/docs/overview/errors/10015
              type: string
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              example: /base
              type: string
          type: object
        title:
          example: Unexpected error
          type: string
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  responses:
    numbers_UnauthorizedResponse_73c9788e53:
      description: Unauthorized
      content:
