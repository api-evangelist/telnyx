openapi: 3.2.0
info:
  title: Telnyx TeXML Applications API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged TeXML Applications across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: TeXML Applications
  description: TeXML Applications operations
paths:
  /texml_applications:
    get:
      description: Returns a list of your TeXML Applications.
      summary: List all TeXML Applications
      operationId: FindTexmlApplications
      tags:
      - TeXML Applications
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/call-scripting_PageConsolidated'
      - $ref: '#/components/parameters/call-scripting_FilterConsolidated'
      - $ref: '#/components/parameters/SortApplication'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Get All Texml Applications Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TexmlApplication'
                  meta:
                    $ref: '#/components/schemas/call-scripting_PaginationMeta'
        '400':
          $ref: '#/components/responses/call-scripting_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/call-scripting_UnauthorizedResponse'
    post:
      description: Creates a TeXML application, which defines the voice URLs and settings used to serve TeXML instructions for calls, and returns the created application.
      summary: Creates a TeXML Application
      operationId: CreateTexmlApplication
      tags:
      - TeXML Applications
      x-endpoint-cost: medium
      parameters: []
      requestBody:
        description: Parameters that can be set when creating a TeXML Application
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTexmlApplicationRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Texml Application Response
                properties:
                  data:
                    $ref: '#/components/schemas/TexmlApplication'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/call-scripting_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/call-scripting_NotFoundResponse_c75353cb83'
        '422':
          $ref: '#/components/responses/call-scripting_UnprocessableEntityResponse_c75353cb83'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /texml_applications/{id}:
    delete:
      description: Permanently deletes the specified TeXML application from your account.
      summary: Deletes a TeXML Application
      operationId: DeleteTexmlApplication
      tags:
      - TeXML Applications
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Texml Application Response
                properties:
                  data:
                    $ref: '#/components/schemas/TexmlApplication'
        '400':
          $ref: '#/components/responses/call-scripting_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/call-scripting_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponseApp'
    get:
      description: Retrieves the details of an existing TeXML Application.
      summary: Retrieve a TeXML Application
      operationId: GetTexmlApplication
      tags:
      - TeXML Applications
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Texml Application Response
                properties:
                  data:
                    $ref: '#/components/schemas/TexmlApplication'
        '400':
          $ref: '#/components/responses/call-scripting_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/call-scripting_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponseApp'
    patch:
      description: Updates settings of an existing TeXML Application.
      summary: Update a TeXML Application
      operationId: UpdateTexmlApplication
      tags:
      - TeXML Applications
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Parameters that can be updated in a TeXML Application
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTexmlApplicationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                title: Texml Application Response
                properties:
                  data:
                    $ref: '#/components/schemas/TexmlApplication'
        '400':
          $ref: '#/components/responses/call-scripting_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/call-scripting_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponseApp'
        '409':
          description: Conflict. Another update to this application is still in progress. Wait and retry the request later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/call-scripting_ErrorResponse'
              example:
                errors:
                - detail: A previous update to this connection is still in progress. Please try again later.
        '422':
          $ref: '#/components/responses/call-scripting_UnprocessableEntityResponse_c75353cb83'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
