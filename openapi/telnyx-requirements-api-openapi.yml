          format: date-time
          readOnly: true
          description: When this version became (or will become) active.
        effective_end_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When this version was superseded. NULL means this is the active or pending version.
    CancelPendingVersionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            cancelled:
              $ref: '#/components/schemas/DocReqsRequirement'
            restored:
              $ref: '#/components/schemas/DocReqsRequirement'
    documents_Error:
      properties:
        code:
          type: string
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    documents_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/documents_Error'
          type: array
      type: object
