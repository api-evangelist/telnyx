openapi: 3.2.0
info:
  title: Telnyx Virtual Cross Connects API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Virtual Cross Connects across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Virtual Cross Connects
  description: Virtual Cross Connect operations
paths:
  /virtual_cross_connects:
    get:
      summary: List all Virtual Cross Connects
      description: Returns a paginated list of the virtual cross connects on your account, with support for filtering.
      operationId: ListVirtualCrossConnects
      tags:
      - Virtual Cross Connects
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[network_id]'
        schema:
          type: object
          properties:
            network_id:
              type: string
              example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
              description: The associated network id to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualCrossConnectCombined'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a Virtual Cross Connect
      description: 'Create a new Virtual Cross Connect.


        For AWS and GCE, you have the option of creating the primary connection first and the secondary connection later. You also have the option of disabling the primary and/or secondary connections at any time and later re-enabling them. With Azure, you do not have this option. Azure requires both the primary and secondary connections to be created at the same time and they can not be independantly disabled.'
      operationId: CreateVirtualCrossConnect
      tags:
      - Virtual Cross Connects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCrossConnectCreate'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VirtualCrossConnectCombined'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /virtual_cross_connects/coverage:
    get:
      summary: List Virtual Cross Connect Cloud Coverage
      description: 'List Virtual Cross Connects Cloud Coverage.


        This endpoint shows which cloud regions are available for the `location_code` your Virtual Cross Connect will be provisioned in.'
      operationId: ListVirtualCrossConnectCoverage
      tags:
      - Virtual Cross Connects
      parameters:
      - name: filters
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filters parameter (deepObject style). Originally: filters[available_bandwidth][contains]'
        schema:
          type: object
          properties:
            available_bandwidth:
              oneOf:
              - type: integer
                description: Filter by exact available bandwidth match
              - type: object
                properties:
                  contains:
                    type: integer
                    description: Filter by available bandwidth containing the specified value
                additionalProperties: false
                description: Available bandwidth filtering operations
          additionalProperties: false
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[cloud_provider], filter[cloud_provider_region], filter[location.region], filter[location.site], filter[location.pop], filter[location.code]'
        schema:
          type: object
          properties:
            cloud_provider:
              type: string
              enum:
              - aws
              - azure
              - gce
              description: The Virtual Private Cloud provider.
              example: aws
            cloud_provider_region:
              type: string
              description: The region of specific cloud provider.
              example: us-east-1
            location.region:
              type: string
              example: AMER
              description: The region of associated location to filter on.
            location.site:
              type: string
              example: SJC
              description: The site of associated location to filter on.
            location.pop:
              type: string
              example: SV1
              description: The POP of associated location to filter on.
            location.code:
              type: string
              example: silicon_valley-ca
              description: The code of associated location to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualCrossConnectCoverage'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/netapps_GenericErrorResponse'
        default:
          $ref: '#/components/responses/netapps_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /virtual_cross_connects/{id}:
    delete:
      summary: Delete a Virtual Cross Connect
      description: Deletes the specified virtual cross connect from your account.
      operationId: DeleteVirtualCrossConnect
      tags:
      - Virtual Cross Connects
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VirtualCrossConnectCombined'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve a Virtual Cross Connect
      description: Returns the details of a single virtual cross connect by its identifier.
      operationId: GetVirtualCrossConnect
      tags:
      - Virtual Cross Connects
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VirtualCrossConnectCombined'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update the Virtual Cross Connect
      description: 'Update the Virtual Cross Connect.


        Cloud IPs can only be patched during the `created` state, as GCE will only inform you of your generated IP once the pending connection requested has been accepted. Once the Virtual Cross Connect has moved to `provisioning`, the IPs can no longer be patched.


        Once the Virtual Cross Connect has moved to `provisioned` and you are ready to enable routing, you can toggle the routing announcements to `true`.'
      operationId: UpdateVirtualCrossConnect
      tags:
      - Virtual Cross Connects
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCrossConnectPatch'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VirtualCrossConnectCombined'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /virtual_cross_connects_coverage:
    get:
      summary: List Virtual Cross Connect Cloud Coverage
      description: 'List Virtual Cross Connects Cloud Coverage.


        This endpoint shows which cloud regions are available for the `location_code` your Virtual Cross Connect will be provisioned in.'
      operationId: ListVirtualCrossConnectCoverage_2
      tags:
      - Virtual Cross Connects
      parameters:
      - name: filters
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filters parameter (deepObject style). Originally: filters[available_bandwidth][contains]'
        schema:
          type: object
          properties:
            available_bandwidth:
              oneOf:
              - type: integer
                description: Filter by exact available bandwidth match
              - type: object
                properties:
                  contains:
                    type: integer
                    description: Filter by available bandwidth containing the specified value
                additionalProperties: false
                description: Available bandwidth filtering operations
          additionalProperties: false
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[cloud_provider], filter[cloud_provider_region], filter[location.region], filter[location.site], filter[location.pop], filter[location.code]'
        schema:
          type: object
          properties:
            cloud_provider:
              type: string
              enum:
              - aws
              - azure
              - gce
              description: The Virtual Private Cloud provider.
              example: aws
            cloud_provider_region:
              type: string
              description: The region of specific cloud provider.
              example: us-east-1
            location.region:
              type: string
              example: AMER
              description: The region of associated location to filter on.
            location.site:
              type: string
              example: SJC
              description: The site of associated location to filter on.
            location.pop:
              type: string
              example: SV1
              description: The POP of associated location to filter on.
            location.code:
              type: string
              example: silicon_valley-ca
              description: The code of associated location to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/netapps_VirtualCrossConnectCoverage'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    VirtualCrossConnectPatch:
      allOf:
      - type: object
        title: VirtualCrossConnectPatch
        properties:
          primary_enabled:
            type: boolean
            description: Indicates whether the primary circuit is enabled. Setting this to `false` will disable the circuit.
            example: true
          primary_routing_announcement:
            description: Whether the primary BGP route is being announced.
            type: boolean
            example: false
          primary_cloud_ip:
            type: string
            description: The IP address assigned for your side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value can not be patched once the VXC has bene provisioned.
            example: 169.254.0.2
          secondary_enabled:
            type: boolean
            description: Indicates whether the secondary circuit is enabled. Setting this to `false` will disable the circuit.
            example: true
          secondary_routing_announcement:
            description: Whether the secondary BGP route is being announced.
            type: boolean
            example: false
          secondary_cloud_ip:
            type: string
            description: The IP address assigned for your side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value can not be patched once the VXC has bene provisioned.
            example: 169.254.0.4
    netapps_VirtualCrossConnectCoverage:
      allOf:
      - type: object
        title: VirtualCrossConnectCoverage
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: virtual_cross_connects_coverage
          location:
            $ref: '#/components/schemas/netapps_Location_17904fcfbc'
          cloud_provider:
            type: string
            enum:
            - aws
            - azure
            - gce
            description: The Virtual Private Cloud with which you would like to establish a cross connect.
            example: aws
          cloud_provider_region:
            type: string
            description: The region where your Virtual Private Cloud hosts are located. Should be identical to how the cloud provider names region, i.e. us-east-1 for AWS but Frankfurt for Azure
            example: us-east-1
          available_bandwidth:
            type: array
            description: The available throughput in Megabits per Second (Mbps) for your Virtual Cross Connect.
            items:
              type: number
            example:
            - 50
            - 100
            - 200
            - 500
    netapps_Location_17904fcfbc:
      type: object
      title: Location
      properties:
        region:
          type: string
          description: Identifies the geographical region of location.
          example: AMER
        site:
          type: string
          description: Site of location.
          example: ORD
        pop:
          type: string
          description: Point of presence of location.
          example: CH1
        code:
          type: string
          description: Location code.
          example: chicago-il
        name:
          type: string
          description: Human readable name of location.
          example: Chicago IL, US
    RegionOut:
      type: object
      properties:
        region_code:
          description: The region interface is deployed to.
          type: string
          example: ashburn-va
        region:
          type: object
          properties:
            code:
              description: Region code of the interface.
              type: string
              example: ashburn-va
            name:
              description: Region name of the interface.
              type: string
              example: Ashburn
            record_type:
              type: string
              description: Identifies the type of the resource.
              readOnly: true
              example: region
    Interface:
      type: object
      properties:
        network_id:
          description: The id of the network associated with the interface.
          type: string
          format: uuid
          example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        name:
          type: string
          description: A user specified name for the interface.
          example: test interface
        status:
          $ref: '#/components/schemas/InterfaceStatus'
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    netapps_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/netapps_Error'
      type: object
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    VirtualCrossConnectCoverage:
      allOf:
      - type: object
        title: VirtualCrossConnectCoverage
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: virtual_cross_connects_coverage
          location:
            $ref: '#/components/schemas/netapps_Location'
          cloud_provider:
            type: string
            enum:
            - aws
            - azure
            - gce
            description: The Virtual Private Cloud with which you would like to establish a cross connect.
            example: aws
          cloud_provider_region:
            type: string
            description: The region where your Virtual Private Cloud hosts are located. Should be identical to how the cloud provider names region, i.e. us-east-1 for AWS but Frankfurt for Azure
            example: us-east-1
          available_bandwidth:
            type: array
            description: The available throughput in Megabits per Second (Mbps) for your Virtual Cross Connect.
            items:
              type: number
            example:
            - 50
            - 100
            - 200
            - 500
    Record:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the resource.
          readOnly: true
          example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        record_type:
          type: string
          description: Identifies the type of the resource.
          readOnly: true
          example: sample_record_type
        created_at:
          type: string
          description: ISO 8601 formatted date-time indicating when the resource was created.
          readOnly: true
          example: '2018-02-02T22:25:27.521Z'
        updated_at:
          type: string
          description: ISO 8601 formatted date-time indicating when the resource was updated.
          readOnly: true
          example: '2018-02-02T22:25:27.521Z'
    netapps_Location:
      type: object
      title: Location
      properties:
        region:
          type: string
          description: Identifies the geographical region of location.
          example: AMER
        site:
          type: string
          description: Site of location.
          example: ORD
        pop:
          type: string
          description: Point of presence of location.
          example: CH1
        code:
          type: string
          description: Location code.
          example: chicago-il
        name:
          type: string
          description: Human readable name of location.
          example: Chicago IL, US
    VirtualCrossConnectCombined:
      allOf:
      - $ref: '#/components/schemas/VirtualCrossConnectCreate'
      - $ref: '#/components/schemas/VirtualCrossConnectPatch'
      - $ref: '#/components/schemas/RegionOut'
    VirtualCrossConnect:
      allOf:
      - $ref: '#/components/schemas/Record'
      - $ref: '#/components/schemas/Interface'
      - type: object
        title: VirtualCrossConnect
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: virtual_cross_connect
          cloud_provider:
            type: string
            enum:
            - aws
            - azure
            - gce
            description: The Virtual Private Cloud with which you would like to establish a cross connect.
            example: aws
          cloud_provider_region:
            type: string
            description: The region where your Virtual Private Cloud hosts are located.<br /><br />The available regions can be found using the /virtual_cross_connect_regions endpoint.
            example: us-east-1
          bgp_asn:
            type: number
            description: The Border Gateway Protocol (BGP) Autonomous System Number (ASN). If null, value will be assigned by Telnyx.
            example: 1234
          bandwidth_mbps:
            type: number
            description: The desired throughput in Megabits per Second (Mbps) for your Virtual Cross Connect.<br /><br />The available bandwidths can be found using the /virtual_cross_connect_regions endpoint.
            example: 50
          primary_enabled:
            type: boolean
            description: Indicates whether the primary circuit is enabled. Setting this to `false` will disable the circuit.
            example: true
            readOnly: true
          primary_cloud_account_id:
            type: string
            description: The identifier for your Virtual Private Cloud. The number will be different based upon your Cloud provider.
            example: '123456789012'
          primary_telnyx_ip:
            type: string
            description: The IP address assigned to the Telnyx side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value should be null for GCE as Google will only inform you of your assigned IP once the connection has been accepted.
            example: 169.254.0.1
          primary_cloud_ip:
            type: string
            description: The IP address assigned for your side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value should be null for GCE as Google will only inform you of your assigned IP once the connection has been accepted.
            example: 169.254.0.2
          primary_bgp_key:
            type: string
            description: The authentication key for BGP peer configuration.
            example: yFV4wEPtPVPfDUGLWiyQzwga
          secondary_enabled:
            type: boolean
            description: Indicates whether the secondary circuit is enabled. Setting this to `false` will disable the circuit.
            example: true
            readOnly: true
          secondary_cloud_account_id:
            type: string
            description: The identifier for your Virtual Private Cloud. The number will be different based upon your Cloud provider.<br /><br />This attribute is only necessary for GCE.
            example: ''
          secondary_telnyx_ip:
            type: string
            description: The IP address assigned to the Telnyx side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value should be null for GCE as Google will only inform you of your assigned IP once the connection has been accepted.
            example: 169.254.0.3
          secondary_cloud_ip:
            type: string
            description: The IP address assigned for your side of the Virtual Cross Connect.<br /><br />If none is provided, one will be generated for you.<br /><br />This value should be null for GCE as Google will only inform you of your assigned IP once the connection has been accepted.
            example: 169.254.0.4
          secondary_bgp_key:
            type: string
            description: The authentication key for BGP peer configuration.
            example: ge1lONeK9RcA83uuWaw9DvZy
    netapps_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      type: object
    InterfaceStatus:
      type: string
      enum:
      - created
      - provisioning
      - provisioned
      - deleting
      description: The current status of the interface deployment.
      readOnly: true
      example: provisioned
    RegionIn:
      type: object
      properties:
        region_code:
          description: The region the interface should be deployed to.
          type: string
          example: ashburn-va
    VirtualCrossConnectCreate:
      allOf:
      - $ref: '#/components/schemas/VirtualCrossConnect'
      - $ref: '#/components/schemas/RegionIn'
      - type: object
        title: VirtualCrossConnectCreate
        required:
        - network_id
        - region_code
        - cloud_provider
        - cloud_provider_region
        - bgp_asn
        - primary_cloud_account_id
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  responses:
    UnprocessableEntity:
      description: Unprocessable entity. Check the 'detail' field in response for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: '10027'
              title: Unprocessable Entity
              detail: The server understood the syntax of the request but was unable to process the instructions.
    netapps_GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netapps_Errors'
    GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    VirtualCrossConnectCoverageListResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/VirtualCrossConnectCoverage'
                type: array
              meta:
                $ref: '#/components/schemas/PaginationMeta'
            type: object
      description: Successful response
    VirtualCrossConnectResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/VirtualCrossConnectCombined'
            type: object
      description: Successful response
    netapps_UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netapps_Errors'
      description: Unprocessable entity. Check the 'detail' field in response for details.
    VirtualCrossConnectListResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/VirtualCrossConnectCombined'
                type: array
              meta:
                $ref: '#/components/schemas/PaginationMeta'
            type: object
      description: Successful response
    netapps_UnprocessableEntity_17904fcfbc:
      description: Unprocessable entity. Check the 'detail' field in response for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors_2'
          example:
            errors:
            - code: '10027'
              title: Unprocessable Entity
              detail: The server understood the syntax of the request but was unable to process the instructions.
  parameters:
    PageConsolidated:
      name: page
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
      schema:
        type: object
        properties:
          number:
            type: integer
            minimum: 1
            default: 1
            description: The page number to load
          size:
