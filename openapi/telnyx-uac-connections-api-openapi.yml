openapi: 3.2.0
info:
  title: Telnyx UAC Connections API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged UAC Connections across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: UAC Connections
  description: UAC connection operations
paths:
  /uac_connections:
    get:
      description: Returns a list of your UAC connections. A UAC (User Agent Client) Connection registers Telnyx to your PBX — the opposite of a standard SIP trunk, where the PBX registers to Telnyx. Use UAC when your PBX doesn’t support outbound SIP registration or you need Telnyx to maintain the registration.
      summary: List UAC connections
      operationId: ListUacConnections
      tags:
      - UAC Connections
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/connections_FilterConsolidated'
      - $ref: '#/components/parameters/connections_PageConsolidated'
      - $ref: '#/components/parameters/connections_SortConnection'
      responses:
        '200':
          description: Successful response with a list of UAC connections.
          content:
            application/json:
              schema:
                type: object
                title: List UAC Connections Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UacConnection'
                  meta:
                    $ref: '#/components/schemas/connections_PaginationMeta'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
    post:
      description: Creates a UAC connection. A UAC (User Agent Client) Connection registers Telnyx to your PBX — the opposite of a standard SIP trunk, where the PBX registers to Telnyx. Use UAC when your PBX doesn’t support outbound SIP registration or you need Telnyx to maintain the registration.
      summary: Create a UAC connection
      operationId: CreateUacConnection
      tags:
      - UAC Connections
      x-endpoint-cost: medium
      parameters: []
      requestBody:
        description: Parameters that can be defined during UAC connection creation
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUacConnectionRequest'
      responses:
        '201':
          description: Successful response with details about a UAC connection.
          content:
            application/json:
              schema:
                type: object
                title: UAC Connection Response
                properties:
                  data:
                    $ref: '#/components/schemas/UacConnection'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /uac_connections/{id}:
    delete:
      description: Permanently deletes the specified UAC connection from your account.
      summary: Delete a UAC connection
      operationId: DeleteUacConnection
      tags:
      - UAC Connections
      parameters:
      - name: id
        in: path
        description: Identifies the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a UAC connection.
          content:
            application/json:
              schema:
                type: object
                title: UAC Connection Response
                properties:
                  data:
                    $ref: '#/components/schemas/UacConnection'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    get:
      description: Retrieves the details of an existing UAC connection.
      summary: Retrieve a UAC connection
      operationId: RetrieveUacConnection
      tags:
      - UAC Connections
      parameters:
      - name: id
        in: path
        description: Identifies the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a UAC connection.
          content:
            application/json:
              schema:
                type: object
                title: UAC Connection Response
                properties:
                  data:
                    $ref: '#/components/schemas/UacConnection'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    patch:
      description: Updates settings of an existing UAC connection.
      summary: Update a UAC connection
      operationId: UpdateUacConnection
      tags:
      - UAC Connections
      parameters:
      - name: id
        in: path
        description: Identifies the resource.
        required: true
        schema:
          type: string
      requestBody:
        description: Parameters that can be updated in a UAC connection
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUacConnectionRequest'
      responses:
        '200':
          description: Successful response with details about a UAC connection.
          content:
            application/json:
              schema:
                type: object
                title: UAC Connection Response
                properties:
                  data:
                    $ref: '#/components/schemas/UacConnection'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
        '409':
          description: Conflict. Another update to this connection is still in progress. Wait and retry the request later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connections_ErrorResponse'
              example:
                errors:
                - detail: A previous update to this connection is still in progress. Please try again later.
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /uac_connections/{id}/actions/check_registration_status:
    post:
      description: Returns the live SIP registration status for a UAC connection. Reports whether the endpoint is currently registered (`status`) and the timestamp of the last SIP registration event (`last_registration`).
      summary: Check a UAC Connection Registration Status
      operationId: CheckUacConnectionRegistrationStatus
      tags:
      - UAC Connections
      parameters:
      - name: id
        in: path
        description: Identifies the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a credential connection registration status.
          content:
            application/json:
              schema:
                type: object
                title: Registration Status Response
                properties:
                  data:
                    type: object
                    title: Registration Status
                    properties:
                      record_type:
                        type: string
                        description: Identifies the type of the resource.
                        example: registration_status
                      status:
                        type: string
                        description: The current registration status of your SIP connection
                        enum:
                        - Not Applicable
                        - Not Registered
                        - Failed
                        - Expired
                        - Registered
                        - Unregistered
                      sip_username:
                        type:
                        - string
                        - 'null'
                        description: The user name of the SIP connection
                        example: sip_username
                      ip_address:
                        type:
                        - string
                        - 'null'
                        description: The ip used during the SIP connection
                        example: 190.106.106.121
                      transport:
                        type:
                        - string
                        - 'null'
                        description: The protocol of the SIP connection
                        example: TCP
                      port:
                        type:
                        - integer
                        - 'null'
                        description: The port of the SIP connection
                        example: 37223
                      user_agent:
                        type:
                        - string
                        - 'null'
                        description: The user agent of the SIP connection
                        example: Z 5.4.12 v2.10.13.2-mod
                      last_registration:
                        type:
                        - string
                        - 'null'
                        description: ISO 8601 formatted date indicating when the resource was last updated.
                        example: '2018-02-02T22:25:27.521Z'
                    example:
                      record_type: registration_status
                      status: Expired
                      sip_username: rogerp
                      ip_address: 190.106.106.121
                      transport: UDP
                      port: 37223
                      user_agent: Z 5.4.12 v2.10.13.2-mod
                      last_registration: '2021-09-28T15:11:02'
              examples:
                registered:
                  summary: Endpoint is registered
                  value:
                    data:
                      record_type: registration_status
                      status: Registered
                      sip_username: '1006'
                      ip_address: 192.0.2.14
                      transport: UDP
                      port: 5060
                      user_agent: Linphone/4.0.0
                      last_registration: '2026-08-31T20:00:00Z'
                unregistered:
                  summary: No active registration; all fields except record_type and status are null
                  value:
                    data:
                      record_type: registration_status
                      status: Unregistered
                      sip_username: null
                      ip_address: null
                      transport: null
                      port: null
                      user_agent: null
                      last_registration: null
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sip_registration_status:
    get:
      summary: SIP Registration Status
      description: 'Returns the live SIP registration status for a Telnyx endpoint: whether it is currently registered, when the current registration expires, and the last response Telnyx received from the registrar.


        The endpoint supports three credential types, selected with the `credential_type` query parameter. Each type is keyed by a different identifier:


        | `credential_type` | Keyed by | Use case |

        | --- | --- | --- |

        | `uac_external_credential` | `connection_id` | A UAC (SIP attach) connection that registers to an external PBX. |

        | `telephony_credential` | `username` | An ephemeral, one-time-use telephony credential. |

        | `sip_credential_connection` | `username` | A traditional SIP credential connection that registers directly to Telnyx. |


        The authenticated account is taken from your API key; you can only read the registration status of connections and credentials your account owns.'
      operationId: GetSipRegistrationStatus
      tags:
      - UAC Connections
      parameters:
      - name: credential_type
        in: query
        required: true
        description: The kind of credential to look up. `uac_external_credential` is keyed by `connection_id`; `telephony_credential` and `sip_credential_connection` are keyed by `username`.
        schema:
          type: string
          enum:
          - uac_external_credential
          - telephony_credential
          - sip_credential_connection
      - name: connection_id
        in: query
        required: false
        description: Identifier of the UAC connection to look up. Required when `credential_type` is `uac_external_credential`.
        schema:
          type: string
        example: '1234567890'
      - name: username
        in: query
        required: false
        description: SIP username to look up. Required when `credential_type` is `telephony_credential` or `sip_credential_connection`.
        schema:
          type: string
        example: useralice12345
      responses:
        '200':
          description: Registration status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SipRegistrationStatus'
              examples:
                uac_credential:
                  summary: UAC external credential - registered
                  value:
                    connection_id: '1234567890'
                    connection_name: FreePBX UAC 1002
                    credential_type: uac_external_credential
                    credential_username: useralice12345
                    registered: true
                    sip_registration_status: registered
                    last_registration_response: 200 OK
                    sip_registration_details:
                      auth_retries: 0
                      expires: 1780404431
                      uptime: 1780401551699908
                      next_action_at: 1780414482
                      failures: 0
                      sip_uri_user_host: 1002@192.0.2.10
                telephony_credential:
                  summary: Telephony credential - registered
                  value:
                    connection_id: '2845678901234567890'
                    connection_name: Softphone Credential Connection
                    credential_type: telephony_credential
                    credential_username: gencredq7f3k9x2
                    registered: true
                    sip_registration_status: registered
                    last_registration_response: 200 OK
                    sip_registration_details:
                      expires: 3600
                      ua_ip: 192.0.2.55
                      ua_port: 14934
                      transport: UDP
                      last_modified: '2026-06-15T11:23:13Z'
                sip_credential_connection:
                  summary: SIP credential connection - registered
                  value:
                    connection_id: '1701773312243271678'
                    connection_name: Office Softphone
                    credential_type: sip_credential_connection
                    credential_username: office_softphone_01
                    registered: true
                    sip_registration_status: registered
                    last_registration_response: 200 OK
                    sip_registration_details:
                      expires: 3600
                      ua_ip: 192.0.2.88
                      ua_port: 5060
                      transport: TCP
                      last_modified: '2026-06-05T09:10:00Z'
                not_registered:
                  summary: Not registered (trying)
                  value:
                    connection_id: '1701773312243271678'
                    connection_name: Office Softphone
                    credential_type: sip_credential_connection
                    credential_username: office_softphone_01
                    registered: false
                    sip_registration_status: trying
                    last_registration_response: null
                    sip_registration_details: {}
                connection_disabled:
                  summary: Connection disabled
                  value:
                    connection_id: '1088210431736022026'
                    connection_name: Disabled Connection
                    credential_type: sip_credential_connection
                    credential_username: disabled_user_01
                    registered: false
                    sip_registration_status: connection_disabled
                    last_registration_response: null
                    sip_registration_details: {}
        '400':
          description: Missing or invalid query parameters. Returned when `credential_type` is unsupported, or when the identifier required for the chosen `credential_type` (`connection_id` or `username`) is missing.
        '401':
          description: Missing or invalid API key
        '403':
          description: The connection or credential exists but is not owned by the authenticated account
        '404':
          description: No connection or credential matches the supplied identifier, or it has no known registration
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  responses:
    connections_BadRequestResponse:
      description: Bad request, the request was unacceptable, often due to missing a required parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/connections_ErrorResponse'
          examples:
            missingParameter:
              value:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The request failed because it was not well-formed.
                  source:
                    pointer: /
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
    connections_UnprocessableEntityResponse:
      description: The request was well-formed but was unable to be followed due to semantic errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/connections_ErrorResponse'
          examples:
            unprocessableEntity:
              value:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: 'Invalid dnis_format: test, was provided. Acceptable formats are +e164, e164, national, sip_username'
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /inbound/dnis_number_format
    UnauthenticatedResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/call-scripting_ErrorResponse'
          examples:
            Authentication Failed:
              value:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not understand the provided credentials.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
    connections_NotFoundResponse:
      description: The requested resource doesn't exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/connections_ErrorResponse'
          examples:
            notFound:
              value:
                errors:
                - code: '10005'
                  title: Resource not found
                  detail: The requested resource or URL could not be found.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10005
                  source:
                    pointer: /
    connections_UnauthorizedResponse:
      description: The user doesn't have the required permissions to perform the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/connections_ErrorResponse'
          examples:
            notAuthorized:
              value:
                errors:
                - code: '10010'
                  title: Not authorized
                  detail: You are not authorized to access the requested resource.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10010
                  source:
                    pointer: /
    connections_BadRequestResponse_2:
      content:
        application/json:
          examples:
            missingParameter:
              value:
                errors:
                - code: '10015'
                  detail: The request failed because it was not well-formed.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /
                  title: Bad Request
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Bad request, the request was unacceptable, often due to missing a required parameter.
    RegistrationStatusResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                example:
                  ip_address: 190.106.106.121
                  last_registration: '2021-09-28T15:11:02'
                  port: 37223
                  record_type: registration_status
                  sip_username: rogerp
                  status: Expired
                  transport: UDP
                  user_agent: Z 5.4.12 v2.10.13.2-mod
                properties:
                  ip_address:
                    description: The ip used during the SIP connection
                    example: 190.106.106.121
                    type: string
                  last_registration:
                    description: ISO 8601 formatted date indicating when the resource was last updated.
                    example: '2018-02-02T22:25:27.521Z'
                    type: string
                  port:
                    description: The port of the SIP connection
                    example: 37223
                    type: integer
                  record_type:
                    description: Identifies the type of the resource.
                    example: registration_status
                    type: string
                  sip_username:
                    description: The user name of the SIP connection
                    example: sip_username
                    type: string
                  status:
                    description: The current registration status of your SIP connection
                    enum:
                    - Not Applicable
                    - Not Registered
                    - Failed
                    - Expired
                    - Registered
                    - Unregistered
                    type: string
                  transport:
                    description: The protocol of the SIP connection
                    example: TCP
                    type: string
                  user_agent:
                    description: The user agent of the SIP connection
                    example: Z 5.4.12 v2.10.13.2-mod
                    type: string
                title: Registration Status
                type: object
            title: Registration Status Response
            type: object
      description: Successful response with details about a credential connection registration status.
    UacConnectionResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/UacConnection_2'
            title: UAC Connection Response
            type: object
      description: Successful response with details about a UAC connection.
    connections_UnprocessableEntityResponse_2:
      content:
        application/json:
          examples:
            unprocessableEntity:
              value:
                errors:
                - code: '10015'
                  detail: 'Invalid dnis_format: test, was provided. Acceptable formats are +e164, e164, national, sip_username'
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /inbound/dnis_number_format
                  title: Bad Request
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request was well-formed but was unable to be followed due to semantic errors.
    UnauthenticatedResponse_2:
      content:
        application/json:
          examples:
            Authentication Failed:
              value:
                errors:
                - code: '10009'
                  detail: Could not understand the provided credentials.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
                  title: Authentication failed
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unauthorized
    ListUacConnectionsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/UacConnection_2'
                type: array
              meta:
                $ref: '#/components/schemas/connections_PaginationMeta'
            title: List UAC Connections Response
            type: object
      description: Successful response with a list of UAC connections.
    connections_NotFoundResponse_2:
      content:
        application/json:
          examples:
            notFound:
              value:
                errors:
                - code: '10005'
                  detail: The requested resource or URL could not be found.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10005
                  source:
                    pointer: /
                  title: Resource not found
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The requested resource doesn't exist.
    connections_UnauthorizedResponse_2:
      content:
        application/json:
          examples:
            notAuthorized:
              value:
                errors:
                - code: '10010'
                  detail: You are not authorized to access the requested resource.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10010
                  source:
                    pointer: /
                  title: Not authorized
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The user doesn't have the required permissions to perform the requested action.
  schemas:
    UpdateUacConnectionRequest:
      type: object
      title: Update UAC Connection Request
      properties:
        active:
          type: boolean
          description: Defaults to true
        user_name:
          type: string
          description: The user name to be used as part of the credentials. Must be 4-32 characters long and alphanumeric values only (no spaces or special characters).
          example: myusername123
        password:
          type: string
          description: The password to be used as part of the credentials. Must be 8 to 128 characters long.
          example: my123secure456password789
        anchorsite_override:
          $ref: '#/components/schemas/AnchorsiteOverride'
        connection_name:
          $ref: '#/components/schemas/ConnectionName'
        sip_uri_calling_preference:
          type: string
          description: This feature enables inbound SIP URI calls to your Credential Auth Connection. If enabled for all (unrestricted) then anyone who calls the SIP URI <your-username>@telnyx.com will be connected to your Connection. You can also choose to allow only calls that are originated on any Connections under your account (internal).
          enum:
          - disabled
          - unrestricted
          - internal
        default_on_hold_comfort_noise_enabled:
          type: boolean
          default: false
          description: When enabled, Telnyx will generate comfort noise when you place the call on hold. If disabled, you will need to generate comfort noise or on hold music to avoid RTP timeout.
        dtmf_type:
          $ref: '#/components/schemas/DtmfType'
        encode_contact_header_enabled:
          type: boolean
          default: false
          description: Encode the SIP contact header sent by Telnyx to avoid issues for NAT or ALG scenarios.
        encrypted_media:
          $ref: '#/components/schemas/EncryptedMedia'
        onnet_t38_passthrough_enabled:
          type: boolean
          default: false
          description: Enable on-net T38 if you prefer the sender and receiver negotiating T38 directly if both are on the Telnyx network. If this is disabled, Telnyx will be able to use T38 on just one leg of the call depending on each leg's settings.
        ios_push_credential_id:
          $ref: '#/components/schemas/ConnectionIosPushCredentialId'
        android_push_credential_id:
          $ref: '#/components/schemas/ConnectionAndroidPushCredentialId'
        webhook_event_url:
          type: string
          format: uri
          description: The URL where webhooks related to this connection will be sent. Must include a scheme, such as 'https'.
          example: https://example.com
        webhook_event_failover_url:
          type:
          - string
          - 'null'
          format: uri
          description: The failover URL where webhooks related to this connection will be sent if sending to the primary URL fails. Must include a scheme, such as 'https'.
          example: https://failover.example.com
          default: ''
        webhook_api_version:
          type: string
          description: Determines which webhook format will be used, Telnyx API v1 or v2.
          enum:
          - '1'
          - '2'
          example: '1'
          default: '1'
        webhook_timeout_secs:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 30
          description: Specifies how many seconds to wait before timing out a webhook.
          example: 25
          default: null
        call_cost_in_webhooks:
          type: boolean
          description: Specifies if call cost webhooks should be sent for this connection.
          default: false
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the connection.
          example:
          - tag1
          - tag2
        rtcp_settings:
          $ref: '#/components/schemas/ConnectionRtcpSettings'
        inbound:
          $ref: '#/components/schemas/UacInboundRequest'
        outbound:
          $ref: '#/components/schemas/UacOutbound'
