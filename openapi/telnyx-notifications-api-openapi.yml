openapi: 3.2.0
info:
  title: Telnyx Notifications API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Notifications across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Notifications
  description: Notification settings operations
paths:
  /notification_channels:
    get:
      description: Returns a paginated list of your notification channels, the destinations that receive notifications.
      summary: List notification channels
      operationId: ListNotificationChannels
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      - $ref: '#/components/parameters/notifications_FilterConsolidated'
      responses:
        '200':
          description: Returns a list of notification channels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    post:
      description: Creates a new notification channel defining where notifications are delivered, and returns the created channel.
      summary: Create a notification channel
      operationId: CreateNotificationChannels
      tags:
      - Notifications
      requestBody:
        description: Add a Notification Channel
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: A Notification Channel response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_channels/{id}:
    delete:
      description: Deletes the specified notification channel so notifications are no longer delivered to it.
      summary: Delete a notification channel
      operationId: DeleteNotificationChannel
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Channel response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    get:
      description: Returns the details of a single notification channel by its identifier.
      summary: Get a notification channel
      operationId: GetNotificationChannel
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Channel response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '404':
          $ref: '#/components/responses/notifications_NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    patch:
      description: Updates the specified notification channel and returns the updated channel.
      summary: Update a notification channel
      operationId: UpdateNotificationChannel
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      requestBody:
        description: Update notification channel object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: A Notification Channel response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_event_conditions:
    get:
      description: Returns a list of your notifications events conditions.
      summary: List all Notifications Events Conditions
      operationId: FindNotificationsEventsConditions
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      - $ref: '#/components/parameters/notifications_FilterConsolidated'
      responses:
        '200':
          description: Returns a list of notification event conditions available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationEventCondition'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_events:
    get:
      description: Returns a list of your notifications events.
      summary: List all Notifications Events
      operationId: FindNotificationsEvents
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Returns a list of notification events available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_profiles:
    get:
      description: Returns a list of your notifications profiles.
      summary: List all Notifications Profiles
      operationId: FindNotificationsProfiles
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Returns a list of notification profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationProfile'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    post:
      description: Creates a new notification profile, a named grouping used to organize notification settings, and returns it.
      summary: Create a notification profile
      operationId: CreateNotificationProfile
      tags:
      - Notifications
      requestBody:
        description: Add a Notification Profile
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationProfile'
      responses:
        '200':
          description: A Notification Profile response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationProfile'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_profiles/{id}:
    delete:
      description: Deletes the specified notification profile from your account.
      summary: Delete a notification profile
      operationId: DeleteNotificationProfile
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Profile response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationProfile'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    get:
      description: Returns the details of a single notification profile by its identifier.
      operationId: GetNotificationProfile
      summary: Get a notification profile
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Profile response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationProfile'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '404':
          $ref: '#/components/responses/notifications_NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    patch:
      description: Updates the specified notification profile and returns the updated profile.
      operationId: UpdateNotificationProfile
      summary: Update a notification profile
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      requestBody:
        description: Update notification profile object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationProfile'
      responses:
        '200':
          description: A Notification Profile response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationProfile'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_settings:
    get:
      description: Returns a paginated list of your notification settings, which map notification event types to profiles and channels.
      summary: List notification settings
      operationId: ListNotificationSettings
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      - $ref: '#/components/parameters/notifications_FilterConsolidated'
      responses:
        '200':
          description: Returns a list of notification settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSetting'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    post:
      description: Adds a notification setting that enables delivery of a notification event type to a notification profile.
      summary: Add a Notification Setting
      operationId: CreateNotificationSetting
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSetting'
      responses:
        '200':
          description: A Notification Setting response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '201':
          description: A Notification Setting response - async
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /notification_settings/{id}:
    delete:
      description: Deletes the specified notification setting, disabling that notification delivery.
      summary: Delete a notification setting
      operationId: DeleteNotificationSetting
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Setting response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '201':
          description: A Notification Setting response - async
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    get:
      description: Returns the details of a single notification setting by its identifier.
      summary: Get a notification setting
      operationId: GetNotificationSetting
      tags:
      - Notifications
      parameters:
      - $ref: '#/components/parameters/notifications_Id'
      responses:
        '200':
          description: A Notification Setting response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '400':
          $ref: '#/components/responses/notifications_BadRequestResponse'
        '404':
          $ref: '#/components/responses/notifications_NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/notifications_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    NotificationSetting:
      properties:
        id:
          type: string
          description: A UUID.
          readOnly: true
          example: 8eb5b5f9-5893-423c-9f15-b487713d44d4
        notification_event_condition_id:
          type: string
          description: A UUID reference to the associated Notification Event Condition.
          example: 70c7c5cb-dce2-4124-accb-870d39dbe852
        notification_profile_id:
          type: string
          description: A UUID reference to the associated Notification Profile.
          example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
        associated_record_type:
          type: string
          example: phone_number
          readOnly: true
        associated_record_type_value:
          type: string
          example: '+13125550000'
          readOnly: true
        status:
          type: string
          description: Most preferences apply immediately; however, other may needs to propagate.
          enum:
          - enabled
          - enable-received
          - enable-pending
          - enable-submtited
          - delete-received
          - delete-pending
          - delete-submitted
          - deleted
          example: enable-received
          readOnly: true
        notification_channel_id:
          type: string
          description: A UUID reference to the associated Notification Channel.
          example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: phone_number
              value:
                type: string
                example: '+13125550000'
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
      type: object
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    NotificationEventCondition:
      properties:
        id:
          type: string
          description: A UUID.
          readOnly: true
          example: 70c7c5cb-dce2-4124-accb-870d39dbe852
        name:
          type: string
          example: from phone number
        description:
          type: string
          example: When emergency number dialed from phone number X
        notification_event_id:
          type: string
          example: d5c395cd-9864-4609-b5e2-3f9fd4ce201a
        associated_record_type:
          type: string
          enum:
          - account
          - phone_number
          example: phone_number
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: phone_number
              optional:
                type: boolean
                example: false
              data_type:
                type: string
                example: string
        enabled:
          type: boolean
          example: true
        allow_multiple_channels:
          description: Dictates whether a notification channel id needs to be provided when creating a notficiation setting.
          type: boolean
          example: false
        asynchronous:
          description: Dictates whether a notification setting will take effect immediately.
          type: boolean
          example: true
        supported_channels:
          description: Dictates the supported notification channel types that can be emitted.
          type: array
          items:
            type: string
          example:
          - webhook
          - sms
          - email
          - voice
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2019-10-15T10:07:15.527Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2019-10-15T10:07:15.527Z'
      type: object
    NotificationProfile:
      description: A Collection of Notification Channels
      properties:
        id:
          type: string
          description: A UUID.
          readOnly: true
          example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
        name:
          type: string
          description: A human readable name.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
      type: object
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    NotificationChannel:
      description: A Notification Channel
      properties:
        id:
          type: string
          description: A UUID.
          readOnly: true
          example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
        notification_profile_id:
          type: string
          description: A UUID reference to the associated Notification Profile.
          example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
        channel_type_id:
          type: string
          description: A Channel Type ID
          enum:
          - sms
          - voice
          - email
          - webhook
        channel_destination:
          type: string
          description: The destination associated with the channel type.
          example: '+13125550000'
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2019-10-15T10:07:15.527Z'
          readOnly: true
      type: object
    NotificationEvent:
      description: An object representing the available notifications.
      properties:
        id:
          type: string
          description: A UUID.
          readOnly: true
          example: d5c395cd-9864-4609-b5e2-3f9fd4ce201a
        name:
          type: string
          description: A human readable name.
          example: Emergency Number Dialed
        notification_category:
          type: string
          example: Calls
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2019-10-15T10:07:15.527Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2019-10-15T10:07:15.527Z'
      type: object
    notifications_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/notifications_Error'
          type: array
      type: object
    notifications_Error:
      properties:
        code:
          type: string
          x-format: int64
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              format: json-pointer
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  parameters:
    notifications_FilterConsolidated:
      name: filter
      in: query
      style: deepObject
      explode: true
      required: false
      description: 'Consolidated filter parameter (deepObject style). Originally: filter[associated_record_type][eq], filter[channel_type_id][eq], filter[notification_profile_id][eq], filter[notification_channel][eq], filter[notification_event_condition_id][eq], filter[status][eq]'
      schema:
        type: object
        properties:
          associated_record_type:
            type: object
            properties:
              eq:
                type: string
                enum:
                - account
                - phone_number
                example: phone_number
                description: Filter by the associated record type
          channel_type_id:
            type: object
            properties:
              eq:
                type: string
                enum:
                - webhook
                - sms
                - email
                - voice
                example: webhook
                description: Filter by the id of a channel type
          notification_profile_id:
            type: object
            properties:
              eq:
                type: string
                example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
                description: Filter by the id of a notification profile
          notification_channel:
            type: object
            properties:
              eq:
                type: string
                example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
                description: Filter by the id of a notification channel
          notification_event_condition_id:
            type: object
            properties:
              eq:
                type: string
                example: 12455643-3cf1-4683-ad23-1cd32f7d5e0a
                description: Filter by the id of a notification channel
          status:
