      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[^\u0000-\u001f\u007f]+$
      description: Required after page 1; account/filter-bound 15-minute stable snapshot; expired/mismatch 409.
