openapi: 3.2.0
info:
  version: 2.0.0
  x-latency-category: responsive
  x-endpoint-cost: light
  title: Telnyx AI Gateway API
  description: SIP trunking, SMS, MMS, Call Control and Telephony Data Services.
  contact:
    email: support@telnyx.com
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: AI Gateway
  description: Manage and report AI Gateway traffic.
paths:
  /llm_token_gateway/spend/events:
    get:
      operationId: get_ai_gateway_spend_events
      description: 'Return request-level usage history for the authenticated account. Supply both UTC dates or neither; omitting both returns the previous full UTC day. Dates use a half-open range [start_date, end_date) of at most 31 days. Cost reflects budget reference rates, not invoice charges. Unknown spend is excluded and reported separately. The report snapshot supports at most 10,000 matching requests, independently of page size. Exceeding this bound returns HTTP 503 without partial results. Narrow the date range or resource filters before retrying. A failed report must not be interpreted as zero usage. Request tags can filter either report and metadata: can group the summary.'
      security:
      - telnyxApiKey: []
      parameters:
      - $ref: '#/components/parameters/ai-gateway-spend_PageNumber'
      - $ref: '#/components/parameters/ai-gateway-spend_PageSize'
      - $ref: '#/components/parameters/Snapshot'
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ''
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ''
      - name: token_group_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: token_user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: token_key_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: end_user_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f]+$
        description: ''
      - name: metadata
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          maxProperties: 5
          propertyNames:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\u0000-\u001f\u007f]+$
        description: 'Request tag filters as metadata[<key>]=<value>, at most 5, combined with AND. A value matches the tag''s text form exactly (booleans as true/false, integers in decimal), so metadata[flag]=true matches both boolean true and the string "true". Keys are case-sensitive; reserved-prefix keys are rejected. Unindexed: bounded by the account, the date range and the report timeout.'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                const: no-store
              description: All API responses; application cache is server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendEvents'
              example:
                data: []
                meta:
                  page_number: 1
                  page_size: 20
                  has_more: false
                  snapshot: 9b7e4a10-3c2d-4f5e-8a6b-1d2c3e4f5a60
        '400':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError400'
        '401':
          $ref: '#/components/responses/GatewayError401'
        '403':
          $ref: '#/components/responses/GatewayError403'
        '404':
          $ref: '#/components/responses/GatewayError404'
        '409':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError409'
        '412':
          $ref: '#/components/responses/GatewayError412'
        '428':
          $ref: '#/components/responses/GatewayError428'
        '429':
          $ref: '#/components/responses/GatewayError429'
        '502':
          $ref: '#/components/responses/GatewayError502'
        '503':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError503'
        '504':
          $ref: '#/components/responses/GatewayError504'
      summary: List gateway spend events
      tags:
      - AI Gateway
  /llm_token_gateway/spend/summary:
    get:
      operationId: get_ai_gateway_spend_summary
      description: 'Return request counts, token counts and reference spend grouped by one attribution dimension. Both UTC dates and group_by are required. Dates use a half-open range [start_date, end_date) of at most 31 days. Cost reflects budget reference rates, not invoice charges. Unknown spend is excluded and reported separately. The report snapshot supports at most 10,000 matching requests, independently of page size. Exceeding this bound returns HTTP 503 without partial results. Narrow the date range or resource filters before retrying. A failed report must not be interpreted as zero usage. Request tags can filter either report and metadata: can group the summary.'
      security:
      - telnyxApiKey: []
      parameters:
      - $ref: '#/components/parameters/ai-gateway-spend_PageNumber'
      - $ref: '#/components/parameters/ai-gateway-spend_PageSize'
      - $ref: '#/components/parameters/Snapshot'
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: ''
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: ''
      - name: token_group_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: token_user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: token_key_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: end_user_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f]+$
        description: ''
      - name: metadata
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          maxProperties: 5
          propertyNames:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\u0000-\u001f\u007f]+$
        description: 'Request tag filters as metadata[<key>]=<value>, at most 5, combined with AND. A value matches the tag''s text form exactly (booleans as true/false, integers in decimal), so metadata[flag]=true matches both boolean true and the string "true". Keys are case-sensitive; reserved-prefix keys are rejected. Unindexed: bounded by the account, the date range and the report timeout.'
      - name: group_by
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SpendGroupBy'
        description: A scope, or metadata:<key> to group by one request tag's text-form value; requests without the key form one group with a null dimension_id.
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                const: no-store
              description: All API responses; application cache is server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendSummary'
              example:
                data: []
                meta:
                  page_number: 1
                  page_size: 20
                  has_more: false
                  snapshot: 9b7e4a10-3c2d-4f5e-8a6b-1d2c3e4f5a60
                  start_date: '2026-09-01'
                  end_date: '2026-09-08'
                  group_by: token_group
        '400':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError400'
        '401':
          $ref: '#/components/responses/GatewayError401'
        '403':
          $ref: '#/components/responses/GatewayError403'
        '404':
          $ref: '#/components/responses/GatewayError404'
        '409':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError409'
        '412':
          $ref: '#/components/responses/GatewayError412'
        '428':
          $ref: '#/components/responses/GatewayError428'
        '429':
          $ref: '#/components/responses/GatewayError429'
        '502':
          $ref: '#/components/responses/GatewayError502'
        '503':
          $ref: '#/components/responses/ai-gateway-spend_GatewayError503'
        '504':
          $ref: '#/components/responses/GatewayError504'
      summary: Get gateway spend summary
      tags:
      - AI Gateway
