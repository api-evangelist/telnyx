  schemas:
    Money:
      type: number
      minimum: 0
      maximum: 1000000000
      multipleOf: 1.0e-06
      description: USD, decimal precision at most 6 places; parse exactly to integer micro-USD, never binary float accounting.
    UsageMetrics:
      type: object
      additionalProperties: false
      properties:
        requests:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        unknown_requests:
          type: integer
          minimum: 0
        cache_hits:
          type: integer
          minimum: 0
        succeeded_requests:
          type: integer
          minimum: 0
        failed_requests:
          type: integer
          minimum: 0
        partial_requests:
          type: integer
          minimum: 0
        spend:
          $ref: '#/components/schemas/Money'
        reserved_spend:
          $ref: '#/components/schemas/Money'
      required:
      - requests
      - input_tokens
      - output_tokens
      - unknown_requests
      - cache_hits
      - succeeded_requests
      - failed_requests
      - partial_requests
      - spend
      - reserved_spend
    ai-gateway-resources_Scope:
      type: string
      enum:
      - token_group
      - token_user
      - token_key
      - end_user
    BudgetDuration:
      type:
      - string
      - 'null'
      enum:
      - 1d
      - 7d
      - 30d
      - null
    UsageExportGuardrailEvaluation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^grd_[0-9a-f-]{36}$
        type:
          const: guardrail.evaluation
        schema_version:
          const: 1
        request_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        token_group_id:
          type: string
          format: uuid
        token_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        token_key_id:
          type: string
          format: uuid
        end_user_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\u0000-\u001f\u007f]+$
          - type: 'null'
        model:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f]+$
        stage:
          type: string
          enum:
          - prompt
          - response
        outcome:
          type: string
          enum:
