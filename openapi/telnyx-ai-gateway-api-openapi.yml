  /llm_token_gateway/usage/export:
    get:
      operationId: exportGatewayUsage
      description: 'Durable, replayable, content-free usage export for customer pipelines. Requires the dedicated llm_token_gateway.usage_export.read V2 action; spend.read and usage.read do not grant it. Records are inference.request (one per immutable ledger revision; a correction adds a new id with supersedes, keep the highest revision per request_id) and guardrail.evaluation (one per guardrail event, including blocked prompts with no inference record; correlate on request_id). Delivery is at least once in commit order: deduplicate on id. Records appear after settlement and after every older database transaction has finished (meta.horizon_lag_seconds); keep polling with next_cursor, which is always returned and is reusable after has_more is false. After a logical database restore, restart from start_time and deduplicate on id; a cursor from before it may return 409 cursor_expired (no Retry-After). Retention promise 30 days. No prompts, responses, provider credentials, supplier or customer rates. Gateway reference/enforcement usage, not invoice truth or BYOK provider charges.'
      security:
      - telnyxApiKey: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        description: ''
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
        description: Opaque next_cursor from a previous page; not combinable with start_time. Bound to the requested types; the account always comes from the credential.
      - name: start_time
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 'First page only: RFC 3339 with offset, at most 30 days ago and not in the future; default now - 24h.'
      - name: types
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z.]+(,[a-z.]+)?$
        description: Comma-separated subset of inference.request,guardrail.evaluation; default both.
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                const: no-store
              description: All API responses; application cache is server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageExportPage'
              example:
                data: []
                meta:
                  next_cursor: synthetic_cursor
                  has_more: false
                  horizon_lag_seconds: 0
        '400':
          $ref: '#/components/responses/ai-gateway_GatewayError400'
        '401':
          $ref: '#/components/responses/GatewayError401'
        '403':
          $ref: '#/components/responses/GatewayError403'
        '404':
          $ref: '#/components/responses/GatewayError404'
        '409':
          $ref: '#/components/responses/GatewayError40911'
        '412':
          $ref: '#/components/responses/GatewayError412'
        '428':
          $ref: '#/components/responses/GatewayError428'
        '429':
          $ref: '#/components/responses/GatewayError429'
        '502':
          $ref: '#/components/responses/GatewayError502'
        '503':
          $ref: '#/components/responses/UsageExportUnavailable'
        '504':
          $ref: '#/components/responses/GatewayError504'
      summary: Export gateway usage
      tags:
      - AI Gateway
  /llm_token_gateway/usage/summary:
    get:
      operationId: gateway_usage_summary
      description: Gateway reference/enforcement usage, not invoice truth or BYOK provider charges. Requires the dedicated llm_token_gateway.usage.read V2 action for combined spend and guardrail reporting; existing spend.read and guardrail_events.read grants do not grant this endpoint. All totals, UTC daily buckets, models and latest 20 guardrail events share one database snapshot. UTC half-open dates, at most 31 days. Zero-filled days; at most 1000 models (503 rather than truncation on overflow/timeout). Known tokens sum independently known categories across latest attempt evidence, including corrections; unknown spend is excluded and unknown_requests/reserved_spend remain explicit. Guardrail counts count events, not distinct requests. No raw spend events, prompts or secrets. This read-only report creates no pagination snapshot and accepts no pagination parameters.
      security:
      - telnyxApiKey: []
      parameters:
      - name: token_group_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: ''
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: ''
      - name: metadata
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          maxProperties: 5
          propertyNames:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\u0000-\u001f\u007f]+$
        description: 'Request tag filters as metadata[<key>]=<value>, at most 5, combined with AND. A value matches the tag''s text form exactly (booleans as true/false, integers in decimal), so metadata[flag]=true matches both boolean true and the string "true". Keys are case-sensitive; reserved-prefix keys are rejected. Unindexed: bounded by the account, the date range and the report timeout.'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                const: no-store
              description: All API responses; application cache is server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayUsage'
              example:
                data:
                  totals:
                    requests: 2
                    input_tokens: 120
                    output_tokens: 30
                    unknown_requests: 1
                    cache_hits: 0
                    succeeded_requests: 1
                    failed_requests: 0
                    partial_requests: 0
                    spend: 0.00045
                    reserved_spend: 0.01
                  by_day:
                  - date: '2026-09-01'
                    requests: 2
                    input_tokens: 120
                    output_tokens: 30
                    unknown_requests: 1
                    cache_hits: 0
                    succeeded_requests: 1
                    failed_requests: 0
                    partial_requests: 0
                    spend: 0.00045
                    reserved_spend: 0.01
                  by_model:
                  - model: Qwen/Qwen3-235B-A22B
                    requests: 2
                    input_tokens: 120
                    output_tokens: 30
                    unknown_requests: 1
                    cache_hits: 0
                    succeeded_requests: 1
                    failed_requests: 0
                    partial_requests: 0
                    spend: 0.00045
                    reserved_spend: 0.01
                  guardrails:
                    blocked_events: 0
                    flagged_events: 0
                    recent_events: []
                meta:
                  token_group_id: 11111111-1111-4111-8111-111111111111
                  start_date: '2026-09-01'
                  end_date: '2026-09-02'
                  metadata: {}
        '400':
          $ref: '#/components/responses/ai-gateway_GatewayError400'
        '401':
          $ref: '#/components/responses/GatewayError401'
        '403':
          $ref: '#/components/responses/GatewayError403'
        '404':
          $ref: '#/components/responses/GatewayError404'
        '409':
