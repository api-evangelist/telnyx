        guardrails:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              secrets:
                type: object
                additionalProperties: false
                properties:
                  prompt:
                    type: string
                    enum:
                    - ignore
                    - flag
                    - block
                  response:
                    type: string
                    enum:
                    - ignore
                    - flag
                    - block
              dlp:
                type: object
                additionalProperties: false
                properties:
                  profiles:
                    type: array
                    items:
                      type: string
                      enum:
                      - financial
                      - government_id
                      - contact
                    uniqueItems: true
                  prompt:
                    type: string
                    enum:
                    - ignore
                    - flag
                    - block
                  response:
                    type: string
                    enum:
                    - ignore
                    - flag
                    - block
              streaming:
                type: string
                enum:
                - buffered
                - passthrough
            description: Per-group guardrail policy. Missing actions default to ignore. profiles may be listed with both dlp actions ignore (staged, inactive) but a non-ignore dlp action requires at least one profile. streaming defaults to buffered when any response action is block and passthrough otherwise; passthrough with a response block is 400. Findings are codes and counts only; content is never stored. The stored form is echoed back canonicalised (all actions explicit, profiles sorted); {} is stored as an all-ignore policy, null disables.
          - type: 'null'
        fallbacks:
          anyOf:
          - type: object
            maxProperties: 1000
            additionalProperties:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^[^\u0000-\u001f\u007f]+$
              minItems: 1
              maxItems: 3
              uniqueItems: true
            description: 'Per-group model fallbacks: primary alias -> ordered list of 1..3 other aliases. Every key and listed alias must be in allowed_models (a PATCH removing a referenced alias is 400); a chain never lists its own key; wildcards are rejected. Chains are one level deep (a step''s own chain is not expanded). Fallback is attempted only for managed routes, only before the first provider event is forwarded, and only to steps the key may use; each attempt is reserved and recorded. {} and null both disable fallbacks.'
          - type: 'null'
        retries:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              max_attempts:
                type: integer
                minimum: 1
                maximum: 5
              retry_delay_ms:
                type: integer
                minimum: 0
                maximum: 5000
                default: 250
              backoff:
                type: string
                enum:
                - constant
                - linear
                - exponential
                default: exponential
              request_timeout_ms:
                anyOf:
                - type: integer
                  minimum: 1000
                  maximum: 60000
                - type: 'null'
            required:
            - max_attempts
            description: 'Per-group same-route retries. max_attempts counts the first try of each step (the primary and each fallback) and is the ceiling for the x-ltg-max-attempts request header. A step is retried only when its attempt definitely did no provider work (connection failure before dispatch, or 429/529) before the first provider event; an uncertain failure (timeout, 408/500/502/503/504) moves to the next fallback step instead. max_attempts x (1 + the longest fallback chain) must not exceed 8, else 400. The n-th retry waits retry_delay_ms (constant), retry_delay_ms*n (linear) or retry_delay_ms*2^(n-1) (exponential), at most 5 s and never past the request deadline, then jittered uniformly down to half that value so concurrent retries spread out; a provider Retry-After of at most 5 s is honoured and a longer one moves to the next step. request_timeout_ms applies to streaming requests only: it bounds each attempt''s time to its first provider event and never applies after it. Non-stream requests keep the per-attempt hop and idle bounds (their headers arrive only with the finished completion). retry_delay_ms and backoff are floors for the request knobs. Each planned attempt is reserved (at most 8 per request); unused reservation is released at settlement. Managed routes only. The stored form is echoed back with defaults filled in; null disables retries.'
          - type: 'null'
        blocked:
          type: boolean
      required:
      - name
      - allowed_models
