          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f]+$
        token_group_id:
          type: string
          format: uuid
        token_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        max_budget:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Stored key limit; set to the maximum when the key was written without one (on a blocked key, null is kept until the key is unblocked).
        budget_duration:
          $ref: '#/components/schemas/BudgetDuration'
        tpm_limit:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Stored key limit; set to the maximum when the key was written without one (on a blocked key, null is kept until the key is unblocked).
        rpm_limit:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Stored key limit; set to the maximum when the key was written without one (on a blocked key, null is kept until the key is unblocked).
        allowed_models:
          anyOf:
          - type: array
            items:
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^[^\u0000-\u001f\u007f]+$
            uniqueItems: true
            maxItems: 1000
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        blocked:
          type: boolean
        required_end_user_id:
          type: boolean
          default: false
          description: Require a nonempty caller-asserted end-user ID; not proof of identity.
        spend:
          $ref: '#/components/schemas/Money'
        reserved_spend:
          $ref: '#/components/schemas/Money'
        budget_started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        resets_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        provisioning:
          type: string
          enum:
          - ready
          - pending
          - unavailable
          - inactive
          - unsupported
          - unknown
          description: 'Provisioning state of the key''s current policy. `pending`: retry readiness with bounded backoff (treat `unknown` the same). `inactive` and `unsupported` are terminal until the key, group, user or catalog changes. `unavailable` means provisioning is stuck and is retried slowly; surface it. Absent while the gateway runs in compatibility mode.'
      required:
      - record_type
      - id
      - created_at
      - updated_at
      - version
      - name
      - token_group_id
      - token_user_id
      - max_budget
      - budget_duration
      - tpm_limit
      - rpm_limit
      - allowed_models
      - expires_at
      - blocked
      - required_end_user_id
      - spend
      - reserved_spend
      - budget_started_at
      - resets_at
