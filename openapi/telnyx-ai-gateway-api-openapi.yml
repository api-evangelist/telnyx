      propertyNames:
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
      additionalProperties:
        anyOf:
        - type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f-\u009f]+$
        - type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        - type: boolean
