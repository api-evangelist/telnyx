paths:
  /numbers_features:
    post:
      summary: Retrieve the features for a list of numbers
      operationId: PostNumbersFeatures
      tags:
      - numbers features
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_numbers:
                  type: array
                  items:
                    type: string
              required:
              - phone_numbers
            example:
              phone_numbers:
              - '+19705555098'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        phone_number:
                          type: string
                        features:
                          type: array
                          items:
                            type: string
                      required:
                      - phone_number
                      - features
              example:
                data:
                - phone_number: string
                  features:
                  - string
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
