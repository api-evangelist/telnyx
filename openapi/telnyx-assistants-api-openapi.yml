          description: Enhances recognition for specific languages and dialects during MiniMax TTS synthesis. Default is null (no boost). Set to 'auto' for automatic language detection. Only applicable when using MiniMax voices.
          enum:
          - null
          - auto
          - Chinese
          - Chinese,Yue
          - English
          - Arabic
          - Russian
          - Spanish
          - French
          - Portuguese
          - German
          - Turkish
          - Dutch
          - Ukrainian
          - Vietnamese
          - Indonesian
          - Japanese
          - Italian
          - Korean
          - Thai
          - Polish
          - Romanian
          - Greek
          - Czech
          - Finnish
          - Hindi
          - Bulgarian
          - Danish
          - Hebrew
          - Malay
          - Persian
          - Slovak
          - Swedish
          - Croatian
          - Filipino
          - Hungarian
          - Norwegian
          - Slovenian
          - Catalan
          - Nynorsk
          - Tamil
          - Afrikaans
          type:
          - string
          - 'null'
        similarity_boost:
          default: 0.75
          description: Determines how closely the AI should adhere to the original voice when attempting to replicate it. Only applicable when using ElevenLabs.
          type: number
        speed:
          default: 1.0
          description: Adjusts speech velocity. 1.0 is default speed; values less than 1.0 slow speech; values greater than 1.0 accelerate it. Only applicable when using ElevenLabs.
          type: number
        style:
          default: 0
          description: Determines the style exaggeration of the voice. Amplifies speaker style but consumes additional resources when set above 0. Only applicable when using ElevenLabs.
          type: number
        temperature:
          default: 0.5
          description: Determines how stable the voice is and the randomness between each generation. Lower values create a broader emotional range; higher values produce more consistent, monotonous output. Only applicable when using ElevenLabs.
          type: number
        use_speaker_boost:
          default: true
          description: Amplifies similarity to the original speaker voice. Increases computational load and latency slightly. Only applicable when using ElevenLabs.
          type: boolean
        voice:
          description: 'The voice to be used by the voice assistant. Check the full list of [available voices](https://developers.telnyx.com/docs/tts-stt/tts-available-voices) via our voices API.

            To use ElevenLabs, you must reference your ElevenLabs API key as an integration secret under the `api_key_ref` field. See [integration secrets documentation](https://developers.telnyx.com/api-reference/integration-secrets/create-a-secret) for details. For Telnyx voices, use `Telnyx.<model_id>.<voice_id>` (e.g. Telnyx.KokoroTTS.af_heart).

            The voice portion of the identifier supports [dynamic variables](https://developers.telnyx.com/docs/inference/ai-assistants/dynamic-variables) using mustache syntax (e.g. `Telnyx.Ultra.{{voice_id}}`). The variable is resolved at call time from your dynamic variables webhook, allowing you to select the voice dynamically per call.'
          type: string
        voice_speed:
          default: 1
          description: The speed of the voice in the range [0.25, 2.0]. 1.0 is deafult speed. Larger numbers make the voice faster, smaller numbers make it slower. This is only applicable for Telnyx Natural voices.
          type: number
      required:
      - voice
      type: object
