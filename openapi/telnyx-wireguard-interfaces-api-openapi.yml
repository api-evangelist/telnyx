openapi: 3.2.0
info:
  title: Telnyx WireGuard Interfaces API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged WireGuard Interfaces across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: WireGuard Interfaces
  description: WireGuard Interface operations
paths:
  /wireguard_interfaces:
    get:
      summary: List all WireGuard Interfaces
      description: Returns a paginated list of the WireGuard interfaces on your account, with support for filtering.
      operationId: ListWireguardInterfaces
      tags:
      - WireGuard Interfaces
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[network_id]'
        schema:
          type: object
          properties:
            network_id:
              type: string
              example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
              description: The associated network id to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WireguardInterfaceRead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a WireGuard Interface
      description: Create a new WireGuard Interface. Current limitation of 10 interfaces per user can be created.
      operationId: CreateWireguardInterface
      tags:
      - WireGuard Interfaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireguardInterfaceCreate'
        required: true
      responses:
        '202':
          description: Creation request accepted. Provisioning is asynchronous; poll GET /wireguard_interfaces/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardInterfaceRead'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /wireguard_interfaces/{id}:
    delete:
      summary: Delete a WireGuard Interface
      description: Deletes the specified WireGuard interface from its network.
      operationId: DeleteWireguardInterface
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardInterfaceRead'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve a WireGuard Interfaces
      description: Returns the details of a single WireGuard interface by its identifier.
      operationId: GetWireguardInterface
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardInterfaceRead'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /wireguard_peers:
    get:
      summary: List all WireGuard Peers
      description: Returns a paginated list of your WireGuard peers, with support for filtering.
      operationId: ListWireguardPeers
      tags:
      - WireGuard Interfaces
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[wireguard_interface_id]'
        schema:
          type: object
          properties:
            wireguard_interface_id:
              type: string
              format: uuid
              example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
              description: The id of the associated WireGuard interface to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WireguardPeer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a WireGuard Peer
      description: Create a new WireGuard Peer. Current limitation of 5 peers per interface can be created.
      operationId: CreateWireguardPeer
      tags:
      - WireGuard Interfaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireguardPeerCreate'
        required: true
      responses:
        '202':
          description: Creation request accepted. Provisioning is asynchronous; poll GET /wireguard_peers/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardPeer'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /wireguard_peers/{id}:
    delete:
      summary: Delete the WireGuard Peer
      description: Deletes the specified WireGuard peer from its interface.
      operationId: DeleteWireguardPeer
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardPeer'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Retrieve the WireGuard Peer
      description: Returns the details of a single WireGuard peer by its identifier.
      operationId: GetWireguardPeer
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardPeer'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update the WireGuard Peer
      description: Updates the specified WireGuard peer and returns the updated peer.
      operationId: UpdateWireguardPeer
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireguardPeerPatch'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WireguardPeer'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /wireguard_peers/{id}/config:
    get:
      summary: Retrieve Wireguard config template for Peer
      operationId: GetWireguardPeerConfig
      tags:
      - WireGuard Interfaces
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: '[Interface]

                  PrivateKey = <! INSERT PEER PRIVATE KEY HERE !>

                  Address = 198.51.100.1/32


                  [Peer]

                  PublicKey = qF4EqlZq+5JL2IKYY8ij49daYyfKVhevJrcDxdqC8GU=

                  AllowedIPs = 198.51.100.0/29

                  Endpoint = 203.0.113.0:51871

                  PersistentKeepalive = 25

                  '
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    Record:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the resource.
          readOnly: true
          example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        record_type:
          type: string
          description: Identifies the type of the resource.
          readOnly: true
          example: sample_record_type
        created_at:
          type: string
          description: ISO 8601 formatted date-time indicating when the resource was created.
          readOnly: true
          example: '2018-02-02T22:25:27.521Z'
        updated_at:
          type: string
          description: ISO 8601 formatted date-time indicating when the resource was updated.
          readOnly: true
          example: '2018-02-02T22:25:27.521Z'
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    WireguardInterface:
      allOf:
      - $ref: '#/components/schemas/Record'
      - $ref: '#/components/schemas/Interface'
      - type: object
        title: WireguardInterface
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: wireguard_interface
          endpoint:
            type: string
            description: The Telnyx WireGuard peers `Peer.endpoint` value.
            example: 203.0.113.0:51871
            readOnly: true
          public_key:
            type: string
            description: The Telnyx WireGuard peers `Peer.PublicKey`.
            readOnly: true
            example: qF4EqlZq+5JL2IKYY8ij49daYyfKVhevJrcDxdqC8GU=
          enable_sip_trunking:
            type: boolean
            description: Enable SIP traffic forwarding over VPN interface.
            example: false
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    WireguardInterfaceCreate:
      allOf:
      - $ref: '#/components/schemas/WireguardInterface'
      - $ref: '#/components/schemas/RegionIn'
      - type: object
        title: WireguardInterfaceCreate
        required:
        - network_id
        - region_code
    WireguardInterfaceRead:
      allOf:
      - $ref: '#/components/schemas/WireguardInterface'
      - $ref: '#/components/schemas/RegionOut'
    RegionOut:
      type: object
      properties:
        region_code:
          description: The region interface is deployed to.
          type: string
          example: ashburn-va
        region:
          type: object
          properties:
            code:
              description: Region code of the interface.
              type: string
              example: ashburn-va
            name:
              description: Region name of the interface.
              type: string
              example: Ashburn
            record_type:
              type: string
              description: Identifies the type of the resource.
              readOnly: true
              example: region
    RegionIn:
      type: object
      properties:
        region_code:
          description: The region the interface should be deployed to.
          type: string
          example: ashburn-va
    WireguardPeerCreate:
      allOf:
      - $ref: '#/components/schemas/WireguardPeer'
      - type: object
        title: WireguardPeerCreate
        required:
        - wireguard_interface_id
    InterfaceStatus:
      type: string
      enum:
      - created
      - provisioning
      - provisioned
      - deleting
      description: The current status of the interface deployment.
      readOnly: true
      example: provisioned
    WireguardPeer:
      allOf:
      - $ref: '#/components/schemas/Record'
      - $ref: '#/components/schemas/WireguardPeerPatch'
      - type: object
        title: WireguardPeer
        properties:
          record_type:
            type: string
            description: Identifies the type of the resource.
            readOnly: true
            example: wireguard_peer
          last_seen:
            type: string
            description: ISO 8601 formatted date-time indicating when peer sent traffic last time.
            readOnly: true
            example: '2018-02-02T22:25:27.521Z'
          wireguard_interface_id:
            description: The id of the wireguard interface associated with the peer.
            type: string
            format: uuid
            example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
          private_key:
            type: string
            description: Your WireGuard `Interface.PrivateKey`.<br /><br />This attribute is only ever utlised if, on POST, you do NOT provide your own `public_key`. In which case, a new Public and Private key pair will be generated for you. When your `private_key` is returned, you must save this immediately as we do not save it within Telnyx. If you lose your Private Key, it can not be recovered.
            example: qF4EqlZq+5JL2IKYY8ij49daYyfKVhevJrcDxdqC8GU=
            readOnly: true
    Interface:
      type: object
      properties:
        network_id:
          description: The id of the network associated with the interface.
          type: string
          format: uuid
          example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        name:
          type: string
          description: A user specified name for the interface.
          example: test interface
        status:
          $ref: '#/components/schemas/InterfaceStatus'
    WireguardPeerPatch:
      type: object
      title: WireguardPeerPatch
      properties:
        public_key:
          type: string
          description: The WireGuard `PublicKey`.<br /><br />If you do not provide a Public Key, a new Public and Private key pair will be generated for you.
          example: qF4EqlZq+5JL2IKYY8ij49daYyfKVhevJrcDxdqC8GU=
    netapps_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/netapps_Error'
          type: array
      type: object
    netapps_Error:
      properties:
        code:
          type: string
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  responses:
    UnprocessableEntity:
      description: Unprocessable entity. Check the 'detail' field in response for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: '10027'
              title: Unprocessable Entity
              detail: The server understood the syntax of the request but was unable to process the instructions.
    GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    WireguardInterfaceResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/WireguardInterfaceRead'
