openapi: 3.2.0
info:
  title: Telnyx Profiles API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Profiles across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Profiles
  description: Messaging profiles
paths:
  /ai/memory/namespaces/{namespace}/profiles:
    get:
      summary: List a namespace's profiles
      operationId: ListMemoryProfiles
      tags:
      - Profiles
      description: Profiles are never created, only written to, so this lists the ones that hold a memory. A profile whose first ingest is still running is not here yet. Ordered by memory count, largest first, so a profile written to while the listing is paged can move between pages and be repeated or missed.
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          title: Namespace
      - name: page[number]
        in: query
        required: false
        description: 'The page to return, counting from 1. Bounded in depth: (page[number] - 1) * page[size] may be at most 10000.'
        schema:
          type: integer
          maximum: 10001
          minimum: 1
          default: 1
          title: Number
      - name: page[size]
        in: query
        required: false
        description: How many results a page holds.
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
              example:
                data:
                - profile_id: caller:+13128675309
                  memory_count: 12
                meta:
                  page_number: 1
                  page_size: 20
                  total_pages: 1
                  total_results: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not find any usable credentials in the request.
                  source:
                    pointer: /
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
        '404':
          description: The namespace does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: namespace_not_found
                  detail: no such namespace
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: invalid_request
                  detail: 'limit is no longer supported: page with page[number] and page[size] instead'
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: upstream_error
                  detail: the memory dataplane is unavailable
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/memory/namespaces/{namespace}/profiles/{profile_id}:
    delete:
      summary: Forget a profile's memories
      operationId: ForgetProfile
      tags:
      - Profiles
      description: Delete everything held about one profile. A 2xx means none of its memories are left, and its summary goes with them. There is no undo.
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          description: The namespace. `default` exists for every organization.
        description: The namespace. `default` exists for every organization.
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
        description: 'The profile: your identifier for the user, caller or agent this memory is about.'
      responses:
        '200':
          description: The profile's memories are gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetResponse'
              example:
                data:
                  profile_id: caller:+13128675309
                  memories_deleted: 12
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not find any usable credentials in the request.
                  source:
                    pointer: /
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
        '404':
          description: The namespace does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: namespace_not_found
                  detail: no such namespace
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: upstream_error
                  detail: the memory dataplane is unavailable
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/memory/namespaces/{namespace}/profiles/{profile_id}/memories:
    get:
      summary: List a profile's memories, most recent first
      operationId: ListMemories
      tags:
      - Profiles
      description: 'Everything stored under one profile, unranked -- ask `recall` for the memories that answer a question. A profile that holds nothing is an empty page rather than a 404: profiles exist by being written to. Each memory names the `source_id` it was extracted from, or null for a memory derived from other memories -- which can read almost the same as the fact it restates. A `source_id` narrows the listing to the memories extracted from that source, and a `session_id` to those extracted from the session, which is the same thing named another way; pass one or the other. Neither is everything the source led to: a memory derived from several sources belongs to no single one and appears only in the unfiltered listing. A memory written while the listing is paged shifts the pages after it, so an entry can be repeated or missed at a page boundary.'
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          title: Namespace
      - name: session_id
        in: query
        required: false
        description: An ingested session, by the `session_id` it was ingested with. Narrows the request to the source that session was stored as.
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Session Id
      - name: source_id
        in: query
        required: false
        description: Narrows the listing to the memories extracted from one source, a remembered fact as well as a session. Pass this or `session_id`, not both.
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Source Id
      - name: page[number]
        in: query
        required: false
        description: 'The page to return, counting from 1. Bounded in depth: (page[number] - 1) * page[size] may be at most 10000.'
        schema:
          type: integer
          maximum: 10001
          minimum: 1
          default: 1
          title: Number
      - name: page[size]
        in: query
        required: false
        description: How many results a page holds.
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
              example:
                data:
                - id: mem_01HZY4
                  text: Invoices go to 220 W Chicago Ave.
                  recorded_at: '2026-08-26T21:14:11Z'
                  source_id: b1e6c0a2-4f3d-4a2e-9c7b-8e1f2a3b4c5d
                meta:
                  page_number: 1
                  page_size: 20
                  total_pages: 22
                  total_results: 431
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not find any usable credentials in the request.
                  source:
                    pointer: /
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
        '404':
          description: The namespace does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: namespace_not_found
                  detail: no such namespace
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: invalid_request
                  detail: pass source_id or session_id, not both
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: upstream_error
                  detail: the memory dataplane is unavailable
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/memory/namespaces/{namespace}/profiles/{profile_id}/memories/{memory_id}:
    get:
      summary: Read one memory, and what it came from
      operationId: GetMemory
      tags:
      - Profiles
      description: 'One memory by its id, as `recall` and the listing return it, together with what it came from. A fact names its `source_id`: read it with `GET .../sources/{source_id}` to see what was stored. A memory derived from other memories names them in `derived_from` instead; read each of those to reach its source.'
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          title: Namespace
          description: The namespace. `default` exists for every organization.
        description: The namespace. `default` exists for every organization.
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
          description: 'The profile: your identifier for the user, caller or agent this memory is about.'
        description: 'The profile: your identifier for the user, caller or agent this memory is about.'
      - name: memory_id
        in: path
        required: true
        description: A memory's id, as `recall` and the listing return it.
        schema:
          type: string
          title: Memory Id
          description: A memory's id, as `recall` and the listing return it.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
              example:
                data:
                  id: mem_01HZY4
                  text: Invoices go to 220 W Chicago Ave.
                  recorded_at: '2026-08-26T21:14:11Z'
                  source_id: b1e6c0a2-4f3d-4a2e-9c7b-8e1f2a3b4c5d
                  derived_from: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not find any usable credentials in the request.
                  source:
                    pointer: /
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
        '404':
          description: The memory does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: memory_not_found
                  detail: no such memory
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: invalid_request
                  detail: memory id must be a UUID
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxErrors'
              example:
                errors:
                - code: upstream_error
                  detail: the memory dataplane is unavailable
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_profiles:
    get:
      summary: List messaging profiles
      operationId: ListMessagingProfiles
      tags:
      - Profiles
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[name]'
        schema:
          type: object
          properties:
            name:
              type: string
              description: Filter by name
      - $ref: '#/components/parameters/PageConsolidated'
      - name: filter[name][eq]
        in: query
        required: false
        schema:
          type: string
        description: Filter profiles by exact name match.
      - name: filter[name][contains]
        in: query
        required: false
        schema:
          type: string
        description: Filter profiles by name containing the given string.
      responses:
        '200':
          description: Successful response with a list of messaging profiles.
          content:
            application/json:
              schema:
                type: object
                title: List Messaging Profiles Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/messaging_MessagingProfile'
                  meta:
                    $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Lists messaging profiles owned by the authenticated account. Apply the documented filters and pagination parameters to narrow the result set.
    post:
      summary: Create a messaging profile
      operationId: CreateMessagingProfile
      tags:
      - Profiles
      x-endpoint-cost: medium
      requestBody:
        description: New Messaging Profile object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messaging_CreateMessagingProfileRequest'
      responses:
        '200':
          description: Successful response with details about a messaging profile.
          content:
            application/json:
              schema:
                type: object
                title: Messaging Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/messaging_MessagingProfile'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Creates a messaging profile that controls outbound sender selection, webhook delivery, and inbound message handling for associated numbers and short codes.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_profiles/{id}:
    delete:
      summary: Delete a messaging profile
      operationId: DeleteMessagingProfile
      tags:
      - Profiles
      parameters:
      - $ref: '#/components/parameters/MessagingProfileId'
      responses:
        '200':
          description: Successful response with details about a messaging profile.
          content:
            application/json:
              schema:
                type: object
                title: Messaging Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/messaging_MessagingProfile'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Deletes the specified messaging profile and returns the profile's final configuration.
    get:
      summary: Retrieve a messaging profile
      operationId: RetrieveMessagingProfile
      tags:
      - Profiles
      parameters:
      - $ref: '#/components/parameters/MessagingProfileId'
      responses:
        '200':
          description: Successful response with details about a messaging profile.
          content:
            application/json:
              schema:
                type: object
                title: Messaging Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/messaging_MessagingProfile'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the complete configuration of the specified messaging profile, including webhook and sender-selection settings.
    patch:
      summary: Update a messaging profile
      operationId: UpdateMessagingProfile
      tags:
      - Profiles
      parameters:
      - $ref: '#/components/parameters/MessagingProfileId'
      requestBody:
        description: New Messaging Profile object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messaging_UpdateMessagingProfileRequest'
      responses:
        '200':
          description: Successful response with details about a messaging profile.
          content:
            application/json:
              schema:
                type: object
                title: Messaging Profile Response
                properties:
                  data:
                    $ref: '#/components/schemas/messaging_MessagingProfile'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Updates the supplied settings on the specified messaging profile. Settings omitted from the request remain unchanged.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_profiles/{id}/phone_numbers:
    get:
      summary: List phone numbers associated with a messaging profile
      operationId: ListProfilePhoneNumbers
      tags:
      - Profiles
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/MessagingProfileId'
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response with a list of messaging profile phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: List Messaging Profile Phone Numbers Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
                  meta:
                    $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the phone numbers currently associated with the specified messaging profile.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_profiles/{id}/short_codes:
    get:
      summary: List short codes associated with a messaging profile
      operationId: ListProfileShortCodes
      tags:
      - Profiles
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/MessagingProfileId'
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response with a list of messaging profile short codes.
          content:
            application/json:
              schema:
                type: object
                title: List Messaging Profile Short Codes Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShortCode'
                  meta:
                    $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the short codes currently associated with the specified messaging profile.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    MessagingFeatureSet:
      type:
      - object
      - 'null'
      required:
      - domestic_two_way
      - international_inbound
      - international_outbound
      description: 'The set of features available for a specific messaging use case (SMS or MMS). Features

        can vary depending on the characteristics the phone number, as well as its current

        product configuration.

        '
      properties:
        domestic_two_way:
          type: boolean
          description: Send messages to and receive messages from numbers in the same country.
        international_inbound:
          type: boolean
          description: Receive messages from numbers in other countries.
        international_outbound:
          type: boolean
          description: Send messages to numbers in other countries.
      example:
        domestic_two_way: true
        international_inbound: false
        international_outbound: true
    TracedMemory:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        recorded_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Recorded At
        source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Id
          description: The source this memory was extracted from. Set for a fact, which comes from exactly one source; null for a memory derived from other memories. Read it with `GET .../sources/{source_id}`. A source deleted a moment ago can still be named here, and then answers 404.
        derived_from:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Derived From
          description: The ids of the memories this one was derived from. Read each with `GET .../memories/{memory_id}` to reach its `source_id`. Set for a derived memory; null for a fact.
      type: object
      required:
      - id
      - text
      - source_id
      - derived_from
      title: TracedMemory
    messaging_PaginationMeta_0b38e7044b:
      type: object
      required:
      - total_pages
      - total_results
      - page_size
      - page_number
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    messaging_Errors_0b38e7044b:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/messaging_Error_0b38e7044b'
    NumberHealthMetrics:
      type: object
      required:
      - message_count
      - inbound_outbound_ratio
      - success_ratio
      - spam_ratio
      description: 'High level health metrics about the number and it''s messaging sending patterns.

        '
      properties:
        message_count:
          type: integer
          description: The number of messages analyzed for the health metrics.
        inbound_outbound_ratio:
          type: number
          format: float
          description: The ratio of messages received to the number of messages sent.
        success_ratio:
          type: number
          format: float
          description: The ratio of messages sucessfully delivered to the number of messages attempted.
        spam_ratio:
          type: number
          format: float
          description: The ratio of messages blocked for spam to the number of messages attempted.
      example:
        message_count: 10
        inbound_outbound_ratio: 1
        success_ratio: 2
        spam_ratio: 10
    PageMeta:
      properties:
        page_number:
          type: integer
          title: Page Number
          description: The page returned, counting from 1.
        page_size:
          type: integer
          title: Page Size
          description: How many results a page holds.
        total_pages:
          type: integer
          title: Total Pages
          description: 'Pages that can be requested; 0 when nothing matched. Page until `page_number` reaches it rather than until a page comes back short: a page can hold fewer than `page_size` results without being the last. Capped at the deepest page served, so on a very large listing it covers fewer results than `total_results`.'
        total_results:
          type: integer
          title: Total Results
          description: Results the request matched, including any past the deepest page.
      type: object
      required:
      - page_number
      - page_size
      - total_pages
      - total_results
      title: PageMeta
      description: 'Where a listing''s page sits in the whole.


        A page is a snapshot: the counts it reports and the order it is drawn in

        both move as writes land, so paging through a busy namespace can repeat or

        miss an entry at a page boundary.'
    MemoryListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ListedMemory'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/PageMeta'
      type: object
      required:
      - data
      - meta
      title: MemoryListResponse
    MemoryResponse:
      properties:
        data:
          $ref: '#/components/schemas/TracedMemory'
      type: object
      required:
      - data
      title: MemoryResponse
    ForgetResponse:
      properties:
        data:
          $ref: '#/components/schemas/ForgottenProfile'
      type: object
      required:
      - data
      title: ForgetResponse
    ForgottenProfile:
      properties:
        profile_id:
          type: string
          title: Profile Id
        memories_deleted:
          type: integer
          title: Memories Deleted
          description: 'Memories the profile held and no longer does, counted before and after. A report rather than an audit: memory moves in the background between the two counts. The status carries the outcome.'
      type: object
      required:
      - profile_id
      - memories_deleted
      title: ForgottenProfile
    TelnyxError:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
        meta:
          type: object
          properties:
            url:
              type: string
    NumberPoolSettings:
      type:
      - object
      - 'null'
      required:
      - toll_free_weight
      - long_code_weight
      - skip_unhealthy
      description: 'Number Pool allows you to send messages from a pool of numbers of different types, assigning

        weights to each type. The pool consists of all the long code and toll free numbers

        assigned to the messaging profile.


        To disable this feature, set the object field to `null`.

        '
      properties:
        toll_free_weight:
          type: number
          example: 10
          description: 'Defines the probability weight for a Toll Free number to be selected when sending a message.

            The higher the weight the higher the probability. The sum of the weights for all number types

            does not necessarily need to add to 100. Weight must be a non-negative number, and when equal

            to zero it will remove the number type from the pool.

            '
        long_code_weight:
          type: number
          example: 1
          description: 'Defines the probability weight for a Long Code number to be selected when sending a message.

            The higher the weight the higher the probability. The sum of the weights for all number types

            does not necessarily need to add to 100.  Weight must be a non-negative number, and when equal

            to zero it will remove the number type from the pool.

            '
        skip_unhealthy:
          type: boolean
          example: true
          description: 'If set to true all unhealthy numbers will be automatically excluded from the pool.

            Health metrics per number are calculated on a regular basis, taking into account the deliverability

            rate and the amount of messages marked as spam by upstream carriers.

            Numbers with a deliverability rate below 25% or spam ratio over 75% will be considered unhealthy.

            '
        sticky_sender:
          type: boolean
          default: false
          description: 'If set to true, Number Pool will try to choose the same sending number for all messages to a particular

            recipient. If the sending number becomes unhealthy and `skip_unhealthy` is set to true, a new

            number will be chosen.

            '
        geomatch:
          type: boolean
          default: false
          description: 'If set to true, Number Pool will try to choose a sending number with the same area code as the destination

            number. If there are no such numbers available, a nunber with a different area code will be chosen. Currently

            only NANP numbers are supported.

            '
      example:
        toll_free_weight: 10
        long_code_weight: 1
        skip_unhealthy: true
        sticky_sender: false
        geomatch: false
