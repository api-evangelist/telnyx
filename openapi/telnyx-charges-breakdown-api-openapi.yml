openapi: 3.2.0
info:
  title: Telnyx Charges Breakdown API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Charges Breakdown across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Charges Breakdown
paths:
  /charges_breakdown:
    get:
      summary: Get monthly charges breakdown
      operationId: GetMonthlyChargesBreakdown
      description: Retrieve a detailed breakdown of monthly charges for phone numbers in a specified date range. The date range cannot exceed 31 days.
      parameters:
      - name: start_date
        in: query
        description: Start date for the charges breakdown in ISO date format (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
          example: '2025-05-01'
      - name: end_date
        in: query
        description: End date for the charges breakdown in ISO date format (YYYY-MM-DD). If not provided, defaults to start_date + 1 month. The date is exclusive, data for the end_date itself is not included in the report. The interval between start_date and end_date cannot exceed 31 days.
        required: false
        schema:
          type: string
          format: date
          example: '2025-06-01'
      - name: format
        in: query
        description: Response format
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
          example: json
      responses:
        '200':
          description: Monthly charges breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyChargesBreakdownResponse'
            text/csv:
              schema:
                type: string
                description: CSV format of the charges breakdown
        '400':
          $ref: '#/components/responses/charges_BadRequestErrorResponse'
        '422':
          $ref: '#/components/responses/charges_UnprocessableEntityErrorResponse'
        default:
          $ref: '#/components/responses/charges_GenericErrorResponse'
      tags:
      - Charges Breakdown
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  responses:
    charges_BadRequestErrorResponse:
      description: Invalid request parameters or date range
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10015'
              title: Bad Request
              detail: The request failed because it was not well-formed.
    charges_UnprocessableEntityErrorResponse:
      description: User account not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10027'
              title: Unprocessable Entity
              detail: The server understood the syntax of the request but was unable to process the instructions.
    charges_GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10007'
              title: Unexpected error
              detail: An unexpected error occured.
    charges_BadRequestErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: Invalid request parameters or date range
    charges_UnprocessableEntityErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: User account not found
    charges_GenericErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: Unexpected error
  schemas:
    ServiceDetail:
      type: object
      properties:
        cost_type:
          type: string
          description: Type of cost (MRC or OTC)
          example: MRC
        name:
          type: string
          description: Service name
          example: Local DIDs
        cost:
          type: string
          description: Cost per unit as decimal string
          example: '1.50'
      required:
      - cost_type
      - name
      - cost
    charges_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/charges_Error'
    NumberBreakdownResult:
      type: object
      properties:
        tn:
          type: string
          description: Phone number
          example: '+15551234567'
        charge_type:
          type: string
          description: Type of charge for the number
          example: local
        service_owner_user_id:
          type: string
          description: User ID of the service owner
          example: 0db0b4aa-a83d-4d4f-ad9b-3ba7c1ac2ce8
        service_owner_email:
          type: string
          format: email
          description: Email address of the service owner
          example: user@example.com
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDetail'
          description: List of services associated with this number
      required:
      - tn
      - charge_type
      - service_owner_user_id
      - service_owner_email
      - services
    charges_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    MonthlyChargesBreakdownResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BreakdownData'
      required:
      - data
    BreakdownData:
      type: object
      properties:
        user_id:
          type: string
          description: User identifier
          example: 0db0b4aa-a83d-4d4f-ad9b-3ba7c1ac2ce8
        start_date:
          type: string
          format: date
          description: Start date of the breakdown period
          example: '2025-05-01'
        end_date:
          type: string
          format: date
          description: End date of the breakdown period
          example: '2025-06-01'
        user_email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        currency:
          type: string
          description: Currency code
          example: USD
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberBreakdownResult'
          description: List of phone number charge breakdowns
      required:
      - user_id
      - start_date
      - end_date
      - user_email
      - currency
      - results
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
