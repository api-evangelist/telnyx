openapi: 3.2.0
info:
  title: Telnyx Messaging API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Messaging across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Messaging
paths:
  /alphanumeric_sender_ids:
    get:
      summary: List alphanumeric sender IDs
      description: List all alphanumeric sender IDs for the authenticated user.
      operationId: ListAlphanumericSenderIds
      tags:
      - Messaging
      parameters:
      - name: filter[messaging_profile_id]
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by messaging profile ID.
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Page size.
      responses:
        '200':
          description: Successful response with a list of alphanumeric sender IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlphanumericSenderId'
                  meta:
                    $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
        '401':
          $ref: '#/components/responses/messaging_UnauthorizedResponse_0b38e7044b'
        '422':
          $ref: '#/components/responses/messaging_UnprocessableEntityResponse_0b38e7044b'
    post:
      summary: Create an alphanumeric sender ID
      description: Create a new alphanumeric sender ID associated with a messaging profile.
      operationId: CreateAlphanumericSenderId
      tags:
      - Messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlphanumericSenderIdRequest'
      responses:
        '201':
          description: Successful response with a single alphanumeric sender ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AlphanumericSenderId'
        '401':
          $ref: '#/components/responses/messaging_UnauthorizedResponse_0b38e7044b'
        '422':
          $ref: '#/components/responses/messaging_UnprocessableEntityResponse_0b38e7044b'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /alphanumeric_sender_ids/{id}:
    delete:
      summary: Delete an alphanumeric sender ID
      description: Delete an alphanumeric sender ID and disassociate it from its messaging profile.
      operationId: DeleteAlphanumericSenderId
      tags:
      - Messaging
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the alphanumeric sender ID.
      responses:
        '200':
          description: Successful response with a single alphanumeric sender ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
