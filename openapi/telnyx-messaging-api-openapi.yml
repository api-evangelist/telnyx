        application/json:
          schema:
            $ref: '#/components/schemas/messaging_Errors'
      description: Unprocessable Entity
    MessagingProfileResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/MessagingProfile_2'
            title: Messaging Profile Response
            type: object
      description: Successful response with details about a messaging profile.
    messaging_BadRequestResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/messaging_Errors'
      description: Bad Request
