        '401':
          $ref: '#/components/responses/messaging_UnauthorizedResponse_0b38e7044b'
        '404':
          $ref: '#/components/responses/messaging_NotFoundResponse_0b38e7044b'
    get:
      summary: Retrieve an alphanumeric sender ID
      description: Retrieve a specific alphanumeric sender ID.
      operationId: GetAlphanumericSenderId
      tags:
      - Messaging
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the alphanumeric sender ID.
      responses:
        '200':
