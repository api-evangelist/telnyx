openapi: 3.2.0
info:
  title: Telnyx Integrations API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Integrations across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Integrations
paths:
  /ai/integrations:
    get:
      tags:
      - Integrations
      summary: List Integrations
      description: Returns the list of third-party integrations available to connect to your AI assistants and workflows.
      operationId: list_integrations_public_integrations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsListResponse'
              example:
                data:
                - id: Id
                  name: Name
                  display_name: Display Name
                  description: Description
                  logo_url: Logo Url
                  status: disconnected
                  available_tools:
                  - string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/integrations/connections:
    get:
      tags:
      - Integrations
      summary: List User Integrations
      description: Returns the list of integration connections you have set up, linking your account to third-party services.
      operationId: list_user_integrations_public_integrations_connections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionsListResponse'
              example:
                data:
                - id: Id
                  integration_id: Integration Id
                  allowed_tools:
                  - string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/integrations/connections/{user_connection_id}:
    delete:
      tags:
      - Integrations
      summary: Delete Integration Connection
      description: Delete a specific integration connection.
      operationId: delete_integration_connection
      parameters:
      - name: user_connection_id
        in: path
        required: true
        schema:
          type: string
        description: The user integration connection identifier
      responses:
        '204':
          description: No Content - Integration connection deleted successfully
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
    get:
      tags:
      - Integrations
      summary: Get User Integration connection By Id
      description: Returns the details of a single integration connection by its ID.
      operationId: GetUserIntegration
      parameters:
      - name: user_connection_id
        in: path
        required: true
        schema:
          type: string
        description: The connection id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionResponse'
              example:
                data:
                  id: Id
                  integration_id: Integration Id
                  allowed_tools:
                  - string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/integrations/{integration_id}:
    get:
      tags:
      - Integrations
      summary: List Integration By Id
      description: Returns the details of a single available integration, including its configuration details.
      operationId: list_integration_by_id_public_integrations__integration_id__get
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
        description: The integration id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
              example:
                id: Id
                name: Name
                display_name: Display Name
                description: Description
                logo_url: Logo Url
                status: disconnected
                available_tools:
                - string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    IntegrationsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Integration'
          title: Data
      required:
      - data
      title: IntegrationsListResponse
    IntegrationConnectionsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationConnection'
          title: Data
      required:
      - data
      title: IntegrationConnectionsListResponse
    Integration:
      type: object
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        description:
          type: string
          title: Description
        logo_url:
          type: string
          title: Logo Url
        status:
          type: string
          enum:
          - disconnected
          - connected
          title: Status
        available_tools:
          type: array
          items:
            type: string
          title: Available Tools
      required:
      - id
      - name
      - display_name
      - description
      - logo_url
      - status
      - available_tools
      title: Integration
    IntegrationConnection:
      type: object
      properties:
        id:
          type: string
          title: Id
        integration_id:
          type: string
          title: Integration Id
        allowed_tools:
          type: array
          items:
            type: string
          title: Allowed Tools
      required:
      - id
      - integration_id
      - allowed_tools
      title: IntegrationConnection
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
      example:
        detail:
        - loc:
          - body
          - name
          msg: Field required
          type: missing
    IntegrationConnectionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/IntegrationConnection'
      required:
      - data
      title: IntegrationConnectionResponse
    HTTPValidationError_2:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
