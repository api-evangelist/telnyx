            schema:
              $ref: '#/components/schemas/InitiateAICallRequest'
        description: Initiate AI Call request object
        required: true
      responses:
        '200':
          $ref: '#/components/responses/InitiateAICallResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '422':
          $ref: '#/components/responses/call-scripting_UnprocessableEntityResponse'
      summary: Initiate an outbound AI call
      tags:
      - TeXML REST Commands
      x-group-parameters: 'true'
      x-latency-category: responsive
    servers:
    - description: Version 2.0.0 of the Telnyx API
      url: https://api.telnyx.com/v2
  /texml/secrets:
    post:
      description: Create a TeXML secret which can be later used as a Dynamic Parameter for TeXML when using Mustache Templates in your TeXML. In your TeXML you will be able to use your secret name, and this name will be replaced by the actual secret value when processing the TeXML on Telnyx side. The secrets are not visible in any logs.
      operationId: CreateTexmlSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeXMLSecretRequest'
        description: Create TeXML secret request object
        required: true
      responses:
        '201':
          $ref: '#/components/responses/CreateTeXMLSecretResponse'
        '422':
          $ref: '#/components/responses/call-scripting_UnprocessableEntityResponse'
      summary: Create a TeXML secret
      tags:
      - TeXML REST Commands
      x-latency-category: responsive
    servers:
    - description: Version 2.0.0 of the Telnyx API
      url: https://api.telnyx.com/v2
  /texml/calls/{connection_id}:
    post:
      summary: Create a connection-scoped TeXML call
      description: Initiate an outbound TeXML call using a TeXML application connection ID, not an account SID. Request parameter names are case-sensitive. From and To are required; Texml supplies inline instructions and Url overrides the application XML request URL. When neither is supplied, the application configuration supplies the instructions. The response is a flat call object without a data wrapper.
      operationId: CreateTexmlCall
      tags:
      - TeXML REST Commands
      parameters:
      - name: connection_id
        in: path
        required: true
        description: The ID of the connection holding the TeXML application to call from.
        schema:
          type: string
        example: '1234567890'
      requestBody:
        required: true
        description: Connection-scoped outbound call parameters.
        content:
          application/json:
            schema:
              type: object
              required:
              - From
              - To
              properties:
                From:
                  type: string
                  description: The E.164-formatted phone number or SIP URI to present as the caller.
                  example: '+13120001234'
                To:
                  type: string
                  description: The E.164-formatted phone number or SIP URI to call.
                  example: '+13121230000'
                Texml:
                  type: string
                  description: Inline TeXML instructions to execute when the call is answered.
                  example: <Response><Say>Hello</Say></Response>
                Url:
                  type: string
                  description: The URL from which to retrieve TeXML instructions. Overrides the TeXML application XML request URL.
                  example: https://example.com/instructions.xml
                Method:
                  type: string
                  enum:
                  - GET
                  - POST
                  description: HTTP method used to retrieve TeXML instructions from Url.
                  example: POST
            example:
              From: '+13120001234'
              To: '+13121230000'
              Texml: <Response><Say>Hello</Say></Response>
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - From
              - To
              properties:
                From:
                  type: string
                  description: The E.164-formatted phone number or SIP URI to present as the caller.
                  example: '+13120001234'
                To:
                  type: string
                  description: The E.164-formatted phone number or SIP URI to call.
                  example: '+13121230000'
                Texml:
                  type: string
                  description: Inline TeXML instructions to execute when the call is answered.
                  example: <Response><Say>Hello</Say></Response>
                Url:
                  type: string
                  description: The URL from which to retrieve TeXML instructions. Overrides the TeXML application XML request URL.
                  example: https://example.com/instructions.xml
                Method:
                  type: string
                  enum:
                  - GET
                  - POST
                  description: HTTP method used to retrieve TeXML instructions from Url.
                  example: POST
            example:
              From: '+13120001234'
              To: '+13121230000'
              Texml: <Response><Say>Hello</Say></Response>
      responses:
        '200':
          description: The outbound call was queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - call_sid
                - from
                - to
                - status
                properties:
                  call_sid:
                    type: string
                    description: The call control ID of the created call.
                    example: v3:call-control-id
                  from:
                    type: string
                    description: The caller address.
                    example: '+13120001234'
                  to:
                    type: string
                    description: The called address.
                    example: '+13121230000'
                  status:
                    type: string
                    description: The initial status of the outbound call.
                    enum:
                    - queued
                    example: queued
              example:
                call_sid: v3:call-control-id
                from: '+13120001234'
                to: '+13121230000'
                status: queued
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse_2'
        '422':
          description: A required call parameter is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/call-scripting_ErrorResponse'
              example:
                errors:
                - code: '10004'
                  detail: 'Can''t be blank: To'
                  source:
                    pointer: /To
                  title: Missing required parameter
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
