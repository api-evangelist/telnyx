      url: https://api.telnyx.com/v2
  /texml/Accounts/{account_sid}/Calls/{call_sid}/Streams.json:
    post:
      description: Starts streaming media from a call to a specific WebSocket address.
      operationId: StartTeXMLCallStreaming
      parameters:
