openapi: 3.2.0
info:
  title: Telnyx Enterprises API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Enterprises across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Enterprises
  description: Manage the legal-entity record that owns your DIRs and phone numbers.
paths:
  /enterprises:
    get:
      summary: List enterprises
      description: Return the enterprises you own, paginated. The default page size is 20; the maximum is 250.
      operationId: listEnterprises
      tags:
      - Enterprises
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/BcPageNumber'
      - name: page[size]
        in: query
        description: Items per page. Default 10. Maximum 250; values above are clamped to 250.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 10
          example: 10
      - name: legal_name
        in: query
        description: Filter by legal name (partial match).
        required: false
        schema:
          type: string
          example: Acme
      - name: filter[legal_name][contains]
        in: query
        required: false
        description: Case-insensitive partial match on legal name.
        schema:
          type: string
          example: Acme
      - name: filter[role_type]
        in: query
        required: false
        description: 'Only return enterprises of this type: `bpo` for call-center (BPO) enterprises, `enterprise` for normal enterprises. Omit to return both.'
        schema:
          type: string
          enum:
          - enterprise
          - bpo
          example: bpo
      responses:
        '200':
          description: Paginated list of enterprises.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseListPublic'
        '401':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    post:
      summary: Create an enterprise
      description: 'Create the legal entity (enterprise) that represents your business on the Telnyx platform.


        The response carries a server-assigned `id` you use for every subsequent call. An enterprise is created once and reused; the API collects all required fields up front.


        Common failure modes:

        - `422` - a required field is missing or malformed (the response `errors[].source.pointer` names the field).

        - `409` - an enterprise with the same identifying details already exists under your account.'
      operationId: createEnterprise
      tags:
      - Enterprises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseCreate'
            example:
              legal_name: Run 065 Debug Co
              organization_type: commercial
              country_code: US
              role_type: enterprise
              website: https://run065.example.com
              fein: 12-3456789
              industry: technology
              number_of_employees: 51-200
              organization_legal_type: llc
              doing_business_as: Run 065 Debug
              jurisdiction_of_incorporation: Delaware
              organization_contact:
                first_name: Sam
                last_name: Org
                email: org@run065.example.com
                job_title: Compliance Lead
                phone_number: '+13125550000'
              billing_contact:
                first_name: Alex
                last_name: Bill
                email: billing@run065.example.com
                phone_number: '+13125550001'
              organization_physical_address:
                country: US
                administrative_area: IL
                city: Chicago
                postal_code: '60601'
                street_address: 100 Main St
              billing_address:
                country: US
                administrative_area: IL
                city: Chicago
                postal_code: '60601'
                street_address: 100 Main St
      responses:
        '201':
          description: Enterprise created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterprisePublicWrapped'
        '400':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '401':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '422':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /enterprises/{enterprise_id}:
    delete:
      summary: Delete an enterprise
      description: 'Soft-delete an enterprise.


        Failure modes:

        - `400` - the enterprise still has dependent resources in a non-deletable state. Remove those first; the response `detail` identifies what is blocking the delete.

        - `409` - the enterprise has a dependent resource with an unresolved claim. Resolve it before deleting.

        - `404` - the enterprise does not exist or does not belong to your account.'
      operationId: deleteEnterprise
      tags:
      - Enterprises
      parameters:
      - $ref: '#/components/parameters/EnterpriseId'
      responses:
        '204':
          description: 204 (no body)
        '400':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '401':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '404':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    get:
      summary: Get an enterprise
      description: Retrieve a single enterprise by id. Returns `404` if the id does not exist or does not belong to your account.
      operationId: getEnterprise
      tags:
      - Enterprises
      parameters:
      - $ref: '#/components/parameters/EnterpriseId'
      responses:
        '200':
          description: Enterprise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterprisePublicWrapped'
        '401':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '404':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    put:
      summary: Replace an enterprise
      description: 'Replace the enterprise''s mutable fields. Only mutable fields may be sent. Server-assigned and immutable fields (`id`, `record_type`, `created_at`, `updated_at`, status fields, `organization_type`, `country_code`, `role_type`) cannot be changed: including any of them in the body is rejected with `400 Bad Request` (`Field ''X'' is not allowed in this request`).


        For an approved BPO enterprise (`role_type` `bpo`), changing any identity field (legal name, DBA, website, FEIN, industry, number of employees, physical address, organization contact, D-U-N-S number, legal type, SIC code, corporate registration number, professional license number, or jurisdiction of incorporation) resets `bpo_verification_status` to `pending` for re-approval and sets every DIR authorization for that BPO to `rejected`. After re-approval, link it again with a newly signed LOA (a new `loa_document_id`); resending the old one keeps the authorization `rejected`. Re-sending an unchanged value does not reset anything.


        If Number Reputation is enabled on the enterprise, `legal_name`, `doing_business_as`, `website`, `fein`, `industry`, `number_of_employees`, `organization_physical_address`, `organization_contact`, and `dun_bradstreet_number` cannot be changed: the request is rejected with `400`.'
      operationId: updateEnterprise
      tags:
      - Enterprises
      parameters:
      - $ref: '#/components/parameters/EnterpriseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpdate'
            example:
              legal_name: Acme Plumbing LLC
              doing_business_as: Acme Plumbing
              organization_legal_type: llc
              industry: business
              number_of_employees: 51-200
              jurisdiction_of_incorporation: Delaware
              website: https://acmeplumbing.example.com
              fein: 12-3456789
              customer_reference: internal-ref-2026Q2
              organization_contact:
                first_name: Sam
                last_name: Owner
                email: sam@acmeplumbing.example.com
                job_title: Compliance Lead
                phone_number: '+13125550000'
              billing_contact:
                first_name: Alex
                last_name: Bill
                email: billing@acmeplumbing.example.com
                phone_number: '+13125550001'
              organization_physical_address:
                country: US
                administrative_area: IL
                city: Chicago
                postal_code: '60601'
                street_address: 100 Main St
              billing_address:
                country: US
                administrative_area: IL
                city: Chicago
                postal_code: '60601'
                street_address: 100 Main St
      responses:
        '200':
          description: Enterprise updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterprisePublicWrapped'
        '400':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '401':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        '404':
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /enterprises/{enterprise_id}/branded_calling:
    post:
      summary: Activate Branded Calling on an enterprise
      description: 'Branded Calling must be activated on each enterprise. Activation is idempotent:

        - First call: marks the enterprise as activated and begins onboarding it with the Branded Calling platform asynchronously. Returns `200` with `branded_calling_enabled: true`.

        - Re-call after success: no-op, returns the same enterprise body.

        - Re-call after a prior failure: re-queues onboarding, returns `200`.


        Prerequisite: the calling user must have agreed to the Branded Calling Terms of Service (`POST /terms_of_service/branded_calling/agree`). Without that, this endpoint returns `403 terms_of_service_not_accepted`.


        Failure modes:

        - `400` - the account has no available credit. Add funds and retry.

        - `400` - the enterprise is not in the United States. Branded Calling is currently available only to US enterprises.

        - `403` - Branded Calling Terms of Service not accepted.

        - `404` - enterprise does not exist or does not belong to your account.


        **Pricing:** Activation itself is free, but the account must have available credit. Branded Calling fees are charged per DIR and per branded call. See https://telnyx.com/pricing/branded-calling for current pricing.'
      operationId: activateBrandedCalling
      tags:
      - Enterprises
      parameters:
      - $ref: '#/components/parameters/EnterpriseId'
      responses:
        '200':
          description: Branded Calling activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterprisePublicWrapped'
        default:
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
        4XX:
          $ref: '#/components/responses/branded-calling_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PhysicalAddress:
      type: object
      required:
      - country
      - administrative_area
      - city
      - postal_code
      - street_address
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 code (currently `US` or `CA`).
          example: US
        administrative_area:
          type: string
          description: State or province code (e.g. `IL`, `ON`).
          example: IL
        city:
          type: string
          maxLength: 100
          description: The city of your registered business address.
          example: Chicago
        postal_code:
          type: string
          maxLength: 20
          description: The postal or ZIP code of your registered business address.
          example: '60601'
        street_address:
          type: string
          maxLength: 255
          description: The street address of your registered business, including the building number and street name.
          example: 100 Main St
        extended_address:
          type: string
          maxLength: 255
          description: An optional second address line, such as a suite, unit, or floor. Leave blank if it does not apply.
          example: Suite 504
          nullable: true
    BillingAddress:
      $ref: '#/components/schemas/PhysicalAddress'
    EnterpriseUpdate:
      type: object
      description: All fields are optional; only the ones supplied are updated. The same field-level rules from `EnterpriseCreateRequest` apply.
      properties:
        legal_name:
          type: string
          description: Your business's full registered legal name, exactly as it appears on your incorporation or tax documents, 3 to 64 characters.
          minLength: 3
          maxLength: 64
        website:
          type: string
          format: uri
          maxLength: 255
          description: Your business's public website address, including https://. Leave blank if your business has no website.
        fein:
          type: string
          description: US Federal Employer Identification Number (`NN-NNNNNNN`) or Canadian equivalent.
        industry:
          type: string
          description: The industry your business operates in. Choose the closest match from the list; if your value is not accepted, pick the nearest category.
          enum:
          - accounting
          - finance
          - billing
          - collections
          - business
          - charity
          - nonprofit
          - communications
          - telecom
          - customer service
          - support
          - delivery
          - shipping
          - logistics
          - education
          - financial
          - banking
          - government
          - public
          - healthcare
          - health
          - pharmacy
          - medical
          - insurance
          - legal
          - law
          - notifications
          - scheduling
          - real estate
          - property
          - retail
          - ecommerce
          - sales
          - marketing
          - software
          - technology
          - tech
          - media
          - surveys
          - market research
          - travel
          - hospitality
          - hotel
        number_of_employees:
          type: string
          description: Approximate headcount range. Used for vetting heuristics; pick the bucket that contains your current employee count.
        organization_legal_type:
          type: string
          description: 'Legal-entity form. Pick the form that matches your incorporation documents:

            - `corporation` - C-corp or S-corp.

            - `llc` - limited liability company.

            - `partnership` - general/limited partnership.

            - `nonprofit` - non-profit corporation, charitable trust, or 501(c)(3)/equivalent.

            - `other` - anything else (sole proprietorships, government bodies, DBAs, etc.). You may be asked for additional documents during vetting.'
        doing_business_as:
          type: string
          maxLength: 255
          description: The trade name your business operates under if it is different from your legal name, also called a Doing Business As (DBA) name. Leave blank if you only use your legal name.
        customer_reference:
          type: string
          maxLength: 255
          description: Your own label for this account. Enter any reference that helps you find it in your records. Telnyx does not use it during vetting.
        primary_business_domain_sic_code:
          type: string
          nullable: true
          description: The 4-digit Standard Industrial Classification code for your main line of business, which tells us what industry you operate in. Look it up in the SIC code directory if you are unsure.
        corporate_registration_number:
          type: string
          nullable: true
          description: The official number your company received when it was legally registered or incorporated (for example from your state or national business registry). It is on your certificate of incorporation.
        professional_license_number:
          type: string
          nullable: true
          description: If your business operates under a professional license (for example legal, medical, or financial services), enter the license number issued by the licensing authority. Leave blank if it does not apply.
        dun_bradstreet_number:
          type: string
          nullable: true
          description: Your optional 9-digit D-U-N-S Number issued by Dun & Bradstreet, a unique identifier for your business. Leave blank if you do not have one.
        organization_contact:
          $ref: '#/components/schemas/OrganizationContact'
        billing_contact:
          $ref: '#/components/schemas/BillingContact'
        organization_physical_address:
          $ref: '#/components/schemas/PhysicalAddress'
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
        jurisdiction_of_incorporation:
          type: string
          maxLength: 255
          description: The state, province, or country where your business was legally incorporated, for example Delaware.
          example: Delaware
    EnterprisePublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4a6192a4-573d-446d-b3ce-aff9117272a6
          readOnly: true
        legal_name:
          type: string
          example: Acme Plumbing LLC
          description: Your business's full registered legal name, exactly as it appears on your incorporation or tax documents, 3 to 64 characters.
        organization_type:
          type: string
          example: commercial
        country_code:
          type: string
          example: US
        role_type:
          type: string
          enum:
          - enterprise
          - bpo
          example: enterprise
        website:
          type: string
          example: https://acmeplumbing.example.com
          description: Your business's public website address, including https://. Leave blank if your business has no website.
        fein:
          type: string
          example: 12-3456789
          description: US Federal Employer Identification Number (`NN-NNNNNNN`) or Canadian equivalent.
        industry:
          type: string
          example: technology
          description: The industry your business operates in. Choose the closest match from the list; if your value is not accepted, pick the nearest category.
        number_of_employees:
          type: string
          example: 51-200
          description: Approximate headcount range. Used for vetting heuristics; pick the bucket that contains your current employee count.
        organization_legal_type:
          type: string
          example: llc
          description: 'Legal-entity form. Pick the form that matches your incorporation documents:

            - `corporation` - C-corp or S-corp.

            - `llc` - limited liability company.

            - `partnership` - general/limited partnership.

            - `nonprofit` - non-profit corporation, charitable trust, or 501(c)(3)/equivalent.

            - `other` - anything else (sole proprietorships, government bodies, DBAs, etc.). You may be asked for additional documents during vetting.'
        doing_business_as:
          type: string
          example: Acme Plumbing
          description: The trade name your business operates under if it is different from your legal name, also called a Doing Business As (DBA) name. Leave blank if you only use your legal name.
        jurisdiction_of_incorporation:
          type: string
          example: Delaware
          description: The state, province, or country where your business was legally incorporated, for example Delaware.
        customer_reference:
          type: string
          description: Your own label for this account. Enter any reference that helps you find it in your records. Telnyx does not use it during vetting.
          example: internal-id-12345
        primary_business_domain_sic_code:
          type: string
          nullable: true
          description: The 4-digit Standard Industrial Classification code for your main line of business, which tells us what industry you operate in. Look it up in the SIC code directory if you are unsure.
          example: null
        corporate_registration_number:
          type: string
          nullable: true
          description: The official number your company received when it was legally registered or incorporated (for example from your state or national business registry). It is on your certificate of incorporation.
          example: null
        professional_license_number:
          type: string
          nullable: true
          description: If your business operates under a professional license (for example legal, medical, or financial services), enter the license number issued by the licensing authority. Leave blank if it does not apply.
          example: null
        dun_bradstreet_number:
          type: string
          nullable: true
          description: Your optional 9-digit D-U-N-S Number issued by Dun & Bradstreet, a unique identifier for your business. Leave blank if you do not have one.
          example: null
        organization_contact:
          $ref: '#/components/schemas/OrganizationContact'
        billing_contact:
          $ref: '#/components/schemas/BillingContact'
        organization_physical_address:
          $ref: '#/components/schemas/PhysicalAddress'
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
        created_at:
          type: string
          format: date-time
          example: '2026-04-26T18:06:51.940749Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2026-04-26T18:09:24.785211Z'
          readOnly: true
        branded_calling_enabled:
          type: boolean
          description: True once Branded Calling has been activated on this enterprise (see `POST /enterprises/{id}/branded_calling`).
        number_reputation_enabled:
          type: boolean
          description: True once Phone Number Reputation has been enabled on this enterprise (see `POST /enterprises/{id}/reputation`).
        bpo_verification_status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          nullable: true
          description: Whether Telnyx has approved this BPO (Business Process Outsourcer) account. Only set for accounts created with `role_type` `bpo`; `null` for normal enterprises. A BPO enterprise must be `approved` before a DIR can be linked to it through `bpo_authorizations`.
          example: approved
        bpo_verification_rejection_reason:
          type: string
          nullable: true
          description: Reason Telnyx rejected the BPO (Business Process Outsourcer) verification, when `bpo_verification_status` is `rejected`; `null` otherwise.
          example: Business registration document could not be verified.
    branded-calling_Error:
      type: object
      required:
      - code
      - title
      - detail
      - meta
      properties:
        code:
          type: string
          example: '10005'
          description: Stable numeric Telnyx error catalog id. See `meta.url` for the full catalog entry.
        title:
          type: string
          example: Invalid parameters
          description: Short human-readable category, e.g. `Bad Request`, `Duplicate resource`, `Not Found`, `Forbidden`. Treat as advisory only - the stable identifier is `code`.
        detail:
          type: string
          example: field required
          description: Context-specific message describing what went wrong on this particular request. May embed offending values; do not rely on it for programmatic matching - branch on `code`.
        meta:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              format: uri
              example: https://developers.telnyx.com/docs/overview/errors/10005
            pending_check_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Set on `422 vetting_checks_incomplete` responses from `/admin/dir/{id}/approve` and `/admin/phone-number-batches/approve`. Lists the still-pending vetting check ids.
            pending_check_codes:
              type: array
              items:
                type: string
              description: Codes of the pending vetting checks (e.g. `loa_signature_valid`).
            pending_check_labels:
              type: array
              items:
                type: string
              description: Human-readable labels of the pending vetting checks.
          description: Carries `url` linking to the Telnyx error catalog entry for this `code`. Useful for forwarding the user to documentation.
        source:
          type: object
          description: Optional pointer at the offending field of the request.
          properties:
            pointer:
              type: string
              example: /body/legal_name
            parameter:
              type: string
              example: page[size]
      description: A single entry in the canonical Telnyx error envelope. `code` is the stable Telnyx error catalog id; the human-readable explanation lives at `meta.url`. `detail` is a context-specific message; `source.pointer` (when present) names the offending field of the request.
    branded-calling_Errors:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/branded-calling_Error'
          description: List of one or more error entries. Order is not significant.
      description: Canonical Telnyx error envelope. Returned on every 4xx and 5xx response from this service. `errors` is non-empty; multiple entries indicate multiple distinct problems with the same request (e.g. one entry per invalid phone number on a bulk operation).
    BillingContact:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone_number
      properties:
        first_name:
          type: string
          maxLength: 255
          description: The first name of the person Telnyx should contact about billing for this account.
          example: Alex
        last_name:
          type: string
          maxLength: 255
          description: The last name of the person Telnyx should contact about billing for this account.
          example: Bill
        email:
          type: string
          format: email
          description: The email address of the person Telnyx should contact about billing for this account.
          example: billing@acmeplumbing.example.com
        phone_number:
          type: string
          description: The phone number of the billing contact, in E.164 format, for example +12125551234.
          example: '+13125550001'
    EnterpriseListPublic:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnterprisePublic'
        meta:
          $ref: '#/components/schemas/branded-calling_PaginationMeta'
    EnterpriseCreate:
      type: object
      required:
      - legal_name
      - organization_type
      - country_code
      - website
      - fein
      - industry
      - number_of_employees
      - organization_legal_type
      - doing_business_as
      - jurisdiction_of_incorporation
      - organization_contact
      - billing_contact
      - organization_physical_address
      - billing_address
      properties:
        legal_name:
          type: string
          example: Acme Plumbing LLC
          description: Your business's full registered legal name, exactly as it appears on your incorporation or tax documents, 3 to 64 characters.
          minLength: 3
          maxLength: 64
        organization_type:
          type: string
          enum:
          - commercial
          - government
          - non_profit
          example: commercial
          description: 'Organization category for vetting purposes:

            - `commercial` - for-profit business entities (LLC, corp, partnership, sole proprietorship). Most callers fall here.

            - `government` - federal/state/local government bodies.

            - `non_profit` - registered 501(c)(3)/equivalent (incl. educational institutions, charities, religious organisations).'
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code. Currently `US` and `CA` are supported.
          example: US
        role_type:
          type: string
          enum:
          - enterprise
          - bpo
          description: '`enterprise` for an organization registering its own DIRs (the default, and the right choice when the calls display your own brand). `bpo` for a Business Process Outsourcer: a call center that places calls on behalf of other enterprises and displays their brand. A `bpo` enterprise describes the call center itself and cannot own a DIR. Each client the call center calls for gets its own `enterprise` in the same account, with the client''s DIR under it; that DIR is then linked to the `bpo` enterprise through `bpo_authorizations`. Fixed at creation.'
          example: enterprise
          default: enterprise
        website:
          type: string
          format: uri
          maxLength: 255
          example: https://acmeplumbing.example.com
