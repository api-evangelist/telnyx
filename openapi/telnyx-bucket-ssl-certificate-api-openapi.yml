openapi: 3.2.0
info:
  title: Telnyx Bucket SSL Certificate API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Bucket SSL Certificate across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Bucket SSL Certificate
  description: SSL certificate operations
paths:
  /storage/buckets/{bucketName}/ssl_certificate:
    delete:
      summary: Remove SSL Certificate
      deprecated: false
      description: Deletes an SSL certificate and its matching secret.
      operationId: RemoveStorageSSLCertificate
      tags:
      - Bucket SSL Certificate
      parameters:
      - name: bucketName
        in: path
        description: Bucket Name
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: SSL Certificate Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SSLCertificate'
          headers: {}
        '401':
          description: Unauthorized
        '404':
          description: Bucket or SSL certificate not found
        '422':
          description: Unprocessable Entity
    get:
      summary: Get Bucket SSL Certificate
      deprecated: false
      description: Returns the stored certificate detail of a bucket, if applicable.
      operationId: GetStorageSSLCertificates
      tags:
      - Bucket SSL Certificate
      parameters:
      - name: bucketName
        in: path
        description: The name of the bucket
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: SSL Certificate Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SSLCertificate'
          headers: {}
        '401':
          description: Unauthorized
        '404':
          description: Bucket or SSL certificate not found
        '422':
          description: Unprocessable Entity
    put:
      summary: Add SSL Certificate
      deprecated: false
      description: Uploads an SSL certificate and its matching secret so that you can use Telnyx's storage as your CDN.
      operationId: AddStorageSSLCertificate
      tags:
      - Bucket SSL Certificate
      parameters:
      - name: bucketName
        in: path
        description: The name of the bucket
        required: true
        example: ''
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                certificate:
                  type: string
                  format: binary
                  description: The SSL certificate file
                  example: ''
                private_key:
                  type: string
                  format: binary
                  description: The private key file
                  example: ''
            example:
              certificate: certificate.pem
              private_key: private_key.pem
      responses:
        '200':
          description: SSL Certificate Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SSLCertificate'
          headers: {}
        '401':
          description: Unauthorized
        '404':
          description: Bucket not found
        '422':
          description: Unprocessable Entity
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    SSLCertificate:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the SSL certificate
        issued_to:
          type: object
          properties:
            common_name:
              type: string
              description: The common name of the entity the certificate was issued to
            organization:
              type: string
              description: The organization the certificate was issued to
            organization_unit:
              type: string
              description: The organizational unit the certificate was issued to
        issued_by:
          type: object
          properties:
            common_name:
              type: string
              description: The common name of the entity the certificate was issued by
            organization:
              type: string
              description: The organization the certificate was issued by
            organization_unit:
              type: string
              description: The organizational unit the certificate was issued by
        valid_from:
          type: string
          format: date-time
          description: The time the certificate is valid from
          example: '2020-01-01T00:00:00Z'
        valid_to:
          type: string
          format: date-time
          description: The time the certificate is valid to
          example: '2020-01-01T00:00:00Z'
        created_at:
          type: string
          format: date-time
          description: Time when SSL certificate was uploaded
          example: '2020-01-01T00:00:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
