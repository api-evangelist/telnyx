openapi: 3.2.0
info:
  title: Telnyx Campaign API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Campaign across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Campaign
  description: Campaign operations
paths:
  /10dlc/campaign:
    get:
      tags:
      - Campaign
      summary: List Campaigns
      operationId: GetCampaigns
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: query
        description: Filter results by brand id.
      - description: The 1-indexed page number to get. The default value is `1`.
        required: false
        schema:
          title: Page
          type: integer
          description: The 1-indexed page number to get. The default value is `1`.
          default: 1
        name: page
        in: query
      - description: The amount of records per page, limited to between 1 and 500 inclusive. The default value is `10`.
        required: false
        schema:
          title: Recordsperpage
          type: integer
          description: The amount of records per page, limited to between 1 and 500 inclusive. The default value is `10`.
          default: 10
        name: recordsPerPage
        in: query
      - name: sort
        required: false
        schema:
          title: Sort
          description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
          type: string
          enum:
          - assignedPhoneNumbersCount
          - -assignedPhoneNumbersCount
          - campaignId
          - -campaignId
          - createdAt
          - -createdAt
          - status
          - -status
          - tcrCampaignId
          - -tcrCampaignId
          default: -createdAt
        in: query
        description: Specifies the sort order for results. If not given, results are sorted by createdAt in descending order.
        example: -assignedPhoneNumbersCount
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignRecordSet_CSP'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Retrieve a list of campaigns associated with a supplied `brandId`.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/acceptSharing/{campaignId}:
    post:
      tags:
      - Campaign
      summary: Accept Shared Campaign
      description: Manually accept a campaign shared with Telnyx
      operationId: AcceptCampaign
      parameters:
      - description: TCR's ID for the campaign to import
        required: true
        schema:
          title: Campaignid
          pattern: ^C[A-Z0-9]{5,8}$
          type: string
          description: TCR's ID for the campaign to import
        name: campaignId
        in: path
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/usecase/cost:
    get:
      tags:
      - Campaign
      summary: Get Campaign Cost
      operationId: GetCampaignCost
      parameters:
      - required: true
        schema:
          title: Usecase
          type: string
        name: usecase
        in: query
        description: Filter results by usecase.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCost'
              example:
                campaignUsecase: Campaignusecase
                monthlyCost: Monthlycost
                upFrontCost: Upfrontcost
                description: Description
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Returns the upfront and monthly cost associated with the selected 10DLC campaign use case.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/usecase_cost:
    get:
      tags:
      - Campaign
      summary: Get Campaign Cost
      operationId: GetCampaignCost_2
      parameters:
      - required: true
        schema:
          title: Usecase
          type: string
        name: usecase
        in: query
        description: Filter results by usecase.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCost'
              example:
                campaignUsecase: Campaignusecase
                monthlyCost: Monthlycost
                upFrontCost: Upfrontcost
                description: Description
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/campaigns_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse'
      x-latency-category: responsive
      description: Retrieve the campaign cost associated with a given 10DLC use case, including any carrier fees.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}:
    delete:
      tags:
      - Campaign
      summary: Deactivate campaign
      description: Terminate a campaign. Note that once deactivated, a campaign cannot be restored.
      operationId: DeactivateCampaign
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDeletionResponse'
              example:
                time: 0
                record_type: Record Type
                message: Message
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    get:
      tags:
      - Campaign
      summary: Get campaign
      operationId: GetCampaign
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxCampaign_CSP'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Retrieve campaign details by `campaignId`.
    put:
      tags:
      - Campaign
      summary: Update campaign
      operationId: UpdateCampaign
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
            example:
              resellerId: RESELLER
              sample1: Sample1
              sample2: Sample2
              sample3: Sample3
              sample4: Sample4
              sample5: Sample5
              messageFlow: Messageflow
              helpMessage: Helpmessage
              autoRenewal: true
              webhookURL: WebhookURL
              webhookFailoverURL: WebhookURL
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxCampaign_CSP'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Update a campaign's properties by `campaignId`. **Please note:** only sample messages are editable.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/appeal:
    post:
      tags:
      - Campaign
      summary: Submit campaign appeal for manual review
      description: 'Submits an appeal for rejected native campaigns in TELNYX_FAILED or MNO_REJECTED status. The appeal is recorded for manual compliance team review and the campaign status is reset to TCR_ACCEPTED. Note: Appeal forwarding is handled manually to allow proper review before incurring upstream charges.'
      operationId: AppealCampaign
      parameters:
      - name: campaignId
        in: path
        description: The Telnyx campaign identifier
        required: true
        schema:
          type: string
          format: uuid
          example: 5eb13888-32b7-4cab-95e6-d834dde21d64
      requestBody:
        description: Appeal request payload
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - appeal_reason
              properties:
                appeal_reason:
                  type: string
                  description: Detailed explanation of why the campaign should be reconsidered and what changes have been made to address the rejection reason.
                  example: The website has been updated to include the required privacy policy and terms of service.
      responses:
        '200':
          description: Appeal recorded successfully. Campaign status updated to TCR_ACCEPTED for manual compliance review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appealed_at:
                    type: string
                    format: date-time
                    description: Timestamp when the appeal was submitted
              example:
                appealed_at: '2025-08-06T15:30:45.123456+00:00'
        '400':
          description: Campaign not in appealable status or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/mnoMetadata:
    get:
      tags:
      - Campaign
      summary: Get Campaign Mno Metadata
      description: Get the campaign metadata for each MNO it was submitted to.
      operationId: GetCampaignMnoMetadata
      parameters:
      - description: ID of the campaign in question
        required: true
        schema:
          title: Campaignid
          type: string
          description: ID of the campaign in question
        name: campaignId
        in: path
      responses:
        '200':
          description: Successful Response. It constains a map of usecase metadata for each MNO. The key is the network ID of the MNO (e.g. 10017), the value is the mno metadata for the usecase. The metadata may also include some MNO specific fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MnoMetadata'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
        5XX:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - code: '10007'
                  title: Unexpected error
                  detail: An unexpected error occured.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/operationStatus:
    get:
      tags:
      - Campaign
      summary: Get campaign operation status
      operationId: GetCampaignOperationStatus
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  '10017': APPROVED
                  '10035': REVIEW
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Retrieve campaign's operation status at MNO level.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/osr/attributes:
    get:
      tags:
      - Campaign
      summary: Get OSR campaign attributes
      operationId: GetCampaignOsrAttributes
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  msg_class: E
                  status: '7'
                  brandId: 00000000-0000-0000-0000-000000000000
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Returns the optional shared-responsibility attributes recorded for the campaign. Use these values to inspect the campaign configuration submitted to the registry.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/osr_attributes:
    get:
      tags:
      - Campaign
      summary: Get OSR campaign attributes
      operationId: GetCampaignOsrAttributes_2
      parameters:
      - required: true
        schema:
          title: Campaignid
          type: string
        name: campaignId
        in: path
        description: Unique identifier of the campaign.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  msg_class: E
                  status: '7'
                  brandId: 00000000-0000-0000-0000-000000000000
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/campaigns_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse'
      x-latency-category: responsive
      description: Retrieve the OSR attributes assigned to a 10DLC campaign.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaign/{campaignId}/sharing:
    get:
      tags:
      - Campaign
      summary: Get Sharing Status
      operationId: GetCampaignSharingStatus
      parameters:
      - description: ID of the campaign in question
        required: true
        schema:
          title: Campaignid
          type: string
          description: ID of the campaign in question
        name: campaignId
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSharingChain'
              example:
                sharedByMe:
                  downstreamCnpId: Downstreamcnpid
                  sharedDate: Shareddate
                  sharingStatus: Sharingstatus
                  statusDate: Statusdate
                  upstreamCnpId: Upstreamcnpid
                sharedWithMe:
                  downstreamCnpId: Downstreamcnpid
                  sharedDate: Shareddate
                  sharingStatus: Sharingstatus
                  statusDate: Statusdate
                  upstreamCnpId: Upstreamcnpid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Returns whether the campaign is configured for partner sharing and the current sharing state.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaignBuilder:
    post:
      tags:
      - Campaign
      summary: Submit Campaign
      operationId: PostCampaign
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxCampaign_CSP'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
        '402':
          description: Insufficient Funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Before creating a campaign, use the Qualify By Usecase endpoint to ensure that the brand you want to assign a new campaign to is qualified for the desired use case of that campaign. **Please note:** After campaign creation, you'll only be able to edit the campaign's sample messages. Creating a campaign will entail an upfront, non-refundable three month's cost that will depend on the campaign's use case (see 10DLC Costs section for details).
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/campaignBuilder/brand/{brandId}/usecase/{usecase}:
    get:
      tags:
      - Campaign
      summary: Qualify By Usecase
      operationId: GetUsecaseQualification
      parameters:
      - required: true
        schema:
          title: Usecase
          type: string
        name: usecase
        in: path
        description: Unique identifier of the usecase.
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsecaseMetadata'
              example:
                annualFee: 0
                maxSubUsecases: 0
                minSubUsecases: 0
                monthlyFee: 0
                quarterlyFee: 0
                usecase: Usecase
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: This endpoint allows you to see whether or not the supplied brand is suitable for your desired campaign use case.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    CampaignDeletionResponse:
      title: CampaignDeletionResponse
      required:
      - time
      type: object
      properties:
        time:
          title: Time
          type: number
        record_type:
          title: Record Type
          type: string
        message:
          title: Message
          type: string
    campaigns_HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    CampaignRecordSet_CSP:
      title: CampaignRecordSet_CSP
      type: object
      properties:
        records:
          title: Records
          type: array
          items:
            $ref: '#/components/schemas/TelnyxCampaignWithAssignedCount_CSP'
        page:
          title: Page
          type: integer
        totalRecords:
          title: Totalrecords
          type: integer
    CampaignCost:
      title: CampaignCost
      required:
      - campaignUsecase
      - monthlyCost
      - upFrontCost
      - description
      type: object
      properties:
        campaignUsecase:
          title: Campaignusecase
          type: string
        monthlyCost:
          title: Monthlycost
          type: string
        upFrontCost:
          title: Upfrontcost
          type: string
        description:
          title: Description
          type: string
    UpdateCampaignRequest:
      title: UpdateCampaignRequest
      type: object
      properties:
        resellerId:
          title: Resellerid
          maxLength: 8
          type: string
          description: Alphanumeric identifier of the reseller that you want to associate with this campaign.
        sample1:
          title: Sample1
          maxLength: 255
          type: string
          description: Message sample. Some campaign tiers require 1 or more message samples.
        sample2:
          title: Sample2
          maxLength: 255
          type: string
          description: Message sample. Some campaign tiers require 2 or more message samples.
        sample3:
          title: Sample3
          maxLength: 255
          type: string
          description: Message sample. Some campaign tiers require 3 or more message samples.
        sample4:
          title: Sample4
          maxLength: 255
          type: string
          description: Message sample. Some campaign tiers require 4 or more message samples.
        sample5:
          title: Sample5
          maxLength: 255
          type: string
          description: Message sample. Some campaign tiers require 5 or more message samples.
        messageFlow:
          title: Messageflow
          maxLength: 2048
          type: string
          description: Message flow description.
        helpMessage:
          title: Helpmessage
          maxLength: 255
          type: string
          description: Help message of the campaign.
        autoRenewal:
          title: Autorenewal
          type: boolean
          description: Help message of the campaign.
          default: true
        webhookURL:
          title: WebhookURL
          type: string
          description: Webhook to which campaign status updates are sent.
        webhookFailoverURL:
          title: WebhookURL
          type: string
          description: Webhook failover to which campaign status updates are sent.
    CampaignSharingChain:
      title: CampaignSharingChain
      type: object
      properties:
        sharedByMe:
          $ref: '#/components/schemas/CampaignSharingStatus'
        sharedWithMe:
          $ref: '#/components/schemas/CampaignSharingStatus'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    MnoMetadata:
      title: MnoMetadata
      type: object
      additionalProperties: true
      properties:
        '10999':
          $ref: '#/components/schemas/MnoMetadataItem'
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    CampaignSharingStatus:
      title: CampaignSharingStatus
      type: object
      properties:
        downstreamCnpId:
          title: Downstreamcnpid
          type: string
        sharedDate:
          title: Shareddate
          type: string
        sharingStatus:
          title: Sharingstatus
          type: string
        statusDate:
          title: Statusdate
          type: string
        upstreamCnpId:
          title: Upstreamcnpid
          type: string
    UsecaseMetadata:
      title: UsecaseMetadata
      type: object
      properties:
        annualFee:
          title: Annualfee
          type: number
          description: Campaign annual subscription fee
        maxSubUsecases:
          title: Maxsubusecases
          type: integer
          description: Maximum number of sub-usecases declaration required.
        minSubUsecases:
          title: Minsubusecases
          type: integer
          description: Minimum number of sub-usecases declaration required.
        mnoMetadata:
          title: Mnometadata
          type: object
          description: Map of usecase metadata for each MNO. Key is the network ID of the MNO (e.g. 10017), Value is the mno metadata for the usecase.
          additionalProperties: true
        monthlyFee:
          title: Monthlyfee
          type: number
          description: Campaign monthly subscription fee
        quarterlyFee:
          title: Quarterlyfee
          type: number
          description: Campaign quarterly subscription fee
        usecase:
          title: Usecase
          type: string
          description: Campaign usecase
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
