                  type: object
                  description: Outbound call quality statistics.
                  properties:
                    packet_count:
                      type: string
                      description: Total number of outbound audio packets.
                      example: '0'
                    skip_packet_count:
                      type: string
                      description: Number of skipped outbound packets (packet loss).
                      example: '0'
