    MessagingInboundMessagePayload:
      properties:
        autoresponse_type:
          type: string
          description: Automatic response type triggered by an inbound opt-in, opt-out, or help keyword. Examples include START, STOP, and HELP.
          example: STOP
        record_type:
          type: string
          example: message
          enum:
          - message
          description: Identifies the type of the resource.
        direction:
          type: string
          example: inbound
          enum:
          - inbound
          description: The direction of the message. Inbound messages are sent to you whereas outbound messages are sent from you.
        id:
          type: string
          format: uuid
          description: Identifies the type of resource.
        type:
          type: string
          enum:
          - SMS
          - MMS
          - WHATSAPP
          - RCS
          description: The messaging channel used for the message.
        messaging_profile_id:
          type: string
          description: Unique identifier for a messaging profile.
        organization_id:
          type: string
          description: Unique identifier for a messaging profile.
        to:
          description: Receiving address. SMS, MMS and RCS webhooks use an array of recipients. RCS recipients are identified by agent_id and agent_name. WhatsApp webhooks use one E.164 phone number.
          oneOf:
          - type: array
            items:
              type: object
              properties:
                phone_number:
                  type: string
                  description: Receiving address (+E.164 formatted phone number or short code).
                  x-format: address
                status:
                  type: string
                  enum:
                  - queued
                  - sending
                  - sent
                  - delivered
                  - sending_failed
                  - delivery_failed
                  - delivery_unconfirmed
                  - webhook_delivered
                carrier:
                  type: string
                  description: The carrier of the receiver.
                line_type:
                  type: string
                  description: The line-type of the receiver.
                  enum:
                  - Wireline
                  - Wireless
                  - VoWiFi
                  - VoIP
                  - Pre-Paid Wireless
                  - ''
                agent_id:
                  type: string
                  description: RCS agent identifier.
                agent_name:
                  type: string
                  description: RCS agent name.
          - type: string
            description: WhatsApp receiving address in E.164 format.
            x-format: address
        cc:
          type: array
          items:
            type: object
            properties:
              phone_number:
                type: string
                description: Receiving address (+E.164 formatted phone number or short code).
                x-format: address
              status:
                type: string
                enum:
                - queued
                - sending
                - sent
                - delivered
                - sending_failed
                - delivery_failed
                - delivery_unconfirmed
              carrier:
                type: string
                description: The carrier of the receiver.
              line_type:
                type: string
                description: The line-type of the receiver.
                enum:
                - Wireline
                - Wireless
                - VoWiFi
                - VoIP
                - Pre-Paid Wireless
                - ''
        from:
          type: object
          properties:
            phone_number:
              type: string
              description: Sending address (+E.164 formatted phone number, alphanumeric sender ID, or short code).
              x-format: address
            status:
              type: string
              enum:
              - received
              - delivered
              - webhook_delivered
            carrier:
              type: string
              description: The carrier of the sender.
            line_type:
              type: string
              description: The line-type of the sender.
              enum:
              - Wireline
              - Wireless
              - VoWiFi
              - VoIP
              - Pre-Paid Wireless
              - ''
              - long_code
        body:
          type: object
          description: Message body for RCS and WhatsApp. RCS messages contain text, user_file, location, or suggestion_response. For WhatsApp edits and revocations, inspect type and the corresponding edit or revoke object.
          properties:
            from:
              type: string
              description: WhatsApp sender in E.164 format.
              x-format: address
            id:
              type: string
              description: Telnyx identifier for this webhook message.
            foreign_id:
              type: string
              description: Meta WhatsApp message identifier for this webhook event.
            timestamp:
              type: string
              description: Unix timestamp supplied by Meta.
            type:
              type: string
              description: WhatsApp message body type. Edit and revoke events use `edit` and `revoke`, respectively.
              examples:
              - edit
              - revoke
            edit:
              type: object
              description: Details for an edited WhatsApp message.
              properties:
                original_message_id:
                  type: string
                  description: Telnyx message ID when a mapping exists, otherwise the original Meta WhatsApp message ID. Treat this value as opaque.
                message:
                  type: object
                  description: Replacement WhatsApp message content. Its shape depends on the message type.
                  additionalProperties: true
              required:
              - original_message_id
              - message
            revoke:
              type: object
              description: Details for a revoked WhatsApp message.
              properties:
                original_message_id:
                  type: string
                  description: Telnyx message ID when a mapping exists, otherwise the original Meta WhatsApp message ID. Treat this value as opaque.
              required:
              - original_message_id
            text:
              description: RCS text string or WhatsApp text object.
              oneOf:
              - type: string
              - type: object
                properties:
                  body:
                    type: string
                additionalProperties: true
            user_file:
              type: object
              description: RCS file attachment and optional thumbnail.
              properties:
                payload:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_size_bytes:
                      type: integer
                    file_uri:
                      type: string
                    mime_type:
                      type: string
                thumbnail:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_size_bytes:
                      type: integer
                    file_uri:
                      type: string
                    mime_type:
                      type: string
            location:
              type: object
              description: Location shared in an RCS message.
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
            suggestion_response:
              type: object
              description: Selected RCS suggestion.
              properties:
                postback_data:
                  type: string
                text:
                  type: string
          additionalProperties: true
        text:
          type: string
          description: 'Message body (i.e., content) as a non-empty string.


            **Required for SMS**'
        num_chars:
          type: integer
          description: The number of characters in the message text
        subject:
          type:
          - string
          - 'null'
          description: Message subject.
        media:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: url
                description: The url of the media requested to be sent.
              content_type:
                type: string
                description: The MIME type of the requested media.
                x-format: mime-type
              size:
                type: integer
                description: The size of the requested media.
              hash_sha256:
                type: string
                minLength: 32
                maxLength: 32
                description: The SHA256 hash of the requested media.
        webhook_url:
          type:
          - string
          - 'null'
          format: url
          description: The URL where webhooks related to this message will be sent.
        webhook_failover_url:
          type:
          - string
          - 'null'
          format: url
          description: The failover URL where webhooks related to this message will be sent if sending to the primary URL fails.
        encoding:
          type: string
          description: Encoding scheme used for the message body.
        parts:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of parts into which the message's body must be split.
        tags:
          type: array
          description: Tags associated with the resource.
          items:
            type: string
        cost:
          type:
          - object
          - 'null'
          properties:
            amount:
              type:
              - string
