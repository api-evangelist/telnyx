              example: normal
              description: Reason the conversation ended.
            conversation_insights:
              type:
              - array
              - 'null'
              description: The conversation's generated insights, when insight generation was enabled for the assistant and has completed. Each entry carries a `status` and the generated `conversation_insights` results. An empty array when the conversation has no generated insights; null when insight data could not be retrieved.
              items:
                type: object
                properties:
                  status:
                    type: string
                    example: completed
                    description: Status of insight generation for this entry.
                  conversation_insights:
                    type:
                    - array
                    - 'null'
                    description: Generated insight results.
                    items:
                      type: object
                      properties:
                        insight_id:
                          type: string
                          example: 6c5018ff-25a2-5364-b6be-f53de3d493c6
                          description: Identifier of the insight template the result was generated from.
                        result:
                          type: string
                          example: The user called the voice assistant to schedule a dental appointment. The assistant confirmed availability for Tuesday at 10:00 AM and transferred the call to the office scheduling line.
                          description: The generated insight result.
            cost:
              description: 'The session''s cost breakdown from Session Analysis, covering every product billed on the call: the AI Voice Assistant engine minutes (`ai-voice-assistant`), LLM inference tokens (`inference`), and call-control, SIP trunking, and recording lines. If cost data could not be retrieved after retries, this field carries the placeholder string `No cost data available.` instead of an object.'
              oneOf:
              - type: object
                title: Call Cost Breakdown
                description: The itemized cost of the call.
                properties:
                  total:
                    type: string
                    example: '0.060300'
                    description: The total cost of the call, summed across every product in the breakdown.
                  currency:
                    type: string
                    example: USD
                    description: The currency of the cost amounts.
                  breakdown:
                    type: array
                    description: Cost lines grouped by product.
                    items:
                      type: object
                      title: Cost Breakdown
                      properties:
                        product:
                          type: string
                          example: ai-voice-assistant
                          description: The Telnyx product the cost line belongs to (for example `ai-voice-assistant`, `inference`, `callcontrol-cdrs`, `siptrunking-cdrs`, `recording-cdrs`).
                        cost:
                          type: string
                          example: '0.050000'
                          description: Total cost for this product across the call, in the currency given by `cost.currency`.
              - type: string
                title: Call Cost Unavailable
                description: The placeholder string `No cost data available.`, returned when cost data could not be retrieved after retries.
            recordings:
              type:
              - array
              - 'null'
              description: Recordings created for the call. An empty array when the call had no recordings; null when recording data could not be retrieved.
              items:
                type: object
                title: Recording
                properties:
                  id:
                    type: string
                    example: 850f003e-1278-5d6b-baf2-918aae3031dc
                    description: Unique identifier of the recording.
                  start_time:
                    type: string
                    format: date-time
                    example: '2026-10-15T20:34:07.955834Z'
                    description: ISO 8601 datetime of when the recording started.
                  end_time:
                    type: string
                    format: date-time
                    example: '2026-10-15T20:34:52.395814Z'
                    description: ISO 8601 datetime of when the recording ended.
                  format:
                    type: string
                    example: mp3
                    description: The recording file format.
                  channels:
                    type: string
                    example: dual
                    description: The recording channel configuration.
                  download_urls:
                    type: object
                    description: Download URL per format. URLs are pre-signed and expire.
                    properties:
                      mp3:
                        type: string
                        description: Pre-signed URL for the mp3 recording file.
                      wav:
                        type: string
                        description: Pre-signed URL for the wav recording file.
