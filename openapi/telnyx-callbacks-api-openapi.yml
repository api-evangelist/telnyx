              $ref: '#/components/schemas/WhatsappWabaAddedEvent'
            example:
              data:
                record_type: event
                id: 5d4f8c1a-6b2e-4f3a-9c7d-2e1b0a9f8e7d
                event_type: whatsapp.waba_added
                occurred_at: '2026-10-01T10:02:11.000Z'
                payload:
                  record_type: waba_account_added
                  waba_id: '123456789012345'
                  phone_numbers:
                  - '+15551234567'
                  status: SUCCESS
                  event_id: 019f4253-e09a-7622-bc6f-625378711d78
      responses:
        '200':
          description: Return an HTTP 200 to acknowledge the webhook.
      parameters:
      - name: telnyx-timestamp
        in: header
        required: true
        description: Unix timestamp (seconds since epoch) of when the webhook was sent - compatible with webhook-timestamp
        schema:
          type: integer
          format: int64
          description: Unix timestamp for replay attack prevention
        x-webhook-equivalent: webhook-timestamp
      - name: telnyx-signature-ed25519
        in: header
        required: true
        description: Base64 encoded Ed25519 signature for webhook verification - compatible with webhook-signature
        schema:
          type: string
          description: Ed25519 signature of timestamp|payload for verification
        x-webhook-equivalent: webhook-signature
      tags:
      - Callbacks
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
