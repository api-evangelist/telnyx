    callConversationEnded_3:
      type: object
      title: Call Conversation Ended
      properties:
        record_type:
          type: string
          example: event
          enum:
          - event
          description: Identifies the type of the resource.
        event_type:
          type: string
          example: call.conversation.ended
          enum:
          - call.conversation.ended
          description: The type of event being delivered.
        id:
          type: string
          format: uuid
          example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
          description: Unique identifier for the event.
        occurred_at:
          type: string
          format: date-time
          example: '2018-02-02T22:25:27.521992Z'
          description: ISO 8601 datetime of when the event occurred.
        created_at:
          type: string
          format: date-time
          example: '2025-05-29T13:35:38.927621Z'
          description: Timestamp when the event was created in the system.
        payload:
          type: object
          properties:
            assistant_id:
              type: string
              example: assistant-d9082b56-ba2d-4ad1-a50c-58661eb1463d
              description: Unique identifier of the assistant involved in the call.
            call_control_id:
              type: string
              example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
              description: Call ID used to issue commands via Call Control API.
            connection_id:
              type: string
              example: 7267xxxxxxxxxxxxxx
              description: Call Control App ID (formerly Telnyx connection ID) used in the call.
            call_leg_id:
              type: string
              example: cc29cce6-3c91-11f0-a8e5-02420aef3d20
              description: ID that is unique to the call leg.
            call_session_id:
              type: string
              example: cc29c8d6-3c91-11f0-aa7c-02420aef3d20
              description: ID that is unique to the call session (group of related call legs).
            client_state:
              type: string
              example: g3QAAAACbQAAAAtkYXRhX2NlbnRlcm0AAAADY2gxbQAAAApkZXBsb3ltZW50bQAAAARiYXNl
              description: Base64-encoded state received from a command.
            calling_party_type:
              type: string
              example: sip
              enum:
              - pstn
              - sip
              description: The type of calling party connection.
            conversation_id:
              type: string
              example: 0424805b-adc1-4ff8-9f95-e1de6883ecbe
              description: ID unique to the conversation or insight group generated for the call.
            duration_sec:
              type: integer
              example: 3
              description: Duration of the conversation in seconds.
            reason:
              type:
              - string
              - 'null'
              example: customer_disconnect
              description: Reason the conversation ended. For Conversation Relay, `customer_disconnect` indicates that the customer WebSocket disconnected.
            messages:
              type: array
              description: The conversation transcript, in order. By default it contains only `user` and `assistant` text turns. When the assistant's `telephony_settings.conversation_ended_full_history` is `true`, it contains the full conversation history, including assistant tool calls, tool results, and `system` and `developer` entries. Redacted when data retention is disabled for the account.
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                    - user
                    - assistant
                    - tool
                    - system
                    - developer
                    example: assistant
                    description: The author of the message. `tool`, `system`, and `developer` only appear when `conversation_ended_full_history` is enabled. `system` and `developer` entries are informational (for example idle check-ins, voicemail prompts, participant-left notices, or messages added through the API); their wording is not a stable contract.
                  content:
                    type: string
                    example: Your balance is $42.10.
                    description: The text of the message. For a tool result, the tool output. May be absent on an assistant message that only contains `tool_calls`.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2025-05-29T13:35:36.123456Z'
                    description: ISO 8601 datetime of when the message was added to the conversation.
                  tool_calls:
                    type: array
                    description: Tools the assistant called in this turn. Only present on `assistant` messages when `conversation_ended_full_history` is enabled.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: call_1
                          description: Identifier of the tool call, referenced by the matching tool result's `tool_call_id`.
                        type:
                          type: string
                          enum:
                          - function
                          example: function
                          description: The type of tool call.
                        function:
                          type: object
                          properties:
                            name:
                              type: string
                              example: get_balance
                              description: The name of the tool that was called.
                            arguments:
                              type: string
                              example: '{"account":"123"}'
                              description: The arguments passed to the tool, as a JSON-encoded string.
                  tool_call_id:
                    type: string
                    example: call_1
                    description: The `id` of the tool call this message answers. Only present on `tool` messages when `conversation_ended_full_history` is enabled.
            from:
              type: string
              example: '+13124287921'
              description: The caller's number or identifier.
            to:
              type: string
              example: jamesw@assistant-d9082b56-ba2d-4ad1-a50c-58661eb1463d.sip.telnyx.com
              description: The callee's number or SIP address.
            llm_model:
              type: string
              example: openai/gpt-4o
              description: The large language model used during the conversation.
            stt_model:
              type: string
              example: distil-whisper/distil-large-v2
              description: The speech-to-text model used in the conversation.
            tts_provider:
              type: string
              example: telnyx
              description: The text-to-speech provider used in the call.
            tts_model_id:
              type: string
              example: Natural
              description: The model ID used for text-to-speech synthesis.
            tts_voice_id:
              type: string
              example: Marissa
              description: Voice ID used for TTS.
      example:
        record_type: event
        event_type: call.conversation.ended
        id: eb8775a6-634f-48b0-b177-d5465a8a8e9f
        occurred_at: '2025-05-29T13:35:38.817785Z'
        created_at: '2025-05-29T13:35:38.927621Z'
        payload:
          assistant_id: assistant-d9082b56-ba2d-4ad1-a50c-58661eb1463d
          call_control_id: v3:HDR1vQHx697hpP9xZ0bhlbUOWPFPDtPcxw-nuSMuC6mGVpb0euoklQ
          call_leg_id: cc29cce6-3c91-11f0-a8e5-02420aef3d20
          call_session_id: cc29c8d6-3c91-11f0-aa7c-02420aef3d20
          calling_party_type: sip
          client_state: g3QAAAACbQAAAAtkYXRhX2NlbnRlcm0AAAADY2gxbQAAAApkZXBsb3ltZW50bQAAAARiYXNl
          connection_id: '2694492062593582591'
          conversation_id: 0424805b-adc1-4ff8-9f95-e1de6883ecbe
          duration_sec: 3
          from: '+13124287921'
          to: jamesw@assistant-d9082b56-ba2d-4ad1-a50c-58661eb1463d.sip.telnyx.com
          llm_model: openai/gpt-4o
          stt_model: distil-whisper/distil-large-v2
          tts_model_id: Natural
          tts_provider: telnyx
          tts_voice_id: Marissa
          reason: customer_disconnect
          messages:
          - role: assistant
            content: Hi, how can I help you today?
            timestamp: '2025-05-29T13:35:35.912345Z'
          - role: user
            content: Goodbye.
            timestamp: '2025-05-29T13:35:37.654321Z'
