    TexmlCallAnsweredWebhookSchema:
      type: object
      title: TeXML Call Answered Webhook
      description: Webhook sent when a TeXML call is answered.
      properties:
        AccountSid:
          type: string
          description: The unique identifier of the account (user_id).
          example: f5586561-8ff0-4291-a51b-c7dfe4139ff9
        CallDuration:
          type: string
          description: The duration of the call in seconds (conditional, only present if start_time and end_time are available).
          example: '15'
        CallInitiatedAt:
          type: string
          format: date-time
          description: The timestamp when the call was initiated.
          example: '2024-01-15T10:30:26.028Z'
        CallSid:
          type: string
          description: The unique identifier of the call (call_control_id).
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallSidLegacy:
          type: string
          description: Legacy call identifier, same as CallSid.
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallStatus:
          type: string
          description: The status of the call.
          enum:
          - in-progress
          example: in-progress
        CallbackSource:
          type: string
          description: The source of the callback.
          enum:
          - call-progress-events
          example: call-progress-events
        CallerId:
          type: string
          description: The display name of the caller.
          example: John Doe
        Codec:
          type: string
          description: The audio codec used for the call (conditional).
          example: PCMU
        ConnectionId:
          type: string
          description: The unique identifier of the connection.
          example: '1234567890'
        ErrorCode:
          type: string
          description: Error code if an error occurred (conditional).
          example: '10001'
        ErrorMessage:
          type: string
          description: Error message if an error occurred (conditional).
          example: Call failed
        From:
          type: string
          description: The phone number or SIP address of the caller.
          example: '+35319605860'
        ParentCallSid:
          type: string
          description: The unique identifier of the parent call (conditional, only present for outbound calls initiated via Dial).
          example: v3:parent-call-id
        ParentCallSidLegacy:
          type: string
          description: Legacy parent call identifier, same as ParentCallSid (conditional, only present for outbound calls initiated via Dial).
          example: v3:parent-call-id
        SamplingRate:
          type: string
          description: The audio sampling rate (conditional).
          example: '8000'
        SequenceNumber:
          type: integer
          description: The sequence number of the event.
          example: '2'
        ShakenStirAttestation:
          type: string
          description: SHAKEN/STIR attestation level (conditional, only present if shaken_stir_data is available).
          example: A
        ShakenStirValidated:
          type: boolean
          description: Whether SHAKEN/STIR validation passed (conditional, only present if shaken_stir_data is available).
          example: 'true'
        Timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when the webhook was generated.
          example: '2024-01-15T10:30:00Z'
        To:
          type: string
          description: The phone number or SIP address that was called.
          example: '+13129457420'
      required:
      - AccountSid
      - CallInitiatedAt
      - CallSid
      - CallSidLegacy
      - CallStatus
      - From
      - To
      - ConnectionId
      - Timestamp
      - CallbackSource
      - SequenceNumber
    ConferenceParticipantPlaybackStartedEvent:
      type: object
      title: Conference Participant Playback Started Event
      properties:
        data:
          $ref: '#/components/schemas/ConferenceParticipantPlaybackStarted'
    TexmlGatherWebhookSchema:
      type: object
      title: TeXML Gather Webhook
      description: Webhook sent when a Gather command completes (sent to the action URL).
      properties:
        AccountSid:
          type: string
          description: The unique identifier of the account (user_id).
          example: cb6cfbbc-eb00-41af-a3f3-0d7b32009e4b
        CallSid:
          type: string
          description: The unique identifier of the call (call_control_id).
          example: v2:DPNqxVjTNtQYaKdcKbU0QgRFrQ3YzuAQrVYC4Ggcuq7zTpDkUB7A4w
        CallSidLegacy:
          type: string
          description: Legacy call identifier, same as CallSid.
          example: v2:DPNqxVjTNtQYaKdcKbU0QgRFrQ3YzuAQrVYC4Ggcuq7zTpDkUB7A4w
        Confidence:
          type: number
          description: The average confidence score of the speech transcription (conditional, only present when input is speech).
          example: '0.95'
        Digits:
          type: string
          description: The DTMF digits collected by the Gather command (conditional, only present when input is dtmf).
          example: '1'
        From:
          type: string
          description: The phone number or SIP address of the caller.
          example: Defaultj35z6@sip.telnyx.com
        SpeechResult:
          type: string
          description: The transcribed text from speech input (conditional, only present when input is speech).
          example: Please connect me to sales
        To:
          type: string
          description: The phone number or SIP address that was called.
          example: '+12132045020'
      required:
      - AccountSid
      - CallSid
      - CallSidLegacy
      - From
      - To
    MessagingInboundMessagePayload:
      properties:
        autoresponse_type:
          type: string
          description: Automatic response type triggered by an inbound opt-in, opt-out, or help keyword. Examples include START, STOP, and HELP.
          example: STOP
        record_type:
          type: string
          example: message
          enum:
          - message
          description: Identifies the type of the resource.
        direction:
          type: string
          example: inbound
          enum:
          - inbound
          description: The direction of the message. Inbound messages are sent to you whereas outbound messages are sent from you.
        id:
          type: string
          format: uuid
          description: Identifies the type of resource.
        type:
          type: string
          enum:
          - SMS
          - MMS
          - WHATSAPP
          - RCS
          description: The messaging channel used for the message.
        messaging_profile_id:
          type: string
          description: Unique identifier for a messaging profile.
        organization_id:
          type: string
          description: Unique identifier for a messaging profile.
        to:
          description: Receiving address. SMS, MMS and RCS webhooks use an array of recipients. RCS recipients are identified by agent_id and agent_name. WhatsApp webhooks use one E.164 phone number.
          oneOf:
          - type: array
            items:
              type: object
              properties:
                phone_number:
                  type: string
                  description: Receiving address (+E.164 formatted phone number or short code).
                  x-format: address
                status:
                  type: string
                  enum:
                  - queued
                  - sending
                  - sent
                  - delivered
                  - sending_failed
                  - delivery_failed
                  - delivery_unconfirmed
                  - webhook_delivered
                carrier:
                  type: string
                  description: The carrier of the receiver.
                line_type:
                  type: string
                  description: The line-type of the receiver.
                  enum:
                  - Wireline
                  - Wireless
                  - VoWiFi
                  - VoIP
                  - Pre-Paid Wireless
                  - ''
                agent_id:
                  type: string
                  description: RCS agent identifier.
                agent_name:
                  type: string
                  description: RCS agent name.
          - type: string
            description: WhatsApp receiving address in E.164 format.
            x-format: address
        cc:
          type: array
          items:
            type: object
            properties:
              phone_number:
                type: string
                description: Receiving address (+E.164 formatted phone number or short code).
                x-format: address
              status:
                type: string
                enum:
                - queued
                - sending
                - sent
                - delivered
                - sending_failed
                - delivery_failed
                - delivery_unconfirmed
              carrier:
                type: string
                description: The carrier of the receiver.
              line_type:
                type: string
                description: The line-type of the receiver.
                enum:
                - Wireline
                - Wireless
                - VoWiFi
                - VoIP
                - Pre-Paid Wireless
                - ''
        from:
          type: object
          properties:
            phone_number:
              type: string
              description: Sending address (+E.164 formatted phone number, alphanumeric sender ID, or short code).
              x-format: address
            status:
              type: string
              enum:
              - received
              - delivered
              - webhook_delivered
            carrier:
              type: string
              description: The carrier of the sender.
            line_type:
              type: string
              description: The line-type of the sender.
              enum:
              - Wireline
              - Wireless
              - VoWiFi
              - VoIP
              - Pre-Paid Wireless
              - ''
              - long_code
        body:
          type: object
          description: Message body for RCS and WhatsApp. RCS messages contain text, user_file, location, or suggestion_response. For WhatsApp edits and revocations, inspect type and the corresponding edit or revoke object.
          properties:
            from:
              type: string
              description: WhatsApp sender in E.164 format.
              x-format: address
            id:
              type: string
              description: Telnyx identifier for this webhook message.
            foreign_id:
              type: string
              description: Meta WhatsApp message identifier for this webhook event.
            timestamp:
              type: string
              description: Unix timestamp supplied by Meta.
            type:
              type: string
              description: WhatsApp message body type. Edit and revoke events use `edit` and `revoke`, respectively.
              examples:
              - edit
              - revoke
            edit:
              type: object
              description: Details for an edited WhatsApp message.
              properties:
                original_message_id:
                  type: string
                  description: Telnyx message ID when a mapping exists, otherwise the original Meta WhatsApp message ID. Treat this value as opaque.
                message:
                  type: object
                  description: Replacement WhatsApp message content. Its shape depends on the message type.
                  additionalProperties: true
              required:
              - original_message_id
              - message
            revoke:
              type: object
              description: Details for a revoked WhatsApp message.
              properties:
                original_message_id:
                  type: string
                  description: Telnyx message ID when a mapping exists, otherwise the original Meta WhatsApp message ID. Treat this value as opaque.
              required:
              - original_message_id
            text:
              description: RCS text string or WhatsApp text object.
              oneOf:
              - type: string
              - type: object
                properties:
                  body:
                    type: string
                additionalProperties: true
            user_file:
              type: object
              description: RCS file attachment and optional thumbnail.
              properties:
                payload:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_size_bytes:
                      type: integer
                    file_uri:
                      type: string
                    mime_type:
                      type: string
                thumbnail:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_size_bytes:
                      type: integer
                    file_uri:
                      type: string
                    mime_type:
                      type: string
            location:
              type: object
              description: Location shared in an RCS message.
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
            suggestion_response:
              type: object
              description: Selected RCS suggestion.
              properties:
                postback_data:
                  type: string
                text:
                  type: string
          additionalProperties: true
        text:
          type: string
          description: 'Message body (i.e., content) as a non-empty string.


            **Required for SMS**'
        num_chars:
          type: integer
          description: The number of characters in the message text
        subject:
          type:
          - string
          - 'null'
          description: Message subject.
        media:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: url
                description: The url of the media requested to be sent.
              content_type:
                type: string
                description: The MIME type of the requested media.
                x-format: mime-type
              size:
                type: integer
                description: The size of the requested media.
              hash_sha256:
                type: string
                minLength: 32
                maxLength: 32
                description: The SHA256 hash of the requested media.
        webhook_url:
          type:
          - string
          - 'null'
          format: url
          description: The URL where webhooks related to this message will be sent.
        webhook_failover_url:
          type:
          - string
          - 'null'
          format: url
          description: The failover URL where webhooks related to this message will be sent if sending to the primary URL fails.
        encoding:
          type: string
          description: Encoding scheme used for the message body.
        parts:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of parts into which the message's body must be split.
        tags:
          type: array
          description: Tags associated with the resource.
          items:
            type: string
        cost:
          type:
          - object
          - 'null'
          properties:
            amount:
              type:
              - string
              - 'null'
              description: The amount deducted from your account.
              x-format: decimal
            currency:
              type:
              - string
              - 'null'
              description: The ISO 4217 currency identifier.
              x-format: iso4217
        cost_breakdown:
          type:
          - object
          - 'null'
          properties:
            carrier_fee:
              type: object
              properties:
                amount:
                  type: string
                  description: The carrier fee amount.
                  x-format: decimal
                currency:
                  type: string
                  description: The ISO 4217 currency identifier.
                  x-format: iso4217
            rate:
              type: object
              properties:
                amount:
                  type: string
                  description: The rate amount applied.
                  x-format: decimal
                currency:
                  type: string
                  description: The ISO 4217 currency identifier.
                  x-format: iso4217
          description: Detailed breakdown of the message cost components.
        tcr_campaign_id:
          type:
          - string
          - 'null'
          description: The Campaign Registry (TCR) campaign ID associated with the message.
        tcr_campaign_billable:
          type: boolean
          description: Indicates whether the TCR campaign is billable.
        tcr_campaign_registered:
          type:
          - string
          - 'null'
          description: The registration status of the TCR campaign.
          example: REGISTERED
        received_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the message request was received.
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Not used for inbound messages.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Not used for inbound messages.
        valid_until:
          type:
          - string
          - 'null'
          description: Not used for inbound messages.
          format: date-time
        errors:
          type: array
          description: These errors may point at addressees when referring to unsuccessful/unconfirmed delivery statuses.
          items:
            $ref: '#/components/schemas/messaging_Error_0b38e7044b'
      example:
        record_type: message
        direction: inbound
        id: 7ee4241c-f127-47e5-9c34-3aac291f8058
        type: SMS
        messaging_profile_id: 0f512bda-ae1e-4597-8e11-e5f5686b97d3
        organization_id: b448f9cc-a842-4784-98e9-03c1a5872950
        from:
          phone_number: '+18665550001'
          status: delivered
          carrier: T-MOBILE USA, INC.
          line_type: Wireless
        to:
        - phone_number: '+18445550001'
          status: delivered
          carrier: TELNYX LLC
          line_type: VoIP
        cc: []
        text: Hello, World!
        num_chars: 13
        subject: From Telnyx!
        media: []
        webhook_url: https://www.example.com/hooks
        webhook_failover_url: https://backup.example.com/hooks
        encoding: GSM-7
        parts: 1
        tags:
        - Greetings
        cost:
          amount: '0.0051'
          currency: USD
        cost_breakdown:
          carrier_fee:
            amount: '0.00305'
            currency: USD
          rate:
            amount: '0.00205'
            currency: USD
        tcr_campaign_id: TCPA3X7
        tcr_campaign_billable: true
        tcr_campaign_registered: REGISTERED
        received_at: '2019-01-23T18:10:02.574Z'
        sent_at: null
        completed_at: null
        valid_until: null
        errors: []
