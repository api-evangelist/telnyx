    TexmlCallDtmfWebhookSchema:
      type: object
      title: TeXML Call DTMF Webhook
      description: Webhook sent when a DTMF digit is received during a TeXML call.
      properties:
        AccountSid:
          type: string
          description: The unique identifier of the account (user_id).
          example: f5586561-8ff0-4291-a51b-c7dfe4139ff9
        CallInitiatedAt:
          type: string
          format: date-time
          description: The timestamp when the call was initiated.
          example: '2024-01-15T10:30:26.028Z'
        CallSid:
          type: string
          description: The unique identifier of the call (call_control_id).
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallSidLegacy:
          type: string
          description: Legacy call identifier, same as CallSid.
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallStatus:
          type: string
          description: The status of the call.
          enum:
          - dtmf
          example: dtmf
        CallbackSource:
          type: string
          description: The source of the callback.
          enum:
          - call-progress-events
          example: call-progress-events
        CallerId:
          type: string
          description: The display name of the caller.
          example: John Doe
        ConnectionId:
          type: string
          description: The unique identifier of the connection.
          example: '1234567890'
        Digit:
          type: string
          description: The DTMF digit that was pressed (0-9, *,
          example: '5'
        ErrorCode:
          type: string
          description: Error code if an error occurred (conditional).
          example: '10001'
        ErrorMessage:
          type: string
          description: Error message if an error occurred (conditional).
          example: Call failed
        From:
          type: string
          description: The phone number or SIP address of the caller.
          example: '+35319605860'
        ParentCallSid:
          type: string
          description: The unique identifier of the parent call (conditional, only present for outbound calls initiated via Dial).
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        ParentCallSidLegacy:
          type: string
          description: Legacy parent call identifier, same as ParentCallSid (conditional, only present for outbound calls initiated via Dial).
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        SequenceNumber:
          type: integer
          description: The sequence number of the event.
          example: '3'
        ShakenStirAttestation:
          type: string
          description: SHAKEN/STIR attestation level (conditional, only present if shaken_stir_data is available).
          example: A
        ShakenStirValidated:
          type: boolean
          description: Whether SHAKEN/STIR validation passed (conditional, only present if shaken_stir_data is available).
          example: 'true'
        Timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when the webhook was generated.
          example: '2024-01-15T10:30:00Z'
        To:
          type: string
          description: The phone number or SIP address that was called.
          example: '+13129457420'
      required:
      - AccountSid
      - CallInitiatedAt
      - CallSid
      - CallSidLegacy
      - CallStatus
      - From
      - To
      - ConnectionId
      - Timestamp
      - CallbackSource
      - SequenceNumber
      - Digit
