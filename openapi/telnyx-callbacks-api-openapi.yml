    CallPaymentProgress:
      type: object
      title: Call Payment Progress
      properties:
        record_type:
          type: string
          enum:
          - event
          example: event
          description: Identifies the type of the resource.
        event_type:
          type: string
          enum:
          - call.payment.progress
          example: call.payment.progress
          description: The type of event being delivered.
        id:
          type: string
          format: uuid
          example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
          description: Unique identifier for the event.
        occurred_at:
          type: string
          format: date-time
          example: '2026-07-27T07:00:00.000000Z'
          description: ISO 8601 datetime when the event occurred.
        payload:
          type: object
          properties:
            call_control_id:
              type: string
              description: Call ID used to issue commands via Call Control API.
              example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
            connection_id:
              type: string
              description: Call Control App ID used in the call.
              example: 7267xxxxxxxxxxxxxx
            call_leg_id:
              type: string
              description: ID unique to the call leg.
              example: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
            call_session_id:
              type: string
              description: ID shared by related call legs in the same call session.
              example: 428c31b6-abf3-3bc1-b7f4-5013ef9657c1
            client_state:
              type: string
              description: Base64-encoded state received from the command.
              example: aGF2ZSBhIG5pY2UgZGF5ID1d
            from:
              type: string
              description: Number or SIP URI placing the call.
              example: +353****5860
            to:
              type: string
              description: Destination number or SIP URI of the call.
              example: +131****7420
            payment_connector:
              type: string
              description: Name of the Pay connector used.
              example: Default
            payment_method:
              type: string
              enum:
              - credit-card
              - ach-debit
              description: Payment method being collected.
              example: credit-card
            payment_card_type:
              type: string
              enum:
              - visa
              - mastercard
              - amex
              - optima
              - discover
              - diners-club
              - jcb
              - maestro
              - enroute
              description: Detected card type. Present only for the recognized card brands listed below.
              example: visa
            payment_card_number:
              type: string
              description: Masked card number with only the last four digits visible.
              example: xxxxxxxxxxxx1111
            expiration_date:
              type: string
              description: Card expiration date in MMYY format.
              example: '1230'
            security_code:
              type: string
              description: Fully masked card security code.
              example: xxx
            payment_card_postal_code:
              type: string
              description: Billing postal code collected from the caller.
              example: '10001'
            bank_account_number:
              type: string
              description: Masked bank account number with only the last two digits visible.
              example: '********34'
            bank_routing_number:
              type: string
              description: Bank routing number collected from the caller.
              example: '110000000'
            bank_account_type:
              type: string
              description: Bank account type, when available.
              example: consumer-checking
            payment_step:
              type: string
              enum:
              - payment-card-number
              - expiration-date
              - postal-code
              - security-code
              - bank-routing-number
              - bank-account-number
              - payment-processing
              description: Current payment collection or processing step.
              example: payment-card-number
            payment_status:
              type: string
              enum:
              - completed
              - failed
              - processing
              description: Status of the current payment step.
              example: completed
            attempt:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
              description: Current 1-based attempt number for the step.
              example: 1
            error_type:
              type: string
              enum:
              - timeout
              - invalid-card-number
              - invalid-card-type
              - invalid-date
              - invalid-security-code
              - invalid-postal-code
              - invalid-bank-routing-number
              - invalid-bank-account-number
              - input-matching-failed
              description: Step-level error when payment collection fails.
              example: invalid-card-number
      example:
        record_type: event
        event_type: call.payment.progress
        id: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
        occurred_at: '2026-07-27T07:00:00.000000Z'
        payload:
          call_control_id: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
          connection_id: 7267xxxxxxxxxxxxxx
          call_leg_id: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
          call_session_id: 428c31b6-abf3-3bc1-b7f4-5013ef9657c1
          from: +353****5860
          to: +131****7420
          payment_connector: Default
          payment_method: credit-card
          payment_step: payment-card-number
          payment_status: completed
          attempt: 1
          payment_card_type: visa
          payment_card_number: xxxxxxxxxxxx1111
