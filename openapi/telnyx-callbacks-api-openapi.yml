    TexmlConferenceSpeakerWebhookSchema:
      type: object
      title: TeXML Conference Speaker Webhook
      description: Webhook sent when a participant starts or stops speaking in a TeXML conference.
      properties:
        AccountSid:
          type: string
          description: The unique identifier of the account (user_id).
          example: f5586561-8ff0-4291-a51b-c7dfe4139ff9
        CallSid:
          type: string
          description: The unique identifier of the call that is speaking.
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallSidLegacy:
          type: string
          description: Legacy call identifier, same as CallSid.
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallingPartyType:
          type: string
          description: The type of calling party (conditional, only present if available in event).
          example: customer
        ConferenceSid:
          type: string
          description: The unique identifier of the conference.
          example: conf_abc123def456
        ConnectionId:
          type: string
          description: The unique identifier of the connection.
          example: '1234567890'
        FriendlyName:
          type: string
          description: The friendly name of the conference.
          example: MyConference
        From:
          type: string
          description: The phone number or SIP address of the caller (conditional, only present if available in event).
          example: '+35319605860'
        FromSipUri:
          type: string
          description: The SIP URI of the caller (conditional, only present if available in event).
          example: sip:user@example.com
        ParticipantLabel:
          type: string
          description: The label of the participant (conditional, only present if available in event).
          example: participant-1
        SequenceNumber:
          type: integer
          description: The sequence number of the event.
          example: '3'
        StatusCallbackEvent:
          type: string
          description: The event that triggered the callback.
          enum:
          - participant-speech-start
          - participant-speech-stop
          example: participant-speech-start
        Timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when the webhook was generated.
          example: '2024-01-15T10:35:00Z'
        To:
          type: string
          description: The phone number or SIP address that was called (conditional, only present if available in event).
          example: '+13129457420'
        ToSipUri:
          type: string
          description: The SIP URI of the callee (conditional, only present if available in event).
          example: sip:conference@example.com
      required:
      - ConferenceSid
      - FriendlyName
      - AccountSid
      - ConnectionId
      - SequenceNumber
      - Timestamp
      - StatusCallbackEvent
      - CallSid
      - CallSidLegacy
