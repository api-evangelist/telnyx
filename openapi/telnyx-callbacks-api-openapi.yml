openapi: 3.2.0
info:
  title: Telnyx Callbacks API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Callbacks across 2 of this provider''s published API definitions: telnyx-openapi.yml, telnyx-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Version 2.0.0 of the Telnyx API
  url: https://api.telnyx.com/v2
security:
- bearerAuth: []
tags:
- description: Callbacks
  name: Callbacks
paths: {}
webhooks:
  CallAIGatherEnded:
    post:
      description: This webhook uses Telnyx headers (telnyx-timestamp, telnyx-signature-ed25519) that are compatible with Standard Webhooks specification for SDK generation. Custom validation logic can map these to standard webhook-timestamp and webhook-signature equivalents. See https://github.com/standard-webhooks/standard-webhooks for details.
      operationId: CallAIGatherEnded
      parameters:
      - description: Unix timestamp (seconds since epoch) of when the webhook was sent - compatible with webhook-timestamp
        in: header
        name: telnyx-timestamp
        required: true
        schema:
          description: Unix timestamp for replay attack prevention
          format: int64
          type: integer
        x-webhook-equivalent: webhook-timestamp
      - description: Base64 encoded Ed25519 signature for webhook verification - compatible with webhook-signature
        in: header
        name: telnyx-signature-ed25519
        required: true
        schema:
          description: Ed25519 signature of timestamp|payload for verification
          type: string
        x-webhook-equivalent: webhook-signature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAIGatherEndedEvent'
        required: true
      responses:
        '200':
          description: The server must return an HTTP 200, otherwise we will reattempt delivery at the failover webhook URL.
      summary: Call AI Gather Ended
      tags:
      - Callbacks
    servers:
    - description: Version 2.0.0 of the Telnyx API
      url: https://api.telnyx.com/v2
