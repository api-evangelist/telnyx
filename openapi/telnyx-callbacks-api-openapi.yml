    TexmlCallRingingWebhookSchema:
      type: object
      title: TeXML Call Ringing Webhook
      description: Webhook sent when a TeXML call is ringing.
      properties:
        AccountSid:
          type: string
          description: The unique identifier of the account (user_id).
          example: f5586561-8ff0-4291-a51b-c7dfe4139ff9
        CallDuration:
          type: string
          description: The duration of the call in seconds (conditional, only present if start_time and end_time are available).
          example: '10'
        CallInitiatedAt:
          type: string
          format: date-time
          description: The timestamp when the call was initiated.
          example: '2024-01-15T10:30:26.028Z'
        CallSid:
          type: string
          description: The unique identifier of the call (call_control_id).
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallSidLegacy:
          type: string
          description: Legacy call identifier, same as CallSid.
          example: v3:9X2vxPDFY2RHSJ1EdMS0RHRksMTg7ldNxdjWbVr9zBjbGjGsSe-aiQ
        CallStatus:
          type: string
          description: The status of the call.
          enum:
          - ringing
          example: ringing
        CallbackSource:
          type: string
          description: The source of the callback.
          enum:
          - call-progress-events
          example: call-progress-events
        CallerId:
          type: string
          description: The display name of the caller.
          example: John Doe
        ConnectionId:
          type: string
          description: The unique identifier of the connection.
          example: '1234567890'
        ErrorCode:
          type: string
          description: Error code if an error occurred (conditional).
          example: '10001'
        ErrorMessage:
          type: string
          description: Error message if an error occurred (conditional).
          example: Call failed
        From:
          type: string
          description: The phone number or SIP address of the caller.
          example: '+35319605860'
        ParentCallSid:
          type: string
          description: The unique identifier of the parent call that initiated this outbound call (conditional, only present for outbound calls initiated via Dial).
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        ParentCallSidLegacy:
          type: string
          description: Legacy parent call identifier, same as ParentCallSid (conditional, only present for outbound calls initiated via Dial).
          example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
        SequenceNumber:
          type: integer
          description: The sequence number of the event.
          example: '1'
        ShakenStirAttestation:
          type: string
          description: SHAKEN/STIR attestation level (conditional, only present if shaken_stir_data is available).
          example: A
        ShakenStirValidated:
          type: boolean
          description: Whether SHAKEN/STIR validation passed (conditional, only present if shaken_stir_data is available).
          example: 'true'
        Timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when the webhook was generated.
          example: '2024-01-15T10:30:00Z'
        To:
          type: string
          description: The phone number or SIP address that was called.
          example: '+13129457420'
      required:
      - AccountSid
      - CallInitiatedAt
      - CallSid
      - CallSidLegacy
      - CallStatus
      - From
      - To
      - ConnectionId
      - Timestamp
      - CallbackSource
      - SequenceNumber
    CallAIGatherEndedEvent:
      type: object
      title: Call AI Gather Ended Event
      properties:
        data:
          $ref: '#/components/schemas/CallAIGatherEnded'
    CallHangup:
      type: object
      title: Call Hangup
      properties:
        record_type:
          type: string
          example: event
          enum:
          - event
          description: Identifies the type of the resource.
        event_type:
          type: string
          example: call.hangup
          enum:
          - call.hangup
          description: The type of event being delivered.
        id:
          type: string
          format: uuid
          example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
          description: Identifies the type of resource.
        occurred_at:
          type: string
          format: date-time
          example: '2018-02-02T22:25:27.521992Z'
          description: ISO 8601 datetime of when the event occurred.
        payload:
          type: object
          properties:
            call_control_id:
              type: string
              example: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
              description: Call ID used to issue commands via Call Control API.
            connection_id:
              type: string
              example: 7267xxxxxxxxxxxxxx
              description: Call Control App ID (formerly Telnyx connection ID) used in the call.
            call_leg_id:
              type: string
              example: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
              description: ID that is unique to the call and can be used to correlate webhook events.
            call_session_id:
              type: string
              example: 428c31b6-abf3-3bc1-b7f4-5013ef9657c1
              description: ID that is unique to the call session and can be used to correlate webhook events. Call session is a group of related call legs that logically belong to the same phone call, e.g. an inbound and outbound leg of a transferred call.
            client_state:
              type: string
              example: aGF2ZSBhIG5pY2UgZGF5ID1d
              description: State received from a command.
            custom_headers:
              description: Custom headers set on answer command
              type: array
              example:
              - name: head_1
                value: val_1
              - name: head_2
                value: val_2
              items:
                $ref: '#/components/schemas/CustomSipHeader'
            sip_headers:
              description: User-to-User and Diversion headers from sip invite.
              type: array
              example:
              - name: User-to-User
                value: '1234'
              - name: Diversion
                value: <sip:111@192.168.1.1>
              items:
                $ref: '#/components/schemas/InboundSipHeader'
            from:
              type: string
              example: '+35319605860'
              description: Number or SIP URI placing the call.
            to:
              type: string
              example: '+13129457420'
              description: Destination number or SIP URI of the call.
            start_time:
              type: string
              format: date-time
              example: '2018-02-02T22:20:27.521992Z'
              description: ISO 8601 datetime of when the call started.
            state:
              type: string
              example: hangup
              enum:
              - hangup
              description: State received from a command.
            tags:
              description: Array of tags associated to number.
              example:
              - tag-01
              - tag-02
              type: array
              items:
                type: string
            hangup_cause:
              type: string
              example: call_rejected
              enum:
              - call_rejected
              - normal_clearing
              - originator_cancel
              - timeout
              - time_limit
              - user_busy
              - not_found
              - no_answer
              - unspecified
              description: The reason the call was ended (`call_rejected`, `normal_clearing`, `originator_cancel`, `timeout`, `time_limit`, `user_busy`, `not_found`, `no_answer` or `unspecified`).
            hangup_source:
              type: string
              example: caller
              enum:
              - caller
              - callee
              - unknown
              description: The party who ended the call (`callee`, `caller`, `unknown`).
            sip_hangup_cause:
              type: string
              example: '603'
              description: The reason the call was ended (SIP response code). If the SIP response is unavailable (in inbound calls for example) this is set to `unspecified`.
            call_quality_stats:
              type:
              - object
              - 'null'
              description: Call quality statistics aggregated from the CHANNEL_HANGUP_COMPLETE event. Only includes metrics that are available (filters out nil values). Returns nil if no metrics are available.
              example:
                inbound:
                  jitter_max_variance: '2.74'
                  jitter_packet_count: '0'
                  mos: '4.50'
                  packet_count: '591'
                  skip_packet_count: '9'
                outbound:
                  packet_count: '0'
                  skip_packet_count: '0'
              properties:
                inbound:
                  type: object
                  description: Inbound call quality statistics.
                  properties:
                    jitter_max_variance:
                      type: string
                      description: Maximum jitter variance for inbound audio.
                      example: '2.74'
                    jitter_packet_count:
                      type: string
                      description: Number of packets used for jitter calculation on inbound audio.
                      example: '0'
                    mos:
                      type: string
                      description: Mean Opinion Score (MOS) for inbound audio quality.
                      example: '4.50'
                    packet_count:
                      type: string
                      description: Total number of inbound audio packets.
                      example: '591'
                    skip_packet_count:
                      type: string
                      description: Number of skipped inbound packets (packet loss).
                      example: '9'
                outbound:
                  type: object
                  description: Outbound call quality statistics.
                  properties:
                    packet_count:
                      type: string
                      description: Total number of outbound audio packets.
                      example: '0'
                    skip_packet_count:
                      type: string
                      description: Number of skipped outbound packets (packet loss).
                      example: '0'
      example:
        record_type: event
        event_type: call.hangup
        id: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
        occurred_at: '2018-02-02T22:25:27.521992Z'
        payload:
          call_control_id: v3:MdI91X4lWFEs7IgbBEOT9M4AigoY08M0WWZFISt1Yw2axZ_IiE4pqg
          connection_id: 7267xxxxxxxxxxxxxx
          call_leg_id: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
          call_session_id: 428c31b6-7af4-4bcb-b7f5-5013ef9657c1
          client_state: aGF2ZSBhIG5pY2UgZGF5ID1d
          from: '+35319605860'
          to: '+35319605860'
          start_time: '2018-02-02T22:20:27.521992Z'
          state: hangup
          hangup_cause: call_rejected
          hangup_source: caller
          sip_hangup_cause: '603'
          call_quality_stats:
            inbound:
              jitter_max_variance: '2.74'
              jitter_packet_count: '0'
              mos: '4.50'
              packet_count: '591'
              skip_packet_count: '9'
            outbound:
              packet_count: '0'
              skip_packet_count: '0'
