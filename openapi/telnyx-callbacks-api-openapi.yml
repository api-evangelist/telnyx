          type: string
          description: The phone number or SIP address of the caller.
          example: '+35319605860'
        RecordingSid:
          type: string
          description: A unique identifier for the recording that was transcribed.
          example: 35094891-3290-4142-b2c2-b2eda57534cf
        RecordingUrl:
          type: string
          description: The URL where the recording can be accessed.
          example: https://api.telnyx.com/v2/recordings/abc123.wav
