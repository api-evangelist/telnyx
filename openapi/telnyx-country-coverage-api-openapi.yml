openapi: 3.2.0
info:
  title: Telnyx Country Coverage API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Country Coverage across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Country Coverage
  description: Country Coverage
paths:
  /country_coverage:
    get:
      summary: Get country coverage
      description: Returns Telnyx service coverage information for every country, including which number types and features are available in each.
      operationId: retreiveCountryCoverage
      tags:
      - Country Coverage
      responses:
        '200':
          description: Response for country coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CountryCoverage'
              examples:
                example-1:
                  value:
                    data:
                      Afghanistan:
                        code: AF
                        numbers: false
                        features: []
                        phone_number_type: []
                        reservable: false
                        quickship: false
                        international_sms: false
                        p2p: false
                        local: {}
                        toll_free: {}
                        mobile: {}
                        national: {}
                        region: null
                        inventory_coverage: false
                      Aland Islands:
                        code: AX
                        numbers: false
                        features: []
                        phone_number_type: []
                        reservable: false
                        quickship: false
                        international_sms: false
                        p2p: false
                        local: {}
                        toll_free: {}
                        mobile: {}
                        national: {}
                        region: null
                        inventory_coverage: false
                      Albania:
                        code: AL
                        numbers: true
                        features:
                        - voice
                        - fax
                        phone_number_type:
                        - local
                        - toll_free
                        reservable: false
                        quickship: false
                        international_sms: false
                        p2p: false
                        local:
                          features:
                          - fax
                          - voice
                          reservable: false
                          full_pstn_replacement: false
                          quickship: false
                          international_sms: false
                          p2p: false
                        toll_free:
                          features:
                          - fax
                          - voice
                          reservable: false
                          full_pstn_replacement: false
                          quickship: false
                          international_sms: false
                          p2p: false
                        mobile: {}
                        national: {}
                        region: EMEA
                        inventory_coverage: false
                        shared_cost: {}
                      Algeria:
                        code: DZ
                        numbers: false
                        features: []
                        phone_number_type: []
                        reservable: false
                        quickship: false
                        international_sms: false
                        p2p: false
                        local: {}
                        toll_free: {}
                        mobile: {}
                        national: {}
                        region: null
                        inventory_coverage: false
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /country_coverage/countries/{country_code}:
    get:
      parameters:
      - name: country_code
        in: path
        description: Country ISO code.
        required: true
        schema:
          type: string
          example: US
      summary: Get coverage for a specific country
      description: Returns Telnyx service coverage information for the specified country, including available number types and features.
      operationId: retreiveSpecificCountryCoverage
      tags:
      - Country Coverage
      responses:
        '200':
          description: Response for specific country coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CountryCoverage'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    CountryCoverage:
      type: object
      properties:
        code:
          type: string
          description: Country ISO code
        numbers:
          type: boolean
        features:
          type: array
          description: Set of features supported
          items:
            type: string
        phone_number_type:
          type: array
          description: Phone number type
          items:
            type: string
        reservable:
          type: boolean
          description: Supports reservable
        quickship:
          type: boolean
          description: Supports quickship
        international_sms:
          type: boolean
        p2p:
          type: boolean
        local:
          type: object
          properties:
            features:
              type: array
              items:
                type: string
            reservable:
              type: boolean
            quickship:
              type: boolean
            international_sms:
              type: boolean
            p2p:
              type: boolean
            full_pstn_replacement:
              type: boolean
        toll_free:
          type: object
          properties:
            features:
              type: array
              items:
                type: string
            reservable:
              type: boolean
            quickship:
              type: boolean
            international_sms:
              type: boolean
            p2p:
              type: boolean
            full_pstn_replacement:
              type: boolean
        mobile:
          type: object
          additionalProperties: true
        national:
          type: object
          additionalProperties: true
        inventory_coverage:
          type: boolean
          description: Indicates whether country can be queried with inventory coverage endpoint
        shared_cost:
          type: object
          additionalProperties: true
        region:
          type:
          - string
          - 'null'
          description: Geographic region (e.g., AMER, EMEA, APAC)
      example:
        code: US
        numbers: true
        features:
        - hd_voice
        - emergency
        - voice
        - mms
        - fax
        - sms
        - international_sms
        phone_number_type:
        - local
        - local
        - local
        - toll_free
        reservable: true
        quickship: true
        international_sms: true
        p2p: true
        local:
          features:
          - hd_voice
          - voice
          - international_sms
          - mms
          - fax
          - sms
          - emergency
          reservable: true
          quickship: false
          international_sms: true
          p2p: true
          full_pstn_replacement: true
        toll_free:
          features:
          - voice
          - mms
          - fax
          - sms
          - emergency
          reservable: true
          quickship: true
          international_sms: false
          p2p: false
          full_pstn_replacement: false
        mobile: {}
        national: {}
        inventory_coverage: true
        shared_cost: {}
        region: AMER
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    numbers_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/numbers_Error'
          type: array
      type: object
    numbers_Error:
      properties:
        code:
          example: '10007'
          type: string
        detail:
          example: An unexpected error occured.
          type: string
        meta:
          properties:
            url:
              description: URL with additional information on the error.
              example: https://developers.telnyx.com/docs/overview/errors/10015
              type: string
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              example: /base
              type: string
          type: object
        title:
          example: Unexpected error
          type: string
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
