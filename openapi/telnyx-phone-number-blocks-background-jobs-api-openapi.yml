openapi: 3.2.0
info:
  title: Telnyx Phone Number Blocks Background Jobs API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Phone Number Blocks Background Jobs across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Phone Number Blocks Background Jobs
  description: Background jobs performed over a phone-numbers block's phone numbers
paths:
  /phone_number_blocks/jobs:
    get:
      summary: Lists the phone number blocks jobs
      operationId: ListPhoneNumberBlocksJobs
      tags:
      - Phone Number Blocks Background Jobs
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: sort
        in: query
        description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
        required: false
        schema:
          type: string
          enum:
          - created_at
          example: created_at
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[type], filter[status]'
        schema:
          type: object
          properties:
            type:
              type: string
              enum:
              - delete_phone_number_block
              example: delete_phone_number_block
              description: Identifies the type of the background job.
            status:
              type: string
              enum:
              - pending
              - in_progress
              - completed
              - failed
              example: in_progress
              description: Identifies the status of the background job.
      responses:
        '200':
          description: Successful response with a list of phone number blocks background jobs.
          content:
            application/json:
              schema:
                type: object
                title: List Phone Number Blocks Background Jobs Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberBlocksJob'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns background jobs that operate on phone-number blocks. Results can be filtered by job type and status, sorted by creation time, and include pagination metadata.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_number_blocks/jobs/delete_phone_number_block:
    post:
      x-latency-category: background
      summary: Deletes all numbers associated with a phone number block
      description: Creates a new background job to delete all the phone numbers associated with the given block. We will only consider the phone number block as deleted after all phone numbers associated with it are removed, so multiple executions of this job may be necessary in case some of the phone numbers present errors during the deletion process.
      operationId: CreatePhoneNumberBlockDeletionJob
      tags:
      - Phone Number Blocks Background Jobs
      x-group-parameters: 'true'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberBlocksJobDeletePhoneNumberBlockRequest'
      responses:
        '202':
          description: Block deletion job accepted. The response contains a background job; poll GET /phone_numbers/jobs/{id} with the job id until it completes.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Blocks Job Delete Phone Number Block
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberBlocksJob'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_number_blocks/jobs/{id}:
    get:
      summary: Retrieves a phone number blocks job
      operationId: GetPhoneNumberBlocksJob
      tags:
      - Phone Number Blocks Background Jobs
      parameters:
      - name: id
        in: path
        description: Identifies the Phone Number Blocks Job.
        required: true
        schema:
          type: string
      x-group-parameters: 'true'
      responses:
        '200':
          description: Phone number blocks job details.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Blocks Job
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberBlocksJob'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the status and details of the phone-number-block background job identified by `id`.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
