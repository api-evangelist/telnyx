openapi: 3.2.0
info:
  title: Telnyx Stored Payment Transactions API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Stored Payment Transactions across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Stored Payment Transactions
  description: Operations for managing stored payment transactions.
paths:
  /v2/payment/stored_payment_transactions:
    post:
      summary: Create a stored payment transaction
      operationId: createStoredPaymentTransaction
      tags:
      - Stored Payment Transactions
      x-endpoint-cost: light
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoredPaymentTransactionRequest'
            example:
              amount: '120.00'
      responses:
        '200':
          description: Stored payment transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredPaymentTransactionResponse'
              example:
                data:
                  id: de06811a-2e43-4561-af5a-7d0a26e20aaa
                  record_type: transaction
                  amount_cents: 12000
                  processor_status: submitted_for_settlement
                  amount_currency: USD
                  created_at: '2026-02-25T10:00:00Z'
                  auto_recharge: false
                  transaction_processing_type: stored_payment
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stored-payment-transactions_ErrorResponse'
              example:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: The required authentication headers were either invalid or not included in the request.
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stored-payment-transactions_ErrorResponse'
              example:
                errors:
                - code: '10010'
                  title: Authorization failed
                  detail: You do not have permission to perform the requested action on the specified resource or resources.
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stored-payment-transactions_ErrorResponse'
              example:
                errors:
                - code: '10027'
                  title: Invalid amount format
                  detail: Amount must include dollars and cents (e.g. "120.00").
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10027
                  source:
                    pointer: /
      x-latency-category: responsive
      description: Create a transaction that charges a stored payment method on the account.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    stored-payment-transactions_ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              detail:
                type: string
              code:
                type: string
              meta:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
              source:
                type: object
                properties:
                  pointer:
                    type: string
    StoredPaymentTransactionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            record_type:
              type: string
              enum:
              - transaction
            amount_cents:
              type: integer
            processor_status:
              type: string
            amount_currency:
              type: string
            created_at:
              type: string
              format: date-time
            auto_recharge:
              type: boolean
            transaction_processing_type:
              type: string
              enum:
              - stored_payment
    StoredPaymentTransactionRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: string
          description: Amount in dollars and cents, e.g. "120.00"
          example: '120.00'
    ErrorResponse:
      properties:
        errors:
          items:
            properties:
              code:
                type: string
              detail:
                type: string
              meta:
                properties:
                  url:
                    format: uri
                    type: string
                type: object
              source:
                properties:
                  pointer:
                    type: string
                type: object
              title:
                type: string
            type: object
          type: array
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
