openapi: 3.2.0
info:
  title: Telnyx Number Settings API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Number Settings across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Number Settings
  description: Configure your phone numbers
paths:
  /messaging_numbers/bulk_updates:
    post:
      summary: Bulk update phone number profiles
      operationId: BulkUpdateMessagingSettingsOnPhoneNumbers
      tags:
      - Number Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbersRequest'
      responses:
        '200':
          description: Successful response with details about messaging bulk update phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve bulk update messaging settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbers'
        4XX:
          $ref: '#/components/responses/phone-numbers_messaging_GenericErrorResponse'
      x-latency-category: responsive
      description: Update the messaging settings of multiple phone numbers in a single request.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_numbers/bulk_updates/{order_id}:
    get:
      summary: Retrieve bulk update status
      operationId: GetBulkUpdateMessagingSettingsOnPhoneNumbersStatus
      tags:
      - Number Settings
      parameters:
      - name: order_id
        description: Order ID to verify bulk update status.
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about messaging bulk update phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve bulk update messaging settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbers'
        4XX:
          $ref: '#/components/responses/phone-numbers_messaging_GenericErrorResponse'
      x-latency-category: responsive
      description: Retrieve the status of a previously submitted bulk update of messaging settings.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_numbers_bulk_updates:
    post:
      summary: Bulk update phone number profiles
      operationId: BulkUpdateMessagingSettingsOnPhoneNumbers_2
      tags:
      - Number Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbersRequest'
      responses:
        '200':
          description: Successful response with details about messaging bulk update phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve bulk update messaging settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbers'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Starts a bulk update of messaging-profile assignments for the supplied phone numbers. The response identifies the order used to monitor processing.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_numbers_bulk_updates/{order_id}:
    get:
      summary: Retrieve bulk update status
      operationId: GetBulkUpdateMessagingSettingsOnPhoneNumbersStatus_2
      tags:
      - Number Settings
      parameters:
      - name: order_id
        description: Order ID to verify bulk update status.
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about messaging bulk update phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve bulk update messaging settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbers'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns processing status and results for a bulk messaging-settings update order.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/messaging:
    get:
      summary: List phone numbers with messaging settings
      operationId: ListPhoneNumbersWithMessagingSettings
      tags:
      - Number Settings
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/PageConsolidated'
      - name: filter[messaging_profile_id]
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by messaging profile ID.
      - name: filter[phone_number]
        in: query
        required: false
        schema:
          type: string
        description: Filter by exact phone number (supports comma-separated list).
      - name: filter[phone_number][contains]
        in: query
        required: false
        schema:
          type: string
        description: Filter by phone number substring.
      - name: filter[type]
        in: query
        required: false
        schema:
          type: string
          enum:
          - tollfree
          - longcode
          - shortcode
        description: Filter by phone number type.
      - name: sort[phone_number]
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort by phone number.
      responses:
        '200':
          description: Successful response with a list of phone numbers with messaging settings.
          content:
            application/json:
              schema:
                type: object
                title: List Messaging Settings Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
                  meta:
                    $ref: '#/components/schemas/messaging_PaginationMeta_0b38e7044b'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns phone numbers with their current messaging product and messaging-profile assignments.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/{id}/messaging:
    get:
      summary: Retrieve a phone number with messaging settings
      operationId: GetPhoneNumberMessagingSettings
      tags:
      - Number Settings
      parameters:
      - name: id
        in: path
        description: Identifies the type of resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a phone number including messaging settings.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve Messaging Settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Returns the messaging product and messaging-profile assignment for the specified phone number.
    patch:
      summary: Update the messaging profile and/or messaging product of a phone number
      operationId: UpdatePhoneNumberMessagingSettings
      tags:
      - Number Settings
      parameters:
      - name: id
        in: path
        description: The phone number to update.
        required: true
        schema:
          type: string
      requestBody:
        description: 'The new configuration to set for this phone number.


          To avoid modifying a value, either omit the field or set its value to `null`.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneNumberMessagingSettingsRequest'
      responses:
        '200':
          description: Successful response with details about a phone number including messaging settings.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve Messaging Settings Response
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
        4XX:
          $ref: '#/components/responses/messaging_GenericErrorResponse_0b38e7044b'
      description: Updates the messaging product, messaging profile, or both for the specified phone number.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    BulkMessagingSettingsUpdatePhoneNumbersRequest:
      type: object
      required:
      - messaging_profile_id
      - numbers
      properties:
        messaging_profile_id:
          type: string
          description: 'Configure the messaging profile these phone numbers are assigned to:


            * Set this field to `""` to unassign each number from their respective messaging profile

            * Set this field to a quoted UUID of a messaging profile to assign these numbers to that messaging profile'
        numbers:
          type: array
          items:
            type: string
            x-format: +E.164
          description: The list of phone numbers to update.
        assign_only:
          type: boolean
          description: If true, only assign numbers to the profile without changing other settings.
          default: false
      example:
        messaging_profile_id: 00000000-0000-0000-0000-000000000000
        numbers:
        - '+18880000000'
        - '+18880000001'
        - '+18880000002'
    messaging_Errors_0b38e7044b:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/messaging_Error_0b38e7044b'
    NumberHealthMetrics:
      type: object
      required:
      - message_count
      - inbound_outbound_ratio
      - success_ratio
      - spam_ratio
      description: 'High level health metrics about the number and it''s messaging sending patterns.

        '
      properties:
        message_count:
          type: integer
          description: The number of messages analyzed for the health metrics.
        inbound_outbound_ratio:
          type: number
          format: float
          description: The ratio of messages received to the number of messages sent.
        success_ratio:
          type: number
          format: float
          description: The ratio of messages sucessfully delivered to the number of messages attempted.
        spam_ratio:
          type: number
          format: float
          description: The ratio of messages blocked for spam to the number of messages attempted.
      example:
        message_count: 10
        inbound_outbound_ratio: 1
        success_ratio: 2
        spam_ratio: 10
    UpdatePhoneNumberMessagingSettingsRequest:
      type: object
      properties:
        messaging_profile_id:
          type: string
          description: 'Configure the messaging profile this phone number is assigned to:


            * Omit this field or set its value to `null` to keep the current value.

            * Set this field to `""` to unassign the number from its messaging profile

            * Set this field to a quoted UUID of a messaging profile to assign this number to that messaging profile'
        messaging_product:
          type: string
          description: 'Configure the messaging product for this number:


            * Omit this field or set its value to `null` to keep the current value.

            * Set this field to a quoted product ID to set this phone number to that product'
          example: P2P
        tags:
          type: array
          items:
            type: string
          description: Tags to set on this phone number.
      example:
        messaging_profile_id: dd50eba1-a0c0-4563-9925-b25e842a7cb6
        messaging_product: P2P
    MessagingFeatureSet:
      type:
      - object
      - 'null'
      required:
      - domestic_two_way
      - international_inbound
      - international_outbound
      description: 'The set of features available for a specific messaging use case (SMS or MMS). Features

        can vary depending on the characteristics the phone number, as well as its current

        product configuration.

        '
      properties:
        domestic_two_way:
          type: boolean
          description: Send messages to and receive messages from numbers in the same country.
        international_inbound:
          type: boolean
          description: Receive messages from numbers in other countries.
        international_outbound:
          type: boolean
          description: Send messages to numbers in other countries.
      example:
        domestic_two_way: true
        international_inbound: false
        international_outbound: true
    BulkMessagingSettingsUpdatePhoneNumbers:
      type: object
      properties:
        record_type:
          type: string
          example: messaging_numbers_bulk_update
          enum:
          - messaging_numbers_bulk_update
          description: Identifies the type of the resource.
          readOnly: true
        order_id:
          type: string
          format: uuid
          description: Order ID to verify bulk update status.
          readOnly: true
        success:
          type: array
          items:
            type: string
            x-format: +E.164
          description: Phoned numbers updated successfully.
        pending:
          type: array
          items:
            type: string
            x-format: +E.164
          description: Phone numbers pending to be updated.
        failed:
          type: array
          items:
            type: string
            x-format: +E.164
          description: Phone numbers that failed to update.
      example:
        record_type: messaging_numbers_bulk_update
        order_id: 00000000-0000-0000-0000-000000000000
        success:
        - '+18880000000'
        - '+18880000001'
        - '+18880000002'
        pending: []
        failed: []
    messaging_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/messaging_Error'
    messaging_Error_0b38e7044b:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    messaging_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    PhoneNumberWithMessagingSettings:
      type: object
      example:
        record_type: messaging_settings
        id: '1293384261075731499'
        phone_number: '+18005550001'
        messaging_profile_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        created_at: '2019-01-23T18:10:02.574Z'
        updated_at: '2019-01-23T18:10:02.574Z'
        country_code: US
        type: tollfree
        health:
          message_count: 122
          inbound_outbound_ratio: 0.43
          success_ratio: 0.94
          spam_ratio: 0.06
        eligible_messaging_products:
        - A2P
        traffic_type: A2P
        messaging_product: A2P
        features:
          sms:
            domestic_two_way: true
            international_inbound: true
            international_outbound: true
          mms: null
      properties:
        record_type:
          type: string
          example: messaging_settings
          enum:
          - messaging_phone_number
          - messaging_settings
          description: Identifies the type of the resource.
          readOnly: true
        id:
          type: string
          description: Identifies the type of resource.
          readOnly: true
        phone_number:
          type: string
          description: +E.164 formatted phone number.
          readOnly: true
          x-format: e164
        messaging_profile_id:
          type:
          - string
          - 'null'
          description: Unique identifier for a messaging profile.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was updated.
          readOnly: true
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: ^[A-Z]{2}$
          example: US
          readOnly: true
        type:
          type: string
          description: The type of the phone number
          enum:
          - long-code
          - toll-free
          - short-code
          - longcode
          - tollfree
          - shortcode
          readOnly: true
        health:
          $ref: '#/components/schemas/NumberHealthMetrics'
        eligible_messaging_products:
          type: array
          description: The messaging products that this number can be registered to use
          readOnly: true
          items:
            type: string
        traffic_type:
          type: string
          description: The messaging traffic or use case for which the number is currently configured.
          example: P2P
          readOnly: true
        messaging_product:
          type: string
          description: The messaging product that the number is registered to use
          example: P2P
        features:
          type: object
          readOnly: true
          properties:
            sms:
              $ref: '#/components/schemas/MessagingFeatureSet'
            mms:
              $ref: '#/components/schemas/MessagingFeatureSet'
        organization_id:
          type: string
          description: The organization that owns this phone number.
        tags:
          type: array
          items:
            type: string
          description: Tags associated with this phone number.
    messaging_PaginationMeta_0b38e7044b:
      type: object
      required:
      - total_pages
      - total_results
      - page_size
      - page_number
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    messaging_PaginationMeta:
      properties:
        page_number:
          example: 2
          type: integer
        page_size:
          example: 25
          type: integer
        total_pages:
          example: 3
          type: integer
        total_results:
          example: 55
          type: integer
      required:
      - total_pages
      - total_results
      - page_size
      - page_number
      type: object
  parameters:
    PageConsolidated:
      name: page
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
      schema:
        type: object
        properties:
          number:
            type: integer
            minimum: 1
            default: 1
            description: The page number to load
          size:
            type: integer
            minimum: 1
            maximum: 250
            default: 20
            description: The size of the page
  responses:
    messaging_GenericErrorResponse_0b38e7044b:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/messaging_Errors_0b38e7044b'
          example:
            errors:
            - code: string
              title: string
              detail: string
              source:
                pointer: /data/attributes/phone_number
                parameter: string
    phone-numbers_messaging_GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/messaging_Errors'
          example:
            errors:
            - code: '10007'
              title: Unexpected error
              detail: An unexpected error occured.
    messaging_GenericErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/messaging_Errors'
      description: Unexpected error
    ListPhoneNumbersWithMessagingSettingsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
                type: array
              meta:
                $ref: '#/components/schemas/messaging_PaginationMeta'
            title: List Messaging Settings Response
            type: object
      description: Successful response with a list of phone numbers with messaging settings.
    PhoneNumberWithMessagingSettingsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/PhoneNumberWithMessagingSettings'
            title: Retrieve Messaging Settings Response
            type: object
      description: Successful response with details about a phone number including messaging settings.
    BulkMessagingSettingsUpdatePhoneNumbersResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/BulkMessagingSettingsUpdatePhoneNumbers'
            title: Retrieve bulk update messaging settings Response
            type: object
      description: Successful response with details about messaging bulk update phone numbers.
