              example: US
            created_at_gt:
              type: string
              format: date-time
              example: '2023-04-05T10:22:08.230549Z'
            created_at_lt:
              type: string
              format: date-time
              example: '2025-06-05T10:22:08.230549Z'
            order_request_id:
              type: string
              format: uuid
              example: 991b8ff5-4daf-4826-9a22-e3991b444a9c
            customer_reference:
              type: string
              example: STRING
        status:
          type: string
          enum:
          - pending
          - success
          - failed
