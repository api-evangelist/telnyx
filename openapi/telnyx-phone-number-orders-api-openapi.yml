openapi: 3.2.0
info:
  title: Telnyx Phone Number Orders API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Phone Number Orders across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Phone Number Orders
  description: Number orders
paths:
  /comments:
    get:
      summary: Retrieve all comments
      operationId: ListComments
      tags:
      - Phone Number Orders
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[comment_record_type], filter[comment_record_id]'
        schema:
          type: object
          properties:
            comment_record_type:
              type: string
              example: sub_number_order
              enum:
              - sub_number_order
              - requirement_group
              description: Record type that the comment relates to
            comment_record_id:
              type: string
              example: 8ffb3622-7c6b-4ccc-b65f-7a3dc0099576
              description: ID of the record the comments relate to
      responses:
        '200':
          description: An array of Comment Responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns comments associated with number-order records. Results can be filtered by record type and record ID and include pagination metadata.
    post:
      summary: Create a comment
      operationId: CreateComment
      tags:
      - Phone Number Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: A Comment Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Comment'
                    - type: object
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Creates a comment associated with a supported number-order record. The response contains the created comment.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /comments/{id}:
    get:
      summary: Retrieve a comment
      operationId: RetrieveComment
      tags:
      - Phone Number Orders
      parameters:
      - name: id
        in: path
        description: The comment ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A Comment Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Comment'
                    - type: object
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the comment identified by `id`, including its associated record and comment metadata.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /comments/{id}/read:
    patch:
      summary: Mark a comment as read
      operationId: MarkCommentRead
      tags:
      - Phone Number Orders
      parameters:
      - name: id
        in: path
        description: The comment ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A Comment Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/ReadComment'
                    - type: object
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Marks the specified comment as read. The response contains the updated read state for the comment.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_order_phone_numbers:
    get:
      summary: Retrieve a list of phone numbers associated to orders
      description: Get a list of phone numbers associated to orders.
      operationId: RetrieveOrderPhoneNumbers
      tags:
      - Phone Number Orders
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[country_code]'
        schema:
          type: object
          properties:
            country_code:
              type: string
              example: US
              description: Country code of the order phone number.
      responses:
        '200':
          description: Successful response with a list of number order phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: List Number Order Phone Numbers Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NumberOrderPhoneNumber'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_order_phone_numbers/{number_order_phone_number_id}:
    get:
      summary: Retrieve a single phone number within a number order
      description: Get an existing phone number in number order.
      operationId: GetNumberOrderPhoneNumber
      tags:
      - Phone Number Orders
      parameters:
      - name: number_order_phone_number_id
        in: path
        description: The number order phone number ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a number order phone number.
          content:
            application/json:
              schema:
                type: object
                title: Number Order Phone Number Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberOrderPhoneNumber'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update requirements for a single phone number within a number order
      description: Updates requirements for a single phone number within a number order.
      operationId: UpdateNumberOrderPhoneNumber
      tags:
      - Phone Number Orders
      parameters:
      - name: number_order_phone_number_id
        in: path
        description: The number order phone number ID.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNumberOrderPhoneNumberRequest'
      responses:
        '200':
          description: Successful response with details about a number order phone number.
          content:
            application/json:
              schema:
                type: object
                title: Number Order Phone Number Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberOrderPhoneNumber'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_orders:
    get:
      summary: List number orders
      description: Returns a paginated list of your phone number orders, with support for filtering.
      operationId: ListNumberOrders
      tags:
      - Phone Number Orders
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[status], filter[created_at], filter[phone_numbers_count], filter[customer_reference], filter[requirements_met]'
        schema:
          type: object
          properties:
            status:
              type: string
              description: Filter number orders by status.
            created_at:
              type: object
              description: Filter number orders by date range.
              properties:
                gt:
                  type: string
                  description: Filter number orders later than this value.
                lt:
                  type: string
                  description: Filter number orders earlier than this value.
              additionalProperties: false
            phone_numbers_count:
              type: string
              description: Filter number order with this amount of numbers
            customer_reference:
              type: string
              description: Filter number orders via the customer reference set.
            requirements_met:
              type: boolean
              description: Filter number orders by requirements met.
      responses:
        '200':
          description: Successful response with a list of number orders.
          content:
            application/json:
              schema:
                type: object
                title: List Number Orders Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NumberOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a number order
      description: Creates an order to purchase the specified phone numbers and returns the created order. Track fulfillment through the order's status.
      operationId: CreateNumberOrder
      tags:
      - Phone Number Orders
      x-endpoint-cost: heavy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNumberOrderRequest'
      responses:
        '200':
          description: Successful response with details about a number order.
          content:
            application/json:
              schema:
                type: object
                title: Number Order Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberOrderWithPhoneNumbers'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_orders/{number_order_id}:
    get:
      summary: Retrieve a number order
      description: Returns the details of an existing phone number order, including its status and the numbers included.
      operationId: RetrieveNumberOrder
      tags:
      - Phone Number Orders
      parameters:
      - name: number_order_id
        in: path
        description: The number order ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a number order.
          content:
            application/json:
              schema:
                type: object
                title: Number Order Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberOrderWithPhoneNumbers'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update a number order
      description: Updates an existing phone number order, for example to satisfy regulatory requirements attached to the order, and returns the updated order.
      operationId: UpdateNumberOrder
      tags:
      - Phone Number Orders
      parameters:
      - name: number_order_id
        in: path
        description: The number order ID.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNumberOrderRequest'
      responses:
        '200':
          description: Successful response with details about a number order.
          content:
            application/json:
              schema:
                type: object
                title: Number Order Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberOrderWithPhoneNumbers'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders:
    get:
      summary: List sub number orders
      description: Get a paginated list of sub number orders.
      operationId: ListSubNumberOrders
      tags:
      - Phone Number Orders
      x-group-parameters: 'true'
      parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[status], filter[order_request_id], filter[country_code], filter[phone_number_type], filter[phone_numbers_count], filter[include_phone_numbers]'
        schema:
          type: object
          properties:
            status:
              type: string
              description: Filter sub number orders by status.
            order_request_id:
              type: string
              format: uuid
              example: 12ade33a-21c0-473b-b055-b3c836e1c293
              description: ID of the number order the sub number order belongs to
            country_code:
              type: string
              example: US
              description: ISO alpha-2 country code.
            phone_number_type:
              type: string
              example: local
              description: Phone Number Type
            phone_numbers_count:
              type: integer
              example: 1
              description: Amount of numbers in the sub number order
            include_phone_numbers:
              type: boolean
              default: false
              description: Include the first 50 phone number objects in the results, including their per-number regulatory requirement statuses
      responses:
        '200':
          description: Successful response with a list of sub number orders.
          content:
            application/json:
              schema:
                type: object
                title: List Sub Number Orders Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/numbers_SubNumberOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders/report:
    post:
      summary: Create a sub number orders report
      description: Create a CSV report for sub number orders. The report will be generated asynchronously and can be downloaded once complete.
      operationId: CreateSubNumberOrdersReport
      tags:
      - Phone Number Orders
      x-endpoint-cost: medium
      x-latency-category: background
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubNumberOrdersReportRequest'
      responses:
        '202':
          description: Report generation accepted. Poll GET /sub_number_orders/report/{report_id} with the returned report id until the report is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubNumberOrdersReport'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/numbers_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders/report/{report_id}:
    get:
      summary: Retrieve a sub number orders report
      description: Get the status and details of a sub number orders report.
      operationId: GetSubNumberOrdersReport
      tags:
      - Phone Number Orders
      x-endpoint-cost: light
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
        description: The unique identifier of the sub number orders report
        example: 12ade33a-21c0-473b-b055-b3c836e1c293
      responses:
        '200':
          description: Sub number orders report response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubNumberOrdersReport'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/numbers_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders/report/{report_id}/download:
    get:
      summary: Download a sub number orders report
      description: Download the CSV file for a completed sub number orders report. The report status must be 'success' before the file can be downloaded.
      operationId: DownloadSubNumberOrdersReport
      tags:
      - Phone Number Orders
      x-endpoint-cost: light
      x-latency-category: background
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
        description: The unique identifier of the sub number orders report
        example: 12ade33a-21c0-473b-b055-b3c836e1c293
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: 'id,order_request_id,is_block_sub_number_order,status,phone_number_type,requirements_met,phone_numbers_count,country_code,user_id,customer_reference,created_at,updated_at

                1758d6ed-61a0-4d7a-bf57-b5dced413d33,f486fc2c-4fdf-4849-930d-b3045373e839,False,success,local,True,1,US,0d7ef697-df19-413a-b724-56b0539f5397,STRING,2025-05-23 14:33:12.376686,2025-05-23 14:33:15.624916'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/numbers_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders/{sub_number_order_id}:
    get:
      summary: Retrieve a sub number order
      description: Returns the details of an existing sub number order, with support for filtering.
      operationId: GetSubNumberOrder
      tags:
      - Phone Number Orders
      parameters:
      - name: sub_number_order_id
        in: path
        description: The sub number order ID.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[include_phone_numbers]'
        schema:
          type: object
          properties:
            include_phone_numbers:
              type: boolean
              default: false
              description: Include the first 50 phone number objects in the results
      responses:
        '200':
          description: Successful response with details about a sub number order.
          content:
            application/json:
              schema:
                type: object
                title: Sub Number Order Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_SubNumberOrder'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update a sub number order's requirements
      description: Updates the requirements of an existing sub number order and returns the updated order.
      operationId: UpdateSubNumberOrder
      tags:
      - Phone Number Orders
      parameters:
      - name: sub_number_order_id
        in: path
        description: The sub number order ID.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubNumberOrderRequest'
      responses:
        '200':
          description: Successful response with details about a sub number order.
          content:
            application/json:
              schema:
                type: object
                title: Sub Number Order Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_SubNumberOrder'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sub_number_orders/{sub_number_order_id}/cancel:
    patch:
      summary: Cancel a sub number order
      description: Allows you to cancel a sub number order in 'pending' status.
      operationId: CancelSubNumberOrder
      tags:
      - Phone Number Orders
      parameters:
