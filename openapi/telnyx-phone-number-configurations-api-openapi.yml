openapi: 3.2.0
info:
  title: Telnyx Phone Number Configurations API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Phone Number Configurations across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Phone Number Configurations
  description: Configure your phone numbers
paths:
  /phone_numbers:
    get:
      summary: List phone numbers
      operationId: ListPhoneNumbers
      tags:
      - Phone Number Configurations
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: sort
        in: query
        description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
        required: false
        schema:
          type: string
          enum:
          - purchased_at
          - phone_number
          - connection_name
          - usage_payment_method
          example: connection_name
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[tag], filter[phone_number], filter[status], filter[country_iso_alpha2], filter[connection_id], filter[voice.connection_name], filter[voice.usage_payment_method], filter[billing_group_id], filter[emergency_address_id], filter[customer_reference], filter[number_type], filter[source]'
        schema:
          type: object
          properties:
            tag:
              type: string
              description: Filter by phone number tags.
            without_tags:
              type: string
              description: When set to 'true', filters for phone numbers that do not have any tags applied. All other values are ignored.
              enum:
              - 'true'
              - 'false'
            phone_number:
              type: string
              description: "Filter by phone number. Requires at least three digits.\n             Non-numerical characters will result in no values being returned."
            status:
              type: string
              enum:
              - purchase-pending
              - purchase-failed
              - port-pending
              - active
              - deleted
              - port-failed
              - emergency-only
              - ported-out
              - port-out-pending
              example: active
              description: Filter by phone number status.
            country_iso_alpha2:
              oneOf:
              - type: string
                example: US
              - type: array
                items:
                  type: string
                example:
                - US
                - CA
              description: Filter by phone number country ISO alpha-2 code. Can be a single value or an array of values.
            connection_id:
              type: string
              example: '1521916448077776306'
              description: Filter by connection_id.
            voice.connection_name:
              type: object
              description: Filter by voice connection name pattern matching.
              properties:
                contains:
                  type: string
                  example: test
                  description: Filter contains connection name. Requires at least three characters.
                starts_with:
                  type: string
                  example: test
                  description: Filter starts with connection name. Requires at least three characters.
                ends_with:
                  type: string
                  example: test
                  description: Filter ends with connection name. Requires at least three characters.
                eq:
                  type: string
                  example: test
                  description: Filter by connection name.
              additionalProperties: false
            voice.usage_payment_method:
              type: string
              enum:
              - pay-per-minute
              - channel
              example: channel
              description: Filter by usage_payment_method.
            billing_group_id:
              type: string
              example: 62e4bf2e-c278-4282-b524-488d9c9c43b2
              description: Filter by the billing_group_id associated with phone numbers. To filter to only phone numbers that have no billing group associated them, set the value of this filter to the string 'null'.
            emergency_address_id:
              type: string
              example: '9102160989215728032'
              description: Filter by the emergency_address_id associated with phone numbers. To filter only phone numbers that have no emergency address associated with them, set the value of this filter to the string 'null'.
            customer_reference:
              type: string
              description: Filter numbers via the customer_reference set.
            number_type:
              type: object
              description: Filter phone numbers by phone number type.
              properties:
                eq:
                  type: string
                  enum:
                  - local
                  - national
                  - toll_free
                  - mobile
                  - shared_cost
                  description: Filter phone numbers by phone number type.
              additionalProperties: false
            source:
              type: string
              enum:
              - ported
              - purchased
              description: Filter phone numbers by their source. Use 'ported' for numbers ported from other carriers, or 'purchased' for numbers bought directly from Telnyx.
      - name: handle_messaging_profile_error
        in: query
        description: Although it is an infrequent occurrence, due to the highly distributed nature of the Telnyx platform, it is possible that there will be an issue when loading in Messaging Profile information. As such, when this parameter is set to `true` and an error in fetching this information occurs, messaging profile related fields will be omitted in the response and an error message will be included instead of returning a 503 error.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'false'
          default: 'false'
      responses:
        '200':
          description: Successful response with a list of phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: List Phone Numbers Response
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/numbers_PhoneNumberDetailed'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/numbers_Error_73c9788e53'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns phone numbers associated with the account. Results support pagination, sorting, and filters for number attributes, status, source, connections, billing groups, emergency addresses, tags, and customer references.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/actions/verify_ownership:
    post:
      summary: Verify ownership of phone numbers
      description: Verifies ownership of the provided phone numbers and returns a mapping of numbers to their IDs, plus a list of numbers not found in the account.
      operationId: VerifyPhoneNumberOwnership
      tags:
      - Phone Number Configurations
      x-endpoint-cost: light
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberVerifyOwnershipRequest'
      responses:
        '200':
          description: Phone number ownership verification completed.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Verify Ownership Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_PhoneNumberVerifyOwnershipResponse'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/slim:
    get:
      summary: Slim List phone numbers
      description: List phone numbers, This endpoint is a lighter version of the /phone_numbers endpoint having higher performance and rate limit.
      operationId: SlimListPhoneNumbers
      tags:
      - Phone Number Configurations
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: include_connection
        in: query
        description: Include the connection associated with the phone number.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_tags
        in: query
        description: Include the tags associated with the phone number.
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
        required: false
        schema:
          type: string
          enum:
          - purchased_at
          - phone_number
          - connection_name
          - usage_payment_method
          example: connection_name
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[tag], filter[phone_number], filter[status], filter[country_iso_alpha2], filter[connection_id], filter[voice.connection_name], filter[voice.usage_payment_method], filter[billing_group_id], filter[emergency_address_id], filter[customer_reference], filter[number_type], filter[source]'
        schema:
          type: object
          properties:
            tag:
              type: string
              description: Filter by phone number tags. (This requires the include_tags param)
            phone_number:
              type: string
              description: "Filter by phone number. Requires at least three digits.\n             Non-numerical characters will result in no values being returned."
            status:
              type: string
              enum:
              - purchase-pending
              - purchase-failed
              - port_pending
              - active
              - deleted
              - port-failed
              - emergency-only
              - ported-out
              - port-out-pending
              example: active
              description: Filter by phone number status.
            country_iso_alpha2:
              oneOf:
              - type: string
                example: US
              - type: array
                items:
                  type: string
                example:
                - US
                - CA
              description: Filter by phone number country ISO alpha-2 code. Can be a single value or an array of values.
            connection_id:
              type: string
              example: '1521916448077776306'
              description: Filter by connection_id.
            voice.connection_name:
              type: object
              description: Filter by voice connection name pattern matching (requires include_connection param).
              properties:
                contains:
                  type: string
                  example: test
                  description: Filter contains connection name. Requires at least three characters and the include_connection param.
                starts_with:
                  type: string
                  example: test
                  description: Filter starts with connection name. Requires at least three characters and the include_connection param.
                ends_with:
                  type: string
                  example: test
                  description: Filter ends with connection name. Requires at least three characters and the include_connection param.
                eq:
                  type: string
                  example: test
                  description: Filter by connection name.
              additionalProperties: false
            voice.usage_payment_method:
              type: string
              enum:
              - pay-per-minute
              - channel
              example: channel
              description: Filter by usage_payment_method.
            billing_group_id:
              type: string
              example: 62e4bf2e-c278-4282-b524-488d9c9c43b2
              description: Filter by the billing_group_id associated with phone numbers. To filter to only phone numbers that have no billing group associated them, set the value of this filter to the string 'null'.
            emergency_address_id:
              type: string
              example: '9102160989215728032'
              description: Filter by the emergency_address_id associated with phone numbers. To filter only phone numbers that have no emergency address associated with them, set the value of this filter to the string 'null'.
            customer_reference:
              type: string
              description: Filter numbers via the customer_reference set.
            number_type:
              type: object
              description: Filter phone numbers by phone number type.
              properties:
                eq:
                  type: string
                  enum:
                  - local
                  - national
                  - toll_free
                  - mobile
                  - shared_cost
                  description: Filter phone numbers by phone number type.
              additionalProperties: false
            source:
              type: string
              enum:
              - ported
              - purchased
              description: Filter phone numbers by their source. Use 'ported' for numbers ported from other carriers, or 'purchased' for numbers bought directly from Telnyx.
      responses:
        '200':
          description: Successful response with a list of phone numbers.
          content:
            application/json:
              schema:
                type: object
                title: List Phone Numbers Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/numbers_SlimPhoneNumberDetailed'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/voice:
    get:
      summary: List phone numbers with voice settings
      operationId: ListPhoneNumbersWithVoiceSettings
      tags:
      - Phone Number Configurations
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: sort
        in: query
        description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
        required: false
        schema:
          type: string
          enum:
          - purchased_at
          - phone_number
          - connection_name
          - usage_payment_method
          example: connection_name
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[phone_number], filter[connection_name], filter[customer_reference], filter[voice.usage_payment_method]'
        schema:
          type: object
          properties:
            phone_number:
              type: string
              description: "Filter by phone number. Requires at least three digits.\n             Non-numerical characters will result in no values being returned."
            connection_name:
              type: object
              description: Filter by connection name pattern matching.
              properties:
                contains:
                  type: string
                  example: test
                  description: Filter contains connection name. Requires at least three characters.
              additionalProperties: false
            customer_reference:
              type: string
              description: Filter numbers via the customer_reference set.
            voice.usage_payment_method:
              type: string
              enum:
              - pay-per-minute
              - channel
              example: channel
              description: Filter by usage_payment_method.
      responses:
        '200':
          description: Successful response with a list of phone numbers with voice settings.
          content:
            application/json:
              schema:
                type: object
                title: List Phone Numbers With Voice Settings Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns account phone numbers together with their voice settings. Results support pagination, sorting, and filters for number, connection name, customer reference, and voice usage payment method.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/{id}:
    delete:
      summary: Delete a phone number
      operationId: DeletePhoneNumber
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      responses:
        '200':
          description: Successful response with details about a phone number.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_PhoneNumberDeletedDetailed'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Deletes the specified phone number from the account. The response contains the phone number's final deleted representation.
    get:
      summary: Retrieve a phone number
      operationId: RetrievePhoneNumber
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      responses:
        '200':
          description: Successful response with details about a phone number.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_PhoneNumberDetailed'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the detailed configuration and current state of the phone number identified by `id`.
    patch:
      summary: Update a phone number
      operationId: UpdatePhoneNumber
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      requestBody:
        description: Updated settings for the phone number.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneNumberRequest'
      responses:
        '200':
          description: Successful response with details about a phone number.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Response
                properties:
                  data:
                    $ref: '#/components/schemas/numbers_PhoneNumberDetailed'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Updates the configurable settings of the specified phone number. The response contains the complete updated phone-number representation.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/{id}/actions/bundle_status_change:
    patch:
      summary: Change the bundle status for a phone number (set to being in a bundle or remove…
      operationId: PhoneNumberBundleStatusChange
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberBundleStatusChangeRequest'
      responses:
        '200':
          description: Phone number bundle status change success
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Bundle Status Change
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Adds the specified phone number to a bundle or removes it from a bundle according to the requested status change. The response contains the phone number with its updated bundle state.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/{id}/actions/enable_emergency:
    post:
      summary: Enable emergency for a phone number
      operationId: EnablePhoneNumberEmergency
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberEnableEmergencyRequest'
      responses:
        '200':
          description: Phone number emergency enabled.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Enable Emergency
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
        '202':
          description: Phone number emergency requested.
          content:
            application/json:
              schema:
                type: object
                title: Phone Number Enable Emergency
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Associates emergency-service settings with the specified phone number. The operation returns the updated phone-number configuration when completed immediately or an accepted state when processing continues asynchronously.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/{id}/voice:
    get:
      summary: Retrieve a phone number with voice settings
      operationId: GetPhoneNumberVoiceSettings
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      responses:
        '200':
          description: Successful response with details about a phone number including voice settings.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve Phone Number Voice Response
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the specified phone number together with its current voice configuration.
    patch:
      summary: Update a phone number with voice settings
      operationId: UpdatePhoneNumberVoiceSettings
      tags:
      - Phone Number Configurations
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/IntId'
      requestBody:
        description: Updated voice settings for the phone number.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneNumberVoiceSettingsRequest'
      responses:
        '200':
          description: Successful response with details about a phone number including voice settings.
          content:
            application/json:
              schema:
                type: object
                title: Retrieve Phone Number Voice Response
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumberWithVoiceSettings'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Updates the voice configuration for the specified phone number. The response contains the phone number with its updated voice settings.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    EmergencySettings:
      description: The emergency services settings for a phone number.
      type: object
      properties:
        emergency_enabled:
          type: boolean
          default: false
          description: Allows you to enable or disable emergency services on the phone number. In order to enable emergency services, you must also set an emergency_address_id.
        emergency_address_id:
          type: string
          description: Identifies the address to be used with emergency services.
        emergency_status:
          type: string
          description: Represents the state of the number regarding emergency activation.
          default: disabled
          enum:
          - disabled
          - active
          - provisioning
          - deprovisioning
          - provisioning-failed
      example:
        emergency_enabled: true
        emergency_address_id: '1315261609962112019'
        emergency_status: active
