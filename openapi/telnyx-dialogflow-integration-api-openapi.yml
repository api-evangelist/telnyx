openapi: 3.2.0
info:
  title: Telnyx Dialogflow Integration API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Dialogflow Integration across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Dialogflow Integration
  description: Dialogflow Connection Operations.
paths:
  /dialogflow_connections/{connection_id}:
    delete:
      summary: Delete stored Dialogflow Connection
      description: Deletes the stored Dialogflow connection for the specified connection.
      operationId: DeleteDialogflowConnection
      tags:
      - Dialogflow Integration
      parameters:
      - $ref: '#/components/parameters/media-streaming_ConnectionId'
      responses:
        '204':
          description: The Dialogflow Connection for connection_id was deleted successfully.
        '404':
          $ref: '#/components/responses/media-streaming_NotFoundResponse'
        default:
          $ref: '#/components/responses/media-streaming_GenericErrorResponse'
    get:
      summary: Retrieve stored Dialogflow Connection
      description: Return details of the Dialogflow connection associated with the given CallControl connection.
      operationId: GetDialogflowConnection
      tags:
      - Dialogflow Integration
      parameters:
      - $ref: '#/components/parameters/media-streaming_ConnectionId'
      responses:
        '200':
          description: Return details of the Dialogflow connection associated with the given CallControl connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogflowConnectionResponse'
        '404':
          $ref: '#/components/responses/media-streaming_NotFoundResponse'
        default:
          $ref: '#/components/responses/media-streaming_GenericErrorResponse'
    post:
      summary: Create a Dialogflow Connection
      description: Save Dialogflow Credentiails to Telnyx, so it can be used with other Telnyx services.
      operationId: CreateDialogflowConnection
      tags:
      - Dialogflow Integration
      parameters:
      - $ref: '#/components/parameters/media-streaming_ConnectionId'
      requestBody:
        $ref: '#/components/requestBodies/DialogflowConnectionRequest'
      responses:
        '201':
          description: Return details of the Dialogflow connection associated with the given CallControl connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogflowConnectionResponse'
        '422':
          $ref: '#/components/responses/media-streaming_UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/media-streaming_GenericErrorResponse'
    put:
      summary: Update stored Dialogflow Connection
      description: Updates the stored Dialogflow connection for the specified connection and returns the updated configuration.
      operationId: UpdateDialogflowConnection
      tags:
      - Dialogflow Integration
      parameters:
      - $ref: '#/components/parameters/media-streaming_ConnectionId'
      requestBody:
        $ref: '#/components/requestBodies/DialogflowConnectionRequest'
      responses:
        '200':
          description: Return details of the Dialogflow connection associated with the given CallControl connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogflowConnectionResponse'
        '404':
          $ref: '#/components/responses/media-streaming_NotFoundResponse'
        '422':
          $ref: '#/components/responses/media-streaming_UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/media-streaming_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  responses:
    media-streaming_GenericErrorResponse:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: '10007'
              title: Unexpected error
              detail: An unexpected error occured.
    media-streaming_UnprocessableEntityResponse:
      description: Unprocessable entity. The request was well-formed but contains semantic errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: '422'
              title: Unprocessable Entity
              detail: The request parameters failed validation.
              source:
                pointer: /service_account
    media-streaming_NotFoundResponse:
      description: Resource not found. The requested resource or URL could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          examples:
            not_found:
              summary: Generic not found
              value:
                errors:
                - code: '404'
                  title: Not Found
                  detail: Page not found
            connection_not_found:
              summary: Connection not found
              value:
                errors:
                - code: '10005'
                  title: Resource not found
                  detail: The Dialogflow connection for the specified connection_id could not be found.
                  source:
                    pointer: /connection_id
    media-streaming_GenericErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/media-streaming_Errors'
      description: Unexpected error.
    media-streaming_UnprocessableEntityResponse_2:
      content:
        application/json:
          example:
            errors:
            - code: '422'
              detail: The request parameters failed validation.
              source:
                pointer: /service_account
              title: Unprocessable Entity
          schema:
            $ref: '#/components/schemas/media-streaming_Errors'
      description: Unprocessable entity. The request was well-formed but contains semantic errors.
    media-streaming_NotFoundResponse_2:
      content:
        application/json:
          examples:
            connection_not_found:
              summary: Connection not found
              value:
                errors:
                - code: '10005'
                  detail: The Dialogflow connection for the specified connection_id could not be found.
                  source:
                    pointer: /connection_id
                  title: Resource not found
            not_found:
              summary: Generic not found
              value:
                errors:
                - code: '404'
                  detail: Page not found
                  title: Not Found
          schema:
            $ref: '#/components/schemas/media-streaming_Errors'
      description: Resource not found. The requested resource or URL could not be found.
    DialogflowConnectionResponseBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialogflowConnectionResponse'
      description: Return details of the Dialogflow connection associated with the given CallControl connection.
  parameters:
    media-streaming_ConnectionId:
      name: connection_id
      description: Uniquely identifies a Telnyx application (Call Control).
      in: path
      required: true
      schema:
        type: string
  schemas:
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    DialogflowConnectionResponse:
      type: object
      title: Dialogflow Connection Response
      required:
      - data
      properties:
        data:
          type: object
          title: Dialogflow Connection
          properties:
            record_type:
              type: string
              example: dialogflow_connections
            connection_id:
              type: string
              example: '1234541231'
              description: Uniquely identifies a Telnyx application (Call Control).
            conversation_profile_id:
              type: string
              description: The id of a configured conversation profile on your Dialogflow account. (If you use Dialogflow CX, this param is required)
              example: a-VMHLWzTmKjiJw5S6O0-w
            environment:
              type: string
              description: Which Dialogflow environment will be used.
              example: development
            service_account:
              type: string
              description: The JSON map to connect your Dialoglow account.
              example: '****'
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    DialogflowConnection:
      type: object
      title: Dialogflow Connection Params
      required:
      - service_account
      properties:
        service_account:
          description: The JSON map to connect your Dialoglow account.
          type: object
          additionalProperties: true
        dialogflow_api:
          description: Determine which Dialogflow will be used.
          type: string
          enum:
          - cx
          - es
          example: cx
          default: es
        conversation_profile_id:
          description: The id of a configured conversation profile on your Dialogflow account. (If you use Dialogflow CX, this param is required)
          type: string
          example: a-VMHLWzTmKjiJw5S6O0-w
        location:
          description: The region of your agent is. (If you use Dialogflow CX, this param is required)
          type: string
          example: global
        environment:
          description: Which Dialogflow environment will be used.
          type: string
          example: development
      example:
        service_account:
          type: service_account
          project_id: your-project-id
          private_key_id: your-private-key
          private_key: REDACTED_PRIVATE_KEY_EXAMPLE
          client_email: example@example.com
          client_id: your-client-id
          auth_uri: https://accounts.google.com/o/oauth2/auth
          token_uri: https://oauth2.googleapis.com/token
          auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
          client_x509_cert_url: https://www.googleapis.com/robot/v1/metadata/x509/example%40example.iam.gserviceaccount.com
        dialogflow_api: cx
        conversation_profile_id: a-VMHLWzTmKjiJw5S6O0-w
        location: global
        environment: development
    media-streaming_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/media-streaming_Error'
          type: array
      type: object
    media-streaming_Error:
      properties:
        code:
          type: string
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  requestBodies:
    DialogflowConnectionRequest:
      description: The params expected to create/update a Dialogflow Connection for given connection_id.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialogflowConnection'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
