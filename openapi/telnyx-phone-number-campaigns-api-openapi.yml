      summary: Get Single Phone Number Campaign
      tags:
      - Phone Number Campaigns
      x-latency-category: responsive
    put:
      operationId: PutPhoneNumberCampaign
      parameters:
      - in: path
        name: phoneNumber
        required: true
        schema:
          title: Phonenumber
          type: string
