openapi: 3.2.0
info:
  title: Telnyx Phone Number Campaigns API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Phone Number Campaigns across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Phone Number Campaigns
  description: Phone number campaign assignment
paths:
  /10dlc/phone_number_campaigns:
    get:
      tags:
      - Phone Number Campaigns
      summary: List phone number campaigns
      operationId: GetAllPhoneNumberCampaigns
      parameters:
      - required: false
        schema:
          title: Recordsperpage
          default: 20
          type: integer
        name: recordsPerPage
        in: query
        description: Number of records to return per page.
      - required: false
        schema:
          title: Page
          default: 1
          type: integer
        name: page
        in: query
        description: Page number to retrieve (1-based).
      - $ref: '#/components/parameters/10dlc_FilterConsolidated'
      - name: sort
        required: false
        schema:
          title: Sort
          description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
          type: string
          enum:
          - assignmentStatus
          - -assignmentStatus
          - createdAt
          - -createdAt
          - phoneNumber
          - -phoneNumber
          default: -createdAt
        description: Specifies the sort order for results. If not given, results are sorted by createdAt in descending order.
        example: -phoneNumber
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCampaignPaginated'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Returns phone-number-to-campaign assignments for the authenticated account. Apply the documented filters and pagination parameters to narrow the result set.
    post:
      tags:
      - Phone Number Campaigns
      summary: Create New Phone Number Campaign
      operationId: CreatePhoneNumberCampaign
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberCampaignCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCampaign'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Assigns a phone number to a 10DLC campaign. The assignment controls which registered campaign is used for traffic from that number.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/phone_number_campaigns/{phoneNumber}:
    delete:
      tags:
      - Phone Number Campaigns
      summary: Delete Phone Number Campaign
      description: This endpoint allows you to remove a campaign assignment from the supplied `phoneNumber`.
      operationId: DeletePhoneNumberCampaign
      parameters:
      - required: true
        schema:
          title: Phonenumber
          type: string
        name: phoneNumber
        in: path
        description: Unique identifier of the phone number.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCampaign'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    get:
      tags:
      - Phone Number Campaigns
      summary: Get Single Phone Number Campaign
      operationId: GetSinglePhoneNumberCampaign
      parameters:
      - required: true
        schema:
          title: Phonenumber
          type: string
        name: phoneNumber
        in: path
        description: Unique identifier of the phone number.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCampaign'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Retrieve an individual phone number/campaign assignment by `phoneNumber`.
    put:
      tags:
      - Phone Number Campaigns
      summary: Update Phone Number Campaign
      operationId: PutPhoneNumberCampaign
      parameters:
      - required: true
        schema:
          title: Phonenumber
          type: string
        name: phoneNumber
        in: path
        description: Unique identifier of the phone number.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberCampaignCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCampaign'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Replaces the 10DLC campaign assignment for the specified phone number.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PhoneNumberCampaignPaginated:
      title: PhoneNumberCampaignPaginated
      required:
      - records
      - page
      - totalRecords
      type: object
      properties:
        records:
          title: Records
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberCampaign'
        page:
          title: Page
          type: integer
        totalRecords:
          title: Totalrecords
          type: integer
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    PhoneNumberCampaignCreate:
      title: PhoneNumberCampaignCreate
      required:
      - phoneNumber
      - campaignId
      type: object
      properties:
        phoneNumber:
          title: Phonenumber
          type: string
          description: The phone number you want to link to a specified campaign.
          example: '+18005550199'
        campaignId:
          title: Campaignid
          type: string
          description: The ID of the campaign you want to link to the specified phone number.
          example: 4b300178-131c-d902-d54e-72d90ba1620j
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    PhoneNumberCampaign:
      title: PhoneNumberCampaign
      required:
      - phoneNumber
      - campaignId
      - createdAt
      - updatedAt
      type: object
      properties:
        phoneNumber:
          title: Phonenumber
          type: string
          example: '+18005550199'
        brandId:
          description: Brand ID. Empty if the number is associated to a shared campaign.
          title: BrandId
          type: string
          example: 7ba705b7-22af-493f-addc-ac04b7ca071c
        tcrBrandId:
          description: TCR's alphanumeric ID for the brand.
          title: TcrBrandId
          type: string
          example: BBRAND1
        campaignId:
          description: 'For shared campaigns, this is the TCR campaign ID, otherwise it is the campaign ID '
          title: Campaignid
          type: string
        tcrCampaignId:
          description: TCR's alphanumeric ID for the campaign.
          title: TcrCampaignid
          type: string
          example: CCAMPA1
        telnyxCampaignId:
          description: Campaign ID. Empty if the number is associated to a shared campaign.
          title: Telnyxcampaignid
          type: string
          example: 3008dd9f-66d7-40e0-bf23-bf2d8d1a96ba
        assignmentStatus:
          description: The assignment status of the number.
          title: AssignmentStatus
          enum:
          - FAILED_ASSIGNMENT
          - PENDING_ASSIGNMENT
          - ASSIGNED
          - PENDING_UNASSIGNMENT
          - FAILED_UNASSIGNMENT
          example: ASSIGNED
          type: string
        tmobileNumberMappingStatus:
          description: The T-Mobile assignment status of the number.
          title: TMobileNumberMappingStatus
          type: string
          example: ADDED
        nonTmobileNumberMappingStatus:
          description: The assignment status of the number towards other carriers.
          title: NonTMobileNumberMappingStatus
          type: string
          example: ADDED
        failureReasons:
          description: Extra info about a failure to assign/unassign a number. Relevant only if the assignmentStatus is either FAILED_ASSIGNMENT or FAILED_UNASSIGNMENT
          type: string
        createdAt:
          title: Createdat
          type: string
          example: '2021-03-08T17:57:48.801186'
        updatedAt:
          title: Updatedat
          type: string
          example: '2021-03-08T17:57:48.801186'
    10dlc_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/10dlc_Error'
          type: array
      type: object
    PhoneNumberCampaign_2:
      properties:
        assignmentStatus:
          description: The assignment status of the number.
          enum:
          - FAILED_ASSIGNMENT
          - PENDING_ASSIGNMENT
          - ASSIGNED
          - PENDING_UNASSIGNMENT
          - FAILED_UNASSIGNMENT
          example: ASSIGNED
          title: AssignmentStatus
          type: string
        brandId:
          description: Brand ID. Empty if the number is associated to a shared campaign.
          example: 7ba705b7-22af-493f-addc-ac04b7ca071c
          title: BrandId
          type: string
        campaignId:
          description: 'For shared campaigns, this is the TCR campaign ID, otherwise it is the campaign ID '
          title: Campaignid
          type: string
        createdAt:
          example: '2021-03-08T17:57:48.801186'
          title: Createdat
          type: string
        failureReasons:
          description: Extra info about a failure to assign/unassign a number. Relevant only if the assignmentStatus is either FAILED_ASSIGNMENT or FAILED_UNASSIGNMENT
          type: string
        phoneNumber:
          example: '+18005550199'
          title: Phonenumber
          type: string
        tcrBrandId:
          description: TCR's alphanumeric ID for the brand.
          example: BBRAND1
          title: TcrBrandId
          type: string
        tcrCampaignId:
          description: TCR's alphanumeric ID for the campaign.
          example: CCAMPA1
          title: TcrCampaignid
          type: string
        telnyxCampaignId:
          description: Campaign ID. Empty if the number is associated to a shared campaign.
          example: 3008dd9f-66d7-40e0-bf23-bf2d8d1a96ba
          title: Telnyxcampaignid
          type: string
        updatedAt:
          example: '2021-03-08T17:57:48.801186'
          title: Updatedat
          type: string
      required:
      - phoneNumber
      - campaignId
      - createdAt
      - updatedAt
      title: PhoneNumberCampaign
      type: object
    10dlc_Error:
      properties:
        code:
          type: string
        detail:
          type: string
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  parameters:
    10dlc_FilterConsolidated:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated filter parameter (deepObject style). Originally: filter[telnyx_campaign_id], filter[telnyx_brand_id], filter[tcr_campaign_id], filter[tcr_brand_id]'
      schema:
        type: object
        properties:
          telnyx_campaign_id:
            type: string
            format: uuid
            example: f3575e15-32ce-400e-a4c0-dd78800c20b0
            description: Filter results by the Telnyx Campaign id
          telnyx_brand_id:
            type: string
            format: uuid
            example: f3575e15-32ce-400e-a4c0-dd78800c20b0
            description: Filter results by the Telnyx Brand id
          tcr_campaign_id:
            type: string
            example: CAMPID3
            description: Filter results by the TCR Campaign id
          tcr_brand_id:
            type: string
            example: BRANDID
            description: Filter results by the TCR Brand id
  responses:
    10dlc_GenericErrorResponse_ca4eb0ad6f:
      description: Generic response error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: string
              title: string
              detail: string
              source:
                pointer: string
                parameter: string
    10dlc_GenericErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/10dlc_Errors'
      description: Generic response error
    SinglePhoneNumberCampaign:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneNumberCampaign_2'
      description: Successful Response
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
