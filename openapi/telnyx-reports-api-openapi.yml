  description: Ledger billing reports
paths:
  /ledger_billing_group_reports:
    post:
      summary: Create a ledger billing group report
      deprecated: false
      description: Create a ledger billing group report, which aggregates ledger activity by billing group.
      operationId: CreateBillingGroupReport
      tags:
      - Reports
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLedgerBillingGroupReport'
            example:
              year: 2019
              month: 10
      responses:
        '200':
          description: Expected ledger billing group report response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LedgerBillingGroupReport'
          headers: {}
        '401':
          $ref: '#/components/responses/GenericErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          headers: {}
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ledger_billing_group_reports/{id}:
    get:
      summary: Get a ledger billing group report
      deprecated: false
      description: Retrieve the details and status of a previously created ledger billing group report.
      operationId: GetBillingGroupReport
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        description: The id of the ledger billing group report
        required: true
        example: f5586561-8ff0-4291-a0ac-84fe544797bd
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Expected ledger billing group report response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LedgerBillingGroupReport'
          headers: {}
        '401':
          $ref: '#/components/responses/GenericErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          headers: {}
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
