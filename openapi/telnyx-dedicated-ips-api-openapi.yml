        '409':
          description: The IP is not in `warming_up` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '40901'
                  title: Conflict
                  detail: warmup actions are only available for a dedicated IP in warming_up status (suspended IPs are operator-held and cannot be resumed by customer action)
  /email/dedicated_ips/{id}/actions/start_warmup:
    post:
      operationId: startDedicatedIpWarmup
      summary: Start warmup for a dedicated IP
      description: 'Start the warm-up ramp (`provisioning` to `warming_up`). The ramp never starts automatically. Only a `provisioning` IP can be started; a `suspended` IP returns `409`. Starting does not check DNS: the IP carries mail only while `dns_confirmed_at` is set and the IP is in a pool that routes mail.'
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
