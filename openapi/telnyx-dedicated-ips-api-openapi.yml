              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10001'
                  title: Not Found
                  detail: The requested dedicated IP was not found
        '409':
          description: The IP is suspended by Telnyx; a customer action cannot start its warm-up. Only Telnyx can lift a suspension; you can still release the IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '40901'
