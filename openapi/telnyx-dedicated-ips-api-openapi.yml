                  pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
                  region: ewr-nj1
                  status: warming_up
                  warmup:
                    started_at: '2026-10-14T20:36:50.000000Z'
                    progress: 25
                    daily_cap: 32000
                    paused: true
                    paused_at: '2026-10-24T21:00:00.000000Z'
                    today:
                      day: '2026-10-24'
                      cap: 32000
                      granted: 1250
                      remaining: 30750
                  billing:
                    status: active
                    charged: true
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-24T21:00:00.000000Z'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
