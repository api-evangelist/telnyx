openapi: 3.2.0
info:
  version: 2.0.0
  x-latency-category: responsive
  x-endpoint-cost: light
  title: Telnyx Dedicated IPs API
  description: SIP trunking, SMS, MMS, Call Control and Telephony Data Services.
  contact:
    email: support@telnyx.com
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Dedicated IPs
  description: Purchase and manage dedicated sending IP addresses for your Telnyx email traffic.
paths:
  /email/dedicated_ips:
    get:
      operationId: listDedicatedIps
      summary: List dedicated IPs
      description: List the dedicated sending IPs owned by the account, newest first. Narrow the list with `filter[status]`, `filter[pool_id]`, and `filter[region]`; supplied filters combine, so an IP must match every one. An empty value, or a nested or array value such as `filter[status][]=active`, applies no filter, and other `filter[...]` keys are ignored. A value that no IP can match (an unknown status, a `pool_id` that is not a UUID, or a value containing a NUL byte) returns an empty list, not an error.
      tags:
      - Dedicated IPs
      parameters:
      - name: filter[status]
        in: query
        required: false
        description: Return only IPs in this lifecycle status (exact match). Any other value returns an empty list. An empty value applies no filter.
        schema:
          type: string
          enum:
          - provisioning
          - warming_up
          - active
          - suspended
          - released
        example: warming_up
      - name: filter[pool_id]
        in: query
        required: false
        description: Return only IPs in this pool (exact match on `pool_id`). A value that is not a UUID returns an empty list. An empty value applies no filter.
        schema:
          type: string
          format: uuid
        example: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
      - name: filter[region]
        in: query
        required: false
        description: Return only IPs in this region (exact, case-sensitive match on `region`). An empty value applies no filter.
        schema:
          type: string
        example: ewr-nj1
      responses:
        '200':
          description: Dedicated IP list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpListResponse'
              example:
                data:
                - id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: null
                  region: ewr-nj1
                  status: provisioning
                  warmup:
                    started_at: null
                    progress: 0
                    daily_cap: null
                    paused: false
                    paused_at: null
                    today: null
                  billing:
                    status: active
                    charged: true
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-14T20:30:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10007'
                  title: Unauthorized
                  detail: The API key provided is invalid or unauthorized
    post:
      operationId: createDedicatedIp
      summary: Purchase a dedicated IP
      description: 'Purchase a dedicated sending IP. Requires a verified, enterprise, or legacy account, and an `Idempotency-Key` header: a request without the header returns `400` (code `10015`) and allocates nothing. Telnyx allocates the next available IP from stock. The optional `region` and `ip_version` fields each restrict which stock IP is allocated; they never change the allocated IP''s metadata. An omitted field applies no restriction for that field, and omitting the body applies neither restriction. An unsupported selector value returns `422`; a supported value that matches no available IP returns `429` and records the request on the waitlist. Billing: $14/month/IP, charged as a monthly recurring charge (MRC) from purchase. The IP is returned in `provisioning` status with a Telnyx-managed PTR hostname and carries no mail until you call `start_warmup` and add it to a pool that routes mail.'
      tags:
      - Dedicated IPs
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Required. Opaque, unquoted key for safely retrying the same purchase. Keys must contain 1 to 255 letters, numbers, hyphens, or underscores. Generate a unique UUID v4 for each purchase and reuse it only when retrying that purchase with the same request. A missing header, or an invalid one —including duplicate, empty, malformed, or overlong values—returns 400 with error code 10015. A request already in progress with the same key returns 409; reusing the key with a different request returns 422. Only successful responses are replayed, for up to 24 hours. Do not include sensitive data in the key.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]{1,255}$
        example: 8e03978e-40d5-43e8-bc93-6894a57f9326
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedicatedIpCreateRequest'
            example:
              region: ewr-nj1
              ip_version: ipv4
      responses:
        '201':
          description: Dedicated IP allocated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: null
                  region: ewr-nj1
                  status: provisioning
                  warmup:
                    started_at: null
                    progress: 0
                    daily_cap: null
                    paused: false
                    paused_at: null
                    today: null
                  billing:
                    status: pending
                    charged: false
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-14T20:30:00.000000Z'
        '400':
          description: Malformed request, or a missing or invalid `Idempotency-Key` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: Idempotency-Key header is required.
                  source:
                    pointer: /header/Idempotency-Key
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Forbidden - the account is not eligible to purchase dedicated IPs (eligible: verified, enterprise, legacy)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10008'
                  title: Forbidden
                  detail: Dedicated IP purchases require a verified or enterprise account
        '422':
          description: A `region` or `ip_version` selector is unsupported, empty, `null`, or not a string. Nothing was allocated or added to the waitlist. `source.pointer` names the field and `detail` lists the supported values. One field is reported per response, `region` first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unsupportedRegion:
                  value:
                    errors:
                    - code: '10015'
                      title: Validation Failed
                      detail: 'region is not available for purchase (available: ewr-nj1)'
                      source:
                        pointer: /data/attributes/region
                unsupportedIpVersion:
                  value:
                    errors:
                    - code: '10015'
                      title: Validation Failed
                      detail: 'ip_version is not available for purchase (available: ipv4)'
                      source:
                        pointer: /data/attributes/ip_version
                nonStringSelector:
                  value:
                    errors:
                    - code: '10015'
                      title: Validation Failed
                      detail: 'region must be a string (available: ewr-nj1)'
                      source:
                        pointer: /data/attributes/region
        '429':
          description: Out of stock (no available IP, or none matching the supplied `region` and `ip_version`) or admission capacity exceeded. meta carries capacity/waitlist details and retry_after_seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpCapacityErrorResponse'
              example:
                errors:
                - code: '10020'
                  title: Rate Limit Exceeded
                  detail: No dedicated IPs are currently available for purchase. Your request can be added to the waitlist — retry after 300 seconds.
                meta:
                  retry_after_seconds: 300
                  waitlist: true
        '503':
          description: Billing is unavailable, the admission capacity could not be read, or the waitlist could not be recorded. Nothing was allocated; retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10031'
                  title: Service Unavailable
                  detail: Dedicated IP Billing is unavailable — the purchase was not allocated; retry shortly
  /email/dedicated_ips/{id}:
    delete:
      operationId: deleteDedicatedIp
      summary: Release a dedicated IP
      description: 'Release the dedicated IP to Telnyx. The IP stops carrying mail immediately, leaves its pool, and moves to `released`. Telnyx sets `quarantine_until` to 30 days after release. Release requests that the MRC stop asynchronously. Check `billing`: `stopping` means the stop is pending, `stopped` means it completed, and `stop_failed` means the charge remains. If the charge was never created or its creation has not completed, `billing` keeps showing the creation status (`not_started`, `pending`, `in_progress`, or `failed`). Any status except `released` can be released. Releasing the last IP in a pool requires `force=true` and `drain=true`.'
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: force
        in: query
        required: false
        description: Set together with `drain=true` to release the last IP in a pool. Either flag alone has no effect. Also accepted in the JSON body.
        schema:
          type: boolean
          default: false
      - name: drain
        in: query
        required: false
        description: Set together with `force=true` to release the last IP in a pool. Acknowledges that mail routed to the emptied pool is held until the pool has a sendable IP again. Also accepted in the JSON body.
        schema:
          type: boolean
          default: false
      - name: reason
        in: query
        required: false
        description: Free-text reason recorded with the release. Also accepted in the JSON body.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedicatedIpDeleteRequest'
            example:
              reason: No longer needed
      responses:
        '200':
          description: Released dedicated IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: null
                  region: ewr-nj1
                  status: released
                  warmup:
                    started_at: null
                    progress: 0
                    daily_cap: null
                    paused: false
                    paused_at: null
                    today: null
                  billing:
                    status: stopping
                    charged: true
                  provisioning_status: not_applicable
                  provisioning:
                    dns_status: not_applicable
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: '2026-11-23T22:00:00.000000Z'
                  released_at: '2026-10-24T22:00:00.000000Z'
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-24T22:00:00.000000Z'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10001'
                  title: Not Found
                  detail: The requested dedicated IP was not found
        '409':
          description: The IP is the last member of its pool and `force`/`drain` were not both set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '40901'
                  title: Conflict
                  detail: 'cannot release the last IP in a pool without force: true and drain: true (in-flight messages need a routable source)'
        '422':
          description: The IP is already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10015'
                  title: Validation Failed
                  detail: cannot transition dedicated IP from released to released
                  source:
                    pointer: /data/attributes/status
        '503':
          description: Billing is unavailable; the IP was not released. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10031'
                  title: Service Unavailable
                  detail: Dedicated IP Billing is unavailable — the purchase was not allocated; retry shortly
    get:
      operationId: getDedicatedIp
      summary: Retrieve a dedicated IP
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Dedicated IP details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
                  region: ewr-nj1
                  status: warming_up
                  warmup:
                    started_at: '2026-10-14T20:36:50.000000Z'
                    progress: 25
                    daily_cap: 32000
                    paused: false
                    paused_at: null
                    today:
                      day: '2026-10-24'
                      cap: 32000
                      granted: 1250
                      remaining: 30750
                  billing:
                    status: active
                    charged: true
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-24T00:00:12.118402Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10001'
                  title: Not Found
                  detail: The requested dedicated IP was not found
      description: Retrieve a single dedicated IP by its identifier, including warm-up state, billing state, and the DNS/PTR provisioning checklist.
    patch:
      operationId: updateDedicatedIp
      summary: Update a dedicated IP
      description: 'Move the IP to another pool, or pause/resume its warm-up ramp. One change applies per request. `pool_id` takes precedence over warm-up changes. Otherwise, use `warmup_paused` or `warmup.paused`; a Boolean `warmup_paused` takes precedence. Moving the last IP out of a pool requires `force: true` and `drain: true`. The PTR hostname is managed by Telnyx: a request that includes `ptr_hostname` returns `422` unless `pool_id` or a warm-up field is present, in which case `ptr_hostname` is ignored.'
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedicatedIpUpdateRequest'
            example:
              pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
              weight: 100
      responses:
        '200':
          description: Updated dedicated IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
                  region: ewr-nj1
                  status: warming_up
                  warmup:
                    started_at: '2026-10-14T20:36:50.000000Z'
                    progress: 25
                    daily_cap: 32000
                    paused: false
                    paused_at: null
                    today:
                      day: '2026-10-24'
                      cap: 32000
                      granted: 1250
                      remaining: 30750
                  billing:
                    status: active
                    charged: true
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-24T00:00:12.118402Z'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The dedicated IP or the target pool was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10001'
                  title: Not Found
                  detail: The requested ip pool was not found
        '409':
          description: The IP is the last member of its current pool and `force`/`drain` were not both set, or `warmup_paused` or `warmup.paused` was sent for an IP that is not `warming_up`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '40901'
                  title: Conflict
                  detail: 'cannot remove the last IP from a pool without force: true and drain: true (in-flight messages need a routable source)'
        '422':
          description: Validation failed. Pool reassignment rejects invalid weights and released IPs. A request that includes `ptr_hostname` (any value, including `null`) and neither `pool_id` nor a warm-up field is rejected because the PTR hostname is managed by Telnyx; the IP is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidWeight:
                  value:
                    errors:
                    - code: '10015'
                      title: Validation Failed
                      detail: weight must be a positive integer (got 0)
                      source:
                        pointer: /data/attributes/weight
                ptrHostnameManaged:
                  value:
                    errors:
                    - code: '10015'
                      title: Validation Failed
                      detail: ptr_hostname is managed by Telnyx and cannot be changed
                      source:
                        pointer: /data/attributes/ptr_hostname
  /email/dedicated_ips/{id}/actions/complete_warmup:
    post:
      operationId: completeDedicatedIpWarmup
      summary: Manually complete warmup
      description: 'Manually complete the warm-up ramp (`warming_up` to `active`), bypassing the schedule. Use only for an IP already warmed elsewhere. Completion sets `warmup.progress` to `100`, clears `warmup.daily_cap`, and applies the ramp-complete allowance to the current UTC day: `warmup.today.cap` becomes `100000000`, `warmup.today.granted` keeps the sends already released today, and `warmup.today.remaining` becomes `cap` minus `granted`. Once completion applies this allowance, an exhausted stage allowance does not block the next eligible first-attempt send. The response reports these values. On an `active` IP, `warmup.progress` and `warmup.daily_cap` are informational: they can keep earlier values after a suspension is lifted and do not limit sending.'
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Dedicated IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
                  region: ewr-nj1
                  status: active
                  warmup:
                    started_at: '2026-10-14T20:36:50.000000Z'
                    progress: 100
                    daily_cap: null
                    paused: false
                    paused_at: null
                    today:
                      day: '2026-10-24'
                      cap: 100000000
                      granted: 1250
                      remaining: 99998750
                  billing:
                    status: active
                    charged: true
                  provisioning_status: dns_confirmed
                  provisioning:
                    dns_status: dns_confirmed
                    ptr_request_state: confirmed
                    ptr_request_pr_url: null
                    checklist:
                      ptr_requested: true
                      ptr_authored: false
                      ptr_merged: true
                      forward_confirmed: true
                  ptr_hostname: mta-64-16-239-170.msgtelnyx.com
                  dns_confirmed_at: '2026-10-14T20:12:41.552310Z'
                  quarantine_until: null
                  released_at: null
                  suspension_reason: null
                  created_at: '2026-09-30T02:03:09.474123Z'
                  updated_at: '2026-10-24T21:45:00.000000Z'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '10001'
                  title: Not Found
                  detail: The requested dedicated IP was not found
        '409':
          description: The IP is suspended by Telnyx; a customer action cannot activate it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
                - code: '40901'
                  title: Conflict
                  detail: 'a suspended dedicated IP is operator-held and cannot be activated by customer action (operator suspension: abuse review)'
        '422':
          description: The IP is not in `warming_up` status, or it has no PTR hostname.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                errors:
