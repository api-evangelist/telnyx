  /email/dedicated_ips/{id}/actions/resume_warmup:
    post:
      operationId: resumeDedicatedIpWarmup
      summary: Resume warmup
      description: Resume a paused warm-up ramp from its held stage. Only a `warming_up` IP can be resumed; resuming a ramp that is not paused returns the IP unchanged.
      tags:
      - Dedicated IPs
      parameters:
      - name: id
        in: path
        required: true
        description: The dedicated IP identifier (UUID).
        schema:
          type: string
