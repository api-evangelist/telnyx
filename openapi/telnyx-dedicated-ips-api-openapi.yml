          description: Dedicated IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedIpShowResponse'
              example:
                data:
                  id: 6a7f9a30-1234-4b5c-8d9e-0f1a2b3c4d5e
                  record_type: dedicated_ip
                  ip_address: 64.16.239.170
                  ip_version: ipv4
                  pool_id: 9b1c4d70-abcd-4e5f-8a9b-0c1d2e3f4a5b
                  region: ewr-nj1
                  status: warming_up
                  warmup:
                    started_at: '2026-10-14T20:36:50.000000Z'
                    progress: 25
                    daily_cap: 32000
                    paused: false
                    paused_at: null
                    today:
                      day: '2026-10-24'
                      cap: 32000
                      granted: 1250
                      remaining: 30750
                  billing:
                    status: active
