  /email/dedicated_ips/{id}/actions/pause_warmup:
    post:
      operationId: pauseDedicatedIpWarmup
      summary: Pause warmup
      description: Pause the warm-up ramp at its current stage. While paused, the IP releases no first-attempt sends from hold and the ramp does not advance. Only a `warming_up` IP can be paused; pausing an already paused IP refreshes `paused_at`.
