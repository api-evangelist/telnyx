components:
  schemas:
    DedicatedIpProvisioning:
      type: object
      description: Read-only status of the Telnyx-managed PTR record. No customer action is required to complete it.
      properties:
        dns_status:
          type: string
          enum:
          - not_applicable
          - pending_ptr
          - pending_dns
          - dns_confirmed
          - dns_lost
          description: '`dns_confirmed`: the PTR is forward-confirmed and `dns_confirmed_at` is set. `pending_ptr`: the PTR record is not yet in place. `pending_dns`: the PTR record is waiting for forward confirmation. `dns_lost`: a previously confirmed PTR no longer confirms, or the PTR request was abandoned before it ever confirmed (`ptr_request_state` is `abandoned`); the IP carries no mail until DNS is confirmed. `not_applicable`: the IP is released or has no PTR record on file.'
        ptr_request_state:
          type: string
          nullable: true
          enum:
          - pending
          - pr_open
          - merged
          - confirmed
          - failed
          - abandoned
          - null
          description: 'State of the Telnyx PTR change: `pending`, `pr_open`, `merged`, `confirmed`, `failed`, or `abandoned`. Informational.'
        ptr_request_pr_url:
          type: string
          nullable: true
          description: Reference to the Telnyx PTR change request, when one exists. Informational.
        checklist:
          type: object
          properties:
            ptr_requested:
              type: boolean
            ptr_authored:
              type: boolean
            ptr_merged:
              type: boolean
            forward_confirmed:
              type: boolean
          description: Informational progress flags for the Telnyx-managed PTR. They do not gate `start_warmup`; use `dns_status` to check whether the IP can carry mail.
    DedicatedIpListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DedicatedIp'
      required:
      - data
    DedicatedIpWarmup:
      type: object
      description: Warmup ramp state for a dedicated IP.
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When `start_warmup` was called. Null before warm-up starts and after release.
        progress:
          type: integer
          description: 'Ramp progress (0-100): the share of the 28 send-day schedule completed. Only UTC days on which the IP sent mail count. Set to 100 when the ramp completes, automatically or through `complete_warmup`. On an `active` IP this value is informational and can keep an earlier value after a suspension is lifted.'
          minimum: 0
          maximum: 100
        daily_cap:
          type: integer
          nullable: true
          minimum: 1
          description: Daily cap of the current ramp stage. Null until the scheduler arms the first stage, and cleared when the ramp completes, automatically or through `complete_warmup`. On an `active` IP this value is informational and can keep an earlier stage cap after a suspension is lifted; it does not limit sending.
        paused:
          type: boolean
          description: True while the ramp is paused.
        paused_at:
          type: string
          format: date-time
          nullable: true
          description: When the ramp was paused. Null when not paused.
        today:
          type: object
          nullable: true
          description: Today's warmup allowance report card (current UTC day). Null outside the warmup window (before start_warmup, after release/suspension). `active` IPs report the ramp-complete allowance, except as described for `cap`.
          properties:
            day:
              type: string
              format: date
              description: The UTC day this snapshot describes (warmup caps reset at UTC midnight).
            cap:
              type: integer
              nullable: true
              description: 'The day''s allowance cap. Null when the ramp has not opened yet (day 0: the scheduler has not armed a stage cap) — distinct from a spent day, which reports the cap with remaining 0. `active` IPs report `100000000`, the ramp-complete cap; `complete_warmup` applies it to the current day immediately. A day''s allowance created before the IP became `active` can keep its stored `cap` and `remaining` until the next first-attempt send refreshes them.'
            granted:
              type: integer
              description: First-attempt sends released from warmup hold so far today. Delivery retries never lease allowance and are not counted.
            remaining:
              type: integer
              nullable: true
              description: Headroom left today. A queued send held by the daily cap is explained by remaining == 0; null mirrors cap (ramp not open yet). On an `active` IP whose `cap` is below `100000000`, remaining == 0 is a stored allowance and does not block the next eligible first-attempt send.
    DedicatedIpShowResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DedicatedIp'
      required:
      - data
    DedicatedIpUpdateRequest:
      type: object
      description: 'Applies one change per request. `pool_id` takes precedence over warm-up changes: when it is present, the IP moves to that pool (with `weight`, `force`, and `drain`) and other fields are ignored. Otherwise, use `warmup_paused` or `warmup.paused`; a Boolean `warmup_paused` takes precedence. The PTR hostname is managed by Telnyx and cannot be changed: when neither `pool_id` nor a warm-up field is present, a body that includes `ptr_hostname` (including `null`) returns `422` and the IP is unchanged. A body with none of these fields returns the IP unchanged.'
      properties:
        pool_id:
          type: string
          format: uuid
          description: Move the IP to this pool, replacing its current membership. Use the IP's current pool to change only its weight. To take an IP out of a pool, use `DELETE /email/ip_pools/{id}/ips/{ip_id}`.
        weight:
          type: integer
          minimum: 1
          default: 100
          description: Routing weight in the target pool. Used only with `pool_id`.
        force:
          type: boolean
          default: false
          description: 'Set together with `drain: true` to move the last IP out of its current pool. Used only with `pool_id`.'
        drain:
          type: boolean
          default: false
          description: 'Set together with `force: true` to move the last IP out of its current pool. Acknowledges that mail routed to the emptied pool is held. Used only with `pool_id`.'
        warmup_paused:
          type: boolean
          description: Pause (`true`) or resume (`false`) the warm-up ramp; equivalent to the `pause_warmup` and `resume_warmup` actions. A Boolean value takes precedence over `warmup.paused`. When a pause field is present and `pool_id` is absent, supplying neither pause field as a Boolean invokes resume.
        warmup:
          type: object
          description: Alias for `warmup_paused`.
          properties:
            paused:
              type: boolean
              description: Pause (`true`) or resume (`false`) the warm-up ramp. Used only when `warmup_paused` is not a Boolean.
    DedicatedIpCapacityMeta:
      type: object
      properties:
        capacity:
          type: integer
          nullable: true
        used:
          type: integer
          nullable: true
        remaining:
          type: integer
          nullable: true
        retry_after_seconds:
          type: integer
        waitlist:
          type: boolean
          nullable: true
          description: True when the request was recorded on the waitlist.
      required:
      - retry_after_seconds
    DedicatedIpDeleteRequest:
      type: object
      description: Optional release options. The same fields are accepted as query parameters.
      properties:
        force:
          type: boolean
          default: false
          description: 'Set together with `drain: true` to release the last IP in a pool. Either flag alone has no effect.'
        drain:
          type: boolean
          default: false
          description: 'Set together with `force: true` to release the last IP in a pool. Acknowledges that mail routed to the emptied pool is held until the pool has a sendable IP again.'
        reason:
          type: string
          description: Free-text reason recorded with the release.
    DedicatedIpCapacityErrorResponse:
      type: object
      description: 429 envelope with machine-readable capacity or waitlist meta.
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/email_Error'
        meta:
          $ref: '#/components/schemas/DedicatedIpCapacityMeta'
      required:
      - errors
      - meta
    DedicatedIpBilling:
      type: object
      description: Monthly recurring charge (MRC) state for the IP's current allocation.
      properties:
        status:
          type: string
          enum:
          - not_started
          - pending
          - in_progress
          - active
          - stopping
          - stopped
          - stop_failed
          - failed
          description: '`not_started`: no charge recorded for the current allocation. `pending`: the charge is queued. `in_progress`: the charge is being created. `active`: the MRC is active. `stopping`: release requested; the MRC stop is being processed. `stopped`: the MRC has stopped. `stop_failed`: the MRC stop failed and the charge remains. `failed`: the charge could not be created.'
        charged:
          type: boolean
          description: True when `status` is `active`, `stopping`, or `stop_failed`. An IP carries mail only after its charge has been created.
    email_Error:
      type: object
      required:
      - code
      - title
      - detail
      properties:
        code:
          type: string
          enum:
          - '10001'
          - '10015'
          - '500'
          - '10007'
          - '10008'
          - '10020'
          - '40901'
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
    ErrorEnvelope:
      type: object
      description: Telnyx v2 error envelope.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
                  parameter:
                    type: string
      required:
      - errors
    DedicatedIp:
      type: object
      description: A dedicated sending IP address owned by the account.
      properties:
        id:
          type: string
          format: uuid
        record_type:
          type: string
          enum:
          - dedicated_ip
        ip_address:
          type: string
          description: The allocated IPv4/IPv6 address.
        ip_version:
          type: string
          enum:
          - ipv4
          - ipv6
        pool_id:
          type: string
          format: uuid
          nullable: true
        region:
          type: string
          description: Region label of the allocated IP (for example, `ewr-nj1`).
        status:
          type: string
          enum:
          - provisioning
          - warming_up
          - active
          - suspended
          - released
          description: 'Lifecycle status. `provisioning`: purchased and billed, carries no mail until `start_warmup`. `warming_up`: warm-up ramp in progress. `active`: ramp complete. `suspended`: suspended by Telnyx; carries no mail and is still billed. `released`: returned to Telnyx; carries no mail.'
        warmup:
          $ref: '#/components/schemas/DedicatedIpWarmup'
        billing:
          $ref: '#/components/schemas/DedicatedIpBilling'
        provisioning_status:
          type: string
          enum:
          - not_applicable
          - pending_ptr
          - pending_dns
          - dns_confirmed
          - dns_lost
          description: Same value as `provisioning.dns_status`.
        provisioning:
          $ref: '#/components/schemas/DedicatedIpProvisioning'
        ptr_hostname:
          type: string
          nullable: true
          description: Telnyx-managed reverse DNS (PTR) hostname of the IP, in the form `mta-<a-b-c-d>.msgtelnyx.com`. Also used as the EHLO hostname when sending from the IP. Managed by Telnyx and cannot be changed through the API.
        dns_confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: When the PTR hostname was forward-confirmed (PTR → hostname → A record → this IP). The IP carries mail only while this is set.
        quarantine_until:
          type: string
          format: date-time
          nullable: true
          description: Set on release to 30 days after `released_at`. The address is not returned to stock before this time.
        released_at:
          type: string
          format: date-time
          nullable: true
          description: When the IP was released. Null until release.
        suspension_reason:
          type: string
          nullable: true
          description: Reason Telnyx recorded when suspending the IP. Null unless `status` is `suspended`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DedicatedIpCreateRequest:
      type: object
      description: Optional purchase selectors. Each supplied field restricts which stock IP is allocated; neither field is written to the IP. Omit the body or a field to apply no restriction for it. Other fields are ignored.
      properties:
        region:
          type: string
          enum:
          - ewr-nj1
          description: 'Allocate an IP in this region. Supported value: `ewr-nj1`. Any other value, including an empty string or `null`, returns `422`.'
        ip_version:
          type: string
          enum:
          - ipv4
          description: 'Allocate an IP of this address family. Supported value: `ipv4`. Any other value, including `ipv6` or `null`, returns `422`.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
