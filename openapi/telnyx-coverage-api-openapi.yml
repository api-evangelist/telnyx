openapi: 3.2.0
info:
  title: Telnyx Coverage API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Coverage across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Coverage
paths:
  /network_coverage:
    get:
      summary: List network coverage locations
      description: List all locations and the interfaces that region supports
      operationId: ListNetworkCoverage
      tags:
      - Coverage
      parameters:
      - name: filters
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filters parameter (deepObject style). Originally: filters[available_services][contains]'
        schema:
          type: object
          properties:
            available_services:
              oneOf:
              - $ref: '#/components/schemas/AvailableService'
                description: Filter by exact available service match
              - type: object
                properties:
                  contains:
                    $ref: '#/components/schemas/AvailableService'
                    description: Filter by available services containing the specified service
                additionalProperties: false
                description: Available service filtering operations
          additionalProperties: false
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[location.region], filter[location.site], filter[location.pop], filter[location.code]'
        schema:
          type: object
          properties:
            location.region:
              type: string
              example: AMER
              description: The region of associated location to filter on.
            location.site:
              type: string
              example: SJC
              description: The site of associated location to filter on.
            location.pop:
              type: string
              example: SV1
              description: The POP of associated location to filter on.
            location.code:
              type: string
              example: silicon_valley-ca
              description: The code of associated location to filter on.
      - $ref: '#/components/parameters/PageConsolidated'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkCoverage'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/GenericErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    AvailableService:
      type: string
      title: Available service
      enum:
      - cloud_vpn
      - private_wireless_gateway
      - virtual_cross_connect
    NetworkCoverage:
      type: object
      title: NetworkCoverage
      properties:
        record_type:
          type: string
          description: Identifies the type of the resource.
          readOnly: true
          example: network_coverage
        location:
          $ref: '#/components/schemas/netapps_Location_17904fcfbc'
        available_services:
          type: array
          description: List of interface types supported in this region.
          items:
            oneOf:
            - $ref: '#/components/schemas/AvailableService'
    netapps_Location_17904fcfbc:
      type: object
      title: Location
      properties:
        region:
          type: string
          description: Identifies the geographical region of location.
          example: AMER
        site:
          type: string
          description: Site of location.
          example: ORD
        pop:
          type: string
          description: Point of presence of location.
          example: CH1
        code:
          type: string
          description: Location code.
          example: chicago-il
        name:
          type: string
          description: Human readable name of location.
          example: Chicago IL, US
    netapps_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/netapps_Error'
          type: array
      type: object
    NetworkCoverage_2:
      properties:
        available_services:
          description: List of interface types supported in this region.
          items:
            oneOf:
            - $ref: '#/components/schemas/AvailableService'
          type: array
        location:
          $ref: '#/components/schemas/netapps_Location'
        record_type:
          description: Identifies the type of the resource.
          example: network_coverage
          readOnly: true
          type: string
      title: NetworkCoverage
      type: object
    netapps_Location:
      properties:
        code:
          description: Location code.
          example: chicago-il
          type: string
        name:
          description: Human readable name of location.
          example: Chicago IL, US
          type: string
        pop:
          description: Point of presence of location.
          example: CH1
          type: string
        region:
          description: Identifies the geographical region of location.
          example: AMER
          type: string
        site:
          description: Site of location.
          example: ORD
          type: string
      title: Location
      type: object
    netapps_Error:
      properties:
        code:
          type: string
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
    AvailableService_2:
      type: string
      title: Available service
      enum:
      - cloud_vpn
      - private_wireless_gateway
      - tailscale_subnet_router
      - virtual_cross_connect
  responses:
