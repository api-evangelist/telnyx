    netapps_Location:
      properties:
        code:
          description: Location code.
          example: chicago-il
          type: string
        name:
          description: Human readable name of location.
          example: Chicago IL, US
          type: string
        pop:
          description: Point of presence of location.
          example: CH1
          type: string
        region:
          description: Identifies the geographical region of location.
          example: AMER
          type: string
        site:
          description: Site of location.
          example: ORD
          type: string
      title: Location
      type: object
    NetworkCoverage:
      properties:
        available_services:
          description: List of interface types supported in this region.
          items:
            oneOf:
            - $ref: '#/components/schemas/AvailableService'
          type: array
        location:
          $ref: '#/components/schemas/netapps_Location'
        record_type:
          description: Identifies the type of the resource.
          example: network_coverage
          readOnly: true
          type: string
      title: NetworkCoverage
      type: object
    AvailableService:
      enum:
      - cloud_vpn
      - private_wireless_gateway
      - virtual_cross_connect
      title: Available service
      type: string
    netapps_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/netapps_Error'
          type: array
      type: object
    netapps_Location_17904fcfbc:
      type: object
      title: Location
      properties:
        region:
          type: string
          description: Identifies the geographical region of location.
          example: AMER
        site:
          type: string
          description: Site of location.
          example: ORD
        pop:
          type: string
          description: Point of presence of location.
          example: CH1
        code:
          type: string
          description: Location code.
          example: chicago-il
        name:
          type: string
          description: Human readable name of location.
          example: Chicago IL, US
    NetworkCoverage_2:
      type: object
      title: NetworkCoverage
      properties:
        record_type:
          type: string
          description: Identifies the type of the resource.
          readOnly: true
          example: network_coverage
        location:
          $ref: '#/components/schemas/netapps_Location_17904fcfbc'
        available_services:
          type: array
