openapi: 3.2.0
info:
  title: Telnyx IPs API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged IPs across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: IPs
  description: IP operations
paths:
  /ips:
    get:
      summary: List Ips
      description: Get all IPs belonging to the user that match the given filters.
      operationId: ListIps
      tags:
      - IPs
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/connections_PageConsolidated'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[connection_id], filter[ip_address], filter[port]'
        schema:
          type: object
          properties:
            connection_id:
              type: string
              description: ID of the IP Connection to which this IP should be attached.
            ip_address:
              type: string
              example: 192.168.0.0
              description: IP adddress represented by this resource.
            port:
              type: integer
              example: 5060
              description: Port to use when connecting to this IP.
      responses:
        '200':
          description: Successful response with a list of IPs.
          content:
            application/json:
              schema:
                type: object
                title: List Ips Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ip'
                  meta:
                    $ref: '#/components/schemas/connections_PaginationMeta'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
    post:
      description: Creates a new IP record for use with IP-based connections, associating an IP address with the specified connection.
      summary: Create an Ip
      operationId: CreateIp
      tags:
      - IPs
      x-endpoint-cost: medium
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIpRequest'
      responses:
        '201':
          description: Successful response with details about an IP.
          content:
            application/json:
              schema:
                type: object
                title: Ip Response
                properties:
                  data:
                    $ref: '#/components/schemas/Ip'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ips/{id}:
    delete:
      description: Permanently deletes the specified IP record from its connection.
      summary: Delete an Ip
      operationId: DeleteIp
      tags:
      - IPs
      parameters:
      - $ref: '#/components/parameters/IpId'
      responses:
        '200':
          description: Successful response with details about an IP.
          content:
            application/json:
              schema:
                type: object
                title: Ip Response
                properties:
                  data:
                    $ref: '#/components/schemas/Ip'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    get:
      description: Return the details regarding a specific IP.
      summary: Retrieve an Ip
      operationId: RetrieveIp
      tags:
      - IPs
      parameters:
      - $ref: '#/components/parameters/IpId'
      responses:
        '200':
          description: Successful response with details about an IP.
          content:
            application/json:
              schema:
                type: object
                title: Ip Response
                properties:
                  data:
                    $ref: '#/components/schemas/Ip'
        '400':
          $ref: '#/components/responses/connections_BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
    patch:
      description: Updates the details of the specified IP record and returns the updated IP.
      summary: Update an Ip
      operationId: UpdateIp
      tags:
      - IPs
      parameters:
      - $ref: '#/components/parameters/IpId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIpRequest'
      responses:
        '200':
          description: Successful response with details about an IP.
          content:
            application/json:
              schema:
                type: object
                title: Ip Response
                properties:
                  data:
                    $ref: '#/components/schemas/Ip'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/connections_UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/connections_NotFoundResponse'
        '409':
          description: Conflict. Another update to this connection is still in progress. Wait and retry the request later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connections_ErrorResponse'
              example:
                errors:
                - detail: A previous update to this connection is still in progress. Please try again later.
        '422':
          $ref: '#/components/responses/connections_UnprocessableEntityResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
