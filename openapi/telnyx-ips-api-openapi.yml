                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /inbound/dnis_number_format
    connections_BadRequestResponse_2:
      content:
        application/json:
          examples:
            missingParameter:
              value:
                errors:
                - code: '10015'
                  detail: The request failed because it was not well-formed.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /
                  title: Bad Request
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Bad request, the request was unacceptable, often due to missing a required parameter.
    IpResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/Ip'
            title: Ip Response
            type: object
      description: Successful response with details about an IP.
    connections_NotFoundResponse_2:
      content:
        application/json:
          examples:
            notFound:
              value:
                errors:
                - code: '10005'
                  detail: The requested resource or URL could not be found.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10005
                  source:
                    pointer: /
                  title: Resource not found
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The requested resource doesn't exist.
    connections_UnauthorizedResponse_2:
      content:
        application/json:
          examples:
            notAuthorized:
              value:
                errors:
                - code: '10010'
                  detail: You are not authorized to access the requested resource.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10010
                  source:
                    pointer: /
                  title: Not authorized
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The user doesn't have the required permissions to perform the requested action.
    ListIpsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/Ip'
                type: array
              meta:
                $ref: '#/components/schemas/connections_PaginationMeta'
            title: List Ips Response
            type: object
      description: Successful response with a list of IPs.
    UnauthenticatedResponse_2:
      content:
        application/json:
          examples:
            Authentication Failed:
              value:
                errors:
                - code: '10009'
                  detail: Could not understand the provided credentials.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
                  title: Authentication failed
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unauthorized
    connections_UnprocessableEntityResponse_2:
      content:
        application/json:
          examples:
            unprocessableEntity:
              value:
                errors:
                - code: '10015'
                  detail: 'Invalid dnis_format: test, was provided. Acceptable formats are +e164, e164, national, sip_username'
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10015
                  source:
                    pointer: /inbound/dnis_number_format
                  title: Bad Request
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request was well-formed but was unable to be followed due to semantic errors.
  parameters:
    IpId:
      name: id
      description: Identifies the type of resource.
      in: path
      required: true
      schema:
        format: uuid
        type: string
        example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
    connections_PageConsolidated:
      name: page
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
      schema:
        type: object
        properties:
          size:
            type: integer
            minimum: 1
            maximum: 250
            default: 250
            description: The size of the page
          number:
            type: integer
            minimum: 1
            default: 1
            description: The page number to load
  schemas:
    connections_PaginationMeta:
      title: Pagination Meta
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    Ip:
      type: object
      title: Ip
      properties:
        id:
          type: string
          description: Identifies the type of resource.
          example: '1293384261075731499'
          x-format: int64
        record_type:
          type: string
          description: Identifies the type of the resource.
          example: ip
        connection_id:
          type: string
          description: ID of the IP Connection to which this IP should be attached.
        ip_address:
          type: string
          description: IP adddress represented by this resource.
          example: 192.168.0.0
        port:
          type: integer
          description: Port to use when connecting to this IP.
          default: 5060
          example: 5060
        created_at:
          type: string
          description: ISO 8601 formatted date indicating when the resource was created.
          example: '2018-02-02T22:25:27.521Z'
        updated_at:
          type: string
          description: ISO 8601 formatted date indicating when the resource was updated.
          example: '2018-02-02T22:25:27.521Z'
      example:
        id: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        record_type: ip
        connection_id: '3456789987654'
        ip_address: 192.168.0.0
        port: 5060
        created_at: '2018-02-02T22:25:27.521Z'
        updated_at: '2018-02-02T22:25:27.521Z'
    UpdateIpRequest:
      title: Update Ip Request
      type: object
      required:
      - ip_address
      properties:
        connection_id:
          type: string
          description: ID of the IP Connection to which this IP should be attached.
        ip_address:
          type: string
          description: IP adddress represented by this resource.
          example: 192.168.0.0
        port:
          type: integer
          description: Port to use when connecting to this IP.
          default: 5060
          example: 5060
      example:
        connection_id: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        ip_address: 192.168.0.0
        port: 5060
    CreateIpRequest:
      title: Create Ip Request
      type: object
      required:
      - ip_address
      properties:
        connection_id:
          type: string
          description: ID of the IP Connection to which this IP should be attached.
        ip_address:
          type: string
          description: IP adddress represented by this resource.
          example: 192.168.0.0
        port:
          type: integer
          description: Port to use when connecting to this IP.
          default: 5060
          example: 5060
      example:
        connection_id: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
        ip_address: 192.168.0.0
        port: 5060
    call-scripting_ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              detail:
                type: string
              meta:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
              title:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
    connections_ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
