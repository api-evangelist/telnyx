  /ai/conversations/{conversation_id}/message:
    post:
      tags:
      - Conversations
      summary: Create Message
      description: Add a new message to the conversation. Used to insert a new messages to a conversation manually ( without using chat endpoint )
      operationId: add_new_message
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the conversation
          title: Conversation Id
        description: The ID of the conversation
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMsgReq'
            example:
              role: Role
              content: ''
              name: Name
              tool_choice: string
              tool_calls: []
              tool_call_id: Tool Call Id
              sent_at: '2024-01-23T18:10:02.574Z'
      responses:
        '200':
          description: Successful Response
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Bad Request / Validation Failed (10015). Invalid, duplicate, empty, malformed, or overlong Idempotency-Key headers are rejected by Edge with HTTP 400 and error code 10015.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inference-embedding_ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflictResponse'
        '413':
          description: Payload Too Large. A request sent with an Idempotency-Key whose body exceeds the endpoint's Edge replay-protection limit (256 KB) is rejected before it reaches the service. Requests sent without the header are not subject to this limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inference-embedding_ErrorResponse'
        '422':
          description: Validation Error. Reusing an Idempotency-Key with a different request body also returns 422 with error code 10027.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/inference-embedding_ErrorResponse'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
        '503':
          description: Service unavailable (10016), including unavailable Edge idempotency protection for a keyed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inference-embedding_ErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/conversations/{conversation_id}/messages:
    get:
      tags:
      - Conversations
      summary: Get conversation messages
      description: Retrieve messages for a specific conversation, including tool calls made by the assistant.
      operationId: get_conversations_public__conversation_id__messages_get
      parameters:
      - name: conversation_id
        in: path
        description: Unique identifier of the conversation.
        required: true
        schema:
          type: string
      - name: page[size]
        in: query
        description: The number of messages to return per page.
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - name: page[number]
        in: query
        description: The page number to retrieve.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageListData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/conversations/{conversation_id}/conversations-insights/{insight_id}:
    delete:
      tags:
      - Conversations
      summary: Delete a conversation's insight generation results
      description: Delete one insight generation request for a conversation. Generation results are stored per conversation and per insight template; deleting a request permanently removes the stored result but does not stop insight generation from running again. To remove every insight result for the conversation, delete the conversation itself. A successful delete returns an empty response.
      operationId: delete_conversation_insight
      parameters:
      - name: conversation_id
        in: path
        description: Unique identifier of the conversation.
        required: true
        schema:
          type: string
      - name: insight_id
        in: path
        description: Unique identifier of the insight generation request to delete, as returned as `data.id` by the insight generation and insights-list operations. Note that the nested `conversation_insights[].insight_id` field returned in the insights-list response is the insight template ID, not the ID accepted here.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response. The stored insight generation result is permanently deleted.
        '404':
          description: Conversation Insight Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    InsightTemplateGroupUpdateReq:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        webhook:
          type: string
          title: Webhook
      type: object
      title: InsightTemplateGroupUpdateReq
    inference-embedding_ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/inference-embedding_ErrorObject'
      required:
      - errors
    TemplateType:
      type: string
      enum:
      - custom
      - default
      title: TemplateType
    InsightTemplateCreateReq:
      properties:
        instructions:
          type: string
          title: Instructions
        name:
          type: string
          title: Name
        webhook:
          type: string
          title: Webhook
          default: ''
        json_schema:
          anyOf:
          - type: string
          - type: object
            title: JsonSchemaObject
          title: Json Schema
          description: If specified, the output will follow the JSON schema.
      type: object
      required:
      - instructions
      - name
      title: InsightTemplateCreateReq
    InsightTemplateResp:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        instructions:
          type: string
          title: Instructions
        created_at:
          type: string
          format: date-time
          title: Created At
        insight_type:
          $ref: '#/components/schemas/TemplateType'
          default: custom
        name:
          type: string
          title: Name
          default: ''
        webhook:
          type: string
          title: Webhook
          default: ''
        json_schema:
          anyOf:
          - type: string
          - type: object
            title: JsonSchemaObject
          title: Json Schema
          description: If specified, the output will follow the JSON schema.
      type: object
      required:
      - id
      - instructions
      - created_at
      title: InsightTemplateResp
    CreateConversationRequest:
      properties:
        name:
          type: string
        metadata:
          type: object
          description: Metadata associated with the conversation. Set `ai_disabled` to `true` to create the conversation with AI message responses disabled.
          additionalProperties:
            type: string
      type: object
      title: CreateConversationRequest
    ConversationMessage:
      type: object
      required:
      - role
      - text
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - tool
          description: The role of the message sender.
        text:
          type: string
          description: The message content. Can be null for tool calls.
        tool_calls:
          type: array
          description: Optional tool calls made by the assistant.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the tool call.
              type:
                type: string
                enum:
                - function
                description: Type of the tool call.
              function:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the function to call.
                  arguments:
                    type: string
                    description: JSON-formatted arguments to pass to the function.
                required:
                - name
                - arguments
            required:
            - id
            - type
            - function
        created_at:
          type: string
          description: The datetime the message was created on the conversation. This does not necesarily correspond to the time the message was sent. The best field to use to determine the time the end user experienced the message is `sent_at`.
          format: date-time
          example: '2025-04-15T13:07:28.764Z'
        sent_at:
          type: string
          description: The datetime the message was sent to the end user.
          format: date-time
          example: '2025-04-15T13:07:28.764Z'
        metadata:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: boolean
            - items:
                anyOf:
                - type: string
                - type: integer
                - type: boolean
              type: array
          type: object
          title: Metadata
    ErrorObject:
      type: object
      properties:
        code:
          type: string
          description: Telnyx error code. Send admission errors include account daily quota 10011 and sender-domain ramp code domain_graduation_limit_exceeded. Edge idempotency errors use 10027 or 10036. Fallback 404/500 responses from the framework may use string status codes ('404', '500') instead.
          enum:
          - '10001'
          - '10006'
          - '10007'
          - '10011'
          - '10015'
          - '10016'
          - '10019'
          - domain_graduation_limit_exceeded
          - recipient_suppressed
          - reputation_suspended
          - '404'
          - '500'
          - '10027'
          - '10036'
        title:
          type: string
        detail:
          description: Human-readable error detail. Changeset responses may return a structured object.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
        source:
          type: object
          additionalProperties: true
          nullable: true
        meta:
          type: object
          additionalProperties: true
          nullable: true
          description: Additional metadata. Present on 401 errors with a documentation URL.
      required:
      - code
      - title
      - detail
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: ''
        created_at:
          type: string
          description: The datetime the conversation was created.
          format: date-time
          example: '2025-04-15T13:07:28.764Z'
        metadata:
          type: object
          description: Metadata associated with the conversation. Telnyx provides several pieces of metadata, but customers can also add their own. The reserved field `ai_disabled` (boolean) can be set to `true` to prevent AI-generated responses on this conversation. When `ai_disabled` is `true`, calls to the chat endpoint will return a 400 error. Set to `false` or remove the field to re-enable AI responses. This is useful when a human agent needs to take over the conversation mid-stream (e.g., a technician stepping in while AI was messaging a resident).
          additionalProperties:
            type: string
          example:
            telnyx_conversation_channel: sms
            telnyx_agent_target: '+13128675309'
            telnyx_end_user_target: '+13128675309'
            assistant_id: assistant-123
        last_message_at:
          type: string
          description: The datetime of the latest message in the conversation.
          format: date-time
          example: '2025-04-15T13:07:28.764Z'
      required:
      - id
      - created_at
      - metadata
      - last_message_at
    ConversationInsightListData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ConversationInsight'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/Meta'
      type: object
      required:
      - data
      - meta
      title: ConversationInsightListData
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    GetInsightTemplatesRespData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/InsightTemplateResp'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/Meta'
      type: object
      required:
      - data
      - meta
      title: GetInsightTemplatesRespData
    InsightTemplateGroupCreateReq:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        webhook:
          type: string
          title: Webhook
          default: ''
      type: object
      required:
      - name
      title: InsightTemplateGroupCreateReq
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
      example:
        detail:
        - loc:
          - body
          - name
          msg: Field required
          type: missing
    InsightTemplateDetailRespData:
      properties:
        data:
          $ref: '#/components/schemas/InsightTemplateResp'
      type: object
      required:
      - data
      title: InsightTemplateDetailRespData
    ConversationInsightAggregateResp:
      properties:
        data:
          items:
            additionalProperties: true
            type: object
            description: An aggregation row. Contains the grouped field values (keyed by the group_by field names) and a `record_count` integer. For example, when grouping by `score`, each row has a `score` value and a `record_count` of conversations with that score. When also splitting by `metadata.assistant_version_id`, each row includes both `score` and `metadata.assistant_version_id` plus their combined `record_count`.
            properties:
              record_count:
                type: integer
                description: Number of conversation insights that match this combination of grouped field values.
            required:
            - record_count
          type: array
          title: Data
          description: Aggregation result rows. Each row contains the grouped field values and a `record_count`.
      type: object
      required:
      - data
      title: ConversationInsightAggregateResp
      description: Aggregated conversation insight counts grouped by the specified fields. Each item in `data` contains the grouped field values and a `record_count` indicating how many conversation insights match that combination.
    InsightTemplateGroupDetailRespData:
      properties:
        data:
          $ref: '#/components/schemas/InsightTemplateGroupResp'
      type: object
      required:
      - data
      title: InsightTemplateGroupDetailRespData
    InsightTemplateUpdateReq:
      properties:
        instructions:
          type: string
          title: Instructions
        name:
          type: string
          title: Name
        webhook:
          type: string
          title: Webhook
        json_schema:
          anyOf:
          - type: string
          - type: object
            title: JsonSchemaObject
          title: Json Schema
      type: object
      title: InsightTemplateUpdateReq
    ConversationInsight:
      type: object
      required:
      - id
      - status
      - created_at
      - conversation_insights
      properties:
        id:
          type: string
          description: Unique identifier for the conversation insight.
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          description: Current status of the insight generation for the conversation.
        created_at:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        conversation_insights:
          type: array
          description: List of insights extracted from the conversation.
          items:
            type: object
            required:
            - result
            - insight_id
            properties:
              result:
                type: string
                description: Insight result from the conversation. If the insight has a JSON schema, this will be stringified JSON object.
              insight_id:
                type: string
                description: Unique identifier for the insight configuration.
    inference-embedding_ErrorObject:
      type: object
      properties:
        code:
          type: string
          description: Telnyx error code. Edge idempotency errors use 10015, 10027, or 10036; idempotency protection outages use 10016; replay-cap 413s surface 10007. Fallback 404/500 responses from the framework may use string status codes ('404', '500') instead.
          enum:
          - '10007'
          - '10015'
          - '10016'
          - '10027'
          - '10036'
          - '404'
          - '500'
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
      required:
      - code
      - title
    email_ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
        suppressed:
          type: array
          description: Present when every recipient is suppressed, so the request is rejected and no message is created.
          items:
            $ref: '#/components/schemas/SuppressedRecipient'
      required:
      - errors
    GetInsightTemplateGroupsRespData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/InsightTemplateGroupResp'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/Meta'
      type: object
      required:
      - data
      - meta
      title: GetInsightTemplateGroupsRespData
    InsightTemplateGroupResp:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        created_at:
          type: string
          format: date-time
          title: Created At
        insights:
          items:
            $ref: '#/components/schemas/InsightTemplateResp'
          type: array
          title: Insights
        webhook:
          type: string
          title: Webhook
          default: ''
      type: object
      required:
      - id
      - name
      - created_at
      title: InsightTemplateGroupResp
    SuppressedRecipient:
      type: object
      properties:
        to:
          type: string
          format: email
          description: Suppressed recipient email address.
        reason:
          type: string
          description: Suppression reason returned by the recipient suppression service.
        scope:
          type: string
          description: Scope at which the suppression applies.
        override_allowed:
          type: boolean
          description: Whether an authorized send may override this suppression.
      required:
      - to
      - reason
      - scope
      - override_allowed
    ConversationMessageListData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ConversationMessage'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/Meta'
      type: object
      required:
      - data
      - meta
      title: ConversationMessageListData
    CreateMsgReq:
      properties:
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
          default: ''
        name:
          type: string
          title: Name
        tool_choice:
          anyOf:
          - type: string
          - type: object
            title: ToolChoiceObject
          title: Tool Choice
        tool_calls:
