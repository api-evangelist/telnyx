    MeetingSessionCameraImageUrlSource:
      title: MeetingSessionCameraImageUrlSource
      type: object
      additionalProperties: false
      required:
      - format
      - url
      properties:
        format:
          type: string
          const: jpeg
          description: Only JPEG images are accepted.
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          description: Public HTTPS JPEG URL with at most 2,048 characters and no credentials, fragment, surrounding whitespace, raw control characters, or explicit non-default port. Signed queries are allowed but must be treated as credentials. Fetching is limited to public network destinations, a five-second timeout, no redirects, a 2xx image/jpeg response with identity or no content encoding, and a 1,363,148-byte limit enforced against both declared and streamed content. The service resolves the URL before bot creation and does not persist, return, or log the URL or image bytes.
      examples:
      - format: jpeg
        url: https://cdn.example.com/bot-camera.jpg
