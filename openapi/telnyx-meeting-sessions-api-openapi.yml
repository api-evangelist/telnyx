          type: boolean
          description: Whether the bot leaves when the Assistant's conversation ends or fails.
    MeetingSessionCameraImage:
      title: MeetingSessionCameraImage
      type: object
      description: Write-only static camera-tile image for this session, not a native account or participant profile photo. Supply exactly one JPEG source. When effective, the image is used as the bot's static camera/video output; presentation varies by meeting platform and recording configuration and is not guaranteed in recordings. An effective Avatar or Assistant webpage output takes precedence, so this input is ignored and a URL source is not fetched.
