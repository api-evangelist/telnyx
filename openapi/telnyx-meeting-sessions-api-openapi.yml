          type: string
          enum:
          - scheduled
          - joining
          - waiting_for_admission
          - active
          - leaving
          - ended
          - failed
          - admission_denied
          description: Lifecycle status. `waiting_for_admission` means the bot reached the meeting lobby and may require host approval. `active` means the bot entered the meeting/media path. `ended` alone does not prove attendance; use non-null `joined_at` as positive evidence that the session became active. `admission_denied` is reserved for an explicit provider denial, while cancellation or another termination can end a never-admitted session as `ended`.
