          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last assistant state change, or null.
        webhook_url:
          type:
          - string
          - 'null'
          format: uri
          description: Webhook endpoint for session lifecycle callbacks, or null if not configured.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value metadata attached to the session.
        failure_reason:
          type:
          - string
          - 'null'
          description: Human-readable failure reason if the session failed, or null.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the session was created.
        join_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Scheduled join time, or null for immediate join.
        joined_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the session first became `active`, or null if it never became active. This remains positive admission evidence after terminal transitions.
        ended_at:
          type:
          - string
