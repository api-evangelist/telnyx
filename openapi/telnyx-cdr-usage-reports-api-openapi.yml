      description: Fetch all previous requests for cdr usage reports.
      operationId: getCdrUsageReports
      parameters:
      - name: page
        in: query
        description: Page number
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Size of the page
        schema:
          maximum: 250
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_CdrGetUsageReportsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_ErrorResponse_ffba4faa88'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The request failed because it was not well-formed.
      x-latency-category: responsive
    post:
      tags:
      - CDR Usage Reports
      summary: Create a new legacy usage V2 CDR report request
      description: Creates a new legacy usage V2 CDR report request with the specified filters
      operationId: submitCdrUsageReport
      requestBody:
        description: Cdr detail request data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageRequestLegacy'
        required: true
      responses:
        '200':
          description: V2 legacy CDR usage report request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrPostUsageReportResponse'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
