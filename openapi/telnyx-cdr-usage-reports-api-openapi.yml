  /reports/cdr_usage_reports/sync:
    get:
      tags:
      - CDR Usage Reports
      description: Generate and fetch voice usage report synchronously. This endpoint will both generate and fetch the voice report over a specified time period. No polling is necessary but the response may take up to a couple of minutes.
      summary: Generates and fetches CDR Usage Reports
      operationId: GetCDRUsageReportSync
      parameters:
      - name: start_date
        in: query
        description: Start of the date range filter (inclusive, ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2020-07-01T00:00:00-06:00'
      - name: end_date
        in: query
        description: End of the date range filter (inclusive, ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2020-07-01T00:00:00-06:00'
      - name: aggregation_type
        in: query
        description: Type of aggregation to apply to the results.
        required: true
        schema:
          type: string
          example: NO_AGGREGATION
          enum:
          - NO_AGGREGATION
          - CONNECTION
          - TAG
          - BILLING_GROUP
      - name: product_breakdown
        in: query
        description: Filter results by product breakdown.
        required: true
        schema:
          type: string
          example: NO_BREAKDOWN
          enum:
          - NO_BREAKDOWN
          - DID_VS_TOLL_FREE
          - COUNTRY
          - DID_VS_TOLL_FREE_PER_COUNTRY
      - name: connections
        in: query
        description: Filter results by connection.
        schema:
          type: array
          example:
          - 1234567890123
          items:
            type: number
            example: 1234567890123
      responses:
        '200':
          description: Successful
          content:
