components:
  schemas:
    AutoRechargePref:
      type: object
      properties:
        id:
          type: string
          example: '1524126400473204723'
          description: The unique identifier for the auto recharge preference.
        record_type:
          type: string
          example: auto_recharge_pref
          description: The record type.
        threshold_amount:
          type: string
          example: '104.00'
          description: The threshold amount at which the account will be recharged.
          x-format: decimal
        recharge_amount:
          type: string
          example: '104.00'
          description: The amount to recharge the account, the actual recharge amount will be the amount necessary to reach the threshold amount plus the recharge amount.
          x-format: decimal
        enabled:
          type: boolean
          example: true
          description: Whether auto recharge is enabled.
        invoice_enabled:
          type: boolean
          example: true
        preference:
          type: string
          enum:
          - credit_paypal
          - ach
          example: credit_paypal
          description: The payment preference for auto recharge.
    AutoRechargePrefRequest:
      type: object
      properties:
        threshold_amount:
          type: string
          example: '104.00'
          description: The threshold amount at which the account will be recharged.
          x-format: decimal
        recharge_amount:
          type: string
          example: '104.00'
          description: The amount to recharge the account, the actual recharge amount will be the amount necessary to reach the threshold amount plus the recharge amount.
          x-format: decimal
        enabled:
          type: boolean
          example: true
          description: Whether auto recharge is enabled.
        invoice_enabled:
          type: boolean
          example: true
        preference:
          type: string
          enum:
          - credit_paypal
          - ach
          example: credit_paypal
          description: The payment preference for auto recharge.
  responses:
    AutoRechargePrefResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AutoRechargePref'
            type: object
      description: Successful response
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
