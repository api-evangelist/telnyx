openapi: 3.2.0
info:
  title: Telnyx Fine Tuning API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Fine Tuning across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Fine Tuning
  description: Customize LLMs for your unique needs
paths:
  /ai/fine_tuning/jobs:
    get:
      tags:
      - Fine Tuning
      summary: List fine tuning jobs
      description: Retrieve a list of all fine tuning jobs created by the user.
      operationId: get_finetuningjob_public_finetuning_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJobsListData'
              example:
                data:
                - id: string
                  created_at: 0
                  hyperparameters:
                    n_epochs: 3
                  model: string
                  organization_id: string
                  status: queued
                  training_file: string
                  finished_at: null
                  trained_tokens: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Fine Tuning
      summary: Create a fine tuning job
      description: Creates a new fine-tuning job that trains a model on the provided dataset, and returns the created job.
      operationId: create_new_finetuningjob_public_finetuning_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFineTuningJobRequest'
            example:
              model: string
              training_file: string
              suffix: string
              hyperparameters:
                n_epochs: 3
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
              example:
                id: string
                created_at: 0
                hyperparameters:
                  n_epochs: 3
                model: string
                organization_id: string
                status: queued
                training_file: string
                finished_at: null
                trained_tokens: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/fine_tuning/jobs/{job_id}:
    get:
      tags:
      - Fine Tuning
      summary: Get a fine tuning job
      description: Returns the details of a single fine-tuning job by its job_id, including its current status.
      operationId: get_finetuningjob_public_finetuning__job_id__get
      parameters:
      - name: job_id
        in: path
        description: Unique identifier of the job.
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
              example:
                id: string
                created_at: 0
                hyperparameters:
                  n_epochs: 3
                model: string
                organization_id: string
                status: queued
                training_file: string
                finished_at: null
                trained_tokens: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /ai/fine_tuning/jobs/{job_id}/cancel:
    post:
      tags:
      - Fine Tuning
      summary: Cancel a fine tuning job
      description: Cancels the specified in-progress fine-tuning job and returns the updated job.
      operationId: cancel_new_finetuningjob_public_finetuning_post
      parameters:
      - name: job_id
        in: path
        description: Unique identifier of the job.
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
              example:
                id: string
                created_at: 0
                hyperparameters:
                  n_epochs: 3
                model: string
                organization_id: string
                status: cancelled
                training_file: string
                finished_at: 1706033402
                trained_tokens: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    CreateFineTuningJobRequest:
      properties:
        model:
          type: string
          description: The base model that is being fine-tuned.
        training_file:
          type: string
          description: The storage bucket or object used for training.
        suffix:
          type: string
          description: Optional suffix to append to the fine tuned model's name.
        hyperparameters:
          type: object
          description: The hyperparameters used for the fine-tuning job.
          properties:
            n_epochs:
              type: integer
              minimum: 1
              maximum: 10
              default: 3
              description: The number of epochs to train the model for. An epoch refers to one full cycle through the training dataset. 'auto' decides the optimal number of epochs based on the size of the dataset. If setting the number manually, we support any number between 1 and 50 epochs.
      type: object
      required:
      - model
      - training_file
      title: CreateFineTuningJobRequest
    FineTuningJob:
      type: object
      title: FineTuningJob
      description: The `fine_tuning.job` object represents a fine-tuning job that has been created through the API.
      properties:
        id:
          type: string
          description: The name of the fine-tuned model that is being created.
        created_at:
          type: integer
          description: The Unix timestamp (in seconds) for when the fine-tuning job was created.
        finished_at:
          type:
          - integer
          - 'null'
          description: The Unix timestamp (in seconds) for when the fine-tuning job was finished. The value will be null if the fine-tuning job is still running.
        hyperparameters:
          type: object
          description: The hyperparameters used for the fine-tuning job.
          properties:
            n_epochs:
              type: integer
              minimum: 1
              maximum: 10
              default: 3
              description: The number of epochs to train the model for. An epoch refers to one full cycle through the training dataset.
          required:
          - n_epochs
        model:
          type: string
          description: The base model that is being fine-tuned.
        organization_id:
          type: string
          description: The organization that owns the fine-tuning job.
        status:
          type: string
          description: The current status of the fine-tuning job.
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        trained_tokens:
          type:
          - integer
          - 'null'
          description: The total number of billable tokens processed by this fine-tuning job. The value will be null if the fine-tuning job is still running.
        training_file:
          type: string
          description: The storage bucket or object used for training.
      required:
      - created_at
      - finished_at
      - hyperparameters
      - id
      - model
      - organization_id
      - status
      - trained_tokens
      - training_file
    FineTuningJobsListData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/FineTuningJob'
          type: array
      type: object
      required:
      - data
      title: FineTuningJobListData
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
      example:
        detail:
        - loc:
          - body
          - name
          msg: Field required
          type: missing
    HTTPValidationError_2:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
