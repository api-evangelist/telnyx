openapi: 3.2.0
info:
  title: Telnyx Brands API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Brands across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Brands
  description: Brand operations
paths:
  /10dlc/brand:
    get:
      tags:
      - Brands
      summary: List Brands
      operationId: GetBrands
      parameters:
      - required: false
        schema:
          title: Page
          minimum: 1
          type: integer
          default: 1
        name: page
        in: query
        description: Page number to retrieve (1-based).
      - description: number of records per page. maximum of 500
        required: false
        schema:
          title: Recordsperpage
          type: integer
          description: number of records per page. maximum of 500
          default: 10
        name: recordsPerPage
        in: query
      - name: sort
        required: false
        schema:
          title: Sort
          description: Specifies the sort order for results. If not given, results are sorted by created_at in descending order.
          type: string
          enum:
          - assignedCampaignsCount
          - -assignedCampaignsCount
          - brandId
          - -brandId
          - createdAt
          - -createdAt
          - displayName
          - -displayName
          - identityStatus
          - -identityStatus
          - status
          - -status
          - tcrBrandId
          - -tcrBrandId
          default: -createdAt
        description: Specifies the sort order for results. If not given, results are sorted by createdAt in descending order.
        example: -identityStatus
        in: query
      - required: false
        schema:
          title: Displayname
          type: string
        name: displayName
        in: query
        description: Filter results by display name.
      - required: false
        schema:
          title: Entitytype
          type: string
        name: entityType
        in: query
        description: Filter results by entity type.
      - required: false
        schema:
          title: State
          type: string
        name: state
        in: query
        description: Filter results by state.
      - required: false
        schema:
          title: Country
          type: string
        name: country
        in: query
        description: Filter results by country.
      - name: brandId
        schema:
          title: BrandId
          type: string
          example: 826ef77a-348c-445b-81a5-a9b13c68fbfe
        in: query
        description: Filter results by the Telnyx Brand id
        required: false
      - name: tcrBrandId
        schema:
          title: TCRBrandId
          type: string
          example: BBAND1
        in: query
        description: Filter results by the TCR Brand id
        required: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandRecordSetCSP'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: This endpoint is used to list all brands associated with your organization.
    post:
      tags:
      - Brands
      summary: Create Brand
      operationId: CreateBrandPost
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxBrand'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: This endpoint is used to create a new brand. A brand is an entity created by The Campaign Registry (TCR) that represents an organization or a company. It is this entity that TCR created campaigns will be associated with. Each brand creation will entail an upfront, non-refundable $4 expense.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/feedback/{brandId}:
    get:
      tags:
      - Brands
      summary: Get Brand Feedback By Id
      description: 'Get feedback about a brand by ID. This endpoint can be used after creating or revetting

        a brand.


        Possible values for `.category[].id`:


        * `TAX_ID` - Data mismatch related to tax id and its associated properties.

        * `STOCK_SYMBOL` - Non public entity registered as a public for profit entity or

        the stock information mismatch.

        * `GOVERNMENT_ENTITY` - Non government entity registered as a government entity.

        Must be a U.S. government entity.

        * `NONPROFIT` - Not a recognized non-profit entity. No IRS tax-exempt status

        found.

        * `OTHERS` - Details of the data misrepresentation if any.'
      operationId: GetBrandFeedbackById
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandFeedback'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/smsOtp/{referenceId}:
    get:
      tags:
      - Brands
      summary: Get Brand SMS OTP Status
      description: 'Query the status of an SMS OTP (One-Time Password) for Sole Proprietor brand verification.


        This endpoint allows you to check the delivery and verification status of an OTP sent during the Sole Proprietor brand verification process. You can query by either:


        * `referenceId` - The reference ID returned when the OTP was initially triggered

        * `brandId` - Query parameter for portal users to look up OTP status by Brand ID


        The response includes delivery status, verification dates, and detailed delivery information.'
      operationId: GetBrandSmsOtpStatus
      parameters:
      - required: true
        schema:
          title: Referenceid
          type: string
          example: OTP4B2001
        name: referenceId
        in: path
        description: The reference ID returned when the OTP was initially triggered
      - required: false
        schema:
          title: Brandid
          type: string
          example: B123ABC
        name: brandId
        in: query
        description: Filter by Brand ID for easier lookup in portal applications
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSmsOtpStatus'
        '404':
          description: OTP reference not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/{brandId}:
    delete:
      tags:
      - Brands
      summary: Delete Brand
      description: Delete Brand. This endpoint is used to delete a brand. Note the brand cannot be deleted if it contains one or more active campaigns, the campaigns need to be inactive and at least 3 months old due to billing purposes.
      operationId: DeleteBrand
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '204':
          description: Brand removed successfully
        '400':
          description: Brand cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
              example:
                code: string
                title: string
                detail: string
                source:
                  pointer: string
                  parameter: string
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_Error_ca4eb0ad6f'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    get:
      tags:
      - Brands
      summary: Get Brand
      operationId: GetBrand
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxBrandWithCampaignsCount'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Returns the details of a 10DLC brand by its brandId, including the count of campaigns associated with the brand.
    put:
      tags:
      - Brands
      summary: Update Brand
      operationId: UpdateBrand
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxBrand'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Update a brand's attributes by `brandId`.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/{brandId}/2faEmail:
    post:
      tags:
      - Brands
      summary: Resend brand 2FA email
      operationId: ResendBrand2faEmail
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: Requests a new two-factor authentication email for the specified 10DLC brand. Complete verification through the link delivered to the brand contact before continuing registration.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/{brandId}/externalVetting:
    get:
      tags:
      - Brands
      summary: List External Vettings
      description: Get list of valid external vetting record for a given brand
      operationId: ListExternalVettings
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalVettingList'
              example:
              - evpId: Evpid
                vettingId: vettingId
                vettingToken: vettingToken
                vettingScore: 0
                vettingClass: Vettingclass
                vettedDate: vettedDate
                createDate: createDate
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    post:
      tags:
      - Brands
      summary: Order Brand External Vetting
      description: 'Order new external vetting for a brand.


        Duplicate orders for the same `evpId` and `vettingClass` return `400` with code `10012` if a successful vetting exists within the last 180 days, or one is currently being processed. Failed vettings can be retried immediately.'
      operationId: PostOrderExternalVetting
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderExternalVetting'
            example:
              evpId: Evpid
              vettingClass: Vettingclass
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalVetting'
              example:
                evpId: Evpid
                vettingId: vettingId
                vettingToken: vettingToken
                vettingScore: 0
                vettingClass: Vettingclass
                vettedDate: vettedDate
                createDate: createDate
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    put:
      tags:
      - Brands
      summary: Import External Vetting Record
      description: 'This operation can be used to import an external vetting record from a TCR-approved

        vetting provider. If the vetting provider confirms validity of the record, it will be

        saved with the brand and will be considered for future campaign qualification.'
      operationId: PutExternalVettingRecord
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalVetting'
            example:
              evpId: Evpid
              vettingId: Vettingid
              vettingToken: Vettingtoken
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalVetting'
              example:
                evpId: Evpid
                vettingId: vettingId
                vettingToken: vettingToken
                vettingScore: 0
                vettingClass: Vettingclass
                vettedDate: vettedDate
                createDate: createDate
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/{brandId}/revet:
    put:
      tags:
      - Brands
      summary: Revet Brand
      operationId: RevetBrand
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnyxBrand'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
      description: This operation allows you to revet the brand. However, revetting is allowed once after the successful brand registration and thereafter limited to once every 3 months.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand/{brandId}/smsOtp:
    get:
      tags:
      - Brands
      summary: Get Brand SMS OTP Status by Brand ID
      description: 'Query the status of an SMS OTP (One-Time Password) for Sole Proprietor brand verification using the Brand ID.


        This endpoint allows you to check the delivery and verification status of an OTP sent during the Sole Proprietor brand verification process by looking it up with the brand ID.


        The response includes delivery status, verification dates, and detailed delivery information.


        **Note:** This is an alternative to the `/10dlc/brand/smsOtp/{referenceId}` endpoint when you have the Brand ID but not the reference ID.'
      operationId: GetBrandSmsOtpStatusByBrandId
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
          example: 4b20019b-043a-78f8-0657-b3be3f4b4002
        name: brandId
        in: path
        description: The Brand ID for which to query OTP status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSmsOtpStatus'
        '404':
          description: OTP status not found for this brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    post:
      tags:
      - Brands
      summary: Trigger Brand SMS OTP
      description: 'Trigger or re-trigger an SMS OTP (One-Time Password) for Sole Proprietor brand verification.


        **Important Notes:**


        * Only allowed for Sole Proprietor (`SOLE_PROPRIETOR`) brands

        * Triggers generation of a one-time password sent to the `mobilePhone` number in the brand''s profile

        * Campaigns cannot be created until OTP verification is complete

        * US/CA numbers only for real OTPs; mock brands can use non-US/CA numbers for testing

        * Returns a `referenceId` that can be used to check OTP status via the GET `/10dlc/brand/smsOtp/{referenceId}` endpoint


        **Use Cases:**


        * Initial OTP trigger after Sole Proprietor brand creation

        * Re-triggering OTP if the user didn''t receive or needs a new code'
      operationId: TriggerBrandSmsOtp
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
          example: 4b20019b-043a-78f8-0657-b3be3f4b4002
        name: brandId
        in: path
        description: The Brand ID for which to trigger the OTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerBrandSmsOtpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerBrandSmsOtpResponse'
        '400':
          description: Bad Request - Brand is not a Sole Proprietor or invalid mobile phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    put:
      tags:
      - Brands
      summary: Verify Brand SMS OTP
      description: 'Verify the SMS OTP (One-Time Password) for Sole Proprietor brand verification.


        **Verification Flow:**


        1. User receives OTP via SMS after triggering

        2. User submits the OTP pin through this endpoint

        3. Upon successful verification:

        - A `BRAND_OTP_VERIFIED` webhook event is sent to the CSP

        - The brand''s `identityStatus` changes to `VERIFIED`

        - Campaigns can now be created for this brand


        **Error Handling:**


        Provides proper error responses for:

        * Invalid OTP pins

        * Expired OTPs

        * OTP verification failures'
      operationId: VerifyBrandSmsOtp
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
          example: 4b20019b-043a-78f8-0657-b3be3f4b4002
        name: brandId
        in: path
        description: The Brand ID for which to verify the OTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyBrandSmsOtpRequest'
        required: true
      responses:
        '204':
          description: OTP verified successfully - No content returned
        '400':
          description: Bad Request - Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
              example:
                detail:
                - loc:
                  - string
                  msg: Message
                  type: Error Type
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/10dlc_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse_ca4eb0ad6f'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /10dlc/brand_feedback/{brandId}:
    get:
      tags:
      - Brands
      summary: Get Brand Feedback By Id
      description: 'Get feedback about a brand by ID. This endpoint can be used after creating or revetting

        a brand.


        Possible values for `.category[].id`:


        * `TAX_ID` - Data mismatch related to tax id and its associated properties.

        * `STOCK_SYMBOL` - Non public entity registered as a public for profit entity or

        the stock information mismatch.

        * `GOVERNMENT_ENTITY` - Non government entity registered as a government entity.

        Must be a U.S. government entity.

        * `NONPROFIT` - Not a recognized non-profit entity. No IRS tax-exempt status

        found.

        * `OTHERS` - Details of the data misrepresentation if any.'
      operationId: GetBrandFeedbackById_2
      parameters:
      - required: true
        schema:
          title: Brandid
          type: string
        name: brandId
        in: path
        description: Unique identifier of the brand.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandFeedback'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brands_HTTPValidationError'
        4XX:
          $ref: '#/components/responses/10dlc_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    10dlc_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/10dlc_Error'
      type: object
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    OrderExternalVetting:
      title: OrderExternalVetting
      required:
      - evpId
      - vettingClass
      type: object
      properties:
        evpId:
          title: Evpid
          maxLength: 10
          type: string
          description: External vetting provider ID for the brand.
        vettingClass:
          title: Vettingclass
          type: string
          description: Identifies the vetting classification.
    BrandIdentityStatus:
      title: BrandIdentityStatus
      enum:
      - VERIFIED
      - UNVERIFIED
      - SELF_DECLARED
      - VETTED_VERIFIED
      description: The verification status of an active brand
      type: string
    ImportExternalVetting:
      title: ImportExternalVetting
      required:
      - evpId
      - vettingId
      type: object
      properties:
        evpId:
          title: Evpid
          maxLength: 10
          type: string
          description: External vetting provider ID for the brand.
        vettingId:
          title: Vettingid
          type: string
          description: Unique ID that identifies a vetting transaction performed by a vetting provider. This ID is provided by the vetting provider at time of vetting.
        vettingToken:
          title: Vettingtoken
          type: string
          description: Required by some providers for vetting record confirmation.
    BrandRecordSetCSP:
      title: BrandRecordSetCSP
      type: object
      properties:
        records:
          title: Records
          type: array
          items:
            $ref: '#/components/schemas/BrandBasic'
        page:
          title: Page
          type: integer
          example: 1
        totalRecords:
          title: Totalrecords
          type: integer
          example: 1
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
