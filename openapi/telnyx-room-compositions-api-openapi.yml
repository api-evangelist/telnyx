          schema:
            $ref: '#/components/schemas/video_Error'
      description: Resource not found
    GetRoomCompositionResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/RoomComposition'
            type: object
      description: Get room composition response.
    video_UnprocessableEntity:
