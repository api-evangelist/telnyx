tags:
- name: SIM Card Orders
  description: SIM Card Orders operations
paths:
  /sim_card_order_preview:
    post:
      summary: Preview SIM card orders
      description: Previews a SIM card order purchase, returning estimated costs and details before you place the order. The preview is processed asynchronously.
      operationId: PreviewSimCardOrders
      tags:
      - SIM Card Orders
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              - address_id
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: The amount of SIM cards that the user would like to purchase in the SIM card order.
                  example: 21
                address_id:
                  type: string
                  description: Uniquely identifies the address for the order.
                  example: '1293384261075731499'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SIMCardOrderPreview'
        '422':
          $ref: '#/components/responses/wireless_UnprocessableEntity_c5290d5308'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sim_card_orders:
    get:
      summary: Get all SIM card orders
      description: Get all SIM card orders according to filters.
      operationId: GetSimCardOrders
      tags:
      - SIM Card Orders
      parameters:
      - $ref: '#/components/parameters/FilterSIMCardOrdersConsolidated'
      - $ref: '#/components/parameters/wireless_PageConsolidated_c5290d5308'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SIMCardOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
          description: Successful Response
        '401':
          description: Unauthorized
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimCardOrderCreate'
        required: true
      tags:
      - SIM Card Orders
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SIMCardOrder'
          description: Successful Response
        '401':
          description: Unauthorized
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
      summary: Create a SIM card order
      description: Creates a new order for physical SIM cards, including quantity and shipping details, and returns the created order.
      operationId: CreateSimCardOrder
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /sim_card_orders/{id}:
    get:
      summary: Get a single SIM card order
      description: Returns the details of a single SIM card order by its ID, including its status.
      operationId: GetSimCardOrder
      tags:
      - SIM Card Orders
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SIMCardOrder'
          description: Successful Response
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
