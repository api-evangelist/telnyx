openapi: 3.2.0
info:
  title: Telnyx Mobile Phone Numbers API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Mobile Phone Numbers across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Mobile Phone Numbers
  description: Mobile phone number operations
paths:
  /v2/mobile_phone_numbers:
    get:
      summary: List Mobile Phone Numbers
      operationId: listMobilePhoneNumbers
      tags:
      - Mobile Phone Numbers
      parameters:
      - name: page[number]
        in: query
        description: The page number to load
        schema:
          type: integer
      - name: page[size]
        in: query
        description: The size of the page
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobilePhoneNumber'
                  meta:
                    $ref: '#/components/schemas/mobile_phone_numbers_PaginationMeta'
        '401':
          description: Unauthorized
      description: Retrieve a paginated list of mobile phone numbers on your account.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /v2/mobile_phone_numbers/{id}:
    get:
      summary: Retrieve a Mobile Phone Number
      operationId: retrieveMobilePhoneNumber
      tags:
      - Mobile Phone Numbers
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the mobile phone number
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobilePhoneNumber'
        '404':
          description: Resource not found
      description: Retrieve the details of a specific mobile phone number.
    patch:
      summary: Update a Mobile Phone Number
      operationId: updateMobilePhoneNumber
      tags:
      - Mobile Phone Numbers
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the mobile phone number
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobilePhoneNumberUpdate'
            example:
              noise_suppression: false
              inbound_call_screening: disabled
              caller_id_name_enabled: false
              tags:
              - string
              call_forwarding:
                forwarding_type: always
                call_forwarding_enabled: false
              cnam_listing:
                cnam_listing_enabled: false
              call_recording:
                inbound_call_recording_enabled: false
                inbound_call_recording_channels: single
                inbound_call_recording_format: wav
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobilePhoneNumber'
        '422':
          description: Unprocessable Entity
      description: Update the settings of a specific mobile phone number.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    MobilePhoneNumberUpdate:
      type: object
      properties:
        customer_reference:
          type:
          - string
          - 'null'
        connection_id:
          type:
          - string
          - 'null'
        noise_suppression:
          type: boolean
        inbound_call_screening:
          type: string
          enum:
          - disabled
          - reject_calls
          - flag_calls
        caller_id_name_enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        inbound:
          type: object
          properties:
            interception_app_id:
              type:
              - string
              - 'null'
              description: The ID of the CallControl or TeXML Application that will intercept inbound calls.
              x-format: int64
        outbound:
          type: object
          properties:
            interception_app_id:
              type:
              - string
              - 'null'
              description: The ID of the CallControl or TeXML Application that will intercept outbound calls.
              x-format: int64
        call_forwarding:
          type: object
          properties:
            forwards_to:
              type:
              - string
              - 'null'
            forwarding_type:
              type:
              - string
              - 'null'
              enum:
              - always
              - on-failure
            call_forwarding_enabled:
              type: boolean
        cnam_listing:
          type: object
          properties:
            cnam_listing_enabled:
              type: boolean
            cnam_listing_details:
              type:
              - string
              - 'null'
        call_recording:
          type: object
          properties:
            inbound_call_recording_enabled:
              type: boolean
            inbound_call_recording_channels:
              type: string
              enum:
              - single
              - dual
            inbound_call_recording_format:
              type: string
              enum:
              - wav
              - mp3
    MobilePhoneNumber:
      type: object
      properties:
        id:
          type: string
          description: Identifies the resource.
          readOnly: true
        record_type:
          type: string
          description: Identifies the type of the resource.
          example: mobile_phone_number
          readOnly: true
        phone_number:
          type: string
          description: The +E.164-formatted phone number.
          readOnly: true
        sim_card_id:
          type: string
          description: The ID of the SIM card associated with this number.
          format: uuid
          readOnly: true
        status:
          type: string
          description: The status of the phone number.
          readOnly: true
        connection_id:
          type:
          - string
          - 'null'
          description: The ID of the connection associated with this number.
          x-format: int64
        connection_name:
          type:
          - string
          - 'null'
          description: The name of the connection.
          readOnly: true
        connection_type:
          type:
          - string
          - 'null'
          description: The type of the connection.
          readOnly: true
        mobile_voice_enabled:
          type: boolean
          description: Indicates if mobile voice is enabled.
          readOnly: true
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the number.
        customer_reference:
          type:
          - string
          - 'null'
          description: A customer reference string.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 formatted date indicating when the resource was last updated.
          readOnly: true
        call_forwarding:
          type: object
          properties:
            call_forwarding_enabled:
              type: boolean
            forwards_to:
              type:
              - string
              - 'null'
            forwarding_type:
              type:
              - string
              - 'null'
              enum:
              - always
              - on-failure
        country_iso_alpha2:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the number.
          readOnly: true
        noise_suppression:
          type: string
          description: The noise suppression setting.
          enum:
          - inbound
          - outbound
          - both
          - disabled
        inbound_call_screening:
          type:
          - string
          - 'null'
          description: The inbound call screening setting.
          enum:
          - disabled
          - reject_calls
          - flag_calls
        caller_id_name_enabled:
          type: boolean
          description: Indicates if caller ID name is enabled.
        call_recording:
          type: object
          properties:
            inbound_call_recording_enabled:
              type: boolean
            inbound_call_recording_channels:
              type: string
              enum:
              - single
              - dual
            inbound_call_recording_format:
              type: string
              enum:
              - wav
              - mp3
        cnam_listing:
          type: object
          properties:
            cnam_listing_enabled:
              type: boolean
            cnam_listing_details:
              type:
              - string
              - 'null'
        outbound:
          type: object
          properties:
            interception_app_id:
              type:
              - string
              - 'null'
              description: The ID of the app that will intercept outbound calls.
              x-format: int64
            interception_app_name:
              type:
              - string
              - 'null'
              description: The name of the app that will intercept outbound calls.
              readOnly: true
        inbound:
          type: object
          properties:
            interception_app_id:
              type:
              - string
              - 'null'
              description: The ID of the app that will intercept inbound calls.
              x-format: int64
            interception_app_name:
              type:
              - string
              - 'null'
              description: The name of the app that will intercept inbound calls.
              readOnly: true
    mobile_phone_numbers_PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
        total_results:
          type: integer
        page_number:
          type: integer
        page_size:
          type: integer
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
