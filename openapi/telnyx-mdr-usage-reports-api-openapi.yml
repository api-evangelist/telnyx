      x-latency-category: responsive
    get:
      tags:
      - MDR Usage Reports
      summary: Get an MDR usage report
      description: Returns a single MDR (Message Detail Record) usage report by its identifier, including its parameters and current status.
      operationId: getMdrUsageReport_2
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrGetUsageReportByIdResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Report not found
        '500':
          description: Internal server error
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /reports/mdr_usage_reports:
    get:
      tags:
      - MDR Usage Reports
      description: Fetch all messaging usage reports. Usage reports are aggregated messaging data for specified time period and breakdown
      summary: Fetch all Messaging usage reports
      operationId: GetMdrUsageReports
      parameters:
      - name: page
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
        schema:
          type: object
          properties:
            number:
              type: integer
              format: int32
              default: 1
              description: Page number
            size:
              type: integer
              format: int32
              default: 20
              description: Size of the page
        examples:
          page[number]=1&page[size]=20:
            value:
              number: 1
              size: 20
            summary: Default pagination with first page and 20 records per page
          page[number]=2&page[size]=20:
            value:
              number: 2
              size: 20
            summary: Second page with 20 records per page
          page[number]=1&page[size]=50:
            value:
              number: 1
              size: 50
            summary: First page with 50 records per page
          page[number]=5&page[size]=100:
            value:
              number: 5
              size: 100
            summary: Fifth page with 100 records per page
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_MdrGetUsageReportsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_ErrorResponse_77109e5d17'
      x-latency-category: interactive
    post:
      tags:
      - MDR Usage Reports
      description: Submit request for new new messaging usage report. This endpoint will pull and aggregate messaging data in specified time period.
      summary: Create MDR Usage Report
      operationId: SubmitUsageReport
      requestBody:
        description: Mdr usage report data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdrPostUsageReportRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrPostUsageReportsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_ErrorResponse_77109e5d17'
      x-latency-category: background
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /reports/mdr_usage_reports/sync:
    get:
      tags:
      - MDR Usage Reports
      description: Generate and fetch messaging usage report synchronously. This endpoint will both generate and fetch the messaging report over a specified time period. No polling is necessary but the response may take up to a couple of minutes.
      summary: Generate and fetch MDR Usage Report
      operationId: GetMDRUsageReportSync
      parameters:
      - name: start_date
        in: query
        description: Start of the date range filter (inclusive, ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2020-07-01T00:00:00-06:00'
      - name: end_date
        in: query
        description: End of the date range filter (inclusive, ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2020-07-01T00:00:00-06:00'
      - name: aggregation_type
        in: query
        description: Type of aggregation to apply to the results.
        required: true
        schema:
          type: string
          example: PROFILE
          enum:
          - NO_AGGREGATION
          - PROFILE
          - TAGS
      - name: profiles
        in: query
        description: Filter results by profile.
        schema:
          type: array
          example:
          - My profile
          items:
            type: string
            example: My profile
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrGetSyncUsageReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_ErrorResponse_77109e5d17'
      x-latency-category: background
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /reports/mdr_usage_reports/{id}:
    delete:
      tags:
      - MDR Usage Reports
      description: Permanently deletes the specified messaging usage report by its identifier.
      summary: Delete MDR Usage Report
      operationId: DeleteUsageReport
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrDeleteUsageReportsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_ErrorResponse_77109e5d17'
      x-latency-category: interactive
    get:
      tags:
      - MDR Usage Reports
      description: Fetch a single messaging usage report by id
      summary: Retrieve messaging report
      operationId: GetUsageReport
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrGetUsageReportsByIdResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting_ErrorResponse_77109e5d17'
      x-latency-category: interactive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
