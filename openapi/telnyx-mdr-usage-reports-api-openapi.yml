openapi: 3.2.0
info:
  title: Telnyx MDR Usage Reports API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged MDR Usage Reports across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: MDR Usage Reports
  description: Messaging usage reports
paths:
  /legacy/reporting/usage_reports/messaging:
    get:
      tags:
      - MDR Usage Reports
      summary: List MDR usage reports
      description: Fetch all previous requests for MDR usage reports.
      operationId: getMdrUsageReports
      parameters:
      - name: page
        in: query
        description: Page number
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Size of the page
        schema:
          maximum: 250
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_MdrGetUsageReportsResponse_ffba4faa88'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_ErrorResponse_ffba4faa88'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The request failed because it was not well-formed.
      x-latency-category: responsive
    post:
      tags:
      - MDR Usage Reports
      summary: Create a new legacy usage V2 MDR report request
      description: Creates a new legacy usage V2 MDR report request with the specified filters
      operationId: submitMdrUsageReport
      requestBody:
        description: MDR detail request data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdrUsageRequestLegacy'
        required: true
      responses:
        '200':
          description: V2 legacy MDR usage report request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrPostUsageReportResponse'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /legacy/reporting/usage_reports/messaging/{id}:
    delete:
      tags:
      - MDR Usage Reports
      summary: Delete a V2 legacy usage MDR report request
      description: Deletes a specific V2 legacy usage MDR report request by ID
      operationId: deleteMdrUsageReport
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: V2 legacy usage MDR report request deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrDeleteUsageReportResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Report not found
        '500':
          description: Internal server error
      x-latency-category: responsive
    get:
      tags:
      - MDR Usage Reports
      summary: Get an MDR usage report
      description: Returns a single MDR (Message Detail Record) usage report by its identifier, including its parameters and current status.
      operationId: getMdrUsageReport
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdrGetUsageReportByIdResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Report not found
        '500':
          description: Internal server error
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /legacy_reporting/usage_reports/messaging:
    get:
      tags:
      - MDR Usage Reports
      summary: List MDR usage reports
      description: Fetch all previous requests for MDR usage reports.
      operationId: getMdrUsageReports_2
      parameters:
      - name: page
        in: query
        description: Page number
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Size of the page
        schema:
          maximum: 250
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_MdrGetUsageReportsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard_ErrorResponse'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The request failed because it was not well-formed.
      x-latency-category: responsive
    post:
      tags:
      - MDR Usage Reports
      summary: Create a new legacy usage V2 MDR report request
      description: Creates a new legacy usage V2 MDR report request with the specified filters
      operationId: submitMdrUsageReport_2
      requestBody:
        description: MDR detail request data
        content:
          application/json:
