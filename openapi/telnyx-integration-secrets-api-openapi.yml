openapi: 3.2.0
info:
  title: Telnyx Integration Secrets API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Integration Secrets across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Integration Secrets
  description: Store and retrieve integration secrets
paths:
  /integration_secrets:
    get:
      tags:
      - Integration Secrets
      summary: List integration secrets
      description: Retrieve a list of all integration secrets configured by the user.
      operationId: list_integration_secrets
      parameters:
      - name: page
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
        schema:
          type: object
          properties:
            size:
              type: integer
              title: Page Size
              example: 25
            number:
              type: integer
              title: Page Number
              example: 1
        examples:
          page[number]=1&page[size]=20:
            value:
              number: 1
              size: 20
            summary: First page with 20 results per page
          page[number]=2&page[size]=20:
            value:
              number: 2
              size: 20
            summary: Second page with 20 results per page
          page[number]=1&page[size]=50:
            value:
              number: 1
              size: 50
            summary: First page with 50 results per page
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[type]'
        schema:
          type: object
          properties:
            type:
              type: string
              title: Filter by type
              example: bearer
              enum:
              - bearer
              - basic
        examples:
          filter[type]=bearer:
            value:
              type: bearer
            summary: Filter results to only show bearer type secrets
          filter[type]=basic:
            value:
              type: basic
            summary: Filter results to only show basic authentication type secrets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSecretsListData'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/integration-secrets_ErrorResponse'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The request failed because it was not well-formed.
    post:
      tags:
      - Integration Secrets
      summary: Create a secret
      description: Create a new secret with an associated identifier that can be used to securely integrate with other services.
      operationId: create_integration_secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationSecretRequest'
            examples:
              bearer:
                value:
                  identifier: my_secret
                  type: bearer
                  token: my_secret_value
              basic:
                value:
                  identifier: my_secret
                  type: basic
                  username: my_username
                  password: my_password
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSecretCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/integration-secrets_ErrorResponse'
              example:
                errors:
                - code: '10027'
                  title: Unprocessable Entity
                  detail: The server understood the syntax of the request but was unable to process the instructions.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /integration_secrets/{id}:
    delete:
      tags:
      - Integration Secrets
      summary: Delete an integration secret
      description: Delete an integration secret given its ID.
      operationId: delete_integration_secret
      parameters:
      - name: id
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
          title: Secret Id
      responses:
        '204':
          description: The resource was deleted successfully.
        '404':
          description: Secret Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/integration-secrets_ErrorResponse'
              example:
                errors:
                - code: Telnyx error code
                  detail: Error details
                  title: Error title
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    IntegrationSecret:
      properties:
        record_type:
          type: string
          title: Record Type
          example: integration_secret
        id:
          type: string
          title: Id
        identifier:
          type: string
          title: Identifier
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - record_type
      - id
      - identifier
      - created_at
      title: IntegrationSecret
    integration-secrets_Metadata:
      properties:
        page_size:
          type: integer
          title: Page Size
          example: 25
        page_number:
          type: integer
          title: Page Number
          example: 1
        total_pages:
          type: integer
          title: Total Pages
          example: 10
        total_results:
          type: integer
          title: Total Items
          example: 250
      required:
      - page_size
      - page_number
      - total_pages
      - total_results
      type: object
      title: Metadata
    CreateIntegrationSecretRequest:
      properties:
        identifier:
          type: string
          title: Identifier
          description: The unique identifier of the secret.
        type:
          type: string
          title: Type
          description: The type of secret.
          enum:
          - bearer
          - basic
        token:
          type: string
          title: Token
          description: The token for the secret. Required for bearer type secrets, ignored otherwise.
        username:
          type: string
          title: Username
          description: The username for the secret. Required for basic type secrets, ignored otherwise.
        password:
          type: string
          title: Password
          description: The password for the secret. Required for basic type secrets, ignored otherwise.
      type: object
      required:
      - identifier
      - type
      title: CreateIntegrationSecretRequest
    IntegrationSecretCreatedResponse:
      properties:
        data:
          $ref: '#/components/schemas/IntegrationSecret'
      type: object
      required:
      - data
      title: IntegrationSecretCreatedResponse
    IntegrationSecretsListData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/IntegrationSecret'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/integration-secrets_Metadata'
      type: object
      required:
      - data
      - meta
      title: SecretsListData
    integration-secrets_ErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/integration-secrets_Error'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    integration-secrets_Error:
      properties:
        code:
          type: string
          title: Telnyx error code
        detail:
          type: string
          title: Error details
        title:
          type: string
          title: Error title
      type: object
      required:
      - detail
      title: Error
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
