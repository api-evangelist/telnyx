components:
  schemas:
    OAuthGrant:
      properties:
        client_id:
          description: OAuth client identifier
          type: string
        created_at:
          description: Timestamp when the grant was created
          format: date-time
          type: string
        id:
          description: Unique identifier for the OAuth grant
          format: uuid
          type: string
        last_used_at:
          description: Timestamp when the grant was last used
          format: date-time
          type:
          - string
          - 'null'
        record_type:
          description: Record type identifier
          enum:
          - oauth_grant
          type: string
        scopes:
          description: List of granted OAuth scopes
          items:
            type: string
          type: array
      required:
      - id
      - record_type
      - client_id
      - scopes
      - created_at
      type: object
    oauth_Error:
      properties:
        error:
          description: Error code
          type: string
        error_description:
          description: Human-readable error description
          type: string
      required:
      - error
      type: object
    oauth_PaginationMeta:
      properties:
