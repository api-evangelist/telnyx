paths:
  /oauth/grants:
    get:
      operationId: ListOAuthGrants
      tags:
      - OAuth Grants
      summary: List OAuth grants
      description: Retrieve a paginated list of OAuth grants for the authenticated user
      parameters:
      - name: page[size]
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of results per page
      - name: page[number]
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number
      responses:
        '200':
          description: List of OAuth grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
                  meta:
                    $ref: '#/components/schemas/oauth_PaginationMeta'
              example:
                data:
                - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  record_type: oauth_grant
                  client_id: string
                  scopes:
                  - string
                  created_at: '2024-01-23T18:10:02.574Z'
                meta:
                  page_number: 0
                  page_size: 0
                  total_results: 0
                  total_pages: 0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /oauth/grants/{id}:
    delete:
      operationId: RevokeOAuthGrant
      tags:
      - OAuth Grants
      summary: Revoke OAuth grant
      description: Revokes the specified OAuth grant, withdrawing the access previously granted to the client.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: OAuth grant ID
      responses:
        '200':
          description: OAuth grant revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthGrant'
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  record_type: oauth_grant
                  client_id: string
                  scopes:
                  - string
                  created_at: '2024-01-23T18:10:02.574Z'
        '404':
          description: OAuth grant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    get:
      operationId: GetOAuthGrant
      tags:
      - OAuth Grants
      summary: Get OAuth grant
      description: Returns the details of a single OAuth grant on your account by its ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: OAuth grant ID
      responses:
        '200':
          description: OAuth grant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthGrant'
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  record_type: oauth_grant
                  client_id: string
                  scopes:
                  - string
                  created_at: '2024-01-23T18:10:02.574Z'
        '404':
          description: OAuth grant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_Error'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
