openapi: 3.2.0
info:
  title: Telnyx CSV Downloads API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged CSV Downloads across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: CSV Downloads
paths:
  /phone_numbers/csv_downloads:
    get:
      summary: List CSV downloads
      operationId: ListCsvDownloads
      tags:
      - CSV Downloads
      x-group-parameters: 'true'
      x-endpoint-cost: medium
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      responses:
        '200':
          description: Successful response with a list of CSV downloads.
          content:
            application/json:
              schema:
                type: object
                title: List CSV Downloads Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CsvDownload'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns CSV export jobs created for account phone numbers, including each export's current status and pagination metadata.
    post:
      x-latency-category: background
      summary: Create a CSV download
      operationId: CreateCsvDownload
      tags:
      - CSV Downloads
      parameters:
      - name: csv_format
        in: query
        description: Which format to use when generating the CSV file. The default for backwards compatibility is 'V1'
        required: false
        schema:
          type: string
          enum:
          - V1
          - V2
          example: V2
          default: V1
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[has_bundle], filter[tag], filter[connection_id], filter[phone_number], filter[status], filter[voice.connection_name], filter[voice.usage_payment_method], filter[billing_group_id], filter[emergency_address_id], filter[customer_reference]'
        schema:
          type: object
          properties:
            has_bundle:
              type: string
              description: Filter by phone number that have bundles.
            tag:
              type: string
              description: Filter by phone number tags.
            connection_id:
              type: string
              example: '1521916448077776306'
              description: Filter by connection_id.
            phone_number:
              type: string
              description: "Filter by phone number. Requires at least three digits.\n             Non-numerical characters will result in no values being returned."
            status:
              type: string
              enum:
              - purchase-pending
              - purchase-failed
              - port-pending
              - active
              - deleted
              - port-failed
              - emergency-only
              - ported-out
              - port-out-pending
              example: active
              description: Filter by phone number status.
            voice.connection_name:
              type: object
              description: Filter by voice connection name pattern matching.
              properties:
                contains:
                  type: string
                  example: test
                  description: Filter contains connection name. Requires at least three characters.
                starts_with:
                  type: string
                  example: test
                  description: Filter starts with connection name. Requires at least three characters.
                ends_with:
                  type: string
                  example: test
                  description: Filter ends with connection name. Requires at least three characters.
                eq:
                  type: string
                  example: test
                  description: Filter by connection name.
              additionalProperties: false
            voice.usage_payment_method:
              type: string
              enum:
              - pay-per-minute
              - channel
              example: channel
              description: Filter by usage_payment_method.
            billing_group_id:
              type: string
              example: 62e4bf2e-c278-4282-b524-488d9c9c43b2
              description: Filter by the billing_group_id associated with phone numbers. To filter to only phone numbers that have no billing group associated them, set the value of this filter to the string 'null'.
            emergency_address_id:
              type: string
              example: '9102160989215728032'
              description: Filter by the emergency_address_id associated with phone numbers. To filter only phone numbers that have no emergency address associated with them, set the value of this filter to the string 'null'.
            customer_reference:
              type: string
              description: Filter numbers via the customer_reference set.
      x-endpoint-cost: medium
      responses:
        '200':
          description: Successful response with details about a CSV download.
          content:
            application/json:
              schema:
                type: object
                title: CSV Download Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CsvDownload'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Starts generation of a CSV export for phone numbers matching the supplied filters. The `csv_format` parameter selects the output format, and the response contains the resulting download record.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /phone_numbers/csv_downloads/{id}:
    get:
      x-latency-category: background
      summary: Retrieve a CSV download
      operationId: GetCsvDownload
      tags:
      - CSV Downloads
      x-endpoint-cost: medium
      parameters:
      - name: id
        in: path
        description: Identifies the CSV download.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a CSV download.
          content:
            application/json:
              schema:
                type: object
                title: CSV Download Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CsvDownload'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
      description: Returns the current status and download details for the CSV export identified by `id`.
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    CsvDownload:
      type: object
      properties:
        id:
          type: string
          example: 42587e44-3a3e-46de-9255-0c9a7a1d1ec7
          description: Identifies the resource.
          readOnly: true
        record_type:
          type: string
          example: csv_download
          description: Identifies the type of the resource.
          readOnly: true
        url:
          type: string
          example: https://www.telnyx.com/sample/42587e44-3a3e-46de-9255-0c9a7a1d1ec7
          description: The URL at which the CSV file can be retrieved.
        status:
          type: string
          enum:
          - pending
          - complete
          - failed
          - expired
          default: pending
          example: pending
          description: Indicates the completion level of the CSV report. Only complete CSV download requests will be able to be retrieved.
      example:
        id: 42587e44-3a3e-46de-9255-0c9a7a1d1ec7
        record_type: csv_download
        url: https://www.telnyx.com/sample/42587e44-3a3e-46de-9255-0c9a7a1d1ec7
        status: pending
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    numbers_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/numbers_Error'
          type: array
      type: object
    numbers_Error:
      properties:
        code:
          example: '10007'
          type: string
        detail:
          example: An unexpected error occured.
          type: string
        meta:
          properties:
            url:
              description: URL with additional information on the error.
              example: https://developers.telnyx.com/docs/overview/errors/10015
              type: string
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              example: /base
              type: string
          type: object
        title:
          example: Unexpected error
          type: string
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  responses:
    numbers_UnauthorizedResponse_73c9788e53:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          examples:
            Authentication Failed:
              value:
                errors:
                - code: '10009'
                  title: Authentication failed
                  detail: Could not understand the provided credentials.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
    GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    numbers_NotFoundResponse_73c9788e53:
      description: The requested resource doesn't exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    numbers_BadRequestResponse_73c9788e53:
      description: Bad request, the request was unacceptable, often due to missing a required parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    numbers_UnprocessableEntity_73c9788e53:
      description: Unprocessable entity. Check the 'detail' field in response for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    numbers_GenericErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numbers_Errors'
      description: Unexpected error
    CsvDownloadResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/CsvDownload'
                type: array
            title: CSV Download Response
            type: object
      description: Successful response with details about a CSV download.
    numbers_UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numbers_Errors'
      description: Unprocessable entity. Check the 'detail' field in response for details.
    ListCsvDownloadsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/CsvDownload'
                type: array
              meta:
                $ref: '#/components/schemas/PaginationMeta'
            title: List CSV Downloads Response
            type: object
      description: Successful response with a list of CSV downloads.
    numbers_UnauthorizedResponse:
      content:
        application/json:
          examples:
            Authentication Failed:
              value:
                errors:
                - code: '10009'
                  detail: Could not understand the provided credentials.
                  meta:
                    url: https://developers.telnyx.com/docs/overview/errors/10009
                  title: Authentication failed
          schema:
            $ref: '#/components/schemas/numbers_Errors'
      description: Unauthorized
    numbers_BadRequestResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numbers_Errors'
      description: Bad request, the request was unacceptable, often due to missing a required parameter.
    numbers_NotFoundResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numbers_Errors'
      description: The requested resource doesn't exist.
  parameters:
    numbers_PageConsolidated_73c9788e53:
      name: page
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
      schema:
        type: object
        properties:
          size:
            type: integer
            minimum: 1
            maximum: 250
            default: 20
            description: The size of the page
          number:
            type: integer
            minimum: 1
            default: 1
            description: The page number to load
    numbers_PageConsolidated:
      description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
      explode: true
      in: query
      name: page
      schema:
        properties:
          number:
            default: 1
            description: The page number to load
            minimum: 1
            type: integer
          size:
            default: 20
            description: The size of the page
            maximum: 250
            minimum: 1
            type: integer
        type: object
      style: deepObject
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
