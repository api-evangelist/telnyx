      title: CreatedUserBundlesResponse
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserBundle'
    UnusedUserBundlesResponse:
      title: UnusedUserBundlesResponse
      required:
      - data
      type: object
      properties:
        data:
          title: Data
          type: array
          items:
            $ref: '#/components/schemas/UnusedUserBundlesSchema'
    UserBundleResourcesResponse:
      title: UserBundleResourcesResponse
      required:
      - data
      type: object
      properties:
        data:
          title: Data
          type: array
          items:
            $ref: '#/components/schemas/UserBundleResourceSchema'
    BillingBundleSummary:
      title: BillingBundleSummary
      required:
      - id
      - name
      - cost_code
      - is_public
      - created_at
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          example: 7ecd040e-6bac-4139-9160-3c0427d98fea
          description: Bundle's ID, this is used to identify the bundle in the API.
        name:
          title: Name
          type: string
          example: Australia Basic
          description: Bundle's name, this is used to identify the bundle in the UI.
        slug:
          title: Slug
          type: string
          example: basic-au-e4f8
          description: Slugified version of the bundle's name.
        cost_code:
          title: Cost Code
          type: string
          example: BUNDLE-PRICING-BASIC-MRC
          description: Bundle's cost code, this is used to identify the bundle in the billing system.
        is_public:
          title: Is Public
          type: boolean
          description: Available to all customers or only to specific customers.
        created_at:
          title: Created At
          type: string
          format: date
          description: Date the bundle was created.
        mrc_price:
          title: Mrc Price
          type: number
          format: float
          example: 2
          description: Monthly recurring charge price.
        currency:
          title: Currency
          type: string
          example: USD
          description: Bundle's currency code.
        specs:
          title: Specs
          type: array
          items:
            type: string
          example:
          - 1 AU Number
          - Emergency Calling
          - All inbound and outbound calling billed pay-as-you-go
    PaginationResponse:
      title: PaginationResponse
      required:
      - total_results
      - total_pages
      - page_number
      - page_size
      type: object
      properties:
        total_results:
          title: Total Results
          type: integer
          example: 55
          description: Total number of results returned.
        total_pages:
          title: Total Pages
          type: integer
          example: 3
          description: Total number of pages from the results.
        page_number:
          title: Page Number
          type: integer
          example: 2
          description: The current page number.
        page_size:
          title: Page Size
          type: integer
          example: 25
          description: The number of results per page.
    PaginatedUserBundlesResponse:
      title: PaginatedUserBundlesResponse
      required:
      - meta
      - data
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          title: Data
          type: array
          items:
            $ref: '#/components/schemas/UserBundle'
    UserBundle:
      type: object
      required:
      - id
      - active
      - user_id
      - created_at
      - billing_bundle
      - resources
      properties:
        id:
          type: string
          format: uuid
          example: ca1d2263-d1f1-43ac-ba53-248e7a4bb26a
          description: User bundle's ID, this is used to identify the user bundle in the API.
        active:
          type: boolean
          example: true
          description: Status of the user bundle.
        user_id:
          type: string
          format: uuid
          example: 16856d8c-cd59-4b08-9ac2-1ebb01d419e1
          description: The customer's ID that owns this user bundle.
        created_at:
          type: string
          format: date
          example: '2025-01-20'
          description: Date the user bundle was created.
        updated_at:
          type:
          - string
          - 'null'
          format: date
          example: '2025-01-20'
          description: Date the user bundle was last updated.
        billing_bundle:
          $ref: '#/components/schemas/BillingBundleSummary'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/UserBundleResourceSchema'
          example: []
    CreateUserBundlesBulkRequest:
      properties:
        idempotency_key:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          description: Idempotency key for the request. Can be any UUID, but should always be unique for each request.
        items:
          type: array
          items:
            type: object
            properties:
              billing_bundle_id:
                type: string
                format: uuid
                example: 12ade33a-21c0-473b-b055-b3c836e1c292
                description: Quantity of user bundles to order.
              quantity:
                type: integer
                description: Quantity of user bundles to order.
            required:
            - billing_bundle_id
            - quantity
          writeOnly: true
      type: object
    UnusedUserBundlesSchema:
      title: UnusedUserBundlesSchema
      required:
      - billing_bundle
      - user_bundle_ids
      type: object
      properties:
        billing_bundle:
          $ref: '#/components/schemas/BillingBundleSummary'
        user_bundle_ids:
          title: User Bundle Ids
          type: array
          items:
            type: string
            format: uuid
          description: List of user bundle IDs for given bundle.
          example:
          - 1e650b96-4c6a-4d6f-b8ed-87c3fcacf595
          - 53beb701-1231-4548-8abf-c802f38b14aa
    UserBundleResponse:
      title: UserBundleResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserBundle'
    UserBundleResourceSchema:
      title: UserBundleResourceSchema
      required:
      - id
      - resource
      - resource_type
      - created_at
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: ca1d2263-d1f1-43ac-ba53-248e7a4bb26a
          description: Resource's ID.
        resource:
          type: string
          example: '+15617819942'
          description: The resource itself (usually a phone number).
        resource_type:
          type: string
          example: number
          description: The type of the resource (usually 'number').
        created_at:
          type: string
          format: date
          example: '2025-01-20'
          description: Date the resource was created.
        updated_at:
          type:
          - string
          - 'null'
          format: date
          example: '2025-01-20'
          description: Date the resource was last updated.
    UserBundleCreateResponse:
      title: UserBundleCreateResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserBundle'
  parameters:
    bundle-pricing_FilterConsolidated:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated filter parameter (deepObject style). Supports filtering by country_iso and resource. Examples: filter[country_iso]=US or filter[resource]=+15617819942'
      schema:
        type: object
        properties:
          country_iso:
            title: Filter[Country Iso]
            type: array
            items:
              type: string
              example: US
            description: Filter by country code.
          resource:
            title: Filter[Resource]
            type: array
            items:
              type: string
              description: Filter by resource.
              example: '+15617819942'
            description: Filter by resource.
    UserBundleId:
      required: true
      schema:
        title: User Bundle Id
        type: string
        format: uuid
        example: ca1d2263-d1f1-43ac-ba53-248e7a4bb26a
        description: User bundle's ID, this is used to identify the user bundle in the API.
      name: user_bundle_id
      in: path
      description: Unique identifier of the user bundle.
    AuthorizationBearer:
      name: authorization_bearer
      in: header
      schema:
        type: string
        description: Authenticates the request with your Telnyx API V2 KEY
      description: 'Format: Bearer <TOKEN>'
    bundle-pricing_PageConsolidated:
      name: page
      in: query
      style: deepObject
      explode: true
      description: 'Consolidated page parameter (deepObject style). Originally: page[size], page[number]'
      schema:
        type: object
        properties:
          size:
            type: integer
            minimum: 1
            maximum: 250
            default: 20
            description: The size of the page.
          number:
            type: integer
            minimum: 1
            default: 1
            description: The page number to load.
    UserBundleId_2:
      in: path
      name: user_bundle_id
      required: true
      schema:
        description: User bundle's ID, this is used to identify the user bundle in the API.
        example: ca1d2263-d1f1-43ac-ba53-248e7a4bb26a
        format: uuid
        title: User Bundle Id
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
