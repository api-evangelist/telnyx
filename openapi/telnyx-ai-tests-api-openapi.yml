  x-endpoint-cost: light
  title: Telnyx AI Tests API
  description: SIP trunking, SMS, MMS, Call Control and Telephony Data Services.
  contact:
    email: support@telnyx.com
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: AI Tests
  description: Test agents, evaluator scenarios, metrics, and run results for the AI test framework.
paths:
  /ai/tests/schedules/v1/cron-jobs:
    get:
      tags:
      - AI Tests
      summary: List scheduled test jobs
      description: Returns the scheduled test jobs in your organization, optionally filtered by test agent. A scheduled job runs selected scenarios on a cron expression.
      operationId: list_scheduled_test_jobs
      parameters:
      - name: agent_id
        in: query
        required: false
        description: Filter jobs belonging to the specified test agent.
        schema:
          type: integer
      responses:
        '200':
          description: List of scheduled test jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTestJobListResponse'
              example:
              - id: 1188
                name: Nightly regression
                agent: 1259
                crontab_expression: 0 3 * * *
                timezone: America/Chicago
                scenario_ids:
                - 9512
                scenarios_data:
                - id: 9512
                  agent: 1259
                  name: Refund escalation flow
                  personality: 4643
                  personality_name: Interruptive (High)
                personality: null
                personalities:
                - 4643
                tags:
                - regression
                frequency: 1
                run_as_text: false
                execution_mode: voice
                notify_on: failure
                is_active: true
                created_at: '2026-10-13T18:04:05.123456Z'
                updated_at: '2026-10-13T18:04:05.123456Z'
        '400':
          description: Bad Request. The AI Tests service rejected the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTestsErrorResponse'
              example:
                errors:
                - code: '10015'
                  title: Bad Request
                  detail: The AI Tests service rejected the request.
        '401':
          description: Unauthorized. Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTestsErrorResponse'
              example:
                errors:
                - code: '10003'
                  title: Unauthorized
                  detail: The API key is missing or invalid.
        '404':
          description: Not Found. The requested resource does not exist or is not enabled for your account.
