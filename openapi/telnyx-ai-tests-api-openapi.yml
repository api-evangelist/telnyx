      operationId: list_test_agents
      parameters:
      - name: page
        in: query
        required: false
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        description: Number of results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 25
      responses:
        '200':
          description: Paginated list of test agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAgentListResponse'
              example:
                count: 1
                next: null
                previous: null
                results:
                - id: 1259
                  agent_name: Support Bot Under Test
                  contact_number: '+13125550123'
                  inbound: false
                  description: Evaluates the support assistant against generated callers.
                  language: en
                  assistant_id: e1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
                  chat_assistant_id: ''
