openapi: 3.2.0
info:
  title: Telnyx Rooms Client Tokens API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Rooms Client Tokens across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Rooms Client Tokens
  description: Rooms Client Tokens operations.
paths:
  /rooms/{room_id}/actions/generate_join_client_token:
    post:
      summary: Create Client Token to join a room
      description: Synchronously create an Client Token to join a Room. Client Token is necessary to join a Telnyx Room. Client Token will expire after `token_ttl_secs`, a Refresh Token is also provided to refresh a Client Token, the Refresh Token expires after `refresh_token_ttl_secs`.
      operationId: CreateRoomClientToken
      tags:
      - Rooms Client Tokens
      x-endpoint-cost: medium
      parameters:
      - name: room_id
        in: path
        description: The unique identifier of a room.
        required: true
        schema:
          type: string
          format: uuid
          example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
      requestBody:
        description: Parameters that can be defined during Room Client Token creation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomClientTokenRequest'
      responses:
        '201':
          description: Create room client token response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                      token_expires_at:
                        description: ISO 8601 timestamp when the token expires.
                        type: string
                        format: date-time
                        example: '2021-03-26T17:51:59Z'
                      refresh_token:
                        type: string
                        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                      refresh_token_expires_at:
                        description: ISO 8601 timestamp when the refresh token expires.
                        type: string
                        format: date-time
                        example: '2021-03-26T17:51:59Z'
                    example:
                      token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..1JGK9PyHkTtoP_iMu-8TzXH_fhmnsDtZZOAJLDzLW6DDtAb80wZ93l1VH5yNx5tFqwIFG0t48dRiBKWlW-nzDA
                      token_expires_at: '2021-04-22T12:24:55Z'
                      refresh_token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..FHsp7KlVXn1E5tTUiKZzmQ4of39gi57AakeQeqI0oAa8hzjFMVb0RGj-mxWTvHVen4GpgsUW_epqqaxK16viCA
                      refresh_token_expires_at: '2021-04-22T12:15:05Z'
        '403':
          $ref: '#/components/responses/video_Forbidden'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /rooms/{room_id}/actions/refresh_client_token:
    post:
      summary: Refresh Client Token to join a room
      description: Synchronously refresh an Client Token to join a Room. Client Token is necessary to join a Telnyx Room. Client Token will expire after `token_ttl_secs`.
      operationId: RefreshRoomClientToken
      tags:
      - Rooms Client Tokens
      x-endpoint-cost: light
      security: []
      parameters:
      - name: room_id
        in: path
        description: The unique identifier of a room.
        required: true
        schema:
          type: string
          format: uuid
          example: 0ccc7b54-4df3-4bca-a65a-3da1ecc777f0
      requestBody:
        description: Parameters that can be defined during Room Client Token refresh.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRoomClientTokenRequest'
      responses:
        '201':
          description: Refresh room client token response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                      token_expires_at:
                        description: ISO 8601 timestamp when the token expires.
                        type: string
                        format: date-time
                        example: '2021-03-26T17:51:59Z'
                    example:
                      token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..1JGK9PyHkTtoP_iMu-8TzXH_fhmnsDtZZOAJLDzLW6DDtAb80wZ93l1VH5yNx5tFqwIFG0t48dRiBKWlW-nzDA
                      token_expires_at: '2021-04-22T12:24:55Z'
        '403':
          $ref: '#/components/responses/video_Forbidden'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    RefreshRoomClientTokenRequest:
      type: object
      properties:
        token_ttl_secs:
          description: The time to live in seconds of the Client Token, after that time the Client Token is invalid and can't be used to join a Room.
          type: integer
          example: 600
          default: 600
          minimum: 10
          maximum: 3600
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
      required:
      - refresh_token
    CreateRoomClientTokenRequest:
      type: object
      properties:
        token_ttl_secs:
          description: The time to live in seconds of the Client Token, after that time the Client Token is invalid and can't be used to join a Room.
          type: integer
          example: 600
          default: 600
          minimum: 10
          maximum: 3600
        refresh_token_ttl_secs:
          description: The time to live in seconds of the Refresh Token, after that time the Refresh Token is invalid and can't be used to refresh Client Token.
          type: integer
          example: 3600
          default: 3600
          minimum: 60
          maximum: 86400
    video_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      type: object
  responses:
    video_Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/video_Error'
    RefreshRoomClientTokenResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                example:
                  token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..1JGK9PyHkTtoP_iMu-8TzXH_fhmnsDtZZOAJLDzLW6DDtAb80wZ93l1VH5yNx5tFqwIFG0t48dRiBKWlW-nzDA
                  token_expires_at: '2021-04-22T12:24:55Z'
                properties:
                  token:
                    example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                    type: string
                  token_expires_at:
                    description: ISO 8601 timestamp when the token expires.
                    example: '2021-03-26T17:51:59Z'
                    format: date-time
                    type: string
                type: object
            type: object
      description: Refresh room client token response.
    CreateRoomClientTokenResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                example:
                  refresh_token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..FHsp7KlVXn1E5tTUiKZzmQ4of39gi57AakeQeqI0oAa8hzjFMVb0RGj-mxWTvHVen4GpgsUW_epqqaxK16viCA
                  refresh_token_expires_at: '2021-04-22T12:15:05Z'
                  token: eyJhbGciOiJFZDI1NTE5IiwidHlwIjoiSldUIn0..1JGK9PyHkTtoP_iMu-8TzXH_fhmnsDtZZOAJLDzLW6DDtAb80wZ93l1VH5yNx5tFqwIFG0t48dRiBKWlW-nzDA
                  token_expires_at: '2021-04-22T12:24:55Z'
                properties:
                  refresh_token:
                    example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                    type: string
                  refresh_token_expires_at:
                    description: ISO 8601 timestamp when the refresh token expires.
                    example: '2021-03-26T17:51:59Z'
                    format: date-time
                    type: string
                  token:
                    example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..gNEwzTow5MLLPLQENytca7pUN79PmPj6FyqZWW06ZeEmesxYpwKh0xRtA0TzLh6CDYIRHrI8seofOO0YFGDhpQ
                    type: string
                  token_expires_at:
                    description: ISO 8601 timestamp when the token expires.
                    example: '2021-03-26T17:51:59Z'
                    format: date-time
                    type: string
                type: object
            type: object
      description: Create room client token response.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/video_Error'
      description: Forbidden
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
