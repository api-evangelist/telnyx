openapi: 3.2.0
info:
  title: Telnyx Phone Number Reservations API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Phone Number Reservations across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Phone Number Reservations
  description: Number reservations
paths:
  /number_reservations:
    get:
      summary: List number reservations
      description: Gets a paginated list of phone number reservations.
      operationId: ListNumberReservations
      tags:
      - Phone Number Reservations
      x-group-parameters: 'true'
      parameters:
      - $ref: '#/components/parameters/numbers_PageConsolidated_73c9788e53'
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[status], filter[created_at], filter[phone_numbers.phone_number], filter[customer_reference]'
        schema:
          type: object
          properties:
            status:
              type: string
              description: Filter number reservations by status.
            created_at:
              type: object
              description: Filter number reservations by date range.
              properties:
                gt:
                  type: string
                  description: Filter number reservations later than this value.
                lt:
                  type: string
                  description: Filter number reservations earlier than this value.
              additionalProperties: false
            phone_numbers.phone_number:
              type: string
              description: Filter number reservations having these phone numbers.
            customer_reference:
              type: string
              description: Filter number reservations via the customer reference set.
      responses:
        '200':
          description: Successful response with a list of number reservations.
          content:
            application/json:
              schema:
                type: object
                title: List Number Reservations Response
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NumberReservation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a number reservation
      description: Creates a Phone Number Reservation for multiple numbers.
      operationId: CreateNumberReservation
      tags:
      - Phone Number Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNumberReservationRequest'
      responses:
        '200':
          description: Successful response with details about a number reservation.
          content:
            application/json:
              schema:
                type: object
                title: Number Reservation Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberReservation'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_reservations/{number_reservation_id}:
    get:
      summary: Retrieve a number reservation
      description: Returns the details of a single phone number reservation, including its status and the reserved numbers.
      operationId: RetrieveNumberReservation
      tags:
      - Phone Number Reservations
      parameters:
      - name: number_reservation_id
        in: path
        description: The number reservation ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a number reservation.
          content:
            application/json:
              schema:
                type: object
                title: Number Reservation Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberReservation'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /number_reservations/{number_reservation_id}/actions/extend:
    post:
      summary: Extend a number reservation
      description: Extends reservation expiry time on all phone numbers.
      operationId: ExtendNumberReservationExpiryTime
      tags:
      - Phone Number Reservations
      parameters:
      - name: number_reservation_id
        in: path
        description: The number reservation ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with details about a number reservation.
          content:
            application/json:
              schema:
                type: object
                title: Number Reservation Response
                properties:
                  data:
                    $ref: '#/components/schemas/NumberReservation'
        '400':
          $ref: '#/components/responses/numbers_BadRequestResponse_73c9788e53'
        '401':
          $ref: '#/components/responses/numbers_UnauthorizedResponse_73c9788e53'
        '404':
          $ref: '#/components/responses/numbers_NotFoundResponse_73c9788e53'
        '422':
          $ref: '#/components/responses/numbers_UnprocessableEntity_73c9788e53'
        '500':
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    ReservedPhoneNumber:
      properties:
        id:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          readOnly: true
        errors:
          type: string
          description: Errors the reservation could happen upon
          example: Number is already on hold
          readOnly: true
        record_type:
          type: string
          example: reserved_phone_number
          readOnly: true
        phone_number:
          type: string
          example: '+19705555098'
        status:
          type: string
          enum:
          - pending
          - success
          - failure
          description: The status of the phone number's reservation.
          example: success
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: An ISO 8901 datetime string denoting when the individual number reservation was created.
          example: '2018-01-01T00:00:00.000000Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: An ISO 8901 datetime string for when the the individual number reservation was updated.
          example: '2018-01-01T00:00:00.000000Z'
          readOnly: true
        expired_at:
          type: string
          format: date-time
          description: An ISO 8901 datetime string for when the individual number reservation is going to expire
          example: '2018-01-01T00:00:00.000000Z'
          readOnly: true
      example:
        id: 12ade33a-21c0-473b-b055-b3c836e1c292
        record_type: reserved_phone_number
        phone_number: '+19705555098'
        status: pending
        created_at: '2018-01-01T00:00:00.000000Z'
        updated_at: '2018-01-01T00:00:00.000000Z'
        expired_at: '2018-01-01T00:00:00.000000Z'
      type: object
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    PaginationMeta:
      type: object
      properties:
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    NumberReservation:
      properties:
        id:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          readOnly: true
        record_type:
          type: string
          example: number_reservation
          readOnly: true
        phone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/ReservedPhoneNumber'
        status:
          type: string
          enum:
          - pending
          - success
          - failure
          description: The status of the entire reservation.
          readOnly: true
        customer_reference:
          type: string
          description: A customer reference string for customer look ups.
          example: MY REF 001
        created_at:
          type: string
          format: date-time
          description: An ISO 8901 datetime string denoting when the numbers reservation was created.
          example: '2018-01-01T00:00:00.000000Z'
          readOnly: true
        errors:
          type: string
          description: Errors the reservation could happen upon
          example: Number is already on hold
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: An ISO 8901 datetime string for when the number reservation was updated.
          example: '2018-01-01T00:00:00.000000Z'
          readOnly: true
      example:
        id: 12ade33a-21c0-473b-b055-b3c836e1c292
        record_type: number_reservation
        phone_numbers:
        - id: 12ade33a-21c0-473b-b055-b3c836e1c292
          record_type: reserved_phone_number
          phone_number: '+19705555098'
          status: pending
          created_at: '2018-01-01T00:00:00.000000Z'
          updated_at: '2018-01-01T00:00:00.000000Z'
          expired_at: '2018-01-01T00:00:00.000000Z'
          errors: Number is already on hold
        status: pending
        customer_reference: MY REF 001
        created_at: '2018-01-01T00:00:00.000000Z'
        updated_at: '2018-01-01T00:00:00.000000Z'
      type: object
    CreateNumberReservationRequest:
      properties:
        id:
          type: string
          format: uuid
          example: 12ade33a-21c0-473b-b055-b3c836e1c292
          readOnly: true
        record_type:
          type: string
          example: number_reservation
          readOnly: true
        phone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/ReservedPhoneNumber'
        status:
          type: string
