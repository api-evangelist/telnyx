openapi: 3.2.0
info:
  title: Telnyx Private Wireless Gateways API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Private Wireless Gateways across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Private Wireless Gateways
  description: Private Wireless Gateways operations
paths:
  /private_wireless_gateways:
    get:
      summary: Get all Private Wireless Gateways
      description: Get all Private Wireless Gateways belonging to the user.
      operationId: GetPrivateWirelessGateways
      tags:
      - Private Wireless Gateways
      parameters:
      - $ref: '#/components/parameters/wireless_PageNumber_c5290d5308'
      - $ref: '#/components/parameters/wireless_PageSize_c5290d5308'
      - name: filter[name]
        description: The name of the Private Wireless Gateway.
        in: query
        required: false
        schema:
          type: string
        example: my private gateway
      - name: filter[ip_range]
        description: The IP address range of the Private Wireless Gateway.
        in: query
        required: false
        schema:
          type: string
        example: 192.168.0.0/24
      - name: filter[region_code]
        description: The name of the region where the Private Wireless Gateway is deployed.
        in: query
        required: false
        schema:
          type: string
        example: dc2
      - name: filter[created_at]
        description: Private Wireless Gateway resource creation date.
        in: query
        required: false
        schema:
          type: string
        example: '2018-02-02T22:25:27.521Z'
      - name: filter[updated_at]
        description: When the Private Wireless Gateway was last updated.
        in: query
        required: false
        schema:
          type: string
        example: '2018-02-02T22:25:27.521Z'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/wireless_PrivateWirelessGateway'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
    post:
      x-latency-category: background
      summary: Create a Private Wireless Gateway
      description: Asynchronously create a Private Wireless Gateway for SIM cards for a previously created network. This operation may take several minutes so you can check the Private Wireless Gateway status at the section Get a Private Wireless Gateway.
      operationId: CreatePrivateWirelessGateway
      tags:
      - Private Wireless Gateways
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network_id:
                  description: The identification of the related network resource.
                  format: uuid
                  type: string
                  example: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
                name:
                  description: The private wireless gateway name.
                  type: string
                  example: My private wireless gateway
                region_code:
                  description: The code of the region where the private wireless gateway will be assigned. A list of available regions can be found at the regions endpoint
                  type: string
                  example: dc2
                address_mode:
                  description: Determines how IP addresses are assigned to SIM cards using this gateway. With static, each SIM card gets a fixed IP address from the gateway's IP range that is preserved across sessions. With dynamic, an IP address is assigned by the network at attach time and may change between sessions. If omitted, the gateway is created with the default address mode, dynamic.
                  type: string
                  enum:
                  - static
                  - dynamic
                  default: dynamic
                  example: static
              required:
              - network_id
              - name
      responses:
        '202':
          description: Creation request accepted. Provisioning is asynchronous; poll GET /private_wireless_gateways/{id} with the returned id to check status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/wireless_PrivateWirelessGateway'
                example:
                  data:
                    id: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
                    network_id: 6a09cdc3-8948-47f0-aa62-74ac943d6c58
                    record_type: private_wireless_gateway
                    created_at: '2018-02-02T22:25:27.521Z'
                    updated_at: '2018-02-02T22:25:27.521Z'
                    name: My private wireless gateway
                    address_mode: dynamic
                    region_code: dc2
                    status:
                      value: provisioning
                      error_description: null
                      error_code: null
                    ip_range: 100.64.1.0/24
                    assigned_resources:
                    - record_type: sim_card_group
                      count: 1
        '422':
          $ref: '#/components/responses/wireless_UnprocessableEntity_c5290d5308'
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /private_wireless_gateways/{id}:
    delete:
      summary: Delete a Private Wireless Gateway
      description: Permanently deletes the specified Private Wireless Gateway from your account.
      operationId: DeleteWirelessGateway
      tags:
      - Private Wireless Gateways
      parameters:
      - $ref: '#/components/parameters/PrivateWirelessGatewayId'
