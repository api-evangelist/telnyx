                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/wireless_PrivateWirelessGateway'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        default:
          $ref: '#/components/responses/wireless_GenericErrorResponse_c5290d5308'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
