openapi: 3.2.0
info:
  title: Telnyx Charges Summary API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Charges Summary across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Charges Summary
paths:
  /charges_summary:
    get:
      summary: Get monthly charges summary
      operationId: GetMonthlyChargesSummary
      description: Retrieve a summary of monthly charges for a specified date range. The date range cannot exceed 31 days.
      parameters:
      - name: start_date
        in: query
        description: Start date for the charges summary in ISO date format (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
          example: '2025-05-01'
      - name: end_date
        in: query
        description: End date for the charges summary in ISO date format (YYYY-MM-DD). The date is exclusive, data for the end_date itself is not included in the report. The interval between start_date and end_date cannot exceed 31 days.
        required: true
        schema:
          type: string
          format: date
          example: '2025-06-01'
      responses:
        '200':
          description: Monthly charges summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyChargesSummaryResponse'
        '400':
          $ref: '#/components/responses/charges_BadRequestErrorResponse'
        '422':
          $ref: '#/components/responses/charges_UnprocessableEntityErrorResponse'
        default:
          $ref: '#/components/responses/charges_GenericErrorResponse'
      tags:
      - Charges Summary
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    SummaryAndTotal:
      type: object
      properties:
        user_id:
          type: string
          description: User identifier
          example: 0db0b4aa-a83d-4d4f-ad9b-3ba7c1ac2ce8
        start_date:
          type: string
          format: date
          description: Start date of the summary period
          example: '2025-05-01'
        end_date:
          type: string
          format: date
          description: End date of the summary period
          example: '2025-06-01'
        user_email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        currency:
          type: string
          description: Currency code
          example: USD
        summary:
          $ref: '#/components/schemas/Summary'
        total:
          $ref: '#/components/schemas/TotalSummary'
      required:
      - user_id
      - start_date
      - end_date
      - user_email
      - currency
      - summary
      - total
    MonthDetail:
      type: object
      properties:
        quantity:
          type: integer
          description: Number of items
          example: 10
        mrc:
          type: string
          description: Monthly recurring charge amount as decimal string
          example: '25.50'
        otc:
          type:
          - string
          - 'null'
          description: One-time charge amount as decimal string
          example: '5.00'
      required:
      - quantity
      - mrc
    ComparativeLine:
      type: object
      properties:
        type:
          type: string
          enum:
          - comparative
          example: comparative
        name:
          type: string
          description: Service name
          example: Local DIDs
        alias:
          type: string
          description: Service alias
          example: local
        new_this_month:
          $ref: '#/components/schemas/MonthDetail'
        existing_this_month:
          $ref: '#/components/schemas/MonthDetail'
      required:
      - type
      - name
      - alias
      - new_this_month
      - existing_this_month
    TotalSummary:
      type: object
      properties:
        new_mrc:
          type: string
          description: Total new monthly recurring charges as decimal string
          example: '50.00'
        new_otc:
          type: string
          description: Total new one-time charges as decimal string
          example: '25.00'
        existing_mrc:
          type: string
          description: Total existing monthly recurring charges as decimal string
          example: '100.00'
        other:
          type: string
          description: Other charges as decimal string
          example: '10.00'
        credits:
          type: string
          description: Total credits as decimal string
          example: '-5.00'
        ledger_adjustments:
          type: string
          description: Ledger adjustments as decimal string
          example: '0.00'
        grand_total:
          type: string
          description: Grand total of all charges as decimal string
          example: '180.00'
      required:
      - new_mrc
      - new_otc
      - existing_mrc
      - other
      - credits
      - ledger_adjustments
      - grand_total
    charges_Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          format: integer
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
    MonthlyChargesSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SummaryAndTotal'
      required:
      - data
    Summary:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SummaryLine'
          description: List of charge summary lines
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLine'
          description: List of billing adjustments
      example:
        lines:
        - type: comparative
          name: Local DIDs
          alias: local
          new_this_month:
            quantity: 10
            mrc: '25.50'
            otc: '5.00'
          existing_this_month:
            quantity: 8
            mrc: '20.00'
        - type: simple
          name: Port Out
          alias: port_out
          quantity: 100
          amount: '15.75'
        adjustments:
        - amount: '-10.00'
          description: Credit for service outage
          event_date: '2025-05-15'
      required:
      - lines
      - adjustments
    SummaryLine:
      oneOf:
      - $ref: '#/components/schemas/ComparativeLine'
      - $ref: '#/components/schemas/SimpleLine'
      discriminator:
        propertyName: type
    SimpleLine:
      type: object
      properties:
        type:
          type: string
          enum:
          - simple
          example: simple
        name:
          type: string
          description: Service name
          example: Port Out
        alias:
          type: string
          description: Service alias
          example: port_out
        quantity:
          type: integer
          description: Number of items
          example: 100
        amount:
          type: string
          description: Total amount as decimal string
          example: '15.75'
      required:
      - type
      - name
      - alias
      - quantity
      - amount
    charges_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/charges_Error'
    AdjustmentLine:
      type: object
      properties:
        amount:
          type: string
          description: Adjustment amount as decimal string
          example: '-10.00'
        description:
          type: string
          description: Description of the adjustment
          example: Credit for service outage
        event_date:
          type: string
          format: date
          description: Date when the adjustment occurred
          example: '2025-05-15'
      required:
      - amount
      - description
      - event_date
  responses:
    charges_UnprocessableEntityErrorResponse:
      description: User account not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10027'
              title: Unprocessable Entity
              detail: The server understood the syntax of the request but was unable to process the instructions.
    charges_GenericErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10007'
              title: Unexpected error
              detail: An unexpected error occured.
    charges_BadRequestErrorResponse:
      description: Invalid request parameters or date range
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
          example:
            errors:
            - code: '10015'
              title: Bad Request
              detail: The request failed because it was not well-formed.
    charges_UnprocessableEntityErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: User account not found
    charges_GenericErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: Unexpected error
    charges_BadRequestErrorResponse_2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/charges_Errors'
      description: Invalid request parameters or date range
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
