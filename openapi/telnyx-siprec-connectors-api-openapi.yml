openapi: 3.2.0
info:
  title: Telnyx SIPREC Connectors API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged SIPREC Connectors across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: SIPREC Connectors
  description: SIPREC connectors configuration.
paths:
  /siprec_connectors:
    post:
      summary: Create a SIPREC connector
      description: Creates a new SIPREC connector configuration.
      operationId: createSiprecConnector
      tags:
      - SIPREC Connectors
      requestBody:
        $ref: '#/components/requestBodies/SiprecConnectorRequest'
      responses:
        '201':
          description: Return details of the SIPREC connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiprecConnectorResponse'
        '422':
          $ref: '#/components/responses/siprec_siprec_UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/siprec_siprec_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /siprec_connectors/{connector_name}:
    delete:
      summary: Delete a SIPREC connector
      description: Deletes the stored SIPREC connector with the specified connector name.
      operationId: deleteSiprecConnector
      tags:
      - SIPREC Connectors
      parameters:
      - $ref: '#/components/parameters/SiprecConnectorName'
      responses:
        '204':
          description: The SIPREC connector was deleted successfully.
        '404':
          $ref: '#/components/responses/siprec_siprec_NotFoundResponse'
        default:
          $ref: '#/components/responses/siprec_siprec_GenericErrorResponse'
    get:
      summary: Retrieve a SIPREC connector
      description: Returns details of a stored SIPREC connector.
      operationId: getSiprecConnector
      tags:
      - SIPREC Connectors
      parameters:
      - $ref: '#/components/parameters/SiprecConnectorName'
      responses:
        '200':
          description: Return details of the SIPREC connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiprecConnectorResponse'
        '404':
          $ref: '#/components/responses/siprec_siprec_NotFoundResponse'
        default:
          $ref: '#/components/responses/siprec_siprec_GenericErrorResponse'
    put:
      summary: Update a SIPREC connector
      description: Updates a stored SIPREC connector configuration.
      operationId: updateSiprecConnector
      tags:
      - SIPREC Connectors
      parameters:
      - $ref: '#/components/parameters/SiprecConnectorName'
      requestBody:
        $ref: '#/components/requestBodies/SiprecConnectorRequest'
      responses:
        '200':
          description: Return details of the SIPREC connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiprecConnectorResponse'
        '404':
          $ref: '#/components/responses/siprec_siprec_NotFoundResponse'
        '422':
          $ref: '#/components/responses/siprec_siprec_UnprocessableEntityResponse'
        default:
          $ref: '#/components/responses/siprec_siprec_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  responses:
    siprec_siprec_GenericErrorResponse:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    siprec_siprec_UnprocessableEntityResponse:
      description: Unprocessable entity. The request was well-formed but contains semantic errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: 422
              title: Unprocessable Entity
              detail: The request parameters failed validation
    siprec_siprec_NotFoundResponse:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: 404
              title: Not Found
              detail: The requested resource does not exist
    siprec_NotFoundResponse:
      content:
        application/json:
          example:
            errors:
            - code: 404
              detail: The requested resource does not exist
              title: Not Found
          schema:
            $ref: '#/components/schemas/siprec_Errors'
      description: The requested resource does not exist
    siprec_UnprocessableEntityResponse:
      content:
        application/json:
          example:
            errors:
            - code: 422
              detail: The request parameters failed validation
              title: Unprocessable Entity
          schema:
            $ref: '#/components/schemas/siprec_Errors'
      description: Unprocessable entity. The request was well-formed but contains semantic errors.
    siprec_GenericErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/siprec_Errors'
      description: Unexpected error.
    SiprecConnectorResponseBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiprecConnectorResponse'
      description: Return details of the SIPREC connector.
  requestBodies:
    SiprecConnectorRequest:
      description: The parameters required to create or update a SIPREC connector.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiprecConnector'
  schemas:
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    SiprecConnectorResponse:
      type: object
      title: SIPREC Connector Response
      required:
      - data
      properties:
        data:
          type: object
          title: SIPREC Connector
          properties:
            record_type:
              type: string
              example: siprec_connector
            name:
              type: string
              description: Name for the SIPREC connector resource.
              example: siprec-connector
            host:
              type: string
              description: Hostname/IPv4 address of the SIPREC SRS.
              example: siprec.telnyx.com
            port:
              type: integer
              description: Port for the SIPREC SRS.
              example: 5060
            app_subdomain:
              type: string
              description: Subdomain to route calls when using Telnyx SRS (optional).
              example: my-app-domain
            created_at:
              type: string
              description: ISO 8601 formatted date/time of creation.
              example: '2024-01-23T18:10:02.574Z'
            updated_at:
              type: string
              description: ISO 8601 formatted date/time of last update.
              example: '2024-01-23T18:10:02.574Z'
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    SiprecConnector:
      type: object
      title: SIPREC connector configuration
      required:
      - host
      - port
      - name
      properties:
        host:
          description: Hostname/IPv4 address of the SIPREC SRS.
          type: string
          example: siprec.telnyx.com
        port:
          description: Port for the SIPREC SRS.
          type: integer
          example: 5060
        name:
          description: Name for the SIPREC connector resource.
          type: string
          example: my-siprec-connector
        app_subdomain:
          description: Subdomain to route the call when using Telnyx SRS (optional for non-Telnyx SRS).
          type: string
          example: my-app-domain
      example:
        host: siprec.telnyx.com
        port: 5060
        name: my-siprec-connector
        app_subdomain: my-app
    siprec_Errors:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/siprec_Error'
          type: array
      type: object
    siprec_Error:
      properties:
        code:
          format: int32
          type: integer
        detail:
          type: string
        meta:
          additionalProperties: true
          type: object
        source:
          properties:
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
          type: object
        title:
          type: string
      required:
      - code
      - title
      type: object
    Errors_2:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      type: object
    Error:
      required:
      - code
      - title
      properties:
        code:
          type: string
          x-format: int64
        title:
          type: string
        detail:
          type: string
          description: A human-readable explanation of the error.
        description:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
              format: json-pointer
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          additionalProperties: true
      example:
        title: Invalid street address
        source:
          pointer: /street_address
        code: '20207'
        description: The street address provided is invalid.
      type: object
  parameters:
    SiprecConnectorName:
      name: connector_name
      in: path
      required: true
      description: Uniquely identifies a SIPREC connector.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
