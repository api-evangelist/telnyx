openapi: 3.2.0
info:
  title: Telnyx Bucket Usage API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Bucket Usage across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Bucket Usage
  description: Bucket Usage operations
paths:
  /storage/buckets/{bucketName}/usage/api:
    get:
      summary: Get API Usage
      deprecated: false
      description: Returns the detail on API usage on a bucket of a particular time period, group by method category.
      operationId: GetStorageAPIUsage
      tags:
      - Bucket Usage
      parameters:
      - name: bucketName
        in: path
        description: The name of the bucket
        required: true
        example: ''
        schema:
          type: string
      - name: filter
        in: query
        required: true
        style: deepObject
        explode: true
        description: 'Consolidated filter parameter (deepObject style). Originally: filter[start_time], filter[end_time]'
        schema:
          type: object
          required:
          - start_time
          - end_time
          properties:
            start_time:
              type: string
              format: date-time
              description: The start time of the period to filter the usage (ISO microsecond format)
            end_time:
              type: string
              format: date-time
              description: The end time of the period to filter the usage (ISO microsecond format)
          additionalProperties: false
        example:
          start_time: '2020-01-01T00:00:00.000Z'
          end_time: '2020-01-01T00:00:00.000Z'
      responses:
        '200':
          description: Bucket Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketAPIUsageResponse'
          headers: {}
        '401':
          description: Unauthorized
        '404':
          description: Bucket not found
        '422':
          description: Unprocessable Entity
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /storage/buckets/{bucketName}/usage/storage:
    get:
      summary: Get Bucket Usage
      deprecated: false
      description: Returns the amount of storage space and number of files a bucket takes up.
      operationId: GetBucketUsage
      tags:
      - Bucket Usage
      parameters:
      - name: bucketName
        in: path
        description: The name of the bucket
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: Bucket Storage Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketUsage'
                  meta:
                    $ref: '#/components/schemas/PaginationMetaSimple'
          headers: {}
        '401':
          description: Unauthorized
        '404':
          description: Bucket not found
        '422':
          description: Unprocessable Entity
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    PaginationMetaSimple:
      type: object
      properties:
        page_number:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 25
        total_pages:
          type: integer
          example: 3
        total_results:
          type: integer
          example: 55
    BucketAPIUsageResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BucketOps'
        total:
          $ref: '#/components/schemas/BucketOpsTotal'
        timestamp:
          type: string
          format: date-time
          description: The time the usage was recorded
          example: '2020-01-01T00:00:00Z'
    BucketOpsTotal:
      type: object
      properties:
        bytes_sent:
          type: integer
          description: The number of bytes sent
          example: 123456
        bytes_received:
          type: integer
          description: The number of bytes received
          example: 123456
        ops:
          type: integer
          description: The number of operations
          example: 123456
        successful_ops:
          type: integer
          description: The number of successful operations
          example: 123456
    BucketUsage:
      type: object
      properties:
        size:
          type: integer
          description: The size of the bucket in bytes
          example: 123456
        size_kb:
          type: integer
          description: The size of the bucket in kilobytes
          example: 123456
        num_objects:
          type: integer
          description: The number of objects in the bucket
          example: 123456
        timestamp:
          type: string
          format: date-time
          description: The time the snapshot was taken
          example: '2020-01-01T00:00:00Z'
    BucketOps:
      type: object
      properties:
        bytes_sent:
          type: integer
          description: The number of bytes sent
          example: 123456
        bytes_received:
          type: integer
          description: The number of bytes received
          example: 123456
        ops:
          type: integer
          description: The number of operations
          example: 123456
        successful_ops:
          type: integer
          description: The number of successful operations
          example: 123456
        category:
          type: string
          enum:
          - list_bucket
          - list_buckets
          - get-bucket_location
          - create_bucket
          - stat_bucket
          - get_bucket_versioning
          - set_bucket_versioning
          - get_obj
          - put_obj
          - delete_obj
          description: The category of the bucket operation
          example: put_obj
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Telnyx API key supplied as `Authorization: Bearer <token>`. In production, auth may be validated by the API gateway and forwarded via Telnyx auth headers.'
    Payment:
      type: apiKey
      in: header
      name: Authorization
      description: 'Machine Payment Protocol credential used on paid retries, sent as `Authorization: Payment ...`. Obtained by paying a challenge returned in the `WWW-Authenticate` header of a 402 response. This is not a Telnyx API key; initial challenge requests use standard bearer authentication instead.'
    agent-memory_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    bearerAuth:
      type: http
      scheme: bearer
    branded-calling_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    collections_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Collections and results are automatically scoped to the authenticated user's organization.
    number-reputation_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Generate one at https://portal.telnyx.com/#/app/api-keys.
    oauthClientAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
        authorizationCode:
          authorizationUrl: https://api.telnyx.com/v2/oauth/authorize
          tokenUrl: https://api.telnyx.com/v2/oauth/token
          refreshUrl: https://api.telnyx.com/v2/oauth/token
          scopes:
            admin: Administrative access to Telnyx resources
      description: OAuth 2.0 authentication for Telnyx API and MCP integrations
    outbound-voice-profiles_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pronunciation-dicts_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API v2 key. Obtain from https://portal.telnyx.com
    rcs-registration_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    stored-payment-transactions_bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    transcriptions-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key. Results are automatically scoped to the authenticated user's organization.
    web-search_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key
    pay-connectors_bearerAuth:
      type: http
      scheme: bearer
      description: Telnyx API key, not the processor bearer token.
    telnyxApiKey:
      type: http
      scheme: bearer
      description: Management-only Telnyx account credential.
