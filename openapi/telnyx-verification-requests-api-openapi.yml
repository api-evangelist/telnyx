openapi: 3.2.0
info:
  title: Telnyx Verification Requests API
  version: 2.0.0
  contact:
    email: support@telnyx.com
  x-endpoint-cost: light
  x-refined-note:
  - x-latency-category differs across the merged source definitions and was not carried
  description: 'Operations tagged Verification Requests across 3 of this provider''s published API definitions: telnyx-openapi.json, telnyx-openapi.yml, telnyx-openapi_2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.telnyx.com/v2
  description: Version 2.0.0 of the Telnyx API
security:
- bearerAuth: []
tags:
- name: Verification Requests
  description: Manage your tollfree verification requests
paths:
  /messaging/tollfree/verification/requests/{id}/status/history:
    get:
      tags:
      - Verification Requests
      summary: Get Verification Request Status History
      description: 'Get the history of status changes for a verification request.


        Returns a paginated list of historical status changes including the reason for each change and when it occurred.'
      operationId: GetVerificationStatusHistory
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          format: uuid
        name: id
        in: path
        description: Unique identifier of the resource.
      - required: true
        schema:
          title: Page Number
          minimum: 1
          type: integer
        name: page[number]
        in: query
        description: Page number to retrieve (1-based).
      - required: true
        schema:
          title: Page Size
          minimum: 1
          type: integer
          description: Request this many records per page. This value is automatically clamped if the provided value is too large.
        name: page[size]
        in: query
        description: Number of items to return per page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_VerificationStatusHistoryEntry_'
        4XX:
          $ref: '#/components/responses/toll-free-verification_GenericErrorResponse'
      x-latency-category: responsive
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_tollfree/verification/requests:
    get:
      tags:
      - Verification Requests
      summary: List Verification Requests
      description: Get a list of previously-submitted tollfree verification requests
      operationId: ListVerificationRequests
      parameters:
      - required: true
        schema:
          title: Page
          minimum: 1
          type: integer
        name: page
        in: query
        description: Page number to retrieve (1-based).
      - description: "\n        Request this many records per page\n\n        This value is automatically clamped if the provided value is too large.\n        "
        required: true
        schema:
          title: Page Size
          minimum: 1
          type: integer
          description: "\n        Request this many records per page\n\n        This value is automatically clamped if the provided value is too large.\n        "
        name: page_size
        in: query
      - required: false
        schema:
          title: Date Start
          type: string
          format: date-time
        name: date_start
        in: query
        description: Start of the date range filter (inclusive, ISO 8601).
      - required: false
        schema:
          title: Date End
          type: string
          format: date-time
        name: date_end
        in: query
        description: End of the date range filter (inclusive, ISO 8601).
      - required: false
        schema:
          $ref: '#/components/schemas/TFVerificationStatus'
        name: status
        in: query
        description: Filter results by status.
      - required: false
        schema:
          title: Phone Number
          type: string
        name: phone_number
        in: query
        description: Filter results by phone number.
      - required: false
        schema:
          title: Business Name
          type: string
        name: business_name
        in: query
        description: Filter verification requests by business name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_VerificationRequestStatus_'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    post:
      tags:
      - Verification Requests
      summary: Submit Verification Request
      description: Submit a new tollfree verification request
      operationId: SubmitVerificationRequest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messaging_toll_free_verification_TFVerificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messaging_toll_free_verification_VerificationRequestEgress'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_tollfree/verification/requests/{id}:
    delete:
      tags:
      - Verification Requests
      summary: Delete Verification Request
      description: 'Delete a verification request


        A request may only be deleted when when the request is in the "rejected" state.


        * `HTTP 200`: request successfully deleted

        * `HTTP 400`: request exists but can''t be deleted (i.e. not rejected)

        * `HTTP 404`: request unknown or already deleted'
      operationId: DeleteVerificationRequest
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          format: uuid
        name: id
        in: path
        description: Unique identifier of the resource.
      responses:
        '200':
          description: Successful deleted
        '404':
          description: Not Found
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    get:
      summary: Get Verification Request
      description: Get a single verification request by its ID.
      operationId: GetVerificationRequest
      tags:
      - Verification Requests
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          format: uuid
        name: id
        in: path
        description: Unique identifier of the resource.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messaging_toll_free_verification_VerificationRequestStatus'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    patch:
      tags:
      - Verification Requests
      summary: Update Verification Request
      description: Update an existing tollfree verification request. This is particularly useful when there are pending customer actions to be taken.
      operationId: UpdateVerificationRequest
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          format: uuid
        name: id
        in: path
        description: Unique identifier of the resource.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messaging_toll_free_verification_TFVerificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messaging_toll_free_verification_VerificationRequestEgress'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /messaging_tollfree/verification/requests/{id}/status_history:
    get:
      tags:
      - Verification Requests
      summary: Get Verification Request Status History
      description: 'Get the history of status changes for a verification request.


        Returns a paginated list of historical status changes including the reason for each change and when it occurred.'
      operationId: GetVerificationStatusHistory_2
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          format: uuid
        name: id
        in: path
        description: Unique identifier of the resource.
      - required: true
        schema:
          title: Page Number
          minimum: 1
          type: integer
        name: page[number]
        in: query
        description: Page number to retrieve (1-based).
      - required: true
        schema:
          title: Page Size
          minimum: 1
          type: integer
          description: Request this many records per page. This value is automatically clamped if the provided value is too large.
        name: page[size]
        in: query
        description: Number of items to return per page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_VerificationStatusHistoryEntry_'
        4XX:
          $ref: '#/components/responses/messaging_toll_free_verification_GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
components:
  schemas:
    messaging_toll_free_verification_VerificationRequestEgress:
      title: VerificationRequestEgress
      required:
      - businessName
      - corporateWebsite
      - businessAddr1
      - businessCity
      - businessState
      - businessZip
      - businessContactFirstName
      - businessContactLastName
      - businessContactEmail
      - businessContactPhone
      - messageVolume
      - phoneNumbers
      - useCase
      - useCaseSummary
      - productionMessageContent
      - optInWorkflow
      - optInWorkflowImageURLs
      - additionalInformation
      - id
      - verificationRequestId
      type: object
      properties:
        businessName:
          title: Businessname
          type: string
          example: Telnyx LLC
        corporateWebsite:
          title: Corporatewebsite
          type: string
          example: http://example.com
        businessAddr1:
          title: Businessaddr1
          type: string
          example: 600 Congress Avenue
        businessAddr2:
          title: Businessaddr2
          type: string
          example: 14th Floor
        businessCity:
          title: Businesscity
          type: string
          example: Austin
        businessState:
          title: Businessstate
          type: string
          example: Texas
        businessZip:
          title: Businesszip
          type: string
          example: '78701'
        businessContactFirstName:
          title: Businesscontactfirstname
          type: string
          example: John
        businessContactLastName:
          title: Businesscontactlastname
          type: string
          example: Doe
        businessContactEmail:
          title: Businesscontactemail
          type: string
          example: email@example.com
        businessContactPhone:
          title: Businesscontactphone
          type: string
          example: '+18005550100'
        messageVolume:
          allOf:
          - $ref: '#/components/schemas/Volume'
          description: 'One of the following exact values: 10; 100; 1,000; 10,000; 100,000; 250,000; 500,000; 750,000; 1,000,000; 5,000,000; 10,000,000+'
          example: 100,000
        phoneNumbers:
          title: Phonenumbers
          type: array
          items:
            $ref: '#/components/schemas/TFPhoneNumber'
          example:
          - phoneNumber: '+18773554398'
          - phoneNumber: '+18773554399'
        useCase:
          allOf:
          - $ref: '#/components/schemas/UseCaseCategories'
          example: 2FA
        useCaseSummary:
          title: Usecasesummary
          type: string
          example: This is a use case where Telnyx sends out 2FA codes to portal users to verify their identity in order to sign into the portal
        productionMessageContent:
          title: Productionmessagecontent
          type: string
          example: Your Telnyx OTP is XXXX
        optInWorkflow:
          title: Optinworkflow
          type: string
          example: User signs into the Telnyx portal, enters number and is prompted to select whether they want to use 2FA verification for security purposes. If they've opted in a confirmation message is sent out to the handset
        optInWorkflowImageURLs:
          title: Optinworkflowimageurls
          type: array
          items:
            $ref: '#/components/schemas/Url'
          example:
          - url: https://telnyx.com/sign-up
          - url: https://telnyx.com/company/data-privacy
        additionalInformation:
          title: Additionalinformation
          type: string
          example: This is for security purposes, blah blah blah
        isvReseller:
          title: Isvreseller
          type: string
          example: 'Yes'
        webhookUrl:
          title: Webhookurl
          type: string
          example: http://example-webhook.com
        businessRegistrationNumber:
          title: Businessregistrationnumber
          type: string
          example: 12-3456789
        businessRegistrationType:
          title: Businessregistrationtype
          type: string
          example: EIN
        businessRegistrationCountry:
          title: Businessregistrationcountry
          type: string
          example: US
        doingBusinessAs:
          title: Doingbusinessas
          type: string
          example: Acme Services
        entityType:
          allOf:
          - $ref: '#/components/schemas/messaging_toll_free_verification_EntityType'
          example: PRIVATE_PROFIT
        optInConfirmationResponse:
          title: Optinconfirmationresponse
          type: string
          example: You have successfully opted in to receive messages from Acme Corp
        helpMessageResponse:
          title: Helpmessageresponse
          type: string
          example: 'Reply HELP for assistance or STOP to unsubscribe. Contact: support@example.com'
        privacyPolicyURL:
          title: Privacypolicyurl
          type: string
          example: https://example.com/privacy
        termsAndConditionURL:
          title: Termsandconditionurl
          type: string
          example: https://example.com/terms
        ageGatedContent:
          title: Agegatedcontent
          type: boolean
          example: false
        optInKeywords:
          title: Optinkeywords
          type: string
          example: START, YES, SUBSCRIBE
        campaignVerifyAuthorizationToken:
          title: Campaignverifyauthorizationtoken
          type:
          - string
          - 'null'
          maxLength: 500
          description: Campaign Verify Authorization Token required for Political use case submissions starting February 17, 2026
          example: cv_token_abc123xyz
        id:
          title: Id
          type: string
          format: uuid
        verificationRequestId:
          title: Verificationrequestid
          type: string
        verificationStatus:
          allOf:
          - $ref: '#/components/schemas/TFVerificationStatus'
          default: In Progress
      description: A verification request as it comes out of the database
    Volume:
      title: Volume
      enum:
      - '10'
      - '100'
      - 1,000
      - 10,000
      - 100,000
      - 250,000
      - 500,000
      - 750,000
      - 1,000,000
      - 5,000,000
      - 10,000,000+
      type: string
      description: Message Volume Enums
    billing-group_Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              description: JSON pointer (RFC6901) to the offending entity.
              type: string
            parameter:
              description: Indicates which query parameter caused the error.
              type: string
        meta:
          type: object
          properties: {}
          additionalProperties: true
    Paginated_VerificationRequestStatus_:
      title: Paginated[VerificationRequestStatus]
      type: object
      required:
      - records
      - total_records
      properties:
        records:
          title: Records
          type: array
          items:
            $ref: '#/components/schemas/VerificationRequestStatus'
          description: The records yielded by this request
          default: []
        total_records:
          title: Total Records
          type: integer
          description: The total amount of records for these query parameters
          default: 0
      description: A paginated response
    Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/billing-group_Error'
      type: object
    TFPhoneNumber:
      title: PhoneNumber
      required:
      - phoneNumber
      type: object
      properties:
        phoneNumber:
          title: Phonenumber
          type: string
      description: A phone number
    UseCaseCategories:
      title: UseCaseCategories
      enum:
      - 2FA
      - App Notifications
      - Appointments
      - Auctions
      - Auto Repair Services
      - Bank Transfers
      - Billing
      - Booking Confirmations
      - Business Updates
      - COVID-19 Alerts
      - Career Training
      - Chatbot
      - Conversational / Alerts
      - Courier Services & Deliveries
      - Emergency Alerts
      - Events & Planning
      - Financial Services
      - Fraud Alerts
      - Fundraising
      - General Marketing
      - General School Updates
      - HR / Staffing
      - Healthcare Alerts
      - Housing Community Updates
      - Insurance Services
      - Job Dispatch
      - Legal Services
      - Mixed
      - Motivational Reminders
      - Notary Notifications
      - Order Notifications
      - Political
      - Public Works
      - Real Estate Services
      - Religious Services
      - Repair and Diagnostics Alerts
      - Rewards Program
      - Surveys
      - System Alerts
      - Voting Reminders
      - Waitlist Alerts
      - Webinar Reminders
      - Workshop Alerts
      type: string
      description: Tollfree usecase categories
    toll-free-verification_Errors:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/toll-free-verification_Error'
      type: object
    Url:
      title: Url
      required:
      - url
      type: object
      properties:
        url:
          title: Url
          maxLength: 2083
          minLength: 1
          type: string
          format: uri
    Paginated_VerificationStatusHistoryEntry_:
      title: Paginated[VerificationStatusHistoryEntry]
      type: object
      required:
      - records
      - total_records
      properties:
        records:
          title: Records
          type: array
          items:
            $ref: '#/components/schemas/VerificationStatusHistoryEntry'
          description: The records yielded by this request
          default: []
        total_records:
          title: Total Records
          type: integer
          description: The total amount of records for these query parameters
          default: 0
      description: A paginated response
    toll-free-verification_EntityType:
      title: EntityType
      type: string
      enum:
      - SOLE_PROPRIETOR
      - PRIVATE_PROFIT
      - PUBLIC_PROFIT
      - NON_PROFIT
      - GOVERNMENT
      description: Business entity classification
    messaging_toll_free_verification_TFVerificationRequest:
      title: VerificationRequest
      required:
      - businessName
      - corporateWebsite
      - businessAddr1
      - businessCity
      - businessState
      - businessZip
      - businessContactFirstName
      - businessContactLastName
      - businessContactEmail
      - businessContactPhone
      - messageVolume
      - phoneNumbers
      - useCase
      - useCaseSummary
      - productionMessageContent
      - optInWorkflow
      - optInWorkflowImageURLs
      - additionalInformation
      type: object
      properties:
        businessName:
          title: Businessname
          type: string
          maxLength: 500
          description: Name of the business; there are no specific formatting requirements
          example: Telnyx LLC
        corporateWebsite:
          title: Corporatewebsite
          type: string
          maxLength: 500
          description: A URL, including the scheme, pointing to the corporate website
          example: http://example.com
        businessAddr1:
          title: Businessaddr1
          type: string
          maxLength: 500
          description: Line 1 of the business address
          example: 600 Congress Avenue
        businessAddr2:
          title: Businessaddr2
          type: string
          maxLength: 500
          description: Line 2 of the business address
          example: 14th Floor
        businessCity:
          title: Businesscity
          type: string
          maxLength: 500
          description: The city of the business address; the first letter should be capitalized
          example: Austin
        businessState:
          title: Businessstate
          type: string
          maxLength: 500
          description: The full name of the state (not the 2 letter code) of the business address; the first letter should be capitalized
          example: Texas
        businessZip:
          title: Businesszip
          type: string
          maxLength: 500
          description: The ZIP code of the business address
          example: '78701'
        businessContactFirstName:
          title: Businesscontactfirstname
          type: string
          maxLength: 500
          description: First name of the business contact; there are no specific requirements on formatting
          example: John
        businessContactLastName:
          title: Businesscontactlastname
          type: string
          maxLength: 500
          description: Last name of the business contact; there are no specific requirements on formatting
          example: Doe
        businessContactEmail:
          title: Businesscontactemail
          type: string
          maxLength: 500
          description: The email address of the business contact
          example: email@example.com
        businessContactPhone:
          title: Businesscontactphone
          type: string
          maxLength: 500
          description: The phone number of the business contact in E.164 format
          example: '+18005550100'
        messageVolume:
          allOf:
          - $ref: '#/components/schemas/Volume'
          description: Estimated monthly volume of messages from the given phone numbers
          example: 100,000
        phoneNumbers:
          title: Phonenumbers
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TFPhoneNumber'
          description: The phone numbers to request the verification of
          example:
          - phoneNumber: '+18773554398'
          - phoneNumber: '+18773554399'
        useCase:
          allOf:
          - $ref: '#/components/schemas/UseCaseCategories'
          description: Machine-readable use-case for the phone numbers
          example: 2FA
        useCaseSummary:
          title: Usecasesummary
          type: string
          maxLength: 500
          description: Human-readable summary of the desired use-case
          example: This is a use case where Telnyx sends out 2FA codes to portal users to verify their identity in order to sign into the portal
        productionMessageContent:
          title: Productionmessagecontent
          type: string
          maxLength: 1000
          description: An example of a message that will be sent from the given phone numbers
          example: Your Telnyx OTP is XXXX
        optInWorkflow:
          title: Optinworkflow
          type: string
          maxLength: 500
          description: Human-readable description of how end users will opt into receiving messages from the given phone numbers
          example: User signs into the Telnyx portal, enters a number and is prompted to select whether they want to use 2FA verification for security purposes. If they've opted in a confirmation message is sent out to the handset
        optInWorkflowImageURLs:
          title: Optinworkflowimageurls
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Url'
          description: Images showing the opt-in workflow
          example:
          - url: https://telnyx.com/sign-up
          - url: https://telnyx.com/company/data-privacy
        additionalInformation:
          title: Additionalinformation
          type: string
          maxLength: 500
          description: Any additional information
        isvReseller:
          title: Isvreseller
          type:
          - string
          - 'null'
          maxLength: 500
          description: ISV name
        webhookUrl:
          title: Webhookurl
          type: string
          maxLength: 500
          description: URL that should receive webhooks relating to this verification request
          example: http://example-webhook.com
        businessRegistrationNumber:
          title: Businessregistrationnumber
          type:
          - string
          - 'null'
          maxLength: 500
          description: Official business registration number (e.g., Employer Identification Number (EIN) in the U.S.). Required from January 2026.
          example: 12-3456789
        businessRegistrationType:
          title: Businessregistrationtype
          type:
          - string
          - 'null'
          maxLength: 500
          description: Type of business registration being provided. Required from January 2026.
          example: EIN
        businessRegistrationCountry:
          title: Businessregistrationcountry
          type:
          - string
          - 'null'
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code of the issuing business authority. Must be exactly 2 letters. Automatically converted to uppercase. Required from January 2026.
          example: US
        doingBusinessAs:
          title: Doingbusinessas
          type:
          - string
          - 'null'
          maxLength: 500
          description: Doing Business As (DBA) name if different from legal name
          example: Acme Services
        entityType:
          anyOf:
          - $ref: '#/components/schemas/messaging_toll_free_verification_EntityType'
          - type: 'null'
          description: Business entity classification. Must be one of the 5 valid enum values.
        optInConfirmationResponse:
          title: Optinconfirmationresponse
          type:
          - string
          - 'null'
          maxLength: 500
          description: Message sent to users confirming their opt-in to receive messages
          example: You have successfully opted in to receive messages from Acme Corp
        helpMessageResponse:
          title: Helpmessageresponse
          type:
          - string
          - 'null'
          maxLength: 500
          description: The message returned when users text 'HELP'
          example: 'Reply HELP for assistance or STOP to unsubscribe. Contact: support@example.com'
        privacyPolicyURL:
          title: Privacypolicyurl
          type:
          - string
          - 'null'
          maxLength: 500
          description: URL pointing to the business's privacy policy. Plain string, no URL format validation.
          example: https://example.com/privacy
        termsAndConditionURL:
          title: Termsandconditionurl
          type:
          - string
          - 'null'
          maxLength: 500
          description: URL pointing to the business's terms and conditions. Plain string, no URL format validation.
          example: https://example.com/terms
        ageGatedContent:
          title: Agegatedcontent
          type: boolean
          default: false
          description: Indicates if messaging content requires age gating (e.g., 18+). Defaults to false if not provided.
        optInKeywords:
          title: Optinkeywords
          type:
          - string
          - 'null'
          maxLength: 500
          description: Keywords used to collect and process consumer opt-ins
          example: START, YES, SUBSCRIBE
        campaignVerifyAuthorizationToken:
          title: Campaignverifyauthorizationtoken
          type:
          - string
          - 'null'
          maxLength: 500
          description: Campaign Verify Authorization Token required for Political use case submissions starting February 17, 2026. This token is validated by Zipwhip and must be provided for all Political use case verifications after the deadline.
          example: cv_token_abc123xyz
      description: The body of a tollfree verification request
    VerificationRequestStatus:
      title: VerificationRequestStatus
      required:
      - businessName
      - corporateWebsite
      - businessAddr1
      - businessCity
      - businessState
      - businessZip
      - businessContactFirstName
      - businessContactLastName
