paths:
  /billing_groups:
    get:
      summary: List all billing groups
      deprecated: false
      description: Retrieve a paginated list of billing groups on your account.
      operationId: ListBillingGroups
      tags:
      - Billing Groups
      parameters:
      - name: page
        in: query
        style: deepObject
        explode: true
        description: 'Consolidated page parameter (deepObject style). Originally: page[number], page[size]'
        schema:
          type: object
          properties:
            number:
              type: integer
              minimum: 1
              default: 1
              description: The page number to load
            size:
              type: integer
              minimum: 1
              maximum: 250
              default: 20
              description: The size of the page
      responses:
        '200':
          description: A paginated array of billing groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingGroup'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    post:
      summary: Create a billing group
      deprecated: false
      description: Create a new billing group, which can be used to organize resources for billing purposes.
      operationId: CreateBillingGroup
      tags:
      - Billing Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBillingGroup'
            example:
              name: string
      responses:
        '200':
          description: Expected billing group response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingGroup'
          headers: {}
        '409':
          $ref: '#/components/responses/ConflictErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    servers:
    - url: https://api.telnyx.com/v2
      description: Version 2.0.0 of the Telnyx API
  /billing_groups/{id}:
    delete:
      summary: Delete a billing group
      deprecated: false
      description: Delete a billing group from your account.
      operationId: DeleteBillingGroup
      tags:
      - Billing Groups
      parameters:
      - name: id
        in: path
        description: The id of the billing group
        required: true
        example: f5586561-8ff0-4291-a0ac-84fe544797bd
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Expected billing group response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingGroup'
          headers: {}
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    get:
      summary: Get a billing group
      deprecated: false
      description: Retrieve the details of a specific billing group.
      operationId: GetBillingGroup
      tags:
      - Billing Groups
      parameters:
      - name: id
        in: path
        description: The id of the billing group
        required: true
        example: f5586561-8ff0-4291-a0ac-84fe544797bd
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Expected billing group response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingGroup'
          headers: {}
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
    patch:
      summary: Update a billing group
      deprecated: false
      description: Update the properties of an existing billing group.
      operationId: UpdateBillingGroup
      tags:
      - Billing Groups
      parameters:
      - name: id
        in: path
        description: The id of the billing group
        required: true
        example: f5586561-8ff0-4291-a0ac-84fe544797bd
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingGroup'
            example:
              name: string
      responses:
        '200':
          description: Expected billing group response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingGroup'
          headers: {}
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityErrorResponse'
        default:
          $ref: '#/components/responses/GenericErrorResponse'
